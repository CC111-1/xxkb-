  <div class="list">${qs.map((q,i)=>`<div class="li" onclick="openOne('${qid(q)}')">
      <div class="n">${i+1}</div>
      <div class="t"><b>${esc(q.q.replace(/\s+/g," ").slice(0,36))}</b><span>${esc(q.s)} · 第${q.n}题</span></div>
      <span class="r mut">重做</span></div>`).join("")||'<div class="empty">暂无记录，去刷几题吧</div>'}</div>`;
}
function startList(){start(window._list.map(id=>byId.get(id)),0,"quiz",null,null)}
function clearWrong(){
  const keep={};DATA.forEach(q=>{const a=ans[qid(q)];if(a&&a.ok)keep[qid(q)]=a});
  ans=keep;save(LS.ans,ans);toast("已清空错题");goWrong();
}
function openOne(id){const q=byId.get(id);start([q],0,"quiz",null,null)}

/* 随机练 / 组卷 / 继续 */
function examLeft(){
  if(!cfg.examDate)return null;
  const t=new Date();t.setHours(0,0,0,0);
  const d=new Date(cfg.examDate+"T00:00:00");
  if(isNaN(d))return null;
  return Math.round((d-t)/86400000);
}
function examBanner(){
  const left=examLeft();if(left===null)return "";
  if(left<0)return `<div class="banner">${ICONS.clock}<div class="t"><b>考试日期已过</b><span>去设置里更新考试日期</span></div></div>`;
  return `<div class="banner examn ${left<=7?"hot":""}" onclick="goSettings()">
    <div class="ic">${ICONS.clock}</div>
    <div class="t"><b>${left===0?`今天就是考试日`:`距考试仅剩 <em class="exn">${left}</em> 天`}</b>
      <span>${left<=7?"冲刺阶段：刷错题 + 每日复习最划算":"稳住节奏，每天一练别断"}</span></div>
    <div class="go">设置 ›</div></div>`;
}
function startReview(){
  const qs=dueList();
  if(!qs.length)return toast("今天没有到期的复习题，去刷点新题吧");
  start(qs.slice(0,30),0,"quiz",null,null);
  toast("复习 "+Math.min(30,qs.length)+" 题");
}
function quickRandom(){
  const pool=DATA.filter(q=>!q.bad);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
  start(pool.slice(0,Math.min(20,pool.length)),0,"quiz",null,null);
}
function openPaper(){
  openMask(`<h3>随机组卷</h3><div class="small">可选某个板块，也可直接全库随机出题</div>
    <div style="margin:6px 0 10px" id="chips"><span class="chip on" data-b="__all" onclick="pickAll(this)">全部题库 · 跨所有卷</span>${BOARD_ORDER.map(b=>`<span class="chip" data-b="${b}" onclick="pickBoard(this)">${b}</span>`).join("")}</div>
    <div class="setrow"><div class="t"><b>题量</b><span>建议 20–50 题</span></div>
      <select id="paperN">${[5,10,20,30,50,100].map(n=>`<option value="${n}" ${n===20?"selected":""}>${n} 题</option>`).join("")}</select></div>
    <div class="acts" style="margin-top:14px"><button class="pri" onclick="makePaper()">生成并开始</button><button class="ghost" onclick="closeMask()">取消</button></div>`);
}
function pickAll(el){
  const on=!el.classList.contains("on");
  document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("on"));
  if(on)el.classList.add("on");
}
function pickBoard(el){
  document.querySelectorAll('#chips .chip[data-b="__all"]').forEach(x=>x.classList.remove("on"));
  el.classList.toggle("on");
}
function makePaper(){
  const bs=[...document.querySelectorAll("#chips .chip.on")].map(x=>x.dataset.b);
  if(!bs.length)return toast("至少选一个板块");
  const n=+document.getElementById("paperN").value;
  const all=bs.includes("__all");
  let pool=DATA.filter(q=>(all||bs.includes(q.b))&&!q.bad);
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t}
  if(!pool.length)return toast("这个范围暂时没有可用题目");
  closeMask();
  start(pool.slice(0,Math.min(n,pool.length)),0,"quiz",null,null);
}
function openResume(){
  const last=load("xxkb_last",null);
  if(!last)return toast("还没有答题记录");
  const bk=boardOf(last.board);
  if(!bk)return toast("记录已失效");
  const qs=last.unit?bk.questions.filter(q=>q.s===last.unit):bk.questions;
  start(qs,Math.min(last.idx||0,qs.length-1),"quiz",bk,last.unit?{s:last.unit}:null);
}

/* 报告 */
function heatHtml(){
  const days=stat.days||{};
  const today=new Date();today.setHours(0,0,0,0);
  const dow=(today.getDay()+6)%7;
  const start=new Date(today);start.setDate(start.getDate()-dow-25*7);
  const lvl=n=>n===0?"0":n<=10?"1":n<=25?"2":n<=50?"3":"4";
  let total=0,active=0,cols="";
  for(let w=0;w<26;w++){
    let cells="";
    for(let d=0;d<7;d++){
      const dt=new Date(start);dt.setDate(start.getDate()+w*7+d);
      if(dt>today){cells+='<i class="hc l0 ghost"></i>';continue}
      const k=dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
      const n=days[k]||0;total+=n;if(n>0)active++;
      cells+=`<i class="hc l${lvl(n)}" title="${k} · ${n} 题"></i>`;
    }
    cols+=`<div class="hcol">${cells}</div>`;
  }
  const names=["一","二","三","四","五","六","日"];
  return `<div class="card" style="padding:14px 14px 12px">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin:0 2px 10px">
      <span>累计打卡 <b style="color:var(--fg)">${active}</b> 天</span><span>近 26 周答题 <b style="color:var(--fg)">${total}</b> 题</span></div>
    <div class="heat-wrap"><div class="hdow">${names.map(n=>`<i>${n}</i>`).join("")}</div>
      <div class="heat">${cols}</div></div>
    <div class="heat-legend">少<i class="hc l0"></i><i class="hc l1"></i><i class="hc l2"></i><i class="hc l3"></i><i class="hc l4"></i>多</div></div>`;
}
function avgSec(){
  const v=Object.values(qtime||{});if(!v.length)return "-";
  return Math.round(v.reduce((a,b)=>a+b,0)/v.length);
}
function topicBoardHtml(){
  const rows=TOPICS.map(t=>{
    const qs=DATA.filter(q=>topicOf(q)===t.k);
    const done=qs.filter(q=>ans[qid(q)]), ok=done.filter(q=>ans[qid(q)].ok);
    return {k:t.k,all:qs.length,done:done.length,rate:done.length?Math.round(ok.length/done.length*100):0};
  }).filter(r=>r.all>0).sort((a,b)=>a.rate-b.rate||b.done-a.done);
  if(!rows.some(r=>r.done))return '<div class="empty">先做几组题，这里会给出各考点的正确率</div>';
  return `<div class="card" style="padding:12px 14px">${rows.map(r=>`
    <div onclick="startTopicAll('${r.k}')" style="padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer">
      <div style="display:flex;justify-content:space-between;font-size:13px"><b style="font-weight:600">${esc(r.k)}</b>
        <span style="color:${r.rate>=70?"var(--ok)":r.rate>=50?"var(--warn)":"var(--err)"};font-weight:600">${r.done?r.rate+"%":"未做"}</span></div>
      <div class="bar" style="margin:6px 0 2px"><i style="width:${r.rate}%"></i></div>
      <div class="note" style="font-size:11px">共 ${r.all} 题 · 已答 ${r.done} 题</div>
    </div>`).join("")}<div class="note" style="margin-top:8px">点一行直接练这个知识点</div></div>`;
}
function startTopicAll(k){
  const qs=DATA.filter(q=>topicOf(q)===k&&!q.bad);
  if(!qs.length)return toast("这个知识点没有题");
  start(qs,firstUnanswered(qs),"quiz",null,null);
}
function goStat(){
  setPad(false);
  const dayk=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const days=(()=>{const t=new Date();t.setHours(0,0,0,0);const a=[];for(let i=9;i>=0;i--){const d=new Date(t);d.setDate(t.getDate()-i);a.push(dayk(d))}return a})();
  const dayn=d=>(stat.days||{})[d]||0;
  const max=Math.max(1,...days.map(dayn));
  const byBoard=BOOKS.map(bk=>({bk,s:st(bk.questions)}));
  document.getElementById("app").innerHTML=`
  ${tabbar("stat")}
  <div class="rescard">
    <div class="bigring">${ringSvg(st(DATA).rate,132,9)}<div class="n"><b>${st(DATA).rate}<span style="font-size:16px">%</span></b><span>整体正确率</span></div></div>
    <div class="resline"><span>已答 <em>${st(DATA).done}</em></span><span>总题 <em>${DATA.length}</em></span><span>错题 <em style="color:var(--err)">${wrongOf(DATA).length}</em></span></div>
  </div>
  <div class="rescard" style="padding:14px 16px">
    <div class="resline" style="margin:2px 0 0"><span>今日目标 <em>${Math.min(todayCount(),cfg.goal)}/${cfg.goal}</em></span>
      <span>平均每题 <em>${avgSec()}</em> 秒</span><span>今日复习 <em>${dueList().length}</em> 题</span></div>
  <div class="bar" style="margin:10px 0 0"><i style="width:${Math.min(100,Math.round(todayCount()/cfg.goal*100))}%"></i></div>
  </div>
  <div class="sec"><b>学习日历</b><a>近 26 周 · 点格子看当天题量</a></div>
  ${heatHtml()}
  <div class="sec"><b>各知识点掌握</b><a>正确率低的排在前面</a></div>
  ${topicBoardHtml()}
  <div class="sec"><b>最近 10 天答题量</b><a>${dayLabel()}</a></div>
  <div class="card" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px 18px;box-shadow:var(--shadow)">
    <div class="barchart">${days.map(d=>{const n=dayn(d);return `<div class="bcol ${n?"":"zero"}" style="height:${n?Math.max(8,n/max*100):4}%"><span><i>${Number(d.slice(8))}日</i><b>${n}</b></span></div>`}).join("")}</div>
  </div>
  <div class="sec"><b>各题本进度</b><a>共 ${DATA.length} 题</a></div>
  <div class="list">${byBoard.map(({bk,s})=>`<div class="li" onclick="openBook('${bk.board}')">
      <div class="n">${esc(bk.board.slice(0,1))}</div>
      <div class="t"><b>${esc(bk.board)}</b><span>已答 ${s.done}/${bk.count} · 正确率 ${s.rate}% · 错题 ${s.wrong}</span></div>
      <span class="r ${s.rate>=70?"ok":s.rate>=50?"mut":"err"}">${s.pct}%</span></div>`).join("")}</div>`;
}

/* 搜题 */
const HOT=["十五五","新质生产力","基层治理","乡村振兴","中国式现代化","全过程人民民主"];
function goSearch(kw){
  setPad(false);
  document.getElementById("app").innerHTML=`
  ${tabbar("search")}
  <div class="sec"><b>搜题</b><a>题干 / 选项 / 卷名都能搜</a></div>
  <div class="searchbar"><input id="kw" value="${esc(kw||"")}" placeholder="输入关键词，如“十五五”“基层治理”" onkeydown="if(event.key==='Enter')doSearch()">
    <button onclick="doSearch()">搜索</button></div>
  <div style="margin-bottom:10px">${HOT.map(h=>`<span class="chip" onclick="goSearch('${h}')">${h}</span>`).join("")}</div>
  <div class="note" style="margin:0 2px 10px">搜题结果点开即看作答与解析，不计入练习进度。</div>
  <div id="results">${kw?searchHtml(kw):'<div class="empty">输入关键词开始搜索</div>'}</div>`;
}
function searchHtml(kw){
  const hit=DATA.filter(q=>q.q.includes(kw)||q.o.join("").includes(kw)||q.s.includes(kw)).slice(0,60);
  if(!hit.length)return '<div class="empty">没有匹配的题，换个关键词试试</div>';
  return `<div class="list">${hit.map(q=>`<div class="li" onclick="openOneDrill('${qid(q)}')">
      <div class="n" style="font-size:11px">${esc(q.b.slice(0,2))}</div>
      <div class="t"><b>${esc(q.q.replace(/\s+/g," ").slice(0,40))}</b><span>${esc(q.s)} · 第${q.n}题</span></div>
      <span class="r mut">答案 ${esc(q.a.trim().replace(/[^A-D]/g,""))}</span></div>`).join("")}</div>`;
}
function doSearch(){
  const kw=(document.getElementById("kw").value||"").trim();
  if(!kw)return toast("输入关键词");
  document.getElementById("results").innerHTML=searchHtml(kw);
}
function openOneDrill(id){const q=byId.get(id);start([q],0,"drill",null,null)}

/* 设置 */
function goSettings(){
  setPad(false);
  document.getElementById("app").innerHTML=`
  ${tabbar("set")}
  <div class="card" style="background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px 4px;box-shadow:var(--shadow)">
    <div class="setrow"><div class="t"><b>外观模式</b><span>白天/夜间，随你眼睛舒服</span></div>
      <div class="seg"><button class="${cfg.theme!=="dark"?"on":""}" onclick="setTheme('light')">白天</button>
        <button class="${cfg.theme==="dark"?"on":""}" onclick="setTheme('dark')">夜间</button></div></div>
    <div class="setrow"><div class="t"><b>字体大小</b><span>当前 ${cfg.font}px（14–22）</span></div>
      <input type="range" min="14" max="22" step="1" value="${cfg.font}" oninput="setFont(this.value)"></div>
    <div class="setrow"><div class="t"><b>字号预览</b><span>正文与选项会同步变化</span></div></div>
    <div style="padding:0 0 14px;font-size:${cfg.font}px;line-height:1.8" id="fsPreview">下列属于未来产业的是——预览一行字，看看大小合不合适。</div>
    <div class="setrow"><div class="t"><b>答完自动跳下一题</b><span>练习时更顺手</span></div>
      <div class="switch ${cfg.autoNext?"on":""}" onclick="tog('autoNext')"><i></i></div></div>
    <div class="setrow"><div class="t"><b>考试日期</b><span>${cfg.examDate?"已设置 "+cfg.examDate+"（剩 "+examLeft()+" 天）":"设置后首页显示倒计时"}</span></div>
      <input type="date" id="examD" value="${cfg.examDate||""}" onchange="setExam(this.value)"
        style="background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:11px;padding:7px 9px;font-family:inherit;font-size:13px">
    </div>
    <div class="setrow"><div class="t"><b>每日目标</b><span>用来算首页完成度</span></div>
      <div class="seg">${[10,20,30,50].map(g=>`<button class="${cfg.goal===g?"on":""}" onclick="setGoal(${g})">${g}</button>`).join("")}</div></div>
    <div class="setrow"><div class="t"><b>复习提醒</b><span>打开时提示今天到期的题（按 1/2/4/7/15/30 天递进）</span></div>
      <div class="switch ${cfg.remind?"on":""}" onclick="tog('remind')"><i></i></div></div>
    <div class="setrow"><div class="t"><b>显示“题干残缺”标记</b><span>原卷被遮挡的题会有提示</span></div>
      <div class="switch ${cfg.showBad?"on":""}" onclick="tog('showBad')"><i></i></div></div>
  </div>
  <div class="sec"><b>数据与反馈</b><a>仅存本机浏览器</a></div>
  <div class="acts" style="margin-bottom:12px">
    <button onclick="exportData()">导出记录</button>
    <button onclick="importData()">导入记录</button>
    <button class="ghost" onclick="viewReps()">我的反馈 ${reps.length}</button>
    <button class="danger" onclick="clearAll()">清空全部记录</button>
  </div>
  <div class="note" style="margin:14px 2px">待复习 ${dueList().length} 题 · 已排进复习计划 ${Object.keys(srs).length} 题</div>
  <div class="note" style="margin:14px 2px">题库共 ${DATA.length} 题 · 本机已答 ${Object.keys(ans).length} 题。换设备请先导出再导入。</div>
  <div class="note" style="margin:2px 2px 0;color:var(--mut)">本程序是单个网页文件：没有服务器、没有数据库，谁打开都是直接跑在自己设备上，再多人在线也不会排队进不去；答题记录只存在你自己的手机或电脑浏览器里。</div>`;
}
function tog(k){cfg[k]=!cfg[k];save(LS.set,cfg);applyTheme();goSettings()}
function setExam(v){cfg.examDate=v||"";save(LS.set,cfg);toast(v?("考试日期 "+v):"已取消倒计时");renderHome()}
function setGoal(g){cfg.goal=g;save(LS.set,cfg);toast("每日目标 "+g+" 题");renderHome()}
function setTheme(t){cfg.theme=t;save(LS.set,cfg);applyTheme();goSettings()}
function setFont(n){cfg.font=+n;save(LS.set,cfg);applyTheme();
  const v=document.getElementById("fsPreview");if(v)v.style.fontSize=cfg.font+"px";
  const lbl=document.querySelector(".setrow .t span");if(lbl&&lbl.textContent.includes("当前"))lbl.textContent="当前 "+cfg.font+"px（14–22）";}
function exportData(){
  const blob=new Blob([JSON.stringify({ans,favs,cfg,stat,srs,notes,qtime,flags,mastered})],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="xxkb_backup.json";a.click();toast("已导出");
}
function importData(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);if(d.ans)ans=d.ans;if(d.favs)favs=d.favs;if(d.cfg)cfg=Object.assign(cfg,d.cfg);
      if(d.stat)stat=d.stat;if(d.srs)srs=d.srs;if(d.notes)notes=d.notes;if(d.qtime)qtime=d.qtime;if(d.flags)flags=d.flags;if(d.mastered)mastered=d.mastered;
      save(LS.ans,ans);save(LS.fav,favs);save(LS.set,cfg);save(LS.stat,stat);save("xxkb_srs_v1",srs);
      save("xxkb_note_v1",notes);save("xxkb_time_v1",qtime);save("xxkb_flag_v1",flags);save("xxkb_master_v1",mastered);applyTheme();toast("导入成功");renderHome();
    }catch(e){toast("文件格式不对")}};r.readAsText(f)};
  inp.click();
}
function clearAll(){
  ask("清空全部答题记录、收藏和设置？不可恢复。",clearAllDo,"确定清空");
}
function clearAllDo(){
  ans={};favs=[];stat={days:{},total:0,ok:0};srs={};notes={};qtime={};flags=[];mastered=[];
  save(LS.ans,ans);save(LS.fav,favs);save(LS.stat,stat);save("xxkb_srs_v1",srs);
  save("xxkb_note_v1",notes);save("xxkb_time_v1",qtime);save("xxkb_flag_v1",flags);save("xxkb_master_v1",mastered);toast("已清空");renderHome();
}

renderHome();
</script>
</body>
</html>
