。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":4,"t":"单选","q":"坚持问题导向是习近平新时代中国特色社会主义思想的世界观和方法论的重要内容。关于坚持问题导向，下列说法不准确的是：","o":["坚持问题导向是马克思主义的鲜明特点","坚持问题导向要抓住人民最关心最直接最现实的利益问题","坚持问题导向体现了矛盾的普遍性和客观性","坚持问题导向本质是变与不变、继承与发展的辩证统一"],"a":"D","e":"“六个必须坚持”，是习近平新时代中国特色社会主义思想的世界观、方法论和贯穿其中的立场观点方法的重要体现。坚持人民至上是根本价值立场，体现了历史唯物主义群众史观；坚持自信自立是内在精神特质，体现了客观规律性和主观能动性的有机结合；坚持守正创新是鲜明理论品格，体现了变与不变、继承与发展的内在联系；坚持问题导向是重要实践要求，体现了矛盾的普遍性和客观性;坚持系统观念是基本思想和工作方法，体现了辩证唯物主义普遍联系的原理；坚持胸怀天下是中国共产党人的境界格局，体现了马克思主义追求人类进步和解放的崇高理想。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":5,"t":"单选","q":"习近平总书记指出，马克思主义是为人民立言，为人民代言的理论，是为改变人民命运而创立、在人民求解放的实践中丰富和发展的，人民的创造性实践是马克思主义理论创新的不竭源泉。下列说法与这一论述相符的是：\n①人民不仅是物质财富的创造者，也是精神财富的创造者\n②要坚持以理论工作者的首创精神为引领，注重从理论创新中总结实践经验\n③无论是毛泽东思想、中国特色社会主义理论体系，还是习近平新时代中国特色社会主义思想，无不源自于人民的智慧、人民的探索、人民的创造\n④各级领导干部身处实践最前沿，对实践变化感知最敏感、感受最深切，也最聪慧","o":["①②","①③","②④","③④"],"a":"B","e":"①当选：习近平总书记的重要文章《开辟马克思主义中国化时代化新境界》指出，“马克思主义是为人民立言、为人民代言的理论，是次相遇为改变人民命运而创立、在人民求解放的实践中丰富和发展的，人民的创造性实践是马克思主义理论创新的不竭源泉。人民作为历史的创造者，不仅是物质财富的创造者，也是精神财富的创造者”。\n②不选：习近平总书记的重要文章《开辟马克思主义中国化时代化新境界》指出，“要尊重人民首创精神，注重从人民的创造性实践中总结新鲜经验，上升为理性认识，提炼出新的理论成果，着力让党的创新理论深入亿万人民心中，成为接地气、聚民智、顺民意、得民心的理论”。\n②中应尊重的是人民首创精神，并注重从人民的创造性实践中总结新鲜经验。\n③当选，\n④不选：习近平总书记的重要文章《开辟马克思主义中国化时代化新境界》指出，“马克思主义中国化时代化成果，都是党和人民实践经验和集体智慧的结晶。无论是毛泽东思想、中国特色社会主义理论体系，还是新时代中国特色社会主义思想，无不源自于人民的智慧、人民的探索、人民的创造。人民群众身处实践最前沿，对实践变化感知最敏感、感受最深切，也最聪慧，只要走到人民群众中去，很多百思不得其解的问题就能豁然开朗、找到答案”。\n④中“各级领导干部”应为“人民群众”。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":6,"t":"单选","q":"习近平总书记强调，粮食安全是“国之大者”。下列保障粮食安全的举措，正确的有几项？\n①全面落实粮食安全党政同责，坚持稳面积、增单产两手发力\n②树立大农业观、大食物观，农林牧渔并举，构建多元化食物供给体系\n③加大高标准农田建设投人和管护力度，确保耕地数量有保障、质量有提升\n④扩大粮食领域高水平对外开放，逐步加大国外优质种业资源和海外粮食产品在我国市场的占有率\n③强化科技和改革双轮驱动，加大核心技术攻关力度","o":["2项","3项","4项","5项"],"a":"C","e":"①②③⑤正确：保障粮食和重要农产品稳定安全供给始终是建设农业强国的头等大事。2023年12月，习近平总书记在中央农村工作会议召开之际，对“三农”工作作出重要指示。习近平总书记指出，要全面落实粮食安全党政同责，坚持稳面积、增单产两手发力。要树立大农业观、大食物观，农林牧渔并举，构建多元化食物供给体系。要守住耕地这个命根子，坚决整治乱占、破坏耕地违法行为，加大高标准农田建设投入和管护力度，确保耕地数量有保障、质量有提升。要强化科技和改革双轮驱动，加大核心技术攻关力度，改革完善“三农”工作体制机制，为农业现代化增动力、添活力。\n④错误：习近平总书记指出，中国人的饭碗任何时候都要牢牢端在自己手上。为此，必须坚持以我为主、立足国内、确保产能、适度进口、科技支撑的国家粮食安全战略。\n④“逐步加大国外优质种业资源和海外粮食产品在我国市场的占有率”不利于保障我国的粮食安全。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":7,"t":"单选","q":"习近平总书记强调，要牢牢扭住自主创新这个“牛鼻子”，关于自主创新的举措，下列表述正确的有几项？\n①主动对接国家战略需求，整合和优化科教创新资源\n②培育产业园区，加强对口合作，加快科研成果落地转化\n③培育新能源、新材料、先进制造、电子信息等战略性新兴产业\n④建设风光火核储一体化能源基地\n③逐步弱化央地合作，鼓励各地自主发展新兴产业","o":["2项","3项","4项","5项"],"a":"C","e":"2023年9月，习近平总书记在新时代推动东北全面振兴座谈会上强调，要牢牢扭住自主创新这个“牛鼻子”，在巩固存量、拓展增量、延伸产业链、提高附加值上下功夫。主动对接国家战略需求，整合和优化科教创新资源，加大研发投入，掌握更多关键核心技术。积极培育产业园区，加强对口合作，加快科研成果落地转化。积极培育新能源、新材料、先进制造、电子信息等战略性新兴产业，积极培育未来产业，加快形成新质生产力，增强发展新动能。加快发展风电、光电、核电等清洁能源，建设风光火核储一体化能源基地。加强生态资源保护利用，依托东北的生态环境和生物资源优势，发展现代生物、大数据等新兴特色产业，发展冰雪经济和海洋经济。继续深化国有企业改革，实施国有企业振兴专项行动，提高国有企业核心竞争力，推动国有资本向重要行业和关键领域集中，强化战略支撑作用。创新央地合作模式，促进央地融合发展，更好带动地方经济发展。据此可知，\n①②③④正确，\n⑤错误，应创新央地合作，而非弱化。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":8,"t":"单选","q":"深化医药卫生体制改革是进一步全面深化改革的重要任务。关于深化医药卫生体制改革，下列举措不恰当的是：","o":["促进优质医疗资源扩容下沉和区域均衡布局","加快建设分级诊疗体系，强化基层医疗卫生服务","完善公立医院薪酬制度，严格限制、缩减编制数量","促进医疗、医保、医药协同发展和治理"],"a":"C","e":"《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，“深化医药卫生体制改革。实施健康优先发展战略，健全公共卫生体系，促进社会共治、医防协同、医防融合，强化监测预警、风险评估、流行病学调查、检验检测、应急处置、医疗救治等能力。促进医疗、医保、医药协同发展和治理。促进优质医疗资源扩容下沉和区域均衡布局，加快建设分级诊疗体系，推进紧密型医联体建设，强化基层医疗卫生服务。深化以公益性为导向的公立医院改革，建立以医疗服务为主导的收费机制，完善薪酬制度，建立编制动态调整机制。引导规范民营医院发展。创新医疗卫生监管手段。健全支持创新药和医疗器械发展机制，完善中医药传承创新发展机制”。综上可知，C项中“严格限制、缩减编制数量”的表述不恰当，应改为“建立编制动态调整机制”。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":9,"t":"单选","q":"以人民为中心的发展思想不是一个抽象的玄奥的概念，不能只停留在口头上，止步于思想环节，而要体现在经济社会发展各个环节，下列体现这一思想的有几项？\n①深化收入分配制度改革，优化收入分配结构\n②全面贯彻党的教育方针，努力办好人民满意的教育\n③实施就业优先战略，把就业摆在经济社会发展优先位置\n④把保障人民健康放在优先发展的战略地位，全面推进健康中国建设\n③完善基本养老保险全国统筹制度，发展多层次多支柱养老保险体系","o":["2项","3项","4项","5项"],"a":"D","e":"以人民为中心的发展思想，核心是发展为了人民、发展HE依靠人民、发展成果由人民共享，落实在民生、收入、教育、就业、社保、健康等经济社会发展各领域。\n①②③④5皆正确。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":10,"t":"单选","q":"2025年9月1日，习近平总书记在“上海合作组织+”会议上郑重提出全球治理倡议。近年来，习近平总书记提出了一系列全球倡议，从不同角度为动荡不安的世界注入稳定性和确定性，为应对世界变局、破解人类难题提供了中国智慧和中国方案。下列倡议与其主要内容对应正确的是：","o":["全球文明倡议——奉行主权平等，遵守国际法治，践行多边主义，倡导以人为本，注重行动导向","全球治理倡议——坚持发展优先、以人民为中心、普惠包容、创新驱动、人与自然和谐共生、行动导向","全球发展倡议——尊重世界文明多样性，弘扬全人类共同价值，重视文明传承和创新，加强国际人文交流合作","全球安全倡议——坚持共同、综合、合作、可持续的安全观，尊重各国主权、领土完整，遵守联合国宪章宗旨和原则，重视各国合理安全关切，通过对话协商以和平方式解决国家间的分歧和争端，统筹维护传统领域和非传统领域安全"],"a":"D","e":"A项对应错误：全球文明倡议的内容：共同倡导尊重世界文明多样性；共同倡导弘扬全人类共同价值；共同倡导重视文明传承和创新；共同倡导加强国际人文交流合作。B项对应错误：全球治理倡议的内容：奉行主权平等；遵守国际法治；践行多边主义；倡导以人为本；注重行动导向。C项对次相遇应错误：全球发展倡议的内容：坚持发展优先；坚持以人民为中心；坚持普惠包容；坚持创新驱动；坚持人与自然和谐共生；坚持行动导向。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":11,"t":"单选","q":"习近平总书记指出，在波澜壮阔的中国人民抗日战争中千千万万的抗战英雄抛头颅、洒热血，为战争胜利作出了重大贡献，为铸就伟大的抗战精神作出了重大贡献。伟大的抗战精神，永远是激励中国人民克服一切艰难险阻为实现中华民族伟大复兴而奋斗的强大精神动力。下列不属于伟大抗战精神内涵的是：","o":["生命至上、命运与共的必胜信念","不畏强暴、血战到底的英雄气概","视死如归、宁死不屈的民族气节","天下兴亡、匹夫有责的爱国情怀"],"a":"A","e":"伟大抗战精神的内涵：天下兴亡、匹夫有责的爱国情怀，视死如归、宁死不屈的民族气节，不畏强暴、血战到底的英雄气概，百折不挠、坚忍不拔的必胜信念。伟大抗疫精神包括“生命至上、举国同心、舍生忘死、尊重科学、命运与共”。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":12,"t":"单选","q":"推进碳达峰碳中和是党中央作出的重大战略决策，是我们对国际社会的庄严承诺，也是推动经济结构转型升级、形成绿色低碳产业竞争优势，实现高质量发展的内在要求。以下有关推进碳达峰碳中和的表述，最准确的是：","o":["积极落实《联合国气候变化框架公约》，与世界各国协商确定达到“双碳”目标的路径和方式、节奏和力度","实现碳达峰碳中和，时间紧任务重，各地应加快步调，通过“碳冲锋”“运动式减碳”尽快实现目标","要优化调整产业结构、大力发展绿色低碳产业，使发展建立在高效利用资源、严格保护生态环境、有效控制温室气体排放的基础上","对于碳排放较高的传统行业，应优先关停退出，确有较高经济价值的，逐步引导实现绿色低碳转型"],"a":"C","e":"A项错误：习近平总书记指出，我们承诺的“双碳”目标是确定不移的，但达到这一目标的路径和方式、节奏和力度则应该而且必须由我们自己作主，决不受他人左右。B项错误：习近平总书记指出，实现碳达峰碳中和，等不得也急不得，不可能毕其功于一役，必须坚持稳中求进、逐步实现，决不能搞“碳冲锋”“运动式减碳”。D项错误：习近平总书记指出，要立足国情，坚持先立后破，加快规划建设新型能源体系，确保能源安全。传统能源和传统产业当前仍是保障我国经济社会运行的“压舱石”，正确做法是通过技术创新推动其清洁高效利用。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":13,"t":"单选","q":"建设教育强国，基点在基础教育。基础教育搞得越扎实，教育强国步伐就越稳、后劲就越足。关于加强基础教育，下列举措正确的有几项？\n①提升寄宿制学校办学条件和管理水平，办好必要的乡村小规模学校\n②统筹推进市域内高中阶段学校多样化发展，加快扩大普通高中教育资源供给\n③强化家庭教育主阵地作用，健全学校家庭社会协同育人机制\n④建立基础教育各学段学龄人口变化监测预警制度，优化中小学和幼儿园布局\n③深人开展县域义务教育优质均衡督导评估，有序推进市域义务教育优质均衡发展","o":["4项","3项","2项","1项"],"a":"A","e":"③错误：《教育强国建设规划纲要（2024一2035年）》指出，强化学校教育主阵地作用，全面提升课堂教学水平，加强对学习困难学生的辅导。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":14,"t":"单选","q":"2025年底，中共中央政治局召开民主生活会强调，锲而不舍落实中央八项规定精神，以优良作风凝心聚力真抓实干。关于作风问题，下列说法不准确的是：","o":["作风问题核心是党同人民群众的关系问题","党强大的人格力量集中体现为党的优良作风","透过党性看作风，在解决党性问题的基础上解决好作风问题","抓作风建设，重点突出坚定理想信念、践行根本宗旨、加强道德修养"],"a":"C","e":"《习近平关于加强党的作风建设论述摘编》指出，作风问题根本上是党性问题。作风反映的是形象和素质，体现的是党性，起决定作用的也是党性。我们改进作风，不能简单就事论事，以为把眼前存在的作风问题从面上解决了就万事大吉了，而是要举一反三，透过作风看党性，在解决作风问题的基础上解决好党性问题。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":15,"t":"单选","q":"习近平总书记指出，中国愿同世界各国一道，把握信息革命发展的历史主动，携手构建网络空间命运共同体，让互联网更好造福人民、造福世界。关于构建网络空间命运共同体，下列表述正确的是：\n①尊重网络主权，维护网络安全，共同构建和平、安全、开放、合作的网络空间\n②全球网络主要由跨国公司提供，网络空间未来应由跨国公司携手经营\n③倡导发展优先，构建更加普惠繁荣的网络空间\n④保障数据安全，建立单边、保密的国际互联网治理体系\n⑤深化网络安全务实合作，有力打击网络违法犯罪行为","o":["①③⑤","①④","①②③⑤","①②③④⑤"],"a":"A","e":"①正确，\n④错误：2014年，习近平总书记向首届世界互联网大会致贺词时指出，中国愿意同世界各国携手努力，本着相互尊重、相互信任的原则，深化国际合作，尊重网络主权，维护网络安全，共同构建和平、安全、开放、合作的网络空间，建立多边、民主、透明的国际互联网治理体系。\n②错误：2015年，习近平总书记出席第二届世界互联网大会开幕式时讲话指出，网络空间是人类共同的活动空间，网络空间前途命运应由世界各国共同掌握。\n③⑤正确：2023年，习近平总书记在向第十届世界互联网大会开幕式发表视频致辞时强调，倡导发展优先，构建更加普惠繁荣的网络空间。深化网络安全务实合作，有力打击网络违法犯罪行为，加强数据安全和个人信息保护。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":16,"t":"单选","q":"党的十八大以来，以习近平同志为核心的党中央坚定不移推进全面从严治党，取得一系列理论创新、实践创新、制度创新成果，构建起全面从严治党体系，开辟了百年大党自我革命新境界。下列关于全面从严治党的表述不准确的是：","o":["制度建设要与管党治党需要相适应、与党的各项建设相配套，全方位织密制度的笼子","严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到“两个维护”","新时代党的建设是以党的组织建设为统领、党的各项建设同向发力综合发力的系统工程","着力抓好政治监督、领导班子特别是“一把手\"监督、“三重一大\"事项监督以及权力集中、资金密集、资源富集等重点领域的监督"],"a":"C","e":"C项错误：2025年第4期《求是》重要文章《健全全面从严治党体系》指出，新时代党的建设是以党的政治建设为统领、党的各项建设同向发力综合发力的系统工程。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":17,"t":"单选","q":"习近平总书记强调，中国将坚持推进高水平对外开放，以高质量发展全面推进中国式现代化，为各国开放合作提供新机遇。关于推进高水平对外开放，下列举措恰当的有几项？\n①维护多元稳定的国际经济格局和经贸关系\n②加强知识产权保护，营造良好的营商环境\n③稳步扩大规则、规制、管理、标准等制度型开放\n④减少对外资企业的准人限制，全面放开所有行业领域\n③加快建设贸易强国，推动共建“一带一路”高质量发展","o":["2项","3项","4项","5项"],"a":"C","e":"①举措恰当：党的二十大报告指出，要推进高水平对外开放。深度参与全球产业分工和合作，维护多元稳定的国际经济格局和经贸关系。\n②举措恰当：习近平总书记的重要文章《全面加强知识产权保护工作激发创新活力推动构建新发展格局》指出，知识产权保护工作关系国家对外开放大局，只有严格保护知识产权，才能优化营商环境、建设更高水平开放型经济新体制。这一举措有利于推进高水平对外开放。\n③举措恰当：党的二十大报告指出，要推进高水平对外开放。稳步扩大规则、规制、管理、标准等制度型开放。\n④举措不恰当：党的二十大报告指出，要推进高水平对外开放。合理缩减外资准人负面清单，依法保护外商投资权益，营造市场化、法治化、国际化一流营商环境。由此可知，我国目前只是减少对外资企业的准入限制，“全面放开”的表述过于绝对化，涉及国家安全、战略资源的领域仍需审慎监管。5举措恰当：党的二十大报告指出，要推进高水平对外开放。推动货物贸易优化升级，创新服务贸易发展机制，发展数字贸易，加快建设贸易强国。推动共建“一带一路”高质量发展。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":18,"t":"单选","q":"我国已经进人推动高质量发展的关键时期，要以人口高质量发展打造高素质人力资源，加快构建新发展格局。关于推动人口高质量发展，下列举措不恰当的是：","o":["稳妥有序实施延迟法定退休年龄政策","重视家庭家教家风，建设新型婚育文化","提高教育普及水平，增加劳动力平均受教育年限","抓住人口增量发展蕴含的新机遇，优化人口结构和分布"],"a":"D","e":"2024年11月16日出版的《求是》杂志发表了习近平总书记的重要文章《以人口高质量发展支撑中国式现代化》。A项举措恰当：文章指出，要加强人力资源开发利用，增加全社会劳动力有效供给。要稳妥有序实施延迟法定退休年龄政策。B项举措恰当：文章指出，要重视家庭家教家风，建设新型婚育文化，推进婚俗改革，破除高价彩礼等陈规陋习。C项举措恰当：文章指出，要提高教育普及水平，增加劳动力平均受教育年限。D项举措不恰当:文章指出，要抓住人口减量发展蕴含的新机遇，加强生态保护修复，促进休养生息。要优化人口结构和分布，维护国家安全。所以“抓住人口增量”的举措错误。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":19,"t":"单选","q":"统一开放的交通运输市场是有效衔接供需、促进国民经济循环畅通的重要基础。关于加快建设统一开放的交通运输市场，下列举措不恰当的是：","o":["建立交通运输装备能源清洁替代机制，保障规划实施全类运输工具应用新能源、清洁能源","对交通运输领域招标投标、政府采购等相关规章制度按照有关规定进行公平竞争审查","依托全国一体化大数据中心协同创新体系布局，构建综合交通大数据中心体系","防止利用数据、算法、技术等手段排除限制竞争、侵害从业人员合法权益"],"a":"A","e":"2024年12月，《中共中央办公厅国务院办公厅关于加快建设统一开放的交通运输市场的意见》发布。A项举措不恰当：意见指出，次相遇要推动交通运输绿色智慧转型升级。完善交通运输装备能源清洁替代政策，推动中重型卡车、船舶等运输工具应用新能源、清洁能源。由此可知，A项中“全类运输工具”的说法错误。B项举措恰当：意见指出，要完善交通领域价格机制。对交通运输领域招标投标、政府采购、经营行为规范、资质标准等相关规章制度按照有关规定进行公平竞争审查，维护公平竞争市场秩序。C项举措恰当：意见指出，要推进数据和技术赋能交通运输发展。依托全国一体化大数据中心协同创新体系布局，构建综合交通大数据中心体系。D项举措恰当：意见指出，要强化反垄断和反不正当竞争。加强交通运输领域市场竞争状况评估，依法查处垄断和不正当竞争行为，防止利用数据、算法、技术等手段排除限制竞争、侵害从业人员合法权益。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":20,"t":"单选","q":"党的二十届三中全会《决定》提出“积极推进首发经济”。关于“首发经济”、下列说法不正确的是：","o":["首发经济是指企业发布新产品、推出新业态、新模式、新服务、新技术，开设首店等经济活动的总称","首发经济涵盖了企业从产品或服务的首次发布、首次展出到首次落地开设门店、首次设立研发中心，再到设立企业总部的链式发展全过程","首发经济的吸引力，在根本上取决于企业的品牌效应","首发经济自带创新属性，具有时尚、品质、新潮等特征"],"a":"C","e":"A、B项正确：首发经济是指企业发布新产品，推出新业态、新模式、新服务、新技术，开设首店等经济活动的总称，其涵盖了企业从产品或服务的首次发布、首次展出到首次落地开设门店、首次设立研发中心，再到设立企业总部的链式发展全过程。C项错误：首发经济与品牌效应密切相关，没有品牌效应，首发经济很难在激发消费潜力和活力方面持续发挥作用。企业的品牌效应是影响首发经济吸引力的重要因素，但不是唯一的决定性因素，首发经济的吸引[力是多种因素综合作用的结果。D项正确：首发经济自带创新属性，具有时尚、品质、新潮等特征，是符合消费升级趋势和高质量发展要求的一种经济形态，是一个地区商业活力、消费实力、创新能力、国际竞争力、品牌形象和开放度的重要体现。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":22,"t":"单选","q":"经济工作千头万绪，必须统筹好有效市场和有为政府的关系、总供给和总需求的关系、培育新动能和更新旧动能的关系、做优增量和盘活存量的关系、提升质量和做大总量的关系。下列相关说法不准确的是：","o":["要加快推动作为经济增长和就业收入基本依托的传统产业改造升级","要加快补上内需特别是消费短板，使内需成为拉动经济增长的主动力和稳定锚","要坚持以量取胜、充分发挥规模效应，用好超大规模市场优势和丰富应用场景","要用好各类增量资源和存量资源，通过盘活存量来带动增量"],"a":"C","e":"习近平总书记指出，要坚持以质取胜和发挥规模效应相统一，用好超大规模市场优势和丰富应用场景，培育更多世界一流企业和领先技术，把质的有效提升和量的合理增长统一于高质量发展的全过程。故本题答案为C。公考资料免费更新加微信。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":23,"t":"单选","q":"习近平总书记指出，我们要建成的教育强国，是中国特色社会主义教育强国，应当具有强大的思政引领力、人才竞争力、科技支撑力、民生保障力、社会协同力、国际影响力，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑。关于建设教育强国，下列说法正确的是：","o":["要坚持教育均等化原则，把教育公平作为国家基本教育政策","要完善人才培养与经济社会发展需要适配机制，顺应时代发展要求，适度增加学科专业数量","要把引进全球顶尖科学家摆到更加突出位置，着力培育拔尖创新人才，推动实现高水平科技自立自强","从教育大国到教育强国是一个系统性跃升和质变，必须以改革创新为动力"],"a":"D","e":"A项说法错误：2018年9月10日，习近平总书记在全国教育大会上的讲话中指出：我们要坚持我国教育现代化的社会主义方向，坚持教育公益性原则，把教育公平作为国家基本教育政策，大力推进教育体制改革创新。B项说法错误：要完善人才培养与经济社会发展需要适配机制，顺应时代发展要求，动态调整学科专业，优化办学资源配置，完善学生实习实践制度，努力让每一位人才都能人尽其才、才尽其用、各得其所。C项说法错误：要把培养国家重大战略急需人才摆到更加突出位置，着力造就拔尖创新人才，推动实现高水平科技自立自强。D项说法正确：2023年5月29日，中共中央政治局就建设教育强国进行第五次集体学习。习近平总书记强调，从教育大国到教育强国是一个系统性跃升和质变，必须以改革创新为动力。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":24,"t":"单选","q":"恩格斯深刻指出：“马克思的整个世界观不是教义，而是方法。它提供的不是现成的教条，而是进一步研究的出发点和供这种研究使用的方法。”下列有关马克思主义理论的说法不准确的是：","o":["马克思创立了辩证法，成为我们认识世界和改造世界的根本方法","科学社会主义的原则不能丢，但科学社会主义也绝不是一成不变的教条","当代中国的伟大社会变革不是简单套用马克思主义经典作家设想的模板","《共产党宣言》发表至今，人类社会发生了翻天覆地的变化，但马克思主义所阐述的一般原理整个来说仍然是完全正确的"],"a":"A","e":"马克思是批判继承了黑格尔的辩证法，创立了唯物辩证法，但辩证法思想在马克思之前已有，不是马克思创立的。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":25,"t":"单选","q":"习近平总书记指出，问题是事物矛盾的表现形式，我们强调增强问题意识、坚持问题导向，就是承认矛盾的普遍性、客观性，就是要善于把认识和化解矛盾作为打开工作局面的突破口。关于矛盾的普遍性、客观性，下列说法正确的是：","o":["矛盾的普遍性是有条件的，并根据条件的变化而变化","矛盾的客观性从属于主观性，不能脱离人的认知、情感、意志而存在","矛盾的普遍性是矛盾的共性，矛盾的特殊性是矛盾的个性","矛盾的普遍性、客观性决定了事物的不同性质，是认清事物本质和发展规律的基础"],"a":"C","e":"A、D项错误，C项正确：矛盾的普遍性是指矛盾存在于一切事物中，存在于一切事物发展过程的始终；矛盾的特殊性是指各个具体事物的矛盾、每一个矛盾的各个方面在发展的不同阶段上各有其特点。矛盾的特殊性决定了事物的不同性质。只有具体分析矛盾的特殊性才能认清事物的本质和发展规律。矛盾的普遍性即矛盾的共性，矛盾的特殊性即矛盾的个性。矛盾的普遍性是无条件的、绝对的，矛盾的特殊性是有条件的、相对的。任何现实存在的事物的矛盾都是共性和个性的有机统一，共性寓于个性之中，没有离开个性的共性，也没有离开共性的个性。B项错误：矛盾具有客观性，不以人的意志为转移。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":26,"t":"单选","q":"习近平总书记强调，要坚定不移贯彻新发展理念，更加自觉地把高质量充分就业作为经济社会发展的优先目标。下列关于高质量充分就业的表述正确的是：\n①全面贯彻劳动者自主就业、政府主导就业、市场促进就业的方针\n②坚持扩大就业容量和提升就业质量相结合\n③坚持就业带动创业\n④加强灵活就业和新就业形态劳动者权益保障，扩大职业伤害保障试点","o":["①②","①③","②④","③④"],"a":"C","e":"2024年5月，中共中央政治局就促进高质量充分就业进行第十四次集体学习。\n①错误：习近平总书记在主持学习时强调，促进高质量充分就业，是新时代新征程就业工作的新定位、新使命。要坚持以人民为中心的发展思想，全面贯彻劳动者自主就业、市场调节就业、政府促进就业和鼓励创业的方针，持续促进就业质的有效提升和量的合理增长，不断增强广大劳动者的获得感幸福感安全感，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑。\n②正确，\n③错误：习近平总书记在主持学习时指出，党的十八大以来，党中央坚持把就业工作摆在治国理政的突出位置，强化就业优先政策，健全就业促进次相遇机制，有效应对各种压力挑战，城镇新增就业年均1300万人，为民生改善和经济发展提供了重要支撑。在实践中不断深化对新时代就业工作规律的认识，积累了许多经验。主要包括：坚持把就业作为民生之本；坚持实施就业优先战略；坚持依靠发展促进就业；坚持扩大就业容量和提升就业质量相结合；坚持突出抓好重点群体就业；坚持创业带动就业；坚持营造公平就业环境；坚持构建和谐劳动关系；等等。这些经验十分宝贵，要长期坚持并不断丰富发展。\n④正确：习近平总书记在主持学习时强调，要加强劳动者权益保障。加强灵活就业和新就业形态劳动者权益保障，扩大职业伤害保障试点，及时总结经验、形成制度。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":27,"t":"单选","q":"党的二十届三中全会提出，要稳步扩大制度型开放。关于稳步扩大制度型开放，下列举措不恰当的是：","o":["独立自主构建不同于国际经济贸易规则的中国特色经贸规则体系","有序扩大我国商品市场、服务市场、资本市场、劳务市场等对外开放","积极参与全球经济治理体系改革，提供更多全球公共产品","扩大对最不发达国家单边开放"],"a":"A","e":"党的二十届三中全会通过的《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，“稳步扩大制度型开放。主动对接国际高标准经贸规则，在产权保护、产业补贴、环境标准、劳动保护、政府采购、电子商务、金融领域等实现规则、规制、管理、标准相通相容，打造透明稳定可预期的制度环境。扩大自主开放，有序扩大我国商品市场、服务市场、资本市场、劳务市场等对外开放，扩大对最不发达国家单边开放。深化援外体制机制改革，实现全链条管理。维护以世界贸易组织为核心的多边贸易体制，积极参与全球经济治理体系改革，提供更多全球公共产品。扩大面向全球的高标准自由贸易区网络，建立同国际通行规则衔接的合规机制，优化开放合作环境”。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":28,"t":"单选","q":"完善市场经济基础制度是构建高水平社会主义市场经济体制的重要内容。下列不属于完善市场经济基础制度内容的是：","o":["完善财政转移支付体系","完善市场信息披露制度","完善市场准人制度","完善产权制度"],"a":"A","e":"A项不属于：《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，“深化财税体制改革。·….…·完善财政转移支付体系，清理规范专项转移支付，增加一般性转移支付，提升市县财力同事权相匹配程度”。据此可知，A项属于深化财税体制改革的内容。B、C、D项属于：《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，“完善市场经济基础制度。完善产权制度，依法平等长久保护各种所有制经济产权，建立高效的知识产权综合管理体制。完善市场信息披露制度，构建商业秘密保护制度。对侵犯各种所有制经济产权和合法利益的行为实行同责同罪同罚，完善惩罚性赔偿制度。加强产权执法司法保护，防止和纠正利用行政、刑事手段干预经济纠纷，健全依法甄别纠正涉企冤错案件机制。完善市场准人制度，优化新业态新领域市场准人环境。深化注册资本认缴登记制度改革，实行依法按期认缴。健全企业破产机制，探索建立个人破产制度，推进企业注销配套改革，完善企业退出制度。健全社会信用体系和监管制度”。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":29,"t":"单选","q":"习近平总书记指出：“社会治理是一门科学，管得太死，一潭死水不行；管得太松，波涛汹涌也不行。要讲究辩证法，处理好活力和秩序的关系，全面看待社会稳定形势，准确把握维护社会稳定工作，坚持系统治理、依法治理、综合治理、源头治理。”关于活力和秩序的关系，下列说法正确的是：\n①二者相互依存，互为彼此存在的前提\n②二者相互排斥，构成了事物的矛盾运动\n③二者相互贯通，在一定条件下可以相互转化\n④二者相互分离，规定着事物发展的趋势","o":["①③","①④","②④","②③"],"a":"A","e":"②④不符合题意：活力与秩序确实存在对立、排斥的一面，这种对立面的斗争推动事物发展。但题干强调“要讲究辩证法，处理好活力和秩序的关系，全面看待社会稳定形势”，更侧重二者的统一与平衡，反对将二者割裂。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":30,"t":"单选","q":"在“优化国土空间发展格局”方面，《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出了明确要求。下列相关说法正确的是：","o":["调整城市化地区、农产品主产区、生态功能区格局，以适应新的发展形势","推动战略性产业向东部地区集中，发挥其技术和人才优势","赋予省级政府统筹建设用地更大自主权，探索实施建设用地总量按规划期管控模式，实行统筹存量和增量综合供地","逐步取消城镇开发边界，为城市扩张和经济发展提供充足空间"],"a":"C","e":"A项错误：《建议》指出，强化主体功能区战略实施，保持城市化地区、农产品主产区、重点生态功能区格局总体稳定，细化明确特殊功能区，完善支持政策和考核评价机制。B项错误：《建议》指出，推动战略性产业、能源资源基地等布局优化。D项错误：《建议》指出，完善国土空间规划体系，落实优化耕地和永久基本农田、生态保护红线、城镇开发边界等控制线，分区分类实施差别化、精细化用途管制。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":31,"t":"单选","q":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》强调，实现社会主义现代化是一个阶梯式递进、不断发展进步的历史过程，需要不懈努力、接续奋斗。下列对“十五五”时是：","o":["是开启全面建设社会主义3口五年","是基本实现社会主义现代键时期","是全面实现全体人民共同？展的关键时期","是基本实现社会主义现代1"],"a":"B","e":"A项错误：开启全面建设社会主义现代化国家新征程的第一个五年是“十四五”时期（2021—2025年）。C项错误：“全面实现全体人民共同富裕”是本世纪中叶建成社会主义现代化强国的重要目标，“十五五”时期的目标是扎实推进共同富裕，而非“全面实现”。D项错误：“决胜时期”一般指目标实现前的最后冲刺阶段，2035年基本实现社会主义现代化的决胜阶段应在2030一2035年，“十五五”属于前期夯实基础的阶段，而非决胜阶段。故本题答案为B。","v":true,"bad":1},{"b":"冲刺五百","s":"国省考历年精选","n":32,"t":"单选","q":"水是生存之步及国家长治久安的大事。为了解决好水安全问题，下列说法有误的是：","o":["要树立节约用水就是保护生态、保护水源就是保护家园的意识，坚决抑制不合理用水需求","要根据人口、城市和产业发展规划，因地制宜发掘更多水资源，避免水资源成为发展的约束条件","要按照“节水优先、空间均衡、系统治理、两手发力”的方针治水","要统筹做好水灾害防治、水资源节约、水生态保护修复、水环境治理"],"a":"B","e":"《中共中央办公厅国务院办公厅关于全面推进江河保护治理的意见》指出，强化水资源刚性约束。坚持以水定城、以水定地、以水定人、以水定产，完善水资源总量管理和全面节约制度。故本题答案为B。","v":true,"bad":1},{"b":"冲刺五百","s":"国省考历年精选","n":33,"t":"单选","q":"城乡融合发展是中国式现代化的必然要求。关于城乡融合发展，下列说法正确的有几项？\n①要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路\n②在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败\n③要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒\n④振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系","o":["1项","2项","3项","4项"],"a":"D","e":"①正确：习近平总书记强调，要把乡村振兴战略这篇大文章做好，必须走城乡融合发展之路。\n②正确：2018年习近平总书记主持第十九届中共中央政治局第八次集体学习时讲话指出，“在现代化进程中，如何处理好工农关系、城乡关系，在一定程度上决定着现代化的成败。”\n③正确：2022年，习近平总书记在中央农村工作会议上强调，“要顺应城乡融合发展大趋势，破除妨碍城乡要素平等交换、双向流动的制度壁垒，促进发展要素、各类服务更多下乡，率先在县域内破除城乡二元结构”。\n④正确：2020年，习近平总书记在中央次相遇农村工作会议上指出，“振兴乡村，不能就乡村论乡村，还是要强化以工补农、以城带乡，加快形成工农互促、城乡互补、协调发展、共同繁荣的新型工农城乡关系。”故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":34,"t":"单选","q":"推进中国式现代化是一个系统工程，需要统筹兼顾、系统谋划、整体推进，正确处理好一系列重大关系。下列与之相关的表述正确的有几项？\n①活力与秩序：中国式现代化应当而且能够实现活而不乱、活跃有序的动态平衡\n②守正与创新：守正才能不迷失方向、不犯颠覆性错误，创新才能把握时代、引领时代\n③战略与策略：要增强策略的前瞻性，准确把握事物发展的必然趋势，以科学的战略预见未来、引领未来\n④效率与公平：中国式现代化既要创造比资本主义更高的效率，又要更有效地维护社会公平，更好实现效率与公平相兼顾、相促进、相统一","o":["1项","2项","3项","4项"],"a":"C","e":"③错误：《推进中国式现代化需要处理好若干重大关系》指出，要增强战略的前瞻性，准确把握事物发展的必然趋势，敏锐洞悉前进道路上可能出现的机遇和挑战，以科学的战略预见未来、引领未来。战略着眼于全局、长远和根本，因而战略应具有前瞻性，用以预见和引I领未来。策略是为实现战略目标而采取的具体路径和手段，应具有灵活性、针对性，更强调可操作性。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":35,"t":"单选","q":"下列选项中，习近平总书记用语与其蕴含的思想、观点对应恰当的是：\n①我将无我，不负人民—全心全意为人民服务\n②功成不必在我、功成必定有我一方向决定前途，道路决定命运\n③江山就是人民，人民就是江山—民为邦本\n④时代是出卷人，我们是答卷人，人民是阅卷人一时代造就英雄，伟大来自平凡","o":["①②","①③","②④","③④"],"a":"B","e":"②对应错误：“功成不必在我、功成必定有我”强调的是一种正确的政绩观和责任担当，即要立足长远、甘于铺垫，同时也要履职尽责、积极作为。而“方向决定前途，道路决定命运”强调的是道路选择和发展方向的根本重要性。4对应错误：“时代是出卷人，我们是答卷人，人民是阅卷人”强调的是以人民为中心的执政理念和评价标准，即工作的成效最终要由人民来评判。而“时代造就英雄，伟大来自平凡”强调的是英雄与时代、伟大与平凡之间的辩证关系。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":36,"t":"单选","q":"党的十八大以来，以习近平同志为核心的党中央高度重视海洋工作和海洋事业发展，将海洋强国建设作为实现中华民族伟大复兴的重大战略任务，通盘谋划、整体推进海洋强国建设。关于建设海洋强国，下列表述不准确的是：","o":["统筹处理人与自然的关系、发展和保护的关系是推进海洋强国建设的重大原则","建设海洋强国必须进一步关心海洋、认识海洋、经略海洋，加快海洋科技创新步伐","建设强大的现代化海军是建设世界一流军队的重要标志，是建设海洋强国的战略支撑","建设海洋强国所需的关键技术主要靠对外开放引进，靠充分发挥国外关键技术经验优势"],"a":"D","e":"A项正确：2024年1月，《求是》杂志刊发自然资源部文章《抓好海洋资源开发保护为建设美丽中国提供蓝色动力》指出，统筹处理人与自然的关系、发展和保护的关系是推进海洋强国建设的重大原则。B项正确：2018年，习近平总书记在山东青岛考察时讲话指出，建设海洋强国，必须进一步关心海洋、认识海洋、经略海洋，加快海洋科技创新步伐。C项正确：2017年，习近平总书记视察海军机关时讲话指出，建设强大的现代化海军是建设世界一流军队的重要标志，是建设海洋强国的战略支撑，是实现中华民族伟大复兴中国梦的重要组成部分。D项错误：2022年，习近平总书记在海南考察时讲话指出，要推动海洋科技实现高水平自立自强，加强原创性、引领性科技攻关，把装备制造牢牢抓在自己手里，努力用我们自己的装备开发油气资源，提高能源自给率，保障国家能源安全。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":37,"t":"单选","q":"习近平总书记强调，现代化产业体系是现代化国家的物质技术基础，必须把发展经济的着力点放在实体经济上，为实现第二个百年奋斗目标提供坚强物质支撑。下列与之相关的说法正确的有几项？\n①推进实施绿色发展战略，充分发挥绿色化赋能实体经济发展效应\n②促进数字技术与实体经济深度融合，催生新产业新业态新模式替代传统产业\n③重视现代服务业的发展，推动现代服务业与先进制造业、现代农业深度融合\n④推动重点产业在国内外有序转移、促进国内外产业深度融合与实体经济发展相结合","o":["1项","2项","3项","4项"],"a":"C","e":"①④正确：《加快建设以实体经济为支撑的现代化产业体系》一文指出，加快推进建设以实体经济为支撑的现代化产业体系的重要举措包括：以推动创新驱动发展与发展实体经济相结合，加快建设以实体经济为支撑的现代化产业体系；深入推进实施绿色发展战略，推动绿色发展与实体经济发展相融合，充分发挥绿色化赋能实体经济发展效应；推动重点产业在国内外有序转移、促进国内外产业深度融合与实体经济发展相结合。\n②错误：《中华人民共和国国民经济和社会发展第十四个五年规划和2035年远景目标纲要》指出，要充分发挥海量数据和丰富应用场景优势，促进数字技术与实体经济深度融合，赋能传统产业转型升级，催生新产业新业态新模式，壮大经济发展新引擎。由此可知，\n②中“替代传统产业”的说法错误。\n③正确：《加快建设以实体经济为支撑的现代化产业体系》一文指出，要牢牢把握加快建设以实体经济为支撑的现代化产业体系的重要任务。要重视推动现代服务业的发展，推动现代服务业与先进制造业、现代农业深度融合。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":38,"t":"单选","q":"习近平总书记指出，如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。关于实现建军一百年奋斗目标，下列举措恰当的是：\n①加强军史学习教育，繁荣发展强军文化，强化战斗精神培育\n②加强军人军属荣誉激励和权益保障，做好退役军人服务保障工作\n③积极开展军事斗争，塑造安全态势，退控危机冲突，阻止局部战争\n④研究掌握信息化智能化战争特点规律，创新军事战略指导，发展人民战争战略战术","o":["①②③","①②④","①③④","②③④"],"a":"B","e":"①举措恰当：党的二十大报告指出，实现建军一百年奋斗目标，开创国防和军队现代化新局面，要全面加强人民军队党的建设，确保枪杆子永远听党指挥。加强军史学习教育，繁荣发展强军文化，强化战斗精神培育。\n②举措恰当：党的二十大报告指出，实现建军一百年奋斗目标，开创国防和军队现代化新局面，要巩固提高一体化国家战略体系和能力。加强军人军属荣誉激励和权益保障，做好退役军人服务保障工作。\n③举措不恰当：党的二十大报告指出，实现建军一百年奋斗目标，开创国防和军队现代化新局面，要全面加强练兵备战，提高人民军队打赢能力。加强军事力量常态化多样化运用，坚定灵活开展军事斗争，塑造安全态势，遏控危机冲突，打赢局部战争。\n④举措恰当：党的二十大报告指出，实现建军一百年奋斗目标，开创国防和军队现代化新局面，要全面加强练兵备战，提高人民军队打赢能力。研究掌握信息化智能化战争特点规律，创新军事战略指导，发展人民战争战略战术。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":40,"t":"单选","q":"习近平总书记强调，全面深化改革必须以促进社会公平正义、增进人民福扯为出发点和落脚点，从人民整体利益、根本利益、长远利益出发谋划和推进改革，多推出一些民生所急、民心所向的改革举措，多办一些惠民生、暖民心、顺民意的实事，做到老百姓关心什么、期盼什么，改革就要抓住什么、推进什么。下列改革措施能够体现上述要求的是：\n①推行“三明医改”经验\n②推行新生儿“出生一件事”“最多跑一次”联办服务\n③推出“无事不扰”企业清单试点改革\n④推行社区“嵌人式”养老模式","o":["①②③","①③④","①②④","②③④④"],"a":"C","e":"①当选：2013年，三明在全国率先把城镇职工医保、居民医保、新农合三类医保经办机构整合成市医疗保障基金管理中心，通过医保支付方式改革，构建多元复合型医保支付体系，减轻了患者医疗经济负担，极大提升了群众对医疗服务的满意度。推行“三明医改”经验符合题干要求。\n②当选：推行新生儿“出生一件事”“最多跑一次”联办服务，可以有效减少群众办事环节，提高政务服务效率。符合题干要求。\n③不选：推出“无事不扰”企业清单试点改革，旨在改善营商环境、激发市场活力。该项主要服务于企业而非直接解决民众生活难题，与题干的要求不符。\n④当选：推行社区“嵌人式”养老模式，即在社区内提供就近养老服务，满足老年人居家养老的需求，缓解家庭照料的压力，有利于提升老年人的生活质量。符合题干要求。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":41,"t":"单选","q":"建设文化强国、事关中国式现代化建设全局，事关中华民族复兴大业，事关提升国际竞争力。锚定2035年建成社会主义文化强国的战略目标，必须始终坚持文化建设着眼于人、落脚于人。下列有关说法正确的是：\n①文化强国之“强”最终要体现在为人民提供文化服务和文化产品的能力上\n②坚持以人民为中心，着眼满足人民群众多样化、多层次、多方面的精神文化需求\n③文化创造核心在人，要建设一支规模宏大、结构合理、锐意创新的高水平文化人才队伍\n④尊重人才成长规律，完善符合文化领域特点的人才选拔、培养、使用、激励机制，营造识才、重才、爱才的良好政策环境","o":["①②③","②③④","①②④","①③④"],"a":"B","e":"①错误：文化强国之“强”最终要体现在人民的思想境界、精神状态、文化修养上。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":42,"t":"单选","q":"2025年7月30日，中共中央政治局召开会议，对扎实做好民生保障工作作了重要部署。下列相关表述不准确的是：","o":["巩固拓展脱贫攻坚成果，确保不发生规模性返贫致贫","夯实“三农”基础，推动粮食和重要农产品价格保持在合理水平","突出就业优先政策导向，促进高校毕业生、退役军人、农民工等重点群体就业","始终把人民群众财产安全放在第一位，加强安全生产监管"],"a":"D","e":"会议指出，始终把人民群众生命安全放在第一位，加强安全生产和食品安全监管，全力做好防汛应急抢险救灾，保障迎峰度夏期间能源电力供应。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":43,"t":"单选","q":"习近平主席在二十国集团领导人第十九次峰会上指出，要完善全球贸易治理，建设开放型世界经济。下列相关表述正确的是：","o":["要适应经济问题政治化的潮流，通过强化绿色低碳要求推行贸易保护政策","要积极构建更具平等性、包容性和建设性的产业链供应链伙伴关系，呼吁各方加强合作","要把安全置于国际经贸议程中心地位，持续推动贸易和投资自由化便利化","要一以贯之保持世界贸易组织规则不变，提高多边贸易体制的权威性、有效性和相关性"],"a":"B","e":"A项错误：中国坚决反对“经济问题政治化”和贸易保护主义。绿色低碳转型应坚持“共同但有区别的责任”，而非通过绿色要求推行贸易保护。C项错误：要把发展置于国际经贸议程中心地位，持续推动贸易和投资自由化便利化。D项错误：世界贸易组织规则应“与时俱进改革完善”，而非“一以贯之保持不变”。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":44,"t":"单选","q":"以实践为基础，从整体上把握人与世界的关系，是马克思主义世界观的重要内容。关于马克思主义实践观，下列说法正确的是：","o":["正确发挥主观能动性是实践的根本途径","实践的过程就是对于结果的检验和评价","实践是人类生存和发展最基本的活动","实践是一种无目的的适应环境的本能活动"],"a":"C","e":"A项错误：实践是发挥主观能动性的根本途径。B项错误：马克思主义哲学认为，实践的完整过程是一个从实践到认识、再从认识到就是检验和评价结果”。D项错误：实践是人类有目的、有意识地改造客观世界的社会性活动。故本题答案为C。公考资料免费更新加微信。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":45,"t":"单选","q":"关于马克思主义政治经济学，下列说法正确的是：","o":["商品的价值量是由生产该商品所需的个别劳动时间决定的","货币的价值尺度职能是通过实际的物质交换来实现的","具体劳动和抽象劳动是不同商品生产过程中的不同劳动","具体劳动创造商品的使用价值，抽象劳动形成商品的价值"],"a":"D","e":"A项错误：决定商品价值量的不是生产商品的个别劳动时间，而是社会必要劳动时间。商品交换以价值量为基础，按照等价交换的原则进行。B项错误：价值尺度是指货币是衡量和计算其他一切商品价值大小的尺度。商品价值的货币表现就是价格。充当价值尺度的货币可以是观念上的货币。C项错误：具体劳动和抽象劳动不是各自独立存在的两种劳动或两次劳动，它们在时间上和空间上是统一的，是商品生产者的同一劳动过程中不可分割的两个方面。D项正确：生产商品的具体劳动创造商品的使用价值，抽象劳动形成商品的价值。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":46,"t":"单选","q":"党的十八大以来，在推进全面从严治党的伟大实践中，我们不断进行实践探索和理论思考，在毛泽东同志当年给出“让人民来监督政府”的第一个答案基础上，给出了第二个答案，那就是不断推进党的自我革命。关于深人推进党的自我革命实践，下列表述不准确的是：","o":["以引领伟大社会革命为根本目的","以跳出历史周期率为战略目标","以解决大党独有难题为主攻方向","以自我监督和法律监督相结合为强大动力"],"a":"D","e":"2024年1月8日至10日，中国共产党第二十届中央纪律检查委员会第三次全体会议在北京举行。习近平总书记在会议上发表重要讲话时明确提出深入推进党的自我革命“九个以”的实践要求，即：以坚持党中央集中统一领导为根本保证，以引领伟大社会革命为根本目的，以新时代中国特色社会主义思想为根本遵循，以跳出历史周期率为战略目标，以解决大党独有难题为主攻方向，以健全全面从严治党体系为有效途径，以锻造坚强组织、建设过硬队伍为重要着力点，以正风肃纪反腐为重要抓手，以自我监督和人民监督相结合为强大动力。据此可知，D项中“法律监督”应为“人民监督”。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":47,"t":"单选","q":"习近平总书记指出，宜传思想文化工作事关党的前途命运，事关国家长治久安，事关民族凝聚力和向心力，是一项极端重要的工作。宣传思想文化工作的首要政治任务是：","o":["培育和践行社会主义核心价值观","用党的创新理论武装全党、教育人民","提升国家文化软实力和中华文化影响力","续中华文脉、推动中华优秀传统文化创造性转化和创新性发展"],"a":"B","e":"2023年10月，习近平总书记对宣传思想文化工作作出重要指示强调，“要坚持以新时代中国特色社会主义思想为指导，全面贯彻党的二十大精神，聚焦用党的创新理论武装全党、教育人民这个首要政治任务，围绕在新的历史起点上继续推动文化繁荣、建设文化强国、建设中华民族现代文明这一新的文化使命，坚定文化自信，秉持开放包容，坚持守正创新·…为全面建设社会主义现代化国家、全面推进中华民族伟大复兴提供坚强思想保证、强大精神力量、有利文化条件”。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":48,"t":"单选","q":"习近平总书记强调，加强党风廉政建设，一体推进不敢腐、不能腐、不想腐，严格落实中央八项规定精神，督促党员、干部，特别是领导干部清廉自守、廉洁从政、干净做事。根据《中国共产党纪律处分条例》，下列违纪情形属于违反廉洁纪律的是：","o":["在重大原则问题上不同党中央保持一致且有实际言论、行为或者造成不良后果的","拒不执行党组织的分配、调动、交流等决定的","干涉生产经营自主权，致使群众财产遭受较大损失的","利用职权或者职务上的影响操办婚丧喜庆事宜，造成不良影响的"],"a":"D","e":"A项不属于：《中国共产党纪律处分条例》（2024年)第六章“对违反政治纪律行为的处分”第四十九条规定，“在重大原则问题上不同党中央保持一致且有实际言论、行为或者造成不良后果的，给予警告或者严重警告处分；情节较重的，给予撤销党内职务或者留党察看处分；情节严重的，给予开除党籍处分”。B项不属于：该条例第七章“对违反组织纪律行为的处分”次相遇第七十九条规定，“拒不执行党组织的分配、调动、交流等决定的，给予警告、严重警告或者撤销党内职务处分”。C项不属于：该条例第九章“对违反群众纪律行为的处分”第一百二十三条规定，“干涉生产经营自主权，致使群众财产遭受较大损失的，对直接责任者和领导责任者，给予警告或者严重警告处分；情节严重的，给予撤销党内职务或者留党察看处分”。D项属于：该条例第八章“对违反廉洁纪律行为的处分”第一百条规定，“利用职权或者职务上的影响操办婚丧喜庆事宜，造成不良影响的，给予警告或者严重警告处分；情节严重的，给予撤销党内职务处分；借机敛财或者有其他侵犯国家、集体和人民利益行为的，从重或者加重处分，直至开除党籍”。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":49,"t":"单选","q":"习近平总书记指出，发展新质生产力、必须进一步全面深化改革，形成与之相适应的新型生产关系。下列体现这一新型生产关系的是：","o":["云端办公刷新上班模式","数据作为生产要素参与分配","推进人工智能同实体经济深度融合","以信息化推进国家治理体系和治理能力现代化"],"a":"B","e":"A项不符合题意：云端办公属于生产方式和工作模式的具体变化。它只是借助信息技术改变了办公场景和形式，提升了工作效率，并未涉及生产关系中所有制、分配方式、要素配置等核心内容的调整，不属于新型生产关系的体现。B项符合题意：数据作为生产要素参与分配精准契合新型生产关系的内涵。新质生产力发展中，数据、技术等新型生产要素的贡献愈发凸显，分配方式作为生产关系的主要内容，也需适配这一趋势。让数据参与收益分配，是完善适应新型生产要素的分配机制，能充分肯定数据要素的价值与贡献，激发其活力，是与新质生产力相适应的新型生产关系的重要体现。C项不符合题意：推进入工智能同实体经济深度融合，核心是推动技术这一生产要素与实体经济的生产环节相结合，目的是提升产业生产效率、催生新业态，属于运用新技术赋能生产力发展的举措，聚焦的是生产力层面的升级，而非生产关系的调整与创新。D项不符合题意：以信息化推进国家治理体系和治理能力现代化，指向的是国家治理层面的改革与优化。其作用是提升治理效率和治理水平，涉及的是行政与治理领域的机制完善，和生产过程中形成的所有制、分配、要素配置等生产关系范畴无关。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":50,"t":"单选","q":"习近平新时代中国特色社会主义思想内容丰富、博大精深，提出了一系列原创性的治国理政新理念新思想新战略。这一伟大思想，不仅属于中国，也属于世界。下列不属于习近平新时代中国特色社会主义思想的世界意义的是：","o":["破解反贫困难题，创造减贫治理的中国样本，为全球减贫事业作出重大贡献","在新时代引领党和国家事业取得了重大成就，续写了经济快速发展和社会长期稳定两大奇迹","破解自我监督难题，找到长期执政条件下跳出历史周期率的第二个答案，为世界政党建设提供借鉴","打破“现代化=西方化”的迷思，拓展发展中国家走向现代化的路径选择，为人类对更好社会制度的探索提供中国方案"],"a":"B","e":"2025年11月12日，《中国社会科学报》发表社评文章《习近平新时代中国特色社会主义思想的世界意义》。A、C、D项正确：文章将习近平新时代中国特色社会主义思想的世界意义归纳为以下几点：破解反贫困难题，创造减贫治理的中国样本，为全球减贫事业作出重大贡献。打破“现代化=西方化”的迷思，拓展发展中国家走向现代化的路径选择，为人类对更好社会制度的探索提供中国方案。破解自我监督难题，找到长期执政条件下跳出历史周期率的第二个答案，为世界政党建设提供借鉴。回答世界之问，为推动构建人类命运共同体提供中国方案。指导新时代中国特色社会主义取得重大成就，充分彰显科学社会主义在21世纪的强大生机活力。B项聚焦的是这一思想对中国自身发展的作用。其引领党和国家事业取得重大成就、续写两大奇迹，直接服务于中国国内的稳定与发展，是对中国内部发展的积极影响，并未涉及对世界其他国家或全球层面的作用。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":51,"t":"单选","q":"习近平总书记在纪念中国人民抗日战争暨世界反法西斯战争胜利80周年大会上的讲话中指出：“中国人民抗日战争是世界反法西斯战争的重要组成部分，中国人民以巨大的民族牺牲，为拯救人类文明，保卫世界和平作出了重大贡献。”这一历史评价所体现的马克思主义原理是：","o":["坚持唯物史观，充分肯定中国人民抗日战争的世界历史意义","坚持人民立场，凸显中国人民为民族生存而战的正义性","坚持爱国主义，强调中华民族的独立、自由和解放","坚持持久抗战，最终赢得世界反法西斯战争的胜利"],"a":"A","e":"题干强调的是中国人民抗日战争的世界历史地位和贡献，将其放在“世界反法西斯战争”的宏观历史视野中，肯定其“为拯救人类文明，保卫世界和平”作出的贡献。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":52,"t":"单选","q":"习近平总书记强调要有“历史耐心”，强调改革是久久为功的伟大事业，保持历史耐心要有“功成不必在我，功成必定有我”的胸怀信念，“守得云开见月明”的思想准备。秉持“板凳坐得十年冷”的实践定力与钻研精神，涵养“功成不必在我、功成必定有我的历史耐心”的重要论述，下列理解准确的是：\n①坚持量变和质变的辩证统一，量变是质变的先决性前提和现实基础，没有一定的量的积累，质变不可能发生\n②坚持战略和策略的辩证统一，长远的战略需要灵活的策略才能最终实现，没有策略的战略必将沦为纸上谈兵\n③坚持理论和实践的辩证统一，历史规律是自然形成的，不受人的社会实践影响，实践中要不局限于一时一事一域一段\n④坚持遵循历史运动规律和发挥历史主动性的辩证统一，遵循历史运动规律和发挥历史主动性是同一个历史过程的两个方面","o":["①②③","①②④","①③④","②③④"],"a":"B","e":"③错误：历史规律具有客观性，需要通过人的实践活动体现并实现，并非“不受人的社会实践影响”。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":53,"t":"单选","q":"习近平总书记强调，要牢固树立和践行绿水青山就是金山银山的理念，坚定不移走生态优先、绿色发展之路。关于绿色发展，下列表述正确的有几项？\n①坚持绿色发展是发展观的一场深刻革命\n②要坚持经济优先、技术优先、人工恢复为主的方针，像保护眼晴一样保护自然和生态环境\n③应暂缓绿色发展领域的多边合作平台建设，以应对现有国际环境治理合作存在的诸多风险与挑战\n④不仅要从政策上加强管理和保护，而且要从全球变化、碳循环机理等方面加深认识，依靠科技创新破解绿色发展难题","o":["1项","2项","3项","4项"],"a":"B","e":"①正确：2017年，习近平总书记在山西考察时讲话指出，“坚持绿色发展是发展观的一场深刻革命。”\n②错误：2018年全国生态环境保护大会上，习近平总书记强调“坚持节约优先、保护优先、自然恢复为主的方针，像保护眼晴一样保护生态环境，像对待生命一样对待生态环境，让自然生态美景永驻人间，还自然以宁静、和谐、美丽。”\n③错误：《中共中央国务院关于加快经济社会发展全面绿色转型的意见》（2024年）指出，“拓展多双边对话合作渠道，加强绿色发展领域的多边合作平台建设，大力宣传中国绿色转型成效，积极借鉴国际经验。”\n④正确：2016年，习近平总书记在全国科技创新大会、两院院士大会、中国科协第九次全国代表大会上的重要讲话指出，“不仅要研究生态恢复治理防护的措施，而且要加深对生物多样性等科学规律的认识；不仅要从政策上加强管理和保护，而且要从全球变化、碳循环机理等方面加深认识，依靠科技创新破解绿色发展难题，形成人与自然和谐发展新格局。”故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":54,"t":"单选","q":"习近平总书记强调，要推动森林“水库、钱库、粮库、碳库”更好联动，实现生态效益、经济效益、社会效益相统一。下列表述与这一要求相契合的有几项？\n①手中有粮，心中不慌\n②绿水青山就是金山银山\n③增绿就是增优势，护林就是护财富\n④环境就是民生，青山就是美丽，蓝天也是幸福","o":["1项","2项","3项","4项"],"a":"C","e":"①不契合：2020年5月，习近平总书记在看望参加全国政协十三届三次会议的经济界委员并参加联组会时强调：“对我们这样一个有着14亿人口的大国来说，农业基础地位任何时候都不能忽视和削弱，手中有粮、心中不慌在任何时候都是真理。”“手中有粮，心中不慌”强调农业对我国的重要性，并未体现生态效益、经济效益、社会效益相统一。次相遇\n②契合：2005年8月，习近平总书记在湖州市安吉县余村考察时，首次提出“绿水青山就是金山银山”的科学论断。2018年5月，习近平总书记在全国生态环境保护大会上发表重要讲话指出：“绿水青山既是自然财富、生态财富，又是社会财富、经济财富。保护生态环境就是保护自然价值和增值自然资本，就是保护经济社会发展潜力和后劲，使绿水青山持续发挥生态效益和经济社会效益。”“绿水青山就是金山银山”体现了生态效益、经济效益、社会效益相统一。\n③契合：2023年9月，习近平总书记在黑龙江漠河考察时指出：“要坚持造林与护林并重；要树立增绿就是增优势、护林就是护财富的理念，在保护的前提下让老百姓通过发展林下经济增加收入。”“增绿”“护林”体现了生态效益，“增优势”体现了社会效益，“护财富”体现了经济效益，故“增绿就是增优势，护林就是护财富”体现了生态效益、经济效益、社会效益相统一。\n④契合：2016年1月，习近平总书记在省部级主要领导干部学习贯彻党的十八届五中全会精神专题研讨班上发表重要讲话指出：“我讲过，环境就是民生，青山就是美丽，蓝天也是幸福，绿水青山就是金山银山；保护环境就是保护生产力，改善环境就是发展生产力。”“环境”“青山”“蓝天”体现了生态效益，“民生”“美丽”“幸福”体现了社会效益和经济效益，“环境就是民生，青山就是美丽，蓝天也是幸福”体现了生态效益、经济效益、社会效益相统一。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":55,"t":"单选","q":"习近平总书记强调，要坚持以铸牢中华民族共同体意识为主线，不断推进民族团结进步事业，推动党的民族工作高质量发展。关于铸牢中华民族共同体意识，下列说法正确的有几项？\n①广泛交往交流交融是推进中华民族共同体建设的重要途径\n②加强对青少年的历史文化教育，全面推广普及国家通用语言文字，全面推行使用国家统编教材\n③要坚持和完善民族区域自治制度，逐步完善相关法律法规和差别化区域支持政策，依法保障各族群众合法权益\n④要引导各族群众不断增强对伟大祖国、中华民族、中华文化、中国共产党、中国特色社会主义的认同","o":["1项","2项","3项","4项"],"a":"D","e":"本题考查2024年习近平总书记在全国民族团结进步表彰大会上的讲话。\n①②③④均来自讲话原文，说法正确。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":56,"t":"单选","q":"习近平总书记指出，各级干部要深刻懂得用权为民、担责成事、廉洁立身的道理，自觉把担当和自律统一起来，在构建亲清政商关系上亮明态度、付诸行动。关于亲清政商关系，下列表述正确的有几项？\n①对于领导干部而言，所谓“亲”，就是要坦荡真诚同民营企业接触交往\n②对于领导干部而言，所谓“清”，就是洁身自好，减少同民营企业家的来往\n③对于民营企业家而言，所谓“亲”，就是积极主动同各级党委和政府及部门多沟通多交流\n④对于民营企业家而言，所谓“清”，就是遵纪守法办企业、光明正大搞经营\n③“亲”和“清”本质上是干事和干净的关系，是辩证统一的，完全可以并行不","o":["2项","3项","4项","5项"],"a":"C","e":"①③④正确，\n②错误：对领导干部而言，所谓“亲”，就是“要坦荡真诚同民营企业接触交往，特别是在民营企业遇到困难和问题情况下更要积极作为、靠前服务，对非公有制经济人土多关注、多谈心、多引导，帮助解决实际困难”。所谓“清”，就是“同民营企业家的关系要清白、纯洁，不能有贪心私心,不能以权谋私,不能搞权钱交易”。对民营企业家而言,所谓“亲”，就是“积极主动同各级党委和政府及部门多沟通多交流，讲真话，说实情，建言，满腔热情支持地方发展”；所谓“清”，就是“要洁身自好、走正道，做到遵纪守法办企业、光明正大搞经营”。5说法正确：2025年2月，习近平总书记在民营企业座谈会上讲话指出，“亲”和“清”本质上是干事和干净的关系，是辩证统一的，完全可以并行不悖。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":57,"t":"单选","q":"党的二十大报告指出，构建全国统一大市场，深化要素市场化改革，建设高标准市场体系。关于构建全国统一大市场，下列与之相关的说法错误的是：","o":["推动市场基础制度规则统一","加强公平竞争审查柔性约束","规范地方招商引资法规制度","深化地方标准管理制度改革"],"a":"B","e":"《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。加强公平竞争审查刚性约束，强化反垄断和反不正当竞争，清理和废除妨碍全国统一市场和公平竞争的各种规定和做法。规范地方招商引资法规制度，严禁违法违规给予政策优惠行为。建立健全统一规范、信息共享的招标投标和政府、事业单位、国有企业采购等公共资源交易平台体系，实现项目全流程公开管理。提升市场综合监管能力和水平。健全国家标准体系，深化地方标准管理制度改革。综上可知，B项中的“柔性”应为“刚性”，说法错误，当选。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":58,"t":"单选","q":"习近平总书记强调，纪检监察机关是推进党的自我革命的重要力量，党和人民对这支队伍充分信任、充满期待。下列与之相关的说法正确的有几项？\n①巩固拓展主题教育和教育整顿成果，坚持把思想教育放在首位\n②强化严格管理监督，打造忠诚干净担当、敢于善于斗争的纪检监察铁军\n③深化纪检监察体制改革，坚持授权和控权相结合，把权力关进制度的笼子\n④着力加强纪检监察工作规范化法治化正规化建设，不断提高正风肃纪反腐能力","o":["1项","2项","3项","4项"],"a":"C","e":"2025年1月6日，习近平总书记在中国共产党第二十届中央纪律检查委员会第四次全体会议上发表重要讲话。他指出，纪检监察机关是推进党的自我革命的重要力量，党和人民对这支队伍充分信任、充满期待。要深化纪检监察体制改革，坚持授权和控权相结合，把权力关进制度的笼子。要着力加强纪检监察工作规范化法治化正规化建设，不断提高正风肃纪反腐能力。要巩固拓展主题教育和教育整顿成果，坚持打铁必须自身硬，强化严格管理监督，打造忠诚干净担当、敢于善于斗争的纪检监察铁军。综上可知，\n②③④说法正确，当选。该讲话并未提及“坚持把思想教育放在首位”，\n①错误，不选。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":59,"t":"单选","q":"习近平总书记在2024年中央经济工作会议上总结我们党对经济工作的规律性认识，提出了“五个必须统筹”，为以高质量发展全面推进中国式现代化提供了科学指引。关于“五个必须统筹”，下列说法正确的有几项？\n①必须统筹好有效市场和有为政府的关系，这是形成既“放得活”又“管得住”的经济秩序的关键所在\n②必须统筹好总供给和总需求的关系，这是畅通国民经济循环的重要基础\n③必须统筹好培育新动能和更新旧动能的关系，这是因地制宜发展新质生产力的内在要求\n④必须统筹好做优增量和盘活存量的关系，这是全面提高资源配置效率的必由之路求","o":["2项","3项","4项","5项"],"a":"D","e":"2024年12月16日，《人民日报》刊发的《深入领会对经济工作的规律性认识》指出，这五个“必须统筹”是习近平总书记对新时代经济发展规律作出的重大论断，既是对已有实践的总结概括，更是对未来发展的启示引领，进一步丰富和发展了习近平总书记经济思想。我们要深刻认识到，必须统筹好有效市场和有为政府的关系，这是形成既“放得活”又“管得住”的经济秩序的关键所在；必须统筹好总供给和总需求的关系，这是畅通国民经济循环的重要基础；必须统筹好培育新动能和更新旧动能的关系，这是因地制宜发展新质生产力的内在要求；必须统筹好做优增量和盘活存量的关系，这是全面提高资源配置效率的必由之路；必须统筹好提升质量和做大总量的关系，这是夯实中国式现代化的物质基础的必然要求。综上可知，说法正确的有\n①②③④5。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":60,"t":"单选","q":"习近平总书记强调，“领导干部要有草摇叶响知鹿过、松风一起知虎来、一叶易色而知天下秋的见微知著能力”。下列工作行为展现了这一能力要求的有几项？\n①面对随时可能发生的各种“黑天鹅”“灰犀牛”事件，能够抓早抓小\n②面对社会发展领域各方面的改革任务，能够做到“十个指头弹钢琴”\n③面对高水平生态环境建设任务，能够做好生态环境监测的“吹哨人”\n④面对纷繁复杂的基层工作，能够做到“两点论”和“重点论”相结合\n③面对工作中不托底的人和事，能够经常敲响警钟，念好安全“紧箍咒”","o":["2项","3项","4项","5项"],"a":"B","e":"2019年9月3日，习近平总书记在中央党校（国家行次相遇政学院）中青年干部培训班开班式上强调，“领导干部要有草摇叶响知鹿过、松风一起知虎来、一叶易色而知天下秋的见微知著能力，对潜在的风险有科学预判，知道风险在哪里，表现形式是什么，发展趋势会怎样，该斗争的就要斗争”。\n①当选：“黑天鹅”比喻小概率高风险事件，主要是指没有预料到的突发事件或问题。“灰犀牛”比喻大概率高风险事件，该类事件一般指问题很大、早有预兆，但是没有得到足够重视，从而导致严重后果的问题或事件。领导干部面对随时可能发生的各种“黑天鹅”“灰犀牛”事件，能够抓早抓小，做到见微知著、未雨绸缪、防患于未然，增强工作的预见性和主动性。这与题干强调的见微知著相符。\n②不选：“十个指头弹钢琴”旨在强调统筹兼顾、抓住重点的工作方法，与题干强调的见微知著不符。\n③当选：面对高水平生态环境建设任务，能够做好生态环境监测的“吹哨人”，科学预判风险，防患于未然。这与题干强调的见微知著相符。\n④不选：“两点论”和“重点论”相结合要求我们既要全面地看待事物的各个方面，又要抓住重点和关键，与题干强调的见微知著不符。5当选：面对工作中不托底的人和事，能够经常敲响警钟，念好安全“紧箍咒”，体现了对安全隐患的预见性和警惕性，与题干强调的见微知著相符。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":61,"t":"单选","q":"中共中央、国务院印发《加快建设农业强国规划（2024一2035年）》，提出面对新形势新要求，必须把加快建设农业强国作为统领“三农”工作的战略总纲，摆在建设社会主义现代化强国的重要位置。下列与加快建设农业强国有关的说法正确的是：","o":["推进生态综合补偿，健全横向生态保护补偿机制，统筹推进生态环境损害赔偿","建立健全长江流域信息共享系统，推进长江流域农业深度节水控水","完善粮食产销奖补制度，中央预算内投资向粮食主销区倾斜","推进农业科技推广体系，从经营性向公益性转变"],"a":"A","e":"B项错误：《规划》指出，实施好长江十年禁渔和海洋伏季休渔，推进黄河流域农业深度节水控水。C项错误：《规划》指出，健全粮食主产区利益补偿机制，完善产粮大县奖补制度，中央预算内投资向粮食主产区倾斜，省级统筹的土地出让收入可按规定用于粮食主产区的高标准农田建设、现代种业提升等，统筹建立粮食产销区省际横向利益补偿机制。D项错误：《规划》指出，健全公益性和经营性相结合的农业科技推广体系，加强基层农技推广队伍建设。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":63,"t":"单选","q":"中国式现代化要靠科技现代化作支撑、实现高质量发展要靠科技创新培育新动能。关于建成科技强国的举措，下列说法正确的是：","o":["要坚持有所为有所不为，突出经济发展需求，在重要领域实施科技战略部署","要充分发挥人才在科技资源配置中的决定性作用，调动产学研各环节的积极性","要充分发挥科技领军企业龙头作用，鼓励中小企业和民营企业科技创新，支持企业牵头或参与国家重大科技项目","要降低基础研究组织化程度，强化自由探索，鼓励面向重大科学问题的协同攻关"],"a":"C","e":"A项错误：要保持战略定力，坚持有所为有所不为，突出国家战略需求，在若干重要领域实施科技战略部署，凝练实施一批新的重大科技项目，形成竞争优势，赢得战略主动。B项错误：要充分发挥市场在科技资源配置中的决定性作用，更好发挥政府各方面作用，调动产学研各环节的积极性，形成共促关键核心技术攻关的工作格局。D项错误：要提高基础研究组织化程度，完善竞争性支持和稳定支持相结合的投入机制，强化面向重大科学问题的协同攻关，同时鼓励自由探索，努力提出原创基础理论、掌握底层技术原理，筑牢科技创新根基和底座。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":64,"t":"单选","q":"习近平总书记在对各省区市进行深人考察调研的过程中，结合各地实际情况，对推进高质量发展作出一系列重要部署。下列对应关系正确的是：","o":["江苏一要建设国家资源型经济转型综合配套改革试验区，重点抓好能源转型、产业升级和适度多元发展","山东一要发挥海洋资源丰富的得天独厚优势，经略海洋、向海图强，打造世界级海洋港口群，打造现代海洋经济发展高地","云南一—要把握好挑大梁的着力点，在推动科技创新和产业创新融合上打头阵","贵州—聚焦实现贸易、投资、跨境资金流动、人员进出、运输来往自由便利和数据安全有序流动"],"a":"B","e":"A项错误：山西作为传统煤炭资源大省，改革核心是‘能源转型、产业升级、适度多元发展”；江苏的核心定位是“长三角一体化核心引擎、科技创新高地、开放型经济强省”。C项错误：江苏、广东等经济大省是“挑大梁”的关键省份，在科技创新和产业创新融合上打头阵；云南的核心定位是“面向南亚东南亚辐射中心、生态安全屏障、文旅大省”。D项错误：“贸易、投资、跨境资金流动、人员进出、运输来往自由便利和数据安全有序流动”是海南自由贸易港的核心政策目标；贵州的核心定位是“数字经济发展创新区、生态文明建设先行区、内陆开放型经济新高地”，重点发展大数据、生态农业、文旅等产业。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":65,"t":"单选","q":"习近平总书记指出：“中国共产党人的理想信念建立在马克思主义科学真理的基础之上，建立在马克思主义揭示的人类社会发展规律的基础之上，建立在为最广大人民谋利益的崇高价值的基础之上。我们坚定，是因为我们追求的是真理；我们坚定，是因为我们遵循的是规律；我们坚定，是因为我们代表的是最广大人民根本利益。”这一论述最直接体现了马克思主义的哪一基本观点？","o":["真理尺度与价值尺度的辩证统一","认识世界与改造世界的辩证统一","量变与质变的辩证统一","矛盾的特殊性与普遍性的辩证统一"],"a":"A","e":"A项当选：真理尺度与价值尺度是紧密联系、不可分割的辩证统一关系。一方面，价值尺度必须以真理为前提。要想达到实践的目的以满足人类自身的需要，就必须“认识真理，掌握真理，信仰真理，捍卫真理”。脱离了真理尺度，价值尺度就偏离了合理的、正确的轨道。另一方面，人类自身需要的内在尺度，推动着人们不断发现新的真理。科学发明、技术创新、经典思想理论的形成，都是人类为了实现更美好的生活而进行的社会实践。脱离了价值尺度，真理就缺失了主体意义。题干中“中国共产党人的理想信念，建立在马克思主义科学真理的基础之上，建立在马克思主义揭示的人类社会发展规律的基础之上”体现了真理尺度，而“建立在为最广大人民谋利益的崇高价值的基础之上”以及“代表的是最广大人民根本利益”则体现了价值尺度。B项不选：认识世界和改造世界是相互依赖、相互制约的辩证统一关系。一次相遇方面，认识世界有助于改造世界，正确认识世界是有效改造世界的必要前提；另一方面，人们只有在改造世界的实践中才能不断地深化、拓展对世界的正确认识。认识世界和改造世界的统一，决定了理论与实践必须相结合。题干对此未予体现。C项不选：量变和质变的辩证关系是：第一，量变是质变的必要准备。任何事物的变化都有一个量变的积累过程，没有量变的积累，质变就不会发生。第二，质变是量变的必然结果，并为新的量变开辟道路。单纯的量变不会永远持续下去，量变达到一定程度必然引起质变。第三，量变和质变是相互渗透的。一方面，在总的量变过程中有阶段性和局部性的部分质变；另一方面，在质变的过程中也有旧质在量上的收缩和新质在量上的扩张。量变和质变是相互依存、相互贯通的，量变引[起质变，在新质的基础上，事物又开始新的量变，如此交替循环，构成了事物的发展过程。题干对此未予体现。D项不选：矛盾的普遍性和特殊性是辩证统一的关系。矛盾的普遍性即矛盾的共性，矛盾的特殊性即矛盾的个性。矛盾的共性是无条件的、绝对的，矛盾的个性是有条件的、相对的。任何现实存在的事物的矛盾都是共性和个性的有机统一，共性寓于个性之中，没有离开个性的共性，也没有离开共性的个性。题干对此未予体现。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":66,"t":"单选","q":"习近平总书记指出，要加强科技基础能力建设，深化科技体制改革，打造科创高地。关于深化科技体制改革，下列表述正确的是：","o":["建立以竞争性支持取代稳定支持的基础研究投人机制","允许科研类事业单位实行比一般事业单位更灵活的管理制度","限制开展高风险、高投人基础研究","降低科技人员在科技成果转化收益分配上的自主权"],"a":"B","e":"2024年7月18日，中国共产党第二十届中央委员会第三次全体会议通过了《中共中央关于进一步全面深化改革推进中国式现代化的决定》。A、C项错误：决定指出，“深化科技体制改革。·………·加强有组织的基础研究，提高科技支出用于基础研究比重，完善竞争性支持和稳定支持相结合的基础研究投入机制，鼓励有条件的地方、企业、社会组织、个人支持基础研究，支持基础研究选题多样化，鼓励开展高风险、高价值基础研究”。B项正确：该决定指出，“深化科技体制改革。···允许科研类事业单位实行比一般事业单位更灵活的管理制度，探索实行企业化管理”。D项错误：该决定指出，“深化科技体制改革。·….··允许科技人员在科技成果转化收益分配上有更大自主权，建立职务科技成果资产单列管理制度，深化职务科技成果赋权改革”。故本题答案为B.。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":67,"t":"单选","q":"完善大统战工作格局，是习近平总书记关于做好新时代党的统一战线工作的重要思想的重要内容，是做好新时代统战工作的重要保障，也是进一步全面深化改革、为推进中国式现代化凝心聚力的重要举措。下列各项不属于完善大统战格局措施的是：","o":["更好发挥党外人士作用，健全党外代表人士队伍建设制度","制定民族团结进步促进法，健全铸牢中华民族共同体意识制度机制","全面构建亲清政商关系，健全促进非公有制经济健康发展、非公有制经济人士健康成长工作机制","健全人大议事规则和论证、评估、评议、听证制度"],"a":"D","e":"A、B、C项属于：《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，“完善大统战工作格局。完善发挥统一战线凝聚人心、汇聚力量政治作用的政策举措。坚持好、发展好、完善好中国新型政党制度。更好发挥党外人士作用，健全党外代表人士队伍建设制度。制定民族团结进步促进法，健全铸牢中华民族共同体意识制度机制，增强中华民族凝聚力。系统推进我国宗教中国化，加强宗教事务治理法治化。完善党外知识分子和新的社会阶层人士政治引I领机制。全面构建亲清政商关系，健全促进非公有制经济健康发展、非公有制经济人士健康成长工作机制。完善港澳台和侨务工作机制”。D项不属于：《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，“加强人民当家作主制度建设。·.·-··健全人大议事规则和论证、评估、评议、听证制度。丰富人大代表联系人民群众的内容和形式”。据此可知，D项举措属于加强人民当家作主制度建设的措施，而非完善大统战工作格局的措施。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":68,"t":"单选","q":"习近平总书记指出，要推动各级领导班子认真践行正确政绩观，切实形成正确工作导向。下列表述与正确政绩观要求相符合的是：","o":["领导干部要树牢竞争优先、力争上游的政绩观","坚持高质量发展，要完善推动高质量发展的政绩考核评价办法","坚持打基础利长远，要注重在做强发展指标、做优发展数据上下功夫","坚持出实招求实效，要大力发展高标准、大气派的工程"],"a":"B","e":"2023年12月21日至22日，中共中央政治局召开学习贯彻习近平新时代中国特色社会主义思想主题教育专题民主生活会。习近平总书记主持会议并发表重要讲话指出，“领导干部要树牢造福人民的政绩观。我们共产党人干事业、创政绩，为的是造福人民，不是为了个人升迁得失。中央政治局的同志要带头坚持以人民为中心的发展思想，坚持高质量发展，反对贪大求洋、盲目蛮干；坚持出实招求实效，反对华而不实、数据造假；坚持打基础利长远，反对竭泽而渔、劳民伤财。高质量发展是全面建设社会主义现代化国家的首要任务，坚持高质量发展要成为领导干部政绩观的重要内容。要完善推动高质量发展的政绩考核评价办法，发挥好指挥棒作用，推动各级领导班子认真践行正确政绩观，切实形成正确工作导向”。综上可知，只有B项表述与正确政绩观要求相符。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":69,"t":"单选","q":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出了我国“十五五”时期经济社会发展的主要目标。下列属于这些主要目标的是：\n①高水平社会主义市场经济体制扎实构建\n②人均国内生产总值达到中等发达国家水平\n③清洁低碳安全高效的新型能源体系初步建成\n④新型工业化、信息化、城镇化、农业现代化取得重大进展","o":["③④","①②","①④","②③"],"a":"A","e":"根据《建议》，“十五五”时期经济社会发展的主要目标包括:高质量发展取得显著成效。经济增长保持在合理区间，全要素生产率稳步提升，居民消费率明显提高，内需拉动经济增长主动力作用持续增强，经济增长潜力得到充分释放，全国统一大市场建设纵深推进，超大规模市场优势持续显现，新型工业化、信息化、城镇化、农业现代化取得重大进展，发展新质生产力、构建新发展格局、建设现代化经济体系取得重大突破。科技自立自强水平大幅提高。国家创新体系整体效能显著提升，教育科技人才一体发展格局基本形成，基础研究和原始创新能力显著增强，重点领域关键核次相遇心技术快速突破，并跑领跑领域明显增多，科技创新和产业创新深度融合，创新驱动作用明显增强。进一步全面深化改革取得新突破。国家治理体系和治理能力现代化深入推进，社会主义市场经济体制更加完善，高水平对外开放体制机制更加健全，全 再钉下一颗，不断钉下去，必然大有成效。如果东一榔头西一棒子，结果很可能是一顺钉子都钉不上、钉不牢。”这句话最能体现的哲学原理是：\n①量变与质变证统一\n②肯定与否定解证统一\n③主要矛盾与次要矛盾辩证统一\n④尊重客现规律与发挥主观能动性辩证统一","o":["①②","②③","③④","①④"],"a":"D","e":"题干中“不断钉下去，必然大有成效”体现了量变与质变辩证统一。题干中“钉钉子往往不是一锤子就能钉好的，而是要一锤一锤接着敲”强调要遵从钉钉子的规律，才能把钉子钉好，体现了尊重客观规律与发挥主观能动性辩证统一。\n②③说法正确，但是与题意无关。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":74,"t":"单选","q":"建设质量强国是推动高质量发展，促进我国经济由大向强转变的重要举措，是满足人民美好生活需要的重要途径。关于建设质量强国，下列表述正确的有几项？\n①建立健全强制性与自愿性相结合的质量披露制度\n②支持开展质量公益诉讼和集体诉讼，有效执行商品质量惩罚性赔偿制度\n③深化检验检测认证机构资质审批制度改革，全面实施告知承诺和优化审批服务\n④加强工程质量监督队伍建设，全面推行政府购买服务方式委托社会力量辅助工程质量监督检查\n③鼓励支持中小微企业实施技术改造、质量改进、品牌建设，提升中小微企业质量技术创新能力","o":["4项","3项","2项","1项"],"a":"A","e":"④错误：《质量强国建设纲要》（2023年）指出，强化工程建设全链条质量监管，完善日常检查和抽查抽测相结合的质量监督检查制度，加强工程质量监督队伍建设，探索推行政府购买服务方式委托社会力量辅助工程质量监督检查。\n①②③5均来自《纲要》原文，说法正确。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":75,"t":"单选","q":"优化政务服务、提升行政效能是优化营商环境、建设全国统一大市场的必然要求，对加快构建新发展格局、推动高质量发展具有重要意义。关于优化政务服务、提升行政效能，下列举措恰当的是：\n①推进关联事项集成办，为企业和群众提供“一件事一次办”“一类事一站办”服务\n②推进线下办事“只进一门”，要求所有的银行网点、邮政网点、园区等都要设置便民服务点\n③推进企业和群众诉求“一线应答”，根据需要设置重点领域专席，不断提升12345热线接办效率\n④推进线上办事“一网通办”，推动各类政务服务事项和应用“应接尽接、应上尽上”，政务服务事项全面纳入同级政务服务平台管理和办理","o":["①②","①③","②④","③④"],"a":"B","e":"本题考查《国务院关于进一步优化政务服务提升行政效能推动“高效办成一件事”的指导意见》（2024年）。\n①正确：推进关联事项集成办。从企业和群众视角出发，将需要多个部门办理或跨层级办理，关联性强、办理量大、办理时间相对集中的多个事项集成办理，为企业和群众提供“一件事一次办”、“一类事一站办”服务。\n②错误：推进线下办事“只进一门”。鼓励在有条件、有需求的银行网点、邮政网点、园区等设置便民服务点，探索利用集成式自助终端提供“24小时不打烊”服务。\n③正确：推进企业和群众诉求“一线应答”。依托12345政务服务便民热线加强政务服务热线归并，根据需要设置重点领域专席，不断提升12345热线接办效率，高效受理政务服务咨询、投诉、求助、建议和在线办理指导等诉求。\n④错误：推进线上办事“一网通办”。依托各级政务服务平台整合联通各类办事服务系统，推动各类政务服务事项和应用“应接尽接、应上尽上”，除法律法规另有规定或涉及国家秘密等外，政务服务事项全部纳入同级政务服务平台管理和办理。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":77,"t":"单选","q":"党的二十届三中全会提出，要推动建设生育友好型社会。关于推动建设生育友好型社会，下列举措不恰当的是：","o":["指导各地推动券育、教育产业市场化发展","鼓励各地出台多孩子女同校就读具体实施办法","指导各地将辅助生殖技术项目纳入医保报销范围","指导有条件的地方将参加职工基本医疗保险的灵活就业人员纳入生育保险"],"a":"A","e":"2024年10月，《关于加快完善生育支持政策体系推动建设生育友好型社会的若干措施》印发。A项举措不恰当：文件指出，“有效降低生育、养育、教育成本，营造全社会尊重生育、支持生育的良好氛围”。由此可知，指导各地推动养育、教育产业市场化发展，可能导致托育、教育成本上升，加重家庭负担，与“降低生育、养育、教育成本”的目的相悖。B项举措恰当：文件指出，“鼓励各地出台多孩子女同校就读具体实施办法，帮助解决家长接送不便问题”。C项举措恰当：文件指出，“加强生育医疗费用保障，指导各地将适宜的分娩镇痛以及辅助生殖技术项目纳入医保报销范围”。D项举措恰当:文件指出，“指导有条件的地方将参加职工基本医疗保险的灵活就业人员、农民工、新就业形态人员纳入生育保险”。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":78,"t":"单选","q":"党的二十届三中全会提出，高水平社会主义市场经济体制是中国式现代化的重要保障。关于构建高水平社会主义市场经济体制，下列举措不恰当的是：","o":["完善市场准人制度，优化新业态新领域市场准人环境","推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通","加强财政政策和货币政策协调配合，着力扩大内需，增强消费对优化供给结构的基础性作用","建立国有企业履行战略使命评价制度，完善国有企业分类考核评价体系，开展国有经济增加值核算"],"a":"C","e":"A项举措恰当：党的二十届三中全会通过《中共中央关于进一步全面深化改革推进中国式现代化的决定》（以下简称《决定》）指出，构建高水平社会主义市场经济体制，要完善市场准人制度，优化新业态新领域市场准人环境。B项举措恰当：《决定》指出，构建高水平社会主义市场经济体制，要构建全国统一大市场。推动市场基础制度规则统一、市场监管公平统一、市场设施高标准联通。C项举措不恰当：党的二十大报告指出，构建高水平社会主义市场经济体制，要加强财政政策和货币政策协调配合，着力扩大内需，增强消费对经济发展的基础性作用和投资对优化供给结构的关键作用。可知，“优化供给结构”应为“经济发展”。D项举措恰当：《决定》指出，构建高水平社会主义市场经济体制，要坚持和落实“两个毫不动摇”。建立国有企业履行战略使命评价制度，完善国有企业分类考核评价体系，开展国有经济增加值核算。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":79,"t":"单选","q":"习近平总书记强调，要锚定2035年建成文化强国的战略目标，坚持马克思主义这一根本指导思想，植根博大精深的中华文明，顺应信息技术发展潮流，不断发展具有强大思想引领力、精神凝聚力、价值感召力、国际影响力的新时代中国特色社会主义文化，不断增强人民精神力量，筑牢强国建设、民族复兴的文化根基。下列做法有利于文化强国建设的是：\n①坚持用马克思主义激活中华传统文化中的优秀因子并赋子其新的时代内涵\n②坚持在文化建设中把经济效益放在首位、经济效益与社会效益相统一\n③坚持把激发创新创造活力作为深化文化体制机制改革的中心环节\n④坚持利用第一、合理发掘和积极干预原则，推动文化遗产系统性保护和利用","o":["①③","①④","②③","②④"],"a":"A","e":"2024年10月28日，中共中央政治局就建设文化强国进行第十七次集体学习，习近平总书记在主持学习时发表重要讲话。\n①当选：讲话指出，要深入挖掘和阐发中华优秀传统文化的精神内涵，用马克思主义激活中华传统文化中的优秀因子并赋予其新的时代内涵，发展新时代中国特色社会主义文化。\n②不选，\n③当选：讲话指出，要坚持以人民为中心的创作导向，坚持把社会效益放在首位、社会效益与经济效益相统一，把激发创新创造活力作为深化文化体制机制改革的中心环节，加快完善文化管理体制和生产经营机制。\n④不选：讲话指出，要秉持敬畏历史、热爱文化之心，坚持保护第一、合理利用和最小干预原则，推动文化遗产系统性保护和统一监管。该句表述有误。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":80,"t":"单选","q":"确保粮食安全，耕地是关键。党的十八大以来，以习近平同志为核心的党中央采取一系列硬措施，坚守耕地保护红线。关于加强耕地保护，下列说法正确的是：","o":["抓好盐碱地综合改造利用，全面推进盐碱地后备资源开发","完善耕地质量建设保护制度，加快耕地质量保护立法","建立健全国家、省、市三级耕地质量监测网络体系","优先把云贵地区的梯田和山间谷地建成高标准农田"],"a":"B","e":"2024年2月，《中共中央办公厅国务院办公厅关于加强耕地保护提升耕地质量完善占补平衡的意见》发布。A项错误：该意见指出，要抓好盐碱地综合改造利用。梯次推进盐碱地等耕地后备资源开发。B项正确，C项错误：该意见指出，要完善耕地质量建设保护制度。加快耕地质量保护立法。每年开展耕地质量变更调查评价，每5年开展耕地质量综合评价，适时开展全国土壤普查。建立健全国家、省、市、县四级耕地质量监测网络体系。D项错误:该意见指出，要加强高标准农田建设。开展整区域建设示范，优先把东北黑土地区、平原地区、具备水利灌溉条件地区的耕地建成高标准农田。故本题答案为B。","v":true},{"b":"冲刺五百","s":"国省考历年精选","n":81,"t":"单选","q":"全面推进依法治国是一个系统工程，必须坚持法治国家、法治政府、法治社会一体建设。下列相关表述不准确的是：","o":["法治社会是构筑法治国家、法治政府的基础","建设法治政府对建设法治社会具有重要引领和带动作用","法治政府、法治社会建设必须服从、服务于法治国家建设","法治国家是依法治国的主体，是法治社会建设的先导和示范"],"a":"D","e":"依法治国的主体是人民，法治国家是依法治国的目标和结果。法治政府是法治社会建设的先导和示范。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":82,"t":"单选","q":"《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》提出，推进国家安全体系和能力现代化，建设更高水平平安中国。下列有关说法正确的是：","o":["锻造实战实用的国家安全能力，把捍卫国土安全摆在首位","统筹推进房地产、地方政府债务、中小金融机构等风险有序化解","健全国家安全体系，坚持以风险防控为先导、法治保障为落脚点","完善公共安全体系，推动公共安全治理模式由事后处理向事中控制转型"],"a":"B","e":"A项错误：锻造实战实用的国家安全能力，突出保障事关国家长治久安、经济健康稳定、人民安居乐业的重大安全，把捍卫政治安全摆在首位。C项错误：坚持以战略为先导、政策为抓手、法治为保障、风险防控为落脚点，完善国家安全法治体系、战略体系、政策体系、风险防控体系。D项错误：完善公共安全体系，推动公共安全治理模式向事前预防转型。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":83,"t":"单选","q":"习近平总书记强调，选人用人要加强党性鉴别，注重考察干部的境界格局和忠诚度廉洁度。下列与党性相关的说法正确的是：","o":["树立和践行正确政绩观，起决定性作用的是党性","强党性，就是要自觉用马克思主义思想改造客观世界","党性、党风、党纪是有机整体，党性是根本，党风是保障，党纪是表现","作风问题本质上是党性问题，要把作风建设摆在党性修养的首位"],"a":"A","e":"A项正确：2022年3月，习近平总书记在春季学期中央党校（国家行政学院）中青年干部培训班开班式上指出：树立和践行正确政绩观，起决定性作用的是党性。B项错误：2023年4月，在学习贯彻习近平新时代中国特色社会主义思想主题教育工作会议上，习近平总书记对开展主题教育的总要求“学思想、强党性、重实践、建新功”作出深刻阐释，指出：强党性，就是要自觉用新时代中国特色社会主义思想改造主观世界，深刻领会这一思想关于坚定理想信念、提升思想境界、加强党性锻炼等一系列要求，始终保持共产党人的政治本色。C项错误：党性、党风、党纪是有机整体，党性是根本，党风是表现，党纪是保障。D项错误：2024年12月26日至27日，习近平总书记在主持召开次相遇中央政治局民主生活会时强调：领导干部要把锤炼党性、提高思想觉悟作为终身课题，活到老、学到老、修养到老。要把政治修养摆在党性修养的首位，从党的创新理论中汲取党性滋养，把学习遵守贯彻党章党规党纪作为党性修养的重要内容。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":84,"t":"单选","q":"2025年是中国人民抗日战争暨世界反法西斯战争胜利80周年。中国人民对战争带来的苦难有着刻骨铭心的记忆，对和平有着孜孜不倦的追求。关于中国人民抗日战争，下列表述不准确的是：","o":["中国人民抗日战争的伟大胜利，是以爱国主义为核心的民族精神的伟大胜利","中国人民抗日战争的伟大胜利，第一次确立了中国在世界上的大国地位，使中国人民赢得了世界爱好和平人民的尊敬","中国人民抗日战争的伟大胜利，是近代以来中国抗击外敌人侵的第一次完全胜利","中国人民抗日战争的伟大胜利，为中华民族由近代以来陷人深重危机走向伟大复兴确立了历史转折点"],"a":"B","e":"习近平总书记在抗战胜利80周年纪念时指出，这一伟大胜利，重新确立了中国在世界上的大国地位，使中国人民赢得了世界爱好和平人民的尊敬。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":85,"t":"单选","q":"高质量发展是全面建设社会主义现代化国家的首要任务，金融要为经济社会发展提供高质量服务。下列与之相关的表述不准确的是：","o":["优化资金供给结构，把更多金融资源用于促进科技创新、绿色发展、传统制造和国有企业","要着力营造良好的货币金融环境，切实加强对重大战略、重点领域和薄弱环节的优质金融服务","始终保持货币政策的稳健性，更加注重做好跨周期和逆周期调节，充实货币政策工具箱","完善机构定位，支持国有大型金融机构做优做强，当好服务实体经济的主力军和维护金融稳定的压舱石"],"a":"A","e":"2023年10月30日至31日，中央金融工作会议在北京举行。会议指出，“高质量发展是全面建设社会主义现代化国家的首要任务，金融要为经济社会发展提供高质量服务。要着力营造良好的货币金融环境，切实加强对重大战略、重点领域和薄弱环节的优质金融服务。始终保持货币政策的稳健性，更加注重做好跨周期和逆周期调节，充实货币政策工具箱。优化资金供给结构，把更多金融资源用于促进科技创新、先进制造、绿色发展和中小微企业····完善机构定位，支持国有大型金融机构做优做强，当好服务实体经济的主力军和维护金融稳定的压舱石，严格中小金融机构准人标准和监管要求，立足当地开展特色化经营，强化政策性金融机构职能定位，发挥保险业的经济减震器和社会稳定器功能”。A项中“传统制造和国有企业”应为“先进制造和中小微企业”。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":86,"t":"单选","q":"完善收入分配制度，构建初次分配、再分配、第三次分配协调配套的制度体系，是进一步全面深化改革的重要任务。关于完善收入分配制度，下列表述不准确的是：","o":["提高劳动报酬在初次分配中的比重","完善劳动者工资决定、合理增长、支付保障机制，健全按要素分配政策制度","规范财富积累机制，多渠道增加城乡居民财产性收入","完善税收、社会保障、转移支付等第三次分配调节机制"],"a":"D","e":"《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，“完善收入分配制度。构建初次分配、再分配、第三次分配协调配套的制度体系，提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。完善劳动者工资决定、合理增长、支付保障机制，健全按要素分配政策制度。完善税收、社会保障、转移支付等再分配调节机制。支持发展公益慈善事业。规范收入分配秩序，规范财富积累机制，多渠道增加城乡居民财产性收入，形成有效增加低收入群体收入、稳步扩大中等收入群体规模、合理调节过高收入的制度体系。深化国有企业工资决定机制改革，合理确定并严格规范国有企业各级负责人薪酬、津贴补贴等”。由此可知，D项中“第三次分配”应为“再分配”。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":87,"t":"单选","q":"党的二十届三中全会提出，健全绿色低碳发展机制，实施支持绿色低碳发展的财税、金融、投资、价格政策和标准体系，发展绿色低碳产业、健全绿色消费激励机制，促进绿色低碳循环发展经济体系建设。关于健全绿色低碳发展机制，下列举措不恰当的是：","o":["优化政府绿色采购政策，完善绿色税制","建立碳排放双控向能耗双控全面转型新机制","完善资源总量管理和全面节约制度，健全废弃物循环利用体系","加快规划建设新型能源体系，完善新能源消纳和调控政策措施"],"a":"B","e":"《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，“健全绿色低碳发展机制。实施支持绿色低碳发展的财税、金融、投资、价格政策和标准体系，发展绿色低碳产业，健全绿色消费激励机制，促进绿色低碳循环发展经济体系建设。优化政府绿色采购政策，完善绿色税制。完善资源总量管理和全面节约制度，健全废弃物循环利用体系。健全煤炭清洁高效利用机制。加快规划建设新型能源体系，完善新能源消纳和调控政策措施。完善适应气候变化工作体系。建立能耗双控向碳排放双控全面转型新机制。构建碳排放统计核算体系、产品碳标识认证制度、产品碳足迹管理体系，健全碳市场交易制度、温室气体自愿减排交易制度，积极稳妥推进碳达峰碳中和”。综上可知，B项中“碳排放双控向能耗双控全面转型新机制”的表述前后颠倒，应改为“能耗双控向碳排放双控全面转型新机制”。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":88,"t":"单选","q":"西部地区在全国改革发展稳定大局中举足轻重，要一以贯之抓好党中央推动西部大开发政策举措的贯彻落实，进一步形成大保护、大开放、高质量发展新格局。关于新时代推动西部大开发下列表述不准确的是：","o":["要坚持把全面发展新兴产业作为主攻方向，加快西部地区产业转型","要坚持以大开放促进大开发，提高西部地区对内对外开放水平","要坚持统筹发展和安全，提升能源资源等重点领域安全保障能力","要坚持推进新型城镇化和乡村全面振兴有机结合，在发展中保障和改善民生"],"a":"A","e":"2024年4月23日，习近平总书记在重庆主持召开新时代推动西部大开发座谈会时强调，“要坚持把发展特色优势产业作为主攻方向，因地制宜发展新兴产业，加快西部地区产业转型升级。要坚持以高水平保护支撑高质量发展，筑牢国家生态安全屏障。要坚持以大开放促进大开发，提高西部地区对内对外开放水平。要坚持统筹发展和安全，提升能源资源等重点领域安全保障能力。要坚持推进新型城镇化和乡村全面振兴有机结合，在发展中保障和改善民生。要坚持铸牢中华民族共同体意识，切实维护民族团结和边疆稳定”。综上可知，A项中“全面发展新兴产业”应为“发展特色优势产业”。故本题答案为。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":89,"t":"单选","q":"人口发展是关系中华民族伟大复兴的大事。下列有关表述，不正确的是：","o":["我国总体上已由人口增量发展转向减量发展阶段，人口发展呈现少子化、老龄化、区域人口增减分化等明显的趋势性特征","我国现有人口和劳动力规模足够庞大，目前人口减少的体量有限，全民受教育水平持续提高，人口综合红利仍然具有明显优势","人口安全是人口高质量发展的底线要求，大国兴衰往往受到人口状况的深刻影响，要将人口安全纳入总体国家安全范畴加以谋划","党的二十大提出，优化人口发展战略，建立生育支持政策体系，降低生育、养育、教育成本，并决定实施三孩生育政策以及育儿补贴制度等配套支持措施"],"a":"D","e":"A项正确：2024年11月，第22期《求是》杂志发表习近平总书记重要文章《以人口高质量发展支撑中国式现代化》。文章指出，随着经济社会发展和人口年龄结构变化，我国总体上已由人口增量发展转向减量发展阶段，人口发展呈现少子化、老龄化、区域人口增减分化等明显的趋势性特征。B项正确：2024年11月，第22期《求是》杂志发表习近平总书记重要文章《以人口高质量发展支撑中国式现代化》。文章指出，我国现有人口和劳动力规模足够庞大，目前人口减少的体量有限，全民受教育水平持续提高，人口综合红利仍然具有明显优势。C项正确：2024年11月，第22期《求是》杂志发表习近平总书记重要文章《以人口高质量发展支撑中国式现代化》。文章指出，人口安全是人口高质量发展的底线要求，大国兴衰往往受到人口状况的深刻影响，要将人口安全纳入总体次相遇国家安全范畴加以谋划。D项错误：党的二十大报告仅提出“优化人口发展战略，建立生育支持政策体系，降低生育、养育、教育成本”；实施三孩生育政策的决策，是在2021年，中共中央、国务院发布的《关于优化生育政策促进入口长期均衡发展的决定》中明确的。党的二十届三中全会提出，要建立生育补贴制度。2024年10月，国务院办公厅印发《关于加快完善生育支持政策体系推动建设生育友好型社会的若干措施》，提出制定生育补贴制度实施方案和管理规范，指导地方做好政策衔接，积极稳妥抓好落实。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":90,"t":"单选","q":"习近平总书记经济思想创造性运用唯物辩证法，构建起做好经济工作的科学方法论，为整体性推进新时代中国特色社会主义经济建设提供了科学的思想方法指南。下列经济工作方法与马克思主义唯物辩证法原理对应错误的是：","o":["坚持稳中求进工作总基调一否定之否定规律","坚持系统观念—事物的普遍联系","坚持问题导向一矛盾具有普遍性","坚持集中精力办好自己的事一事物发展变化是由内因决定的"],"a":"A","e":"坚持稳中求进工作总基调对应的是量变质变规律。“稳”体现的是事物发展过程中的量变阶段，是为后续发展积累条件、夯实基础；“进则是在量变积累到一定程度后实现的质变突破。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":91,"t":"单选","q":"习近平总书记指出，“宪法作为上层建筑，一定要适应经济基础的变化而变化。任何国家都不可能制定一部永远适用的宪法。”下列古语与这一观点最为契合的是：","o":["理国要道，在于公平正直","盖天下之事，不难于立法，而难于法之必行","举直错诸枉，则民服；举枉错诸直，则民不服","法与时转则治，治与世宜则有功"],"a":"D","e":"A项不符合题意：这句话的核心是强调治理国家的关键在于秉持公平正直的原则，聚焦的是治国的价值取向和道德准则，和宪法等法律制度要随时代、经济基础变化的观点没有关联。B项不符合题意：此句重点指出制定法律并不困难，难的是将法律切实贯彻执行。它聚焦的是法律实施层面的问题，而非法律是否需要根据实际情况进行调整和变革。C项不符合题意：这句话出自《论语》，意思是提拔任用正直公正的人，把他们放在不正直的人之上，民众就会信服；反之民众则不会信服。其讨论的是干部任用与民心向背的关系。D项符合题意：这句话出自《韩非子·五蠹》，意思是法度应随着时代的发展而调整变化，社会才能治理得好；社会治理方式与社会实际相适应，才能取得成效。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":92,"t":"单选","q":"习近平新时代中国特色社会主义思想是坚持马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合的重大成果，是坚持“两个结合”的光辉典范，实现了马克思主义中国化时代化新的飞跃。下列对“两个结合”的理解准确的是：\n①“结合”本身就是创新，同时又开启了广阔的理论和实践创新空间\n②“结合”是深刻的“化学反应”，造就了一个有机统一的新的文化生命体\n③“结合”塑造了文化民族性，有了文化民族性，文化自信就有了根本依托\n④“结合”筑牢了道路根基，使中国特色社会主义道路越走越宽广、越走越坚定\n③“结合”的前提是彼此契合，马克思主义和中华优秀传统文化存在高度的契合性","o":["①②③④","①②③⑤","①②④⑤","①③④⑤"],"a":"C","e":"③错误：2023年，习近平总书记在文化传承发展座谈会上指出：“结合”巩固了文化主体性，创立新时代中国特色社会主义思想就是这一文化主体性的最有力体现。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":93,"t":"单选","q":"“五年来，我们党以巨大的政治勇气和强烈的责任担当，提出一系列新理念新思想新战略，出台一系列重大方针政策，推出一系列重大举措，推进一系列重大工作，解决了许多长期想解决而没有解决的难题，办成了许多过去想办而没有办成的大事，推动党和国家事业发生历史性变革。”这段话最直接体现了马克思主义哲学的哪一观点？","o":["一切从实际出发","人的意识具有能动性","人民群众是历史的创造者","生产关系反作用于生产力"],"a":"B","e":"这段话的核心是强调我们党在正确的思想和战略（即‘新理念新思想新战略”）指导下，通过主动的、有计划的实践（出台政策、推出举措、推进工作），成功推动了历史性变革，解决了难题，办成了大事。这直接体现了“人的意识具有能动性”的哲学原理。A、C、D项说法正确，但是与题意无关。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":94,"t":"单选","q":"习近平总书记指出，要推动公共文化服务标准化、均等化，坚持政府主导、社会参与、重心下移、共建共享，完善公共文化服务体系，提高基本公共文化服务的覆盖面和适用性。关于完善公共文化服务体系，下列举措正确的有几项？\n①做好文化馆、乡镇（街道）综合文化站、村（社区）综合性文化服务中心等的规划建设\n②推动优质文化资源向沿海发达地区集中，促进公共文化服务差异化发展\n③实施全国智慧图书馆体系建设、公共文化云建设等项目\n④实施广播电视惠民工程，完善农村文化基础设施网络\n③推动各民族文化的传承保护和创新交融，提升民族地区公共文化服务水平","o":["2项","3项","4项","5项"],"a":"C","e":"②错误：《国家人权行动计划（2021－2025年）》指出，落实国家基本公共服务标准要求，加强基层文化建设，增加供给总量，优化供给结构，推动优质文化资源向农村地区、革命老区、民族地区、边疆地区倾斜，缩小城乡和地区之间公共文化服务差距。并且“推动优质文化资源向沿海发达地区集中”与题干中“推动公共文化服务标准化、均等化”直接矛盾。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":95,"t":"单选","q":"加强数字政府建设是创新政府治理理念和方式、形成数字治理新格局、推进国家治理体系和治理能力现代化的重要举措。下列关于数字政府建设的基本原则，表述正确的有几项？\n①坚持党的全面领导，充分发挥党总揽全局、协调各方的领导核心作用\n②坚持以市场为中心，始终把满足人民群众物质生活的迫切需求作为目标\n③坚持整体协同，强化系统观念，加强系统集成，全面提升数字政府集约化建设水平\n④坚持数据赋能，建立健全数据治理制度和标准体系，加强数据汇聚融合、共享开放和开发利用","o":["1项","2项","3项","4项"],"a":"C","e":"②错误：《国务院关于加强数字政府建设的指导意见》指出，坚持以人民为中心。始终把满足人民对美好生活的向往作为数字政府建设的出发点和落脚点，着力破解企业和群众反映强烈的办事难、办事慢、办事繁问题，坚持数字普惠，消除“数字鸿沟”，让数字政府建设成果更多更公平惠及全体人民。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":96,"t":"单选","q":"习近平总书记指出，要提高政治判断力、政治领悟力、政治执行力，主动识变求变应变，强化全局视野和系统思维，加强改革政策统筹、进度统筹、效果统筹，发挥改革整体效应。这一论述最能体现马克思主义的哪些基本观点？\n①实践是检验真理的唯一标准\n②系统的存在依赖于要素之间的相关性中产生的有机统一体\n③质变是量变的必然结果，量变达到一定程度必然引起质变\n④尊重客观规律是正确发挥主观能动性的前提","o":["①②","②④","①③","③④"],"a":"B","e":"题干中“强化全局视野和系统思维，加强改革政策统筹、进度统筹、效果统筹，发挥改革整体效应”体现了系统的重要性，系统是相互联系、相互作用的要素构成的有机整体。题干中“主动识变求变应变”，是在尊重客观规律（识变）基础上，发挥主观能动性（求变、应变）。\n①③说法正确，但是与题意无关。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":97,"t":"单选","q":"深化养老服务改革发展是实施积极应对人口老龄化国家战略的迫切要求，是保障和改善民生的重要任务，事关亿万百姓福社，事关社会和谐稳定。为加快建设适合我国国倩的养老服务体系、更好保障老有所养，下列举措恰当的是：\n①推动国有资本参与发展养老服务，完善分类考核评价\n②加快补齐农村养老服务短板，扩大农村养老服务供给\n③发挥社区养老的决定作用，为居家养老提供有力支持\n④以失能老年人的照护为重点，强化我国基本养老服务","o":["①②③","①②④","①③④","②③④"],"a":"B","e":"2024年12月30日，《中共中央国务院关于深化养老服务改革发展的意见》印发。\n①举措恰当：意见指出，要发挥养老服务产业发展市场配置资源作用。推动国有资本参与发展养老服务，完善分类考核评价。\n②举措恰当：意见指出，要加快补齐农村养老服务短板。因地制宜扩大农村养老服务供给。\n③举措不恰当：意见指出，要扩大社区养老服务有效供给，依托社区为居家养老提供有力支持。社区养老在我国养老服务中发挥着重要作用，但不是“决定作用”。\n④举措恰当：意见指出，要优化居家为基础、社区为依托、机构为专业支撑、医养相结合的养老服务供给格局，强化以失能老年人照护为重点的基本养老服务。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":98,"t":"单选","q":"坚定理想信念，坚守共产党人精神追求，始终是共产党人安身立命的根本。关于推动理想信念教育常态化制度化，下列表述不恰当的是：","o":["形成网上思想道德教育统一化、标准化实施机制","建立健全道德领域突出问题协同治理机制，完善“扫黄打非”长效机制","健全诚信建设长效机制，教育引导全社会自觉遵守法律、遵循公序良俗","优化英模人物宣传学习机制，创新爱国主义教育和各类群众性主题活动组织机制"],"a":"A","e":"《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，推动理想信念教育常态化制度化。完善培育和践行社会主义核心价值观制度机制。改进创新文明培育、文明实践、文明创建工作机制。实施文明乡风建设工程。优化英模人物宣传学习机制，创新爱国主义教育和各类群众性次相遇主题活动组织机制，推动全社会崇尚英雄、缅怀先烈、争做先锋。构建中华传统美德传承体系，健全社会公德、职业道德、家庭美德、个人品德建设体制机制，健全诚信建设长效机制，教育引导全社会自觉遵守法律、遵循公序良俗，坚决反对拜金主义、享乐主义、极端个人主义和历史虚无主义。形成网上思想道德教育分众化、精准化实施机制。建立健全道德领域突出 "新思想马原要点","n":13,"t":"单选","q":"党的二十大报告指出，要巩固和发展最广泛的爱国统一战线。下列相关说法，正确的有几项？\n①人心问题是统一战线最核心最根本的问题\n②统一战线是中国共产党夺取革命、建设、改革事业胜利的重要法宝\n③统战工作的关键是要坚持求同存异，发扬批评与自我批评的优良传统\n④统战工作的本质要求是大团结大联合，解决的就是人心和力量问题","o":["1项","2 项","3项","4项"],"a":"B","e":"①错误：坚持党的领导是统一战线最核心最根本的问题。\n③错误：统战工作的关键是要坚持求同存异，发扬“团结一—批评～—团结\"的优良传统，在尊重多样性中寻求一致性，找到最大公约数、画出最大同心圆。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":14,"t":"单选","q":"国家安全是人民幸福安康的基本要求，是安邦定国的重要基石。下列关于总体国家安全观，说法正确的是：","o":["总体国家安全观以国家安全为宗旨","总体国家安全观以经济安全为保障","总体国家安全观以军事、文化、社会安全为基础","总体国家安全观以政治安全为根本"],"a":"D","e":"ABC项错误：总体国家安全观以人民安全为宗旨，政治安全为根本，经济安全为基础，军事、文化、社会安全为保障。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":15,"t":"单选","q":"推动构建人类命运共同体，要弘扬全人类共同价值，落实全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议，广泛凝聚共识、汇聚力量。下列说法正确的有几项？\n①人类命运共同体的内涵是建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界\n②和平与发展是人类的共同事业，公平与正义是人类的共同理想，民主与自由是人类的共同追求\n③全球治理倡议倡导各国坚持共同、综合、合作、可持续的安全观\n④推动建设相互尊重、公平正义、合作共赢的新型国际关系\n③全人类共同价值则反映了世界各国人民普遍认同的价值理念的最大公约数","o":["2项","3项","4项","5 项"],"a":"C","e":"③错误：“坚持共同、综合、合作、可持续的安全观\"是全球安全倡议的核心内容，而非全球治理倡议。全球治理倡议的核心主张是奉行主权平等、遵守国际法治、践行多边主义、倡导以人为本、注重行动导向。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":16,"t":"单选","q":"党的二十大报告指出，要坚定不移全面从严治党，深人推进新时代党的建设新的伟大工程。关于全面从严治党，下列说法正确的是：\n①全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路\n②全面从严治党，要以党的政治建设为根本性建设\n③全面从严治党的总体布局是推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深人推进反腐败斗争\n④全面从严治党以党的长期执政能力建设、先进性和纯洁性建设为统领","o":["①②③","①②④","①③④","②③④"],"a":"A","e":"④错误：新时代党的建设，以加强党的长期执政能力建设、先进性和纯洁性建设为主线，以政治建设为统领。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":17,"t":"单选","q":"党的二十大报告指出，“全面依法治国是国家治理的一场深刻革命”。关于全面依法治国，下列说法正确的有几项？\n①全面依法治国的总抓手是建设社会主义法治国家\n②法治政府建设是全面依法治国的重点任务和主体工程\n③全面依法治国是实现中华民族伟大复兴的战略支撑\n④全面依法治国必须正确处理政治和法治、改革和法治、依法洽国和以德治国、依法洽国和依规治党的关系","o":["1项","2项","3项","4项"],"a":"B","e":"①错误：全面依法治国的总抓手是建设中国特色社会主义法治体系。\n③错误：全面依法治国是坚持和发展中国特色社会主义的本质要求和重要保障。巩固国防和强大人民军队是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的战略支撑。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":18,"t":"单选","q":"关于深化文化体制机制改革，下列说法正确的有几项？\n①健全用马克思主义理论武装全党、教育人民、指导实践工作体系\n②坚决反对拜金主义、享乐主义、极端个人主义和历史虚无主义\n③完善公共文化服务体系，建立优质文化资源直达基层机制\n④坚持以经济效益为中心的创作导向，坚持出成果和出人才相结合、抓作品和抓环境相贯通","o":["1项","2项","3项","4项"],"a":"B","e":"①错误：健全用党的创新理论武装全党、教育人民、指导实践工作体系。\n④错误：坚持以人民为中心的创作导向，坚持出成果和出人才相结合、抓作品和抓环境相贯通。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":19,"t":"单选","q":"中国式现代化是一种全新的人类文明形态。下列相关说法，正确的是：","o":["社会主义革命和建设时期，为实现现代化创造了根本社会条件","概括提出并深人阐述中国式现代化理论，是党的十九大的一个重大理论创新","以人民为中心的发展思想直接关系中国式现代化的根本方向、最终成败","要正确处理好顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放等一系列重大关系"],"a":"D","e":"A项错误：新民主主义革命时期，为实现现代化创造了根本社会条件。B项错误：概括提出并深入阐述中国式现代化理论，是党的二十大的一个重大理论创新，是科学社会主义的最新重大成果。C项错误：党的领导直接关系中国式现代化的根本方向、前途命运、最终成败。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":20,"t":"单选","q":"就业是最基本的民生，事关人民群众切身利益．事关经济社会健康发展，事关国家长治久安。下列有关说法，错误的有几项？\n①坚持以人民为中心的发展思想，全面贯彻劳动者自主就业、市场调节就业、政府促进就业和鼓励创业的方针\n②以强化就业优先政策为抓手，以破解季节性就业矛盾为着力点，以深化就业体制机制改革为动力\n③引导资金、技术、劳动密集型产业从中西部向东部、从腹地向中心城市有序转移\n④健全劳动、知识、技术等要素按贡献参与分配的初次分配机制、提高劳动报酬在再分配中的比重","o":["1项","2项","3项","4项"],"a":"C","e":"②错误：以强化就业优先政策为抓手，以破解结构性就业矛盾为着力点，以深化就业体制机制改革为动力。\n③错误：引导资金、技术、劳动密集型产业从东部向中西部、从中心城市向腹地有序转移。\n④错误：健全劳动、知识、技术等要素按贡献参与分配的初次分配机制，提高劳动报酬在初次分配中的比重。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":22,"t":"单选","q":"关于共同富裕，下列说法正确的有几项？\n①共同富裕是社会主义的本质要求\n②共同富裕是全体人民的富裕，是人民群众物质生活和精神生活都富裕\n③共同富裕是社会主义的根本任务\n④不同地区富裕程度存在一定差异，实现共同富裕应该各提各的指标","o":["1项","2项","3项","4 项"],"a":"B","e":"③错误：社会主义的根本任务是解放和发展生产力。\n④错误：全体人民共同富裕是一个总体概念，是对全社会而言的，不要分成城市一块、农村一块，或者东部、中部、西部地区各一块，各提各的指标，要从全局上来看。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":23,"t":"单选","q":"发展全过程人民民主，必须加强人民当家作主制度保障，坚持和完善我国政治制度体系。下列有关我国政治制度的说法，正确的有几项？\n①人民代表大会制度是我国的基本政治制度\n②基层群众自治制度是社会主义民主政治建设的基础\n③人民代表大会制度的实质就是人民当家作主\n④平等、团结、互助、和谐是处理民族关系的基本原则","o":["1项","2 项","3 项","4项"],"a":"B","e":"①错误：人民代表大会制度是我国的根本政治制度。中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度构成了我国的基本政治制度。\n④错误：平等、团结、互助、和谐是我国民族关系的特征。民族平等、民族团结、各民族共同繁荣是我国处理民族关系的基本原则。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":24,"t":"单选","q":"建设美丽中国，是全面建设社会主义现代化国家的重要目标，也是满足人民日益增长的优美生态环境需要的必然要求。关于
