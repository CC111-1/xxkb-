<title>小黑题库 · 公考刷题器 | cc 原创</title>
<style>
:root{
  --bg:#f4f6f5; --bg2:#eef2f0; --card:#fff; --fg:#152622; --mut:#7a8b86;
  --line:#e6ebe8; --pri:#0e7c6b; --pri2:#12a58c; --pri-l:#e8f5f1;
  --ok:#12894b; --ok-l:#e7f6ec; --err:#c62b23; --err-l:#fdecea; --warn:#c07800;
  --shadow:0 1px 2px rgba(16,40,34,.04),0 8px 24px rgba(16,40,34,.07);
  --shadow-lg:0 2px 6px rgba(16,40,34,.06),0 18px 40px rgba(16,40,34,.12);
  --r:18px;
}
[data-theme=dark]{
  --bg:#0e1413; --bg2:#111a18; --card:#17211f; --fg:#e6efec; --mut:#8ea19b;
  --line:#243230; --pri:#2fbfa4; --pri2:#3dd7b8; --pri-l:#12302b;
  --ok:#3ec97f; --ok-l:#122f21; --err:#f2736c; --err-l:#361715; --warn:#e0a94a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-lg:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif;
  background:radial-gradient(1200px 500px at 50% -200px,var(--bg2),var(--bg) 70%);min-height:100vh}
.app{max-width:760px;margin:0 auto;padding:0 16px 40px}
button{font-family:inherit}
.icon{width:18px;height:18px;display:inline-block;vertical-align:-3px}
.icon-btn{width:38px;height:38px;border:0;border-radius:12px;background:var(--card);color:var(--fg);
  box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.tabs{position:sticky;top:0;z-index:12;display:flex;gap:6px;padding:10px 0 9px;
  background:linear-gradient(var(--bg) 74%,transparent);backdrop-filter:blur(10px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:9px 2px;border-radius:13px;background:var(--card);
  border:1px solid var(--line);font-size:12px;color:var(--mut);cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.tab svg{width:13px;height:13px}
.tab.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent;
  box-shadow:0 8px 18px rgba(13,122,104,.26);font-weight:600}
.features{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:2px 0 10px}
.feat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);
  cursor:pointer;display:flex;gap:11px;align-items:center}
.feat .fi{width:38px;height:38px;border-radius:12px;background:var(--pri-l);color:var(--pri);display:flex;
  align-items:center;justify-content:center;flex:0 0 auto}
.feat .ft{flex:1;min-width:0}
.feat .ft b{display:block;font-size:14px;font-weight:650}
.feat .ft span{font-size:11px;color:var(--mut)}
.feat .arw{color:var(--mut);font-size:14px}
.banner{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--pri-l),var(--card));
  border:1px solid var(--line);border-radius:18px;padding:13px 15px;margin:0 0 14px;box-shadow:var(--shadow);cursor:pointer}
.banner .ic{width:38px;height:38px;border-radius:12px;background:var(--pri);color:#fff;display:flex;align-items:center;
  justify-content:center;flex:0 0 auto}
.banner .t{flex:1;min-width:0}
.banner .t b{display:block;font-size:14.5px;font-weight:650}
.banner .t span{font-size:11.5px;color:var(--mut)}
.banner .go{font-size:12px;color:var(--pri);font-weight:600;white-space:nowrap}
.star{margin-left:auto;cursor:pointer;color:var(--mut);display:flex;align-items:center;gap:4px;font-size:11.5px}
.star.on{color:#d9a300}
.report{display:flex;justify-content:flex-end;margin:10px 0 2px;font-size:11.5px}
.report a{cursor:pointer;text-decoration:none;color:var(--mut);border-bottom:1px dashed var(--line)}
.hdr{position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;padding:12px 0;
  background:linear-gradient(var(--bg) 70%,transparent);backdrop-filter:blur(8px)}
.hdr h1{flex:1;font-size:18px;margin:0;font-weight:650;letter-spacing:.2px}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px 18px 18px;color:#fff;
  background:linear-gradient(135deg,#0b6b5e,#128a76 45%,#17a58c);
  box-shadow:0 12px 30px rgba(13,107,93,.28);margin:4px 0 14px}
.hero:after{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-110px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 65%)}
.hero .brand{display:flex;align-items:center;gap:8px;font-size:13px;opacity:.95}
.dot{width:22px;height:22px;border-radius:7px;background:#fff;color:#0b6b5e;display:inline-flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:800}
.hero h1{margin:8px 0 2px;font-size:24px;letter-spacing:.5px}
.hero .sub{font-size:12.5px;opacity:.86}
.orig{margin-left:auto;font-size:13.5px;font-weight:600;letter-spacing:.5px;padding:3px 11px;border-radius:20px;background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.32)}
.quote{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 15px;margin:0 0 14px;
  box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start}
.quote .qm{color:var(--pri);font-size:22px;line-height:1;margin-top:2px;font-family:Georgia,serif}
.quote .qt{flex:1;font-size:14px;line-height:1.7}
.quote .qd{font-size:11px;color:var(--mut);white-space:nowrap;padding-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:19px;font-weight:700;letter-spacing:.3px}
.stat span{font-size:11px;color:var(--mut)}
.stat.w b{color:var(--err)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 10px}
.sec b{font-size:15px;font-weight:650}
.sec a{font-size:12px;color:var(--mut);text-decoration:none}
.book{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px 15px 13px;margin-bottom:12px;
  box-shadow:var(--shadow);transition:.18s}
.book:active{transform:scale(.995)}
.book-top{display:flex;gap:12px;align-items:center}
.badge{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12.5px;
  color:#fff;flex:0 0 auto;font-weight:600;letter-spacing:.5px}
.badge.c1{background:linear-gradient(135deg,#1d4ed8,#3b82f6)}
.badge.c2{background:linear-gradient(135deg,#b45309,#f59e0b)}
.badge.c3{background:linear-gradient(135deg,#15803d,#22c55e)}
.badge.c4{background:linear-gradient(135deg,#6d28d9,#a855f7)}
.badge.c5{background:linear-gradient(135deg,#0e7490,#06b6d4)}
.badge.c6{background:linear-gradient(135deg,#7c2d12,#f97316)}
.book h3{margin:0;font-size:15.5px;font-weight:650}
.book .meta{font-size:12px;color:var(--mut);margin-top:2px}
.ringwrap{margin-left:auto;flex:0 0 auto;width:48px;height:48px;position:relative}
.ringwrap svg{transform:rotate(-90deg)}
.ringwrap i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;
  font-style:normal;color:var(--pri);font-weight:700}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin:11px 0 10px}
.bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--pri),var(--pri2));width:0}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts button{border:0;border-radius:11px;padding:8px 13px;font-size:12.5px;cursor:pointer;background:var(--pri-l);
  color:var(--pri);font-weight:600}
.acts button.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(14,124,107,.25)}
.acts button.ghost{background:transparent;border:1px solid var(--line);color:var(--mut);font-weight:500}
.acts button.danger{background:transparent;border:1px solid var(--err);color:var(--err);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px 12px;text-align:center;
  box-shadow:var(--shadow);cursor:pointer;color:var(--fg)}
.tile svg{width:22px;height:22px;color:var(--pri)}
.tile b{display:block;font-size:13px;font-weight:600;margin-top:6px}
.tile span{font-size:10.5px;color:var(--mut)}
.mask{position:fixed;inset:0;background:rgba(8,22,19,.5);backdrop-filter:blur(3px);display:none;align-items:flex-end;
  justify-content:center;z-index:30;padding:0}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:22px 22px 0 0;width:100%;max-width:760px;max-height:82vh;overflow:auto;
  padding:18px 18px 26px;box-shadow:var(--shadow-lg);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.modal h3{margin:0 0 3px;font-size:17px}
.modal .small{color:var(--mut);font-size:12px;margin-bottom:12px}
.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.unit{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px;text-align:center;cursor:pointer;font-size:12.5px}
.unit b{display:block;font-size:13.5px;margin-bottom:1px}
.unit span{color:var(--mut);font-size:11px}
.opt{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:9px 0;display:flex;gap:11px;
  cursor:pointer;background:var(--card);transition:.16s;align-items:flex-start}
.opt:active{transform:scale(.995)}
.opt .lab{width:26px;height:26px;border-radius:9px;border:1.5px solid var(--line);display:flex;align-items:center;
  justify-content:center;font-size:13px;flex:0 0 auto;color:var(--mut);font-weight:600;margin-top:1px}
.opt .txt{flex:1;font-size:.95em;line-height:1.7}
.opt.sel{border-color:var(--pri);background:var(--pri-l);box-shadow:0 0 0 3px rgba(14,124,107,.08)}
.opt.sel .lab{background:var(--pri);color:#fff;border-color:var(--pri)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.ok .lab{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.err{border-color:var(--err);background:var(--err-l)}
.opt.err .lab{background:var(--err);color:#fff;border-color:var(--err)}
.opt.dim{opacity:.5}
.qwrap{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:17px 16px 6px;box-shadow:var(--shadow)}
.qhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.tag{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:8px;background:var(--pri-l);color:var(--pri);font-weight:600}
.tag.warn{background:var(--err-l);color:var(--err)}
.tag.gray{background:var(--bg2);color:var(--mut)}
.qidx{margin-left:auto;font-size:11.5px;color:var(--mut);font-variant-numeric:tabular-nums}
.qtext{font-size:1.06em;line-height:1.88;white-space:pre-wrap;margin:2px 0 4px}
.qtext b{color:var(--pri)}
.hdrline{position:sticky;top:0;z-index:9;background:linear-gradient(var(--bg) 72%,transparent);padding:10px 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.hsub{flex:1;min-width:0}
.hsub .t1{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-bottom:5px}
.prog{height:5px;border-radius:4px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:.25s}
.segprog{display:flex;gap:3px}
.segprog i{flex:1;height:4px;border-radius:3px;background:var(--line)}
.segprog i.on{background:linear-gradient(90deg,var(--pri),var(--pri2))}
.foot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:20;display:flex;gap:8px;padding:12px 16px 18px;
  width:100%;max-width:760px;background:linear-gradient(transparent,var(--bg) 30%,var(--bg) 62%)}
.foot button{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:14.5px;cursor:pointer;
  background:var(--card);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.foot button.pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;
  box-shadow:0 8px 20px rgba(14,124,107,.28)}
.foot button.small{flex:0 0 66px;font-size:12.5px;font-weight:500;color:var(--mut);white-space:nowrap;padding:13px 4px}
.foot button:disabled{opacity:.4;box-shadow:none}
.sheetgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:8px}
.sq{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
  font-size:13.5px;cursor:pointer;background:var(--bg);color:var(--mut);font-weight:600}
.sq.done{background:var(--pri-l);border-color:var(--pri);color:var(--pri)}
.sq.now{outline:2px solid var(--pri);outline-offset:1px}
.rescard{background:linear-gradient(150deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:24px;
  padding:22px 18px;text-align:center;box-shadow:var(--shadow);margin-bottom:12px}
.bigring{width:132px;height:132px;margin:0 auto 6px;position:relative}
.bigring svg{transform:rotate(-90deg)}
.bigring .n{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.bigring .n b{font-size:34px;line-height:1;letter-spacing:-1px}
.bigring .n span{font-size:11px;color:var(--mut);margin-top:3px}
.resline{display:flex;justify-content:center;gap:18px;font-size:12.5px;color:var(--mut);margin-top:8px;flex-wrap:wrap}
.resline em{font-style:normal;font-weight:700;font-size:15px;color:var(--fg)}
.list{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border-bottom:0}
.li .n{width:32px;height:32px;border-radius:10px;background:var(--bg2);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--mut);flex:0 0 auto;font-weight:600}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:14px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .t span{font-size:11.5px;color:var(--mut)}
.li .r{font-size:11.5px;font-weight:600;flex:0 0 auto}
.li .r.ok{color:var(--ok)}.li .r.err{color:var(--err)}.li .r.mut{color:var(--mut)}
.answerbar{border-radius:14px;padding:11px 13px;font-size:14px;font-weight:600;margin:14px 0 2px}
.answerbar.ok{background:var(--ok-l);color:var(--ok)}
.answerbar.err{background:var(--err-l);color:var(--err)}
.exp{margin-top:14px;padding-top:13px;border-top:1px dashed var(--line)}
.exp h4{margin:0 0 7px;font-size:13px;color:var(--pri);letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.exp p{margin:0;font-size:14.5px;line-height:1.9;white-space:pre-wrap;color:var(--fg)}
.exp.why h4{color:var(--warn)}
.exp.why p{font-size:14px}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .t{flex:1}
.setrow .t b{font-weight:600;font-size:14.5px;display:block}
.setrow .t span{font-size:11.5px;color:var(--mut)}
.switch{width:46px;height:27px;border-radius:16px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;transition:.2s}
.switch>i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--pri)}
.switch.on>i{left:22px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--mut);font-size:12.5px;padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
select{background:var(--bg);border:1px solid var(--line);color:var(--fg);border-radius:11px;padding:8px 10px;font-size:13.5px;font-family:inherit}
input[type=range]{-webkit-appearance:none;width:160px;height:4px;border-radius:4px;background:var(--line);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--pri);box-shadow:0 2px 6px rgba(14,124,107,.4)}
.searchbar{display:flex;gap:8px;margin-bottom:12px}
.searchbar input{flex:1;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);
  color:var(--fg);font-size:15px;font-family:inherit;box-shadow:var(--shadow)}
.searchbar button{border:0;border-radius:14px;padding:0 18px;background:var(--pri);color:#fff;font-size:14px;cursor:pointer}
.chip{display:inline-block;padding:7px 13px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;margin:0 8px 8px 0;cursor:pointer;color:var(--fg)}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri);box-shadow:0 6px 14px rgba(14,124,107,.22)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(16px);background:rgba(16,32,28,.92);
  color:#fff;padding:10px 18px;border-radius:12px;font-size:13.5px;opacity:0;transition:.24s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{text-align:center;color:var(--mut);padding:44px 0;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:12px}
.note{font-size:12px;color:var(--mut);line-height:1.7}
.barchart{display:flex;align-items:flex-end;gap:7px;height:112px;margin-top:26px}
.barchart div{flex:1;background:linear-gradient(180deg,var(--pri2),var(--pri));border-radius:7px 7px 0 0;min-height:3px;position:relative}
.barchart div.zero{background:var(--line)}
.barchart div span{position:absolute;top:-32px;left:-4px;right:-4px;text-align:center;font-size:10px;color:var(--mut);line-height:1.35;white-space:nowrap}
.barchart div span i{display:block;font-style:normal;font-size:9.5px;opacity:.75}
.barchart div span b{display:block;font-size:11px;color:var(--fg)}
.fade{animation:fade .2s ease}
@keyframes fade{from{opacity:.35}to{opacity:1}}
@media(min-width:720px){
  .app{max-width:760px;margin:0 auto}
  .hero h1{font-size:26px}
}
@media(min-width:1000px){
  .features{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:400px){
  .hero h1{font-size:21px}.stats{gap:7px}.stat b{font-size:17px}
  .tiles{gap:8px}.qtext{font-size:15.5px}
}

.ktag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--bg2);color:var(--mut);border:1px solid var(--line)}
.qhead .spacer{margin-left:auto}
.mini{font-size:11.5px;color:var(--mut);display:inline-flex;align-items:center;gap:3px;cursor:pointer;padding:4px 7px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.mini.on{color:#d9a300;border-color:#f0d089;background:#fffaf0}

选","q":"2026 年1 月9 日，国务院常务会议召开。会议指出，实施财政金融协同促内需一揽子政策，是扩大有效需求、创新宏观调控的重要举措。下列相关举措，说法正确的是：","o":["要加强财政政策与金融政策配合联动，充分发挥政策效应，引导社会资本参与促消费、扩投资","要围绕促进居民消费，优化实施服务业经营主体贷款、个人消费贷款免息政策，推动增加优质服务供给，增强居民消费能力","要围绕支持民间投资，实施国有企业贷款贴息政策，设立民间投资专项担保计划","要建立支持民营企业债券风险分担机制，优化实施设备更新贷款财政贴息政策，进一步提高企业融资门槛和成本"],"a":"A","e":"B 项说法错误：要围绕促进居民消费，优化实施服务业经营主体贷款、个人消费贷款贴息政策，推动增加优质服务供给，增强居民消费能力。CD 项说法错误：围绕支持民间投资，实施中小微企业贷款贴息政策，设立民间投资专项担保计划，建立支持民营企业债券风险分担机制，优化实施设备更新贷款财政贴息政策，进一步降低企业融资门槛和成本。故本题答案为A。","v":true,"bad":false},{"b":"月半时政","s":"2026年1月时政·上","n":7,"t":"单选","q":"2026 年1 月9 日，国务院常务会议召开。会议指出，推行由常住地提供基本公共服务，有利于推进基本公共服务均等化，更好支撑以人为本的新型城镇化。下列相关举措，说法正确的是：\n①要科学有序、因地制宜推进各项举措，构建适应公共服务随人走的政策支撑和要素保障体系\n②要着力解决已落户常住人口急难愁盼问题，完善随迁子女教育政策，扩大公租房保障范围\n③要健全就业地参加职工社会保险制度，加强常住地基本医疗保障，强化就业服务，完善兜底性公共服务\n④要按照常住人口布局公共服务设施，加强服务事项协同经办，不断完善有利于流动人口连续享有基本公共服务的共建共享政策","o":["①③④","①②③","①②④","②③④"],"a":"A","e":"②说法错误：要着力解决未落户常住人口急难愁盼问题，完善随迁子女教育政策，扩大公租房保障范围，健全就业地参加职工社会保险制度，加强常住地基本医疗保障，强化就业服务，完善兜底性公共服务，让他们更好融入城市。故本题答案为A。","v":true,"bad":false},{"b":"月半时政","s":"2026年1月时政·上","n":8,"t":"单选","q":"2026 年1 月9 日，国务院常务会议召开。会议指出，修订自然保护区条例，做好与国家公园法等法律法规的协调衔接，将为高质量推进自然保护区建设提供有力法治保障。下列相关说法，正确的是：","o":["坚持开发利用第一、统筹保护和发展，按照自然生态系统特性和内在规律，对自然保护区实行整体保护、系统修复、综合治理","构建市场主导、多方参与、社会共享的机制，实现生态保护、绿色发展、民生改善相统一","构建以自然保护区为主体、国家公园为基础，各类自然公园为补充的自然保护地体系","生态文明建设是关系中华民族永续发展的根本大计，党的十八大首次将其纳入“五位一体”总体布局"],"a":"D","e":"AB 项说法错误：要坚持生态保护第一、统筹保护和发展，按照自然生态系统特性和内在规律，对自然保护区实行整体保护、系统修复、综合治理，在确保生态得到保护的前提下提升公共服务功能，构建政府主导、多方参与、社会共享的机制，实现生态保护、绿色发展、民生改善相统一。C 项说法错误：构建以国家公园为主体、自然保护区为基础，各类自然公园为补充的自然保护地体系。故本题答案为D。","v":true,"bad":false},{"b":"月半时政","s":"2026年1月时政·上","n":9,"t":"单选","q":"2026 年1 月，习近平在中国共产党第二十届中央纪律检查委员会第五次全体会议上发表重要讲话。下列相关说法，正确的有几项？\n①贯彻落实党中央重大决策部署，是维护党中央权威和集中统一领导的根本要求，也是党和人民事业不断发展进步的重要历史经验\n②党的自我革命重在授权，把权力关进制度笼子是新时代全面从严治党的一项重要任务\n③党的十八大后，党中央以制定实施中央八项规定开局破题，立铁规矩、强硬约束，推动党风政风焕然一新\n④把权力关进制度笼子，既要不断完善制度规定，使制度密而不繁、有效管用，又要着力提高制度执行力，增强柔性约束\n⑤党的十八大以来，我们党成功走出一条在党中央集中统一领导下，标本兼治、一体推进不敢腐不能腐不想腐的中国特色反腐败之路","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"②说法错误：党的自我革命重在治权，把权力关进制度笼子是新时代全面从严治党的一项重要任务。\n④说法错误：把权力关进制度笼子，既要不断完善制度规定，使制度密而不繁、有效管用，又要着力提高制度执行力，增强刚性约束。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年1月时政·上","n":10,"t":"单选","q":"2026 年1 月，习近平在中国共产党第二十届中央纪律检查委员会第五次全体会议上发表重要讲话。他强调，党的十八大以来，我们党成功走出一条在党中央集中统一领导下，标本兼治、一体推进不敢腐不能腐不想腐的中国特色反腐败之路，要坚定走下去。这一论断的哲学依据是：\n①整体与部分相互联系、相互作用，要树立系统思维实现整体最优目标\n②具体问题具体分析是正确认识事物的基础和正确解决矛盾的关键\n③事物发展是前进性与曲折性的辩证统一\n④本质是由现象产生的，总是从不同的侧面这样或那样地体现着事物的现象","o":["①②③","②③④","①②","③④"],"a":"C","e":"①符合题意：题干中“一体推进不敢腐不能腐不想腐”体现了整体与部分的相互联系，要求树立系统思维、实现整体最优目标。\n②符合题意：题干中“中国特色反腐败之路”体现了矛盾具有特殊性，要坚持具体问题具体分析，这是正确认识事物的基础和正确解决矛盾的关键。\n④说法错误：现象是由本质产生的，总是从不同的侧面这样或那样地体现着事物的本质。\n③说法正确，但是与题意无关。故本题答案为C。","v":true,"bad":false},{"b":"月半时政","s":"2026年1月时政·上","n":11,"t":"单选","q":"2026 年1 月，习近平在中国共产党第二十届中央纪律检查委员会第五次全体会议上发表重要讲话。他强调，党的十八大后，党中央以制定实施中央八项规定开局破题，立铁规矩、强硬约束，推动党风政风焕然一新。下列说法正确的是：\n①八项规定是我们改进作风的第一步，是我们作为共产党人应该做到的最高要求\n②作风问题本质上是党性问题，领导干部的作风直接关系党内风气和政治生态，关系民心向背，决定着党的群众基础\n③持续深化纠“四风”工作，当前的重点是力戒享乐主义、奢靡之风\n④制定实施中央八项规定，是我们党在新时代的徙木立信之举","o":["①②③","②④","①③","①③④"],"a":"B","e":"①说法错误：八项规定既不是最高标准，更不是最终目的，只是我们改进作风的第一步，是我们作为共产党人应该做到的基本要求。\n③说法错误：持续深化纠“四风”工作，特别是要力戒形式主义、官僚主义。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年1月时政·上","n":12,"t":"单选","q":"2026 年1 月，中国共产党第二十届中央纪律检查委员会第五次全体会议召开。全会强调，“十五五”时期是基本实现社会主义现代化夯实基础、全面发力的关键时期，全面从严治党面临新的形势任务。下列对于纪检监察机关的要求，说法正确的有几项？\n①要深刻把握实现“十五五”时期目标任务对维护党的团结统一提出的更高要求，坚定不移推动全党拥护“两个确立”、做到“两个维护”\n②要深刻把握实现“十五五”时期目标任务对把权力关进制度笼子提出的更高要求，坚定不移强化制度治权、依规用权\n③要深刻把握实现“十五五”时期目标任务对保持党的先进性纯洁性提出的更高要求，坚定不移走好中国特色反腐败之路\n④要深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业","o":["1 项","2 项","3 项","4 项"],"a":"D","e":"本题答案D。逐项对照原文：\n①要深刻把握实现“十五五”时期目标任务对维护党的团结统一提出的更高要求，坚定不移推；\n②要深刻把握实现“十五五”时期目标任务对把权力关进制度笼子提出的更高要求，坚定不移；\n③要深刻把握实现“十五五”时期目标任务对保持党的先进性纯洁性提出的更高要求，坚定不；\n④要深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党。四项均为原文表述，主体、时限、数量、定语未被偷换，故全选，选D。","v":true,"bad":false},{"b":"月半时政","s":"2026年1月时政·上","n":13,"t":"单选","q":"2026 年1 月，中国共产党第二十届中央纪律检查委员会第五次全体会议召开。全会强调，强化政治监督，推动全党凝心聚力实现“十五五”时期目标任务。下列相关举措，说法正确的有几项？\n①推动加强党的创新理论武装，引导党员干部增强使命意识，做到笃信、务实、担当、自 心，以更大力度和更实举措抓好经济工作。”体现了意识具有能动性，要坚持发挥主观能动性。D 项符合题意：题干中并没有相关表述能够体现量变必然引起质变，要重视量的积累。故本题答案为D。","v":true,"bad":false},{"b":"月半时政","s":"2026年4月时政·下","n":33,"t":"多选","q":"2026 年4 月29 日，习近平向上海合作组织绿色和可持续发展论坛致贺信。习近平指出，中国秉持绿水青山就是金山银山理念，坚定不移走生态优先、绿色发展之路，是全球生态文明建设的______。","o":["参与者","贡献者","引领者","主导者"],"a":"ABC","e":"习近平指出，中国秉持绿水青山就是金山银山理念，坚定不移走生态优先、绿色发展之路，是全球生态文明建设的参与者、贡献者、引领者。故本题答案为ABC。","v":true,"bad":false},{"b":"月半时政","s":"2026年4月时政·下","n":34,"t":"单选","q":"2026 年4 月30 日，《中华人民共和国监狱法》发布，自2026 年11 月1 日起施行。下列相关说法，不正确的是：","o":["监狱工作坚持中国共产党的领导，坚持总体国家安全观，建立公正、法治、文明、廉洁、高效的监狱刑罚执行体制","监狱工作应当坚持惩罚和改造相结合、教育和劳动相结合，以改造人为宗旨","监狱应当根据罪犯的犯罪类型、刑期和人身危险程度，设置不同戒备等级监狱、监区","监狱应当根据罪犯的户籍所在地和家庭背景，设置不同功能类型监区"],"a":"D","e":"D 项说法错误：根据罪犯健康状况和改造需要，设置不同功能类型监区。故本题答案为D。","v":true,"bad":false},{"b":"月半时政","s":"2026年4月时政·下","n":35,"t":"单选","q":"2026 年4 月30 日，《中华人民共和国监狱法》发布，自2026 年11 月1 日起施行。其中明确规定了监狱人民警察的法定职责。下列属于监狱人民警察依法履行职责的有几项？\n①收押和释放罪犯，维护监管秩序与安全\n②对罪犯进行监管和教育改造，管理罪犯的生活和卫生\n③对罪犯改造表现进行考核、奖惩\n④直接裁定办理暂予监外执行、减刑、假释\n⑤处理罪犯申诉、控告、检举\n⑥预防、制止和侦查罪犯在监狱内的犯罪活动","o":["3 项","4 项","5 项","6 项"],"a":"C","e":"④说法错误：监狱人民警察的职责是“提出办理暂予监外执行、减刑、假释建议”，而非直接“裁定办理”。减刑、假释等需要由人民法院依法裁定。监狱人民警察依法履行下列职责：（一）收押和释放罪犯；（二）维护监管秩序与安全；（三）对罪犯进行监管和教育改造，管理罪犯的生活和卫生；（四）对罪犯改造表现进行考核、奖惩；（五）提出办理暂予监外执行、减刑、假释建议；（六）处理罪犯申诉、控告、检举；（七）预防、制止和侦查罪犯在监狱内的犯罪活动；（八）押解罪犯；（九）法律规定的其他职责。故本题答案为C。","v":true,"bad":false},{"b":"月半时政","s":"2026年4月时政·下","n":36,"t":"单选","q":"2026 年4 月30 日，《中华人民共和国监狱法》发布，自2026 年11 月1 日起施行。其中对罪犯减刑的条件作出了明确规定。下列情形中属于“应当减刑”的重大立功表现的有几项？\n①阻止他人重大犯罪活动的\n②在日常生产、生活中舍己救人的\n③在抗御自然灾害或者排除重大事故中，有突出表现的\n④检举监狱内外重大犯罪活动，经查证属实的\n⑤有发明创造或者重大技术革新的","o":["2 项","3 项","4 项","5 项"],"a":"D","e":"有下列重大立功表现之一的，应当减刑：（一）阻止他人重大犯罪活动的；（二）检举监狱内外重大犯罪活动，经查证属实的；（三）有发明创造或者重大技术革新的；（四）在日常生产、生活中舍己救人的；（五）在抗御自然灾害或者排除重大事故中，有突出表现的；（六）对国家和社会有其他重大贡献的。\n①②③④⑤均正确。故本题答案为D。","v":true,"bad":false},{"b":"月半时政","s":"2026年5月时政·上","n":1,"t":"单选","q":"2026 年5 月，第9 期《求是》杂志发表习近平重要文章《在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班上的讲话》。文章指出，制定和实施五年规划，是我们党治国理政一条重要经验，是中国特色社会主义制度一个重要政治优势。具体体现在：\n①有利于实现党的领导\n②有利于集中力量办大事\n③有利于前瞻性把握战 说法错误：景德镇原名昌南镇，其得名并非因为“景德瓷土”。据史料记载，北宋景德元年，因昌南镇出产的青白瓷深受宋真宗皇帝喜爱，真宗遂将自己的年号“景德”赐给该镇作为地名，景德镇由此得名。B 项说法正确：明代洪武二年，明太祖朱元璋在景德镇珠山正式设立“御器厂”，专门负责为皇家烧造御用瓷器。到了清代，该机构改称为“御窑厂”。C 项说法错误：陶器和瓷器的根本区别不在于是否施釉，而在于原料和烧成温度。陶器一般使用易熔黏土，在较低温度（通常在800-1150℃）下烧成，胎体疏松、吸水率高；而瓷器使用高岭土等原料，在1200℃以上的高温下烧成，胎体致密坚硬、基本不吸水，且敲击声音清脆。此外，陶器并非均为无釉素胎，有些陶器也会施低温釉。D项说法错误：景德镇的四大传统名瓷通常指的是青花瓷、玲珑瓷、粉彩瓷、颜色釉瓷。珐琅彩瓷虽然也是景德镇御窑创烧的珍贵品种，但它并不在传统的“四大名瓷”之列。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年7月时政·下","n":15,"t":"单选","q":"2026 年7 月20 日，国务院常务会议召开。会议指出，推动服务业扩能提质和“六张网”规划建设对于稳投资、扩消费、惠民生具有重要意义。下列举措说法正确的有几项？\n①要充分释放服务业发展潜力，分门别类完善支持政策，加快破除各种制约和障碍\n②生产性服务业要加力支持科技创新和价值创造，进一步发挥对虚拟经济的支撑作用\n③生活性服务业要着力扩大优质供给，更好满足人民群众多样化多层次需求\n④要系统推进“六张网”规划建设，统筹好建和用的关系，更加重视管理机制等“硬建设”","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"②说法错误：生产性服务业要加力支持科技创新和价值创造，进一步发挥对实体经济的支撑作用。\n④说法错误：同时统筹好建和用的关系，更加重视管理机制等“软建设”，增强运营服务能力。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年7月时政·下","n":16,"t":"单选","q":"2026 年7 月20 日，国务院常务会议召开。会议指出，推动服务业扩能提质和“六张网”规划建设对于稳投资、扩消费、惠民生具有重要意义。下列属于“六张网”规划建设内容的是：\n①水网、新型电网\n②算力网、新一代通信网\n③油气网、公铁路轨道网\n④物流网、城市地下管网","o":["①②③","①②④","①③④","②③④"],"a":"B","e":"2026 年7 月20 日，国务院常务会议召开，听取对服务业扩能提质和水网、新型电网、算力网、新一代通信网、城市地下管网、物流网等“六张网”规划建设督查情况汇报。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年7月时政·下","n":17,"t":"单选","q":"2026 年7 月23 日，《全民健身计划（2026－2030 年）》印发。全民健身是全体人民增强体魄、健康生活的基础和保障，是加快体育强国建设的重要基石。下列关于2030 年目标，说法正确的是：\n①产品服务供给能力不断增强、质量持续提高\n②人均体育场地面积达到4 平方米左右\n③经常参加体育锻炼人数比例达到50%左右\n④每千人拥有社会体育指导员达到3.3 名左右","o":["①②③④","①②④","①③④","②③④"],"a":"B","e":"③说法错误：经常参加体育锻炼人数比例达到40%左右。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年7月时政·下","n":18,"t":"单选","q":"2026 年7 月23 日，《全民健身计划（2026－2030 年）》印发。全民健身是全体人民增强体魄、健康生活的基础和保障，是加快体育强国建设的重要基石。下列说法正确的是：","o":["要坚持以人民为中心的发展思想，积极构建党委领导、市场主导、部门联动、社会协同、多元参与、法治保障的全民健身工作格局","要推动群众身边的场地设施布局建设与户籍人口总量、结构、流动趋势相衔接，新增资源优先向人口密集、供需矛盾突出的区域倾斜","要实施学生体质强健计划，中小学生每天综合体育活动时间不低于2 小时","要积极探索政府、企业、居民合理分担全民健身公共服务产品成本的机制，推广民建公营、民办公助等模式"],"a":"C","e":"A 项说法错误：要坚持以人民为中心的发展思想，积极构建党委领导、政府主导、部门联动、社会协同、多元参与、法治保障的全民健身工作格局。B 项说法错误：推动群 家庭工资收入规定比例的条件","个体工商户、灵活就业人员应当强制缴存住房公积金","实现住房公积金缴存记录等全国范围内互信互认，推动住房公积金转移接续、异地贷款等业务便捷高效办理","住房公积金管理中心可将住房公积金用于购买国债、政策性金融债、股票，进一步拓宽资金投资渠道"],"a":"C","e":"A 项说法错误：修订后的条例取消提取公积金支付房租时“房租超过家庭工资收入规定比例”的条件。B 项说法错误：个体工商户、灵活就业人员可以自愿缴存住房公积金，并非强制缴存。D 项说法错误：住房公积金管理中心可将住房公积金用于购买国债、政策性金融债，不得用于购买股票。故本题答案为C。","v":true,"bad":false},{"b":"月半时政","s":"2026年8月时政·下","n":9,"t":"单选","q":"2026 年8 月，修订后的《住房公积金管理条例》公布。下列说法正确的有几项？\n①职工和单位住房公积金的缴存比例均不得低于职工上一年度月平均工资的5%，不得高于国家规定的最高缴存比例\n②职工死亡或者被宣告死亡的，职工的继承人、受遗赠人可以提取职工住房公积金账户内的存储余额\n③以欺诈、伪造证明材料或者其他手段违法提取住房公积金的，5 年内不得提取住房公积金或者使用住房公积金贷款\n④以欺诈、伪造证明材料或者其他手段违法获得住房公积金贷款的，3 年内不得提取住房公积金或者使用住房公积金贷款","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"③④说法错误：以欺诈、伪造证明材料或者其他手段违法提取住房公积金的，由住房公积金管理中心责令限期退回违法提取的住房公积金，3 年内不得提取住房公积金或者使用住房公积金贷款。以欺诈、伪造证明材料或者其他手段违法获得住房公积金贷款的，由住房公积金管理中心责令限期返还贷款资金，5 年内不得提取住房公积金或者使用住房公积金贷款。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年8月时政·下","n":10,"t":"单选","q":"2026 年8 月17 日，习近平在纪念江泽民同志诞辰100 周年大会上发表重要讲话指出，我们要学习江泽民同志坚定如磐的政治信仰。关于江泽民同志的重要贡献和主张，下列说法正确的是：\n①强调共产党人的根本政治信仰是社会主义和共产主义\n②提出党始终是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队\n③推动着力解决提高领导水平和执政水平、增强拒腐防变和抵御风险能力两大历史性课题\n④强调共产党人的世界观是马克思主义的辩证唯物主义和历史唯物主义","o":["①②③④","②③④","①③④","①②"],"a":"A","e":"本题答案A。逐项对照原文：\n①强调共产党人的根本政治信仰是社会主义和共产主义；\n②提出党始终是中国工人阶级的先锋队，同时是中国人民和中华民族的先锋队；\n③推动着力解决提高领导水平和执政水平、增强拒腐防变和抵御风险能力两大历史性课题；\n④强调共产党人的世界观是马克思主义的辩证唯物主义和历史唯物主义。四项均为原文表述，主体、时限、数量、定语未被偷换，故全选，选A。","v":true,"bad":false},{"b":"月半时政","s":"2026年8月时政·下","n":11,"t":"单选","q":"2026 年8 月17 日，习近平在纪念江泽民同志诞辰100 周年大会上发表重要讲话指出，我们要学习江泽民同志真挚深厚的为民情怀。关于江泽民同志的重要贡献和主张，下列说法正确的有几项？\n①全心全意为人民服务，立党为公，执政为民，是我们党同一切剥削阶级政党的根本区别\n②发展经济的根本目的是提高全国人民生活水平和质量\n③领导实施西部大开发战略、国家八七扶贫攻坚计划\n④有力推动新时期实现人民生活从温饱不足到全面小康的历史性跨越","o":["1 项","2 项","3 项","4 项"],"a":"C","e":"④说法错误：他领导实施西部大开发战略、国家八七扶贫攻坚计划，出台增加农民收入、关心国有企业下岗职工生活和再就业等政策举措，有力推动了新时期实现人民生活从温饱不足到总体小康、奔向全面小康的历史性跨越。故本题答案为C。","v":true,"bad":false},{"b":"月半时政","s":"2026年8月时政·下","n":12,"t":"单选","q":"2026 年8 月17 日，习近平在纪念江泽民同志诞辰100 周年大会上发表重要讲话指出，我们要学习江泽民同志与时俱进的创新精神。关于江泽民同志的重要贡献和主张，下列说法正确的有几项？\n①创立“三个代表”重要思想，创造性回答了什么是社会主义、怎样建设社会主义的问题\n②确定社会主义初级阶段的基本路线，提出“三步走”的发展战略\n③确立公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制等三大基本经济制度\n④提出坚持“引进来”和“走出去”相结合，领导我们成功加入世界贸易组织","o":["1 项","2 项","3 项","4 项"],"a":"A","e":"①说法错误：“三个代表”重要思想：进一步回答了什么是社会主义、怎样建设社会主义，创造性回答的是建设什么样的党、怎样建设党的问题。\n②说法错误：社会主义初级阶段基本路线、三步走发展战略，是党的十三大（邓小平）确立提出。江泽民同志领导我们确定党在社会主义初级阶段的基本纲领，确立社会主义市场经济体制的改革目标和基本框架。\n③说法错误：江泽民同志确立公有制为主体、多种所有制经济共同发展的基本经济制度和按劳分配为主体、多种分配方式并存的分配制度。进入新时代以来，特别是党的十九届四中全会把公有制为主体、多种所有制经济共同发展，按劳分配为主体、多种分配方式并存，社会主义市场经济体制合并成为“三大基本经济制度”，不属于江泽民时期确立。故本题答案为A。公考资料免费更新加微shgk738","v":true,"bad":false},{"b":"月半时政","s":"2026年8月时政·下","n":13,"t":"单选","q":"2026 年8 月17 日，习近平在纪念江泽民同志诞辰100 周年大会上发表重要讲话指出，我们要学习江泽民同志深谋远虑的战略思维。下列能够体现江泽民同志战略思维的是：","o":["从二十一世纪头20 年是我国必须紧紧抓住并且可以大有作为的重要战略机遇期这一重大判断出发，对全面建设小康社会、实现第二步战略目标进行前瞻性谋划","坚持把改革作为党执政兴国的第一要务，引领我们聚精会神搞建设、一心一意谋改革","领导我们积极发展社会主义民主政治，实施全面依法治国基本方略","领导实现香港、澳门顺利回归，推动两岸双方达成体现一个中国原则的“九二共识”"],"a":"D","e":"A 项说法错误：江泽民同志从二十一世纪头20 年是我国必须紧紧抓住并且可以大有作为的重要战略机遇期这一重大判断出发，对全面建设小康社会、实现第三步战略目标进行前瞻性谋划。B 项说法错误：江泽民同志坚持把发展作为党执政兴国的第一要务，引领全党全国各族人民聚精会神搞建设、一心一意谋发展。C 项说法错误：江泽民同志领导我们积极发展社会主义民主政治，实施依法治国基本方略，发展社会主义先进文化。全面依法治国是习近平总书记在十八届四中全会中提出的。故本题答案为D。","v":true,"bad":false},{"b":"月半时政","s":"2026年8月时政·下","n":14,"t":"单选","q":"2026 年8 月17 日，习近平在纪念江泽民同志诞辰100 周年大会上发表重要讲话指出，“历尽天华成此景，人间万事出艰辛。”这是江泽民同志以豪迈诗句对奋斗的诠释。这句诗体现的哲学道理是：","o":["矛盾的主要方面决定事物的性质","量变必然引起质变，要重视量的积累","重视发挥意识主观能动性是实践的根本途径","事物发展是前进性与曲折性的统一"],"a":"D","e":"“成此景”代表事物发展光明的前途（前进性），“出艰辛”代表过程要历经磨难坎坷（曲折性），体现事物发展是前进性和曲折性的统一。故本题答案为D。","v":true,"bad":false},{"b":"月半时政","s":"2026年8月时政·下","n":15,"t":"单选","q":"2026 年8 月19 日，《全民医疗保障“十五五”规划》发布。关于“十五五”时期全民医疗保障发展的总体要求，下列说法正确的是：\n①坚持以经济效益为中心，以改革创新为动力\n②坚持以推动医保事业高质量发展为主题\n③坚持整体谋划、系统治理，尽力而为、量力而行\n④要全面建成覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次医疗保障体系","o":["①②③④","②③④","①③④","①②"],"a":"B","e":"①说法错误：坚持以人民健康为中心，以推动医保事业高质量发展为主题，以改革创新为动力，坚持整体谋划、系统治理，尽力而为、量力而行，全面建成覆盖全民、统筹城乡、公平统一、安全规范、可持续的多层次医疗保障体系，持续提升人民群众的获得感、幸福感、安全感，谱写助力全体人民共同富裕的中国式现代化医保新篇章。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年8月时政·下","n":16,"t":"单选","q":"2026 年8 月19 日，《全民医疗保障“十五五”规 :"2026年9月时政·下","n":2,"t":"单选","q":"2026 年9 月，第18 期《求是》杂志发表习近平重要文章《在加强基础研究座谈会上的讲话》。文章指出，要壮大基础研究人才队伍，要一体推进教育科技人才发展，全方位做好培养、引进、使用工作，努力使基础研究人才数量充足、素质优良、结构合理。下列相关举措，说法正确的有几项？\n①要优化科教独立育人机制，注重在科研一线发现和培养高水平人才\n②要把引进海外科技人才作为战略基点，源源不断充实基础研究后备力量\n③要大力扶持青年人才，坚持任务牵引、以老带新，为青年科技人员的成长成才铺路搭桥\n④要大力弘扬科学家精神，激发青少年的好奇心、想象力和探求欲，让投身基础研究成为更多青少年的人生追求","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：优化科教协同育人机制，注重在科研一线发现和培养高水平人才。\n②说法错误：着力提高自主培养质量，遵循人才成长规律，全面提高教育质量，源源不断培养基础研究后备力量。因此自主培养始终是人才培养的主要渠道，而非把引进海外人才作为战略基点。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年9月时政·下","n":3,"t":"单选","q":"2026 年9 月，第18 期《求是》杂志发表习近平重要文章《在加强基础研究座谈会上的讲话》。文章指出，要加强对基础研究的支持保障。下列说法正确的是：","o":["要逐步提高基础研究经费占比，进一步拓宽筹资渠道，稳步增加财政投入，引导企业和社会力量加大投入，形成基础研究多元化投入格局","要建立以竞争性支持取代稳定支持的基础研究投入机制","要加紧建设世界一流科技期刊，鼓励国内外成果在海外期刊和平台首发","要深化科技体制改革，健全符合基础研究特点的统一评价体系，完善基础研究激励机制"],"a":"A","e":"B 项说法错误：提高科学基金资助效能，对从事基础研究的科研机构和平台基地提供稳定支持，对优秀研究团队和人才实行竞争择优基础上的接续支持，对重大原创项目采取滚动式支持。故要完善竞争性支持和稳定支持相结合的基础研究投入机制，而非“竞争性支持取代稳定支持”。C 项说法错误：加紧建设世界一流科技期刊，鼓励国内外成果在我国期刊和平台首发。D 项说法错误：深化科技体制改革，健全符合基础研究特点的分类评价体系，完善基础研究激励机制，改革科研管理方式。故本题答案为A。","v":true,"bad":false},{"b":"月半时政","s":"2026年9月时政·下","n":4,"t":"单选","q":"2026 年9 月，第18 期《求是》杂志发表习近平重要文章《在加强基础研究座谈会上的讲话》。文章指出，要拓展基础研究国际合作。下列说法正确的有几项？\n①主动融入全球创新网络，在开放合作中提升引进消化吸收再创新能力\n②深化政府和民间基础研究国际交流合作，发挥共建“一带一路”等平台作用，联合各国开展气候变化、能源环境、生命健康等重大科学问题攻关\n③加大国家科技计划对外开放力度，扩大基础研究人员交流规模\n④牵头发起和加入国际大科学计划、大科学工程，支持在华设立国际科技组织，支持国内高校、科研院所、科技组织积极主导全球科技治理","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：主动融入全球创新网络，在开放合作中提升原始创新能力。\n④说法错误：牵头发起和加入国际大科学计划、大科学工程，支持在华设立国际科技组织，支持国内高校、科研院所、科技组织积极参与全球科技治理。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年9月时政·下","n":5,"t":"单选","q":"2026 年9 月，第18 期《求是》杂志发表习近平重要文章《在加强基础研究座谈会上的讲话》。文章指出，基础研究是打基础、利长远的事业，既不能急功近利，也不可消极无为，要有“前人栽树、后人乘凉”的境界和担当，有“十年磨一剑”的恒心和毅力。这体现的哲学道理是：\n①事物发展是量变与质变的统一，要重视量的积累，持之以恒\n②要用发展的眼光看问题，把握事物发展的长远性、连续性\n③矛盾具有特殊性，要坚持一分为二的观点看问题\n④尊重客观规律是正确发挥主观能动性的前提条件","o":["①②③","①②④","①③④","①②③④"],"a":"B","e":"①符合题意：“十年磨一剑”的恒心和毅力、“不能急功近利”，强调基础研究周期长、见效慢，必须日积月累、久久为功，集中体现了重视量的积累、为实现质变创造条件的量变质变辩证关系原 月半时政","s":"2026年10月时政·上","n":5,"t":"单选","q":"2026 年10 月，第19 期《求是》杂志发表习近平重要文章《加强普惠性、基础性、兜底性民生建设》。就业是最大的民生。下列关于就业的说法正确的是：\n①促进高质量充分就业，是新时代新征程就业工作的新定位、新使命\n②要坚持以人民为中心的发展思想，全面贯彻劳动者自主就业、政府调节就业、市场促进就业和鼓励创业的方针\n③要以推动高质量发展为基础，以强化就业优先政策为引领，以实施就业优先战略为抓手，以深化就业体制机制改革为动力\n④要持续促进就业质的有效提升和量的合理增长，不断增强广大劳动者的获得感幸福感安全感，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑","o":["①③","①④","②③","②④"],"a":"B","e":"②说法错误：要坚持以人民为中心的发展思想，全面贯彻劳动者自主就业、市场调节就业、政府促进就业和鼓励创业的方针。\n③说法错误：以推动高质量发展为基础，以实施就业优先战略为引领，以强化就业优先政策为抓手，以深化就业体制机制改革为动力，持续促进就业质的有效提升和量的合理增长，不断增强广大劳动者的获得感幸福感安全感，为以中国式现代化全面推进强国建设、民族复兴伟业提供有力支撑。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年10月时政·上","n":6,"t":"单选","q":"2026 年10 月，第19 期《求是》杂志发表习近平重要文章《加强普惠性、基础性、兜底性民生建设》。文章指出，保障和改善民生要抓住人民最关心最直接最现实的利益问题，既尽力而为，又量力而行，一件事情接着一件事情办，一年接着一年干。这一要求体现的哲学道理是：","o":["事物的发展是前进性和曲折性的统一，要勇敢面对挫折","要坚持一切从实际出发，重视量的积累，循序渐进推动事物发展","主要矛盾和次要矛盾在一定条件下可以相互转化","意识对物质具有能动的反作用，只要充分发挥主观能动性就能办好一切事情"],"a":"B","e":"B 项符合题意：“量力而行”强调从客观实际出发，尊重客观规律，不能脱离现实条件盲目蛮干，体现一切从实际出发；“尽力而为”则体现充分发挥主观能动性，二者结合正是把尊重客观规律与发挥主观能动性统一起来。“一件事情接着一件事情办，一年接着一年干”强调通过持续不断的量的积累，逐步实现民生的改善，体现量变是质变的必要准备，要重视量的积累、循序渐进。A、C 项不符合题意：表述本身正确，但是与题意无关。D 项说法错误：该表述夸大了主观能动性的作用，忽视了客观条件和客观规律的制约，属于唯心主义倾向。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年10月时政·上","n":7,"t":"单选","q":"2026 年10 月，第19 期《求是》杂志发表习近平重要文章《加强普惠性、基础性、兜底性民生建设》。文章指出，要按照守住底线、突出重点、完善制度、引导舆论的思路做好民生工作。下列说法正确的是：\n①“守住底线”，就是要重点保障中等收入群众基本生活，做好高校大学生生活困难补助\n②“突出重点”，就是要注意稳定和扩大就业，特别是要鼓励创业就业，多渠道创造就业岗位，尤其要做好以高校毕业生为重点的青年就业工作\n③“完善制度”，就是要坚持全覆盖保基本多层次可持续方针，加强城乡社保体系建设\n④“引导舆论”，就是要促进形成良好舆论氛围和社会预期，引导广大群众树立通过勤劳致富改善生活的理念","o":["①②③","①③④","①②④","②③④"],"a":"D","e":"①说法错误：“守住底线”，就是要重点保障低收入群众基本生活，做好高校大学生生活困难补助。故本题答案为D。","v":true,"bad":false},{"b":"月半时政","s":"2026年10月时政·上","n":8,"t":"单选","q":"2026 年10 月，第19 期《求是》杂志发表习近平重要文章《加强普惠性、基础性、兜底性民生建设》。下列相关说法，正确的有几项？\n①为民造福是立党为公、执政为民的本质要求\n②要提升寄宿制学校办学条件和管理水平，逐步撤并乡村小规模学校\n③社会政策要托底，就是要守住民生底线\n④要适应人的全面发展和全体人民共同富裕的进程，不断推动幼有所育、学有所教、劳有所得、病有所医、老有所养、住有所居、弱有所扶取得新进展","o":["1 项","2 项","3 项","4 项"],"a":"C","e":"②说法错误：加强对留守儿童、残疾儿童的关心关爱，提升寄宿制学校办学条件和管理水平，办好必要的乡村小规模学校，建设好特殊教育学校。故本题答案为C。","v":true,"bad":false},{"b":"月半时政","s":"2026年10月时政·上","n":9,"t":"单选","q":"2026 年10 月，第19 期《求是》杂志发表习近平重要文章《加强普惠性、基础性、兜底性民生建设》。文章指出，要按照守住底线、突出重点、完善制度、引导舆论的思路做好民生工作。下列哲学道理对应正确的是：\n①守住底线——要保持适度原则，防范量变向不利方向质变\n②突出重点——解决问题要抓住事物的主要矛盾\n③完善制度——调整上层建筑以适应经济基础的发展\n④引导舆论——重视发挥社会意识的直接现实性","o":["①②③","①③④","②③④","①②③④"],"a":"A","e":"①对应正确：底线就是量变的临界点，守住底线，防止事物向坏的方向质变，体现坚持适度原则，量变与质变辩证关系。\n②对应正确：办事情抓重点、抓关键，对应解决问题抓主要矛盾原理。\n③对应正确：制度属于上层建筑范畴，完善制度是调整上层建筑使之适应经济基础。\n④说法错误：舆论属于社会意识，引导舆论是发挥意识的主观能动性。社会意识没有直接现实性，实践才具有直接现实性。故本题答案为A。","v":true,"bad":false},{"b":"月半时政","s":"2026年10月时政·上","n":10,"t":"单选","q":"2026 年10 月，第19 期《求是》杂志发表习近平重要文章《加强普惠性、基础性、兜底性民生建设》。文章指出，坚持以人民为中心，不断提升教育公共服务的普惠性、可及性、便捷性，让教育改革发展成果更多更公平惠及全体人民。下列说法正确的是：\n①要优化区域教育资源配置，建立同人口变化相协调的基本公共教育服务供给机制\n②要推动义务教育优质均衡发展，加强义务教育学校标准化建设，逐步消除城乡、区域、校际、群体差距\n③要促进学前教育普及普惠和高中阶段学校多样化发展，探索逐步扩大免费教育范围\n④要持续巩固“双减”成果，全面提升课堂教学水平，提高课后服务质量","o":["①②③","①③④","①②④","②③④"],"a":"B","e":"②说法错误：要优化区域教育资源配置，建立同人口变化相协调的基本公共教育服务供给机制，推动义务教育优质均衡发展，加强义务教育学校标准化建设，逐步缩小城乡、区域、校际、群体差距。故本题答案为B。","v":true,"bad":false},{"b":"月半时政","s":"2026年10月时政·上","n":11,"t":"单选","q":"2026 年10 月，第19 期《求是》杂志发表习近平重要文章《加强普惠性、基础性、兜底性民生建设》。文章指出，经济发展和社会保障是水涨船高的关系，水浅行小舟，水深走大船。下列说法正确的有几项？\n①政府不能什么都包，重点是加强基础性、普惠性、兜底性民生保障建设\n②要增强风险意识，分析社会保障可能面临的新情况新问题，提高工作预见性和主动性，未雨绸缪采取应对措施\n③要拓展国际视野，关注国外社会保障发展情况，汲取经验教训\n④要统筹需要和可能，把保障和改善民生建立在经济发展和财力可持续的基础之上，坚决防止落入“福利主义”养懒汉的陷阱","o":["1 项","2 项","3 项","4 项"],"a":"D","e":"本题答案D。逐项对照原文：\n①政府不能什么都包，重点是加强基础性、普惠性、兜底性民生保障建设；\n②要增强风险意识，分析社会保障可能面临的新情况新问题，提高工作预见性和主动性，未雨；\n③要拓展国际视野，关注国外社会保障发展情况，汲取经验教训；\n④要统筹需要和可能，把保障和改善民生建立在经济发展和财力可持续的基础之上，坚决防止。四项均为原文表述，主体、时限、数量、定语未被偷换，故全选，选D。","v":true,"bad":false},{"b":"月半时政","s":"2026年10月时政·上","n":12,"t":"单选","q":"2026 年10 月12 日至13 日，全国卫生与健康大会在北京召开。习近平出席会议并发表重要讲话。下列相关说法，正确的有几项？\n①“十五五”时期是实现到本世纪中叶建成健康中国目标的关键时期，要推动卫生与健康事业高质量发展，确保健康中国建设取得决定性进展\n②人民健康是民族昌盛和国家强盛的重要标志\n③我国建成世界上规模最大的医疗服务体系、传统医药体系、疾病防控体系、医疗保障体系\n④我们要建成的健康中国，是均衡普惠、优质高效的健康中国，应当具有强大的健康管理能力、疾病防控能力、医疗服务能力、医保支撑能力、医药创新能力、人才培养能力","o":["1 项","2 项","3 项","4 项"],"a":"C 是：","o":["青藏高原是世界上海拔最高的高原，处于中国第三阶梯","黄河、长江、澜沧江均发源于西藏自治区","西藏自治区太阳能、水能资源理论蕴藏量居中国首位","艾丁湖是世界上海拔最高的大湖，与玛旁雍措、羊卓雍措并称西藏三大圣湖"],"a":"C","e":"A 项说法错误：青藏高原是世界上海拔最高的高原，被称为“世界屋脊”，位于中国地势第一级阶梯。第三级阶梯主要包括东北平原、华北平原、长江中下游平原等低海拔区域。B 项说法错误：黄河、长江、澜沧江的发源地是青海省南部的三江源地区，并非西藏自治区。D 项说法错误：西藏三大圣湖是纳木错、玛旁雍措、羊卓雍措；艾丁湖位于新疆吐鲁番盆地，是中国陆地海拔最低点。故本题答案为C。","v":true,"bad":false},{"b":"专题","s":"2026年新年贺词专题20题","n":9,"t":"单选","q":"2025 年12 月31 日，习近平发表2026 年新年贺词。习近平指出，2025 年我到西藏、新疆出席庆祝活动，从雪域高原到天山南北，各族群众心手相连，像石榴籽一样紧紧抱在一起。下列关于新疆的说法正确的是：","o":["汉朝时期，张骞出使西域、班超投笔从戎都对西域产生重要影响","元朝时期，设立西域都护府，新疆地区正式纳入中国版图","明朝时期，改称西域为新疆，后期正式在新疆设省","晚清时期消灭阿古柏势力、收复新疆的将领是李鸿章"],"a":"A","e":"B 项说法错误：西域都护府是西汉时期设立的，这一举措标志着新疆地区正式纳入中国版图；元朝对西域的管辖机构主要为行省、宣慰司等，并未设立西域都护府。C 项说法错误：清朝乾隆时期，将重新统一的西域地区命名为“新疆”，取“故土新归”之意；1884 年，清政府正式在新疆设省，加强对该地区的管辖。D 项说法错误：晚清时期，左宗棠奉命率清军西征，成功消灭阿古柏势力、收复新疆，捍卫了中国领土完整；李鸿章是晚清洋务派代表人物，其主要活动集中在海防建设、洋务运动等领域。故本题答案为A。","v":true,"bad":false},{"b":"专题","s":"2026年新年贺词专题20题","n":10,"t":"单选","q":"2025 年12 月31 日，习近平发表2026 年新年贺词。习近平指出，2025 年我到西藏、新疆出席庆祝活动，从雪域高原到天山南北，各族群众心手相连，像石榴籽一样紧紧抱在一起。下列关于新疆的说法正确的是：","o":["新疆地貌可以概括为“三山夹两盆”，昆仑山将其分为南北疆两个部分","中国四大盆地中塔里木盆地、准噶尔盆地、吐鲁番盆地均在新疆","额尔齐斯河是中国最长的内陆河，被称为南疆的母亲河","对塔克拉玛干沙漠的锁边固沙工程是“三北工程”三大攻坚战之一"],"a":"D","e":"A 项说法错误：新疆地貌的“三山夹两盆”是指天山、昆仑山、阿尔泰山三座山脉，夹着塔里木盆地、准噶尔盆地两大盆地。划分南北疆的地理界线是天山；昆仑山位于新疆南部，是新疆与西藏的界山之一。B 项说法错误：中国四大盆地分别是塔里木盆地、准噶尔盆地、柴达木盆地、四川盆地。其中塔里木盆地、准噶尔盆地位于新疆；吐鲁番盆地是新疆境内的小型盆地，并不属于中国四大盆地。C 项说法错误：中国最长的内陆河是塔里木河，是南疆的“母亲河”；额尔齐斯河是外流河，最终注入北冰洋。故本题答案为D。","v":true,"bad":false},{"b":"专题","s":"2026年新年贺词专题20题","n":11,"t":"单选","q":"2025 年12 月31 日，习近平发表2026 年新年贺词。习近平指出，我出席了全运会开幕式，粤港澳三地同心同行，令人欣慰。下列关于此次全运会，说法正确的是：\n①首次由粤港澳三地联合举办，是“一国两制”在体育领域的创新实践\n②主题口号为“激情全运会，活力长三角”，吉祥物以中华白海豚为原型\n③会徽以“繁荣、包容”为立意，由木棉、牡丹、莲花三朵花瓣交迭旋转形成图案\n④开幕式在广东省广州市举办，闭幕式在广东省深圳市举办","o":["①②","②④","②③","①④"],"a":"D","e":"②说法错误：主题口号为“激情全运会，活力大湾区”。\n③说法错误：会徽以“繁荣、包容”为立意，由木棉、紫荆、莲花三朵花瓣交迭旋转形成图案。故本题答案为D。","v":true,"bad":false},{"b":"专题","s":"2026年新年贺词专题20题","n":12,"t":"单选","q":"2025 年12 月31 日，习近平发表2026 年新年贺词。习近平指出，我们继续敞开胸怀拥抱世界。上合组织天津峰会、全球妇女峰会成功举办，海南自贸港全岛封关运作。下列相关说法正确的有几项？\ 举行，习近平发表重要讲话。红军长征纵横十余省，长驱二万五千里，跨越近百条江河，翻越皑皑雪山，穿过茫茫草地，进行600 余次战役战斗，粉碎上百万敌军围追堵截。下列关于长征，说法正确的是：","o":["激战腊子口是遵义战役关键一战，是长征以来第一个大胜仗","夹金山是中央红军长征翻越的第一座大雪山","娄山关战斗战胜了长征途中最后一道天险，打通进入甘肃的通道","中央红军长征翻越的最后一座高山是五台山"],"a":"B","e":"A 项说法错误：激战腊子口是打开北上通道的关键一战，但“长征以来第一个大胜仗”通常指遵义战役相关战斗，且腊子口并非遵义战役组成部分。B 项说法正确：夹金山是中央红军长征翻越的第一座大雪山。C 项说法错误：长征途中最后一道天险是腊子口，而非娄山关。D 项说法错误：中央红军长征翻越的最后一座高山是六盘山，而非五台山。故本题答案为B。","v":true,"bad":false},{"b":"专题","s":"长征专题（长征胜利90周年）","n":15,"t":"单选","q":"2026 年10 月22 日，纪念长征胜利90 周年大会隆重举行。习近平指出，要大力弘扬伟大长征精神，接续奋斗、砥砺前行，把革命前辈开创的伟大事业不断推向前进，在新的长征路上奋力创造新的辉煌！下列关于长征，说法正确的是：\n①红军大部队长征的具体集结出发地是江西于都\n②长征途中新组建的方面军是红二方面军，总指挥是陈毅\n③刘伯承与小叶丹彝海结盟是党的民族平等、民族团结政策在长征中的伟大实践\n④长征途中，我们党高举全民族团结抗战的大旗，推动了抗日民族统一战线的形成","o":["①②③","①②④","①③④","②③④"],"a":"C","e":"②说法错误：长征途中新组建的方面军是红二方面军，但总指挥是贺龙，不是陈毅。故本题答案为C。","v":true,"bad":false},{"b":"专题","s":"长征专题（长征胜利90周年）","n":16,"t":"单选","q":"2026 年10 月22 日，纪念长征胜利90 周年大会隆重举行。习近平指出，要大力弘扬伟大长征精神，把革命前辈开创的伟大事业不断推向前进，在新的长征路上奋力创造新的辉煌！下列关于长征中著名会议，说法不正确的是：","o":["黎平会议决定放弃北上湘西，确定向黔北进军","遵义会议中我党第一次独立自主解决党内问题","批判张国焘分裂，决定北上的会议是俄界会议","瓦窑堡会议正式决议把长征落脚点确定在陕北"],"a":"D","e":"A 项说法正确：黎平会议决定放弃北上湘西与红二、六军团会合的原定计划，确定向黔北进军。B 项说法正确：遵义会议是党第一次独立自主地运用马克思主义基本原理解决自己的路线、方针、政策问题。C 项说法正确：俄界会议批判了张国焘分裂党、分裂红军的错误，坚持北上方针。D 项说法错误：正式决定把长征落脚点放在陕北的是榜罗镇会议；瓦窑堡会议的议题是建立抗日民族统一战线。故本题答案为D。","v":true,"bad":false},{"b":"专题","s":"长征专题（长征胜利90周年）","n":17,"t":"单选","q":"2026 年10 月22 日，纪念长征胜利90 周年大会隆重举行。习近平指出，要大力弘扬伟大长征精神，把革命前辈开创的伟大事业不断推向前进，在新的长征路上奋力创造新的辉煌！下列关于长征中著名会师，说法不正确的是：","o":["红一方面军和红四方面军初次于四川懋功会师","红一方面军和陕北红军会师地点是陕北吴起镇","红一方面军和红二方面军会师地点是四川甘孜","红一方面军和红四方面军会师地点是甘肃会宁"],"a":"C","e":"A 项说法正确：1935 年6 月，红一方面军（中央红军）翻越夹金山后，在四川懋功（今小金）地区与红四方面军会师，这是两军的初次会师。B 项说法正确：1935 年10 月，中央红军到达陕北吴起镇，与陕北红军（红十五军团）会师，中央红军长征胜利结束。C 项说法错误：红一方面军与红二方面军的会师地点是甘肃会宁、静宁将台堡地区（1936 年10 月）​，不是四川甘孜。四川甘孜（甘孜寺一带）是1936 年6 月红二、红六军团与红四方面军会合的地点，与“红一方面军和红二方面军会师”不是同一事件。D项说法正确：1936 年10 月，红一方面军与红四方面军在甘肃会宁会师。故本题答案为C。","v":true,"bad":false},{"b":"专题","s":"长征专题（长征胜利90周年）","n":18,"t":"单选","q":"2026 年10 月22 日，纪念长征胜利90 周年大会隆重举行。习近平指出，要大力弘扬伟大长征精神，把革命前辈开创的伟大事业不断推向前进，在新的长征路上奋力创造新的辉煌！下列关于红军长征的著名事件排序，说法正确的是：","o":["四渡赤水——湘江战役——巧渡金沙江——飞夺泸定桥","黎平会议——遵义会议——两河口会议——榜罗镇会议","懋功会师——会宁会师——吴起镇会师——将台堡会师","攻占娄山关——翻越夹金山——踏过六盘山——激战腊子口"],"a":"B","e":"A 项说法错误：湘江战役发生在四渡赤水之前，正确顺序应为湘江战役——四渡赤水——巧渡金沙江——飞夺泸定桥。B 项说法正确：黎平会议——遵义会议——两河口会议——榜罗镇会议，时间顺序正确。C 项说法错误：会宁会师是长征胜利结束标志，应在吴起镇会师之后，正确顺序为懋功会师——吴起镇会师——会宁会师/将台堡会师。D 项说法错误：正确顺序应为攻占娄山关——翻越夹金山——激战腊子口——踏过六盘山。故本题答案为B。","v":true,"bad":false},{"b":"专题","s":"长征专题（长征胜利90周年）","n":19,"t":"单选","q":"2026 年10 月22 日，纪念长征胜利90 周年大会隆重举行。毛泽东在长征途中写下了诸多著名诗词，下列诗词的排序，正确的是：\n①雄关漫道真如铁，而今迈步从头越\n②金沙水拍云崖暖，大渡桥横铁索寒\n③更喜岷山千里雪，三军过后尽开颜\n④不到长城非好汉，屈指行程二万","o":["③④①②","①②④③","③①②④","①②③④"],"a":"D","e":"①“雄关漫道真如铁，而今迈步从头越”出自《忆秦娥·娄山关》（1935 年2 月）。\n②“金沙水拍云崖暖，大渡桥横铁索寒”与\n③“更喜岷山千里雪，三军过后尽开颜”均出自《七律·长征》（1935 年10 月，且诗中事件按金沙江→大渡河→岷山的行进顺序）。\n④“不到长城非好汉，屈指行程二万”出自《清平乐·六盘山》（1935 年10 月，翻越六盘山时所作）。正确排序为\n①②③④，故本题答案为D。","v":true,"bad":false},{"b":"专题","s":"长征专题（长征胜利90周年）","n":20,"t":"单选","q":"2026 年10 月22 日，纪念长征胜利90 周年大会隆重举行。某省份各个高校组织“重走长征路”活动，下列长征路线一定不可能发生的是：","o":["江西→湖南→贵州→云南→四川→甘肃","湖南→贵州→云南→西康→四川→甘肃","四川→西康→甘肃→陕西→河南→山东","湖南→贵州→云南→四川→甘肃→陕西"],"a":"C","e":"A 项可能：这是红一方面军（中央红军）主力的基本走向——1934年10 月从江西瑞金等地出发，经湖南、贵州、云南，1935 年5 月巧渡金沙江入四川，再北上过草地，1935 年10 月到甘肃。路线成立。B 项可能：红二、红六军团（后组成红二方面军）1935 年11 月从湖南桑植出发，经贵州、云南，1936 年5 月入西康（今四川甘孜一带），与红四方面军会合后北上，经四川、甘肃。路线成立。C 项不可能：红军长征的终点在陕甘，不存在“经甘肃、陕西之后再折向河南、山东”的走向。红军到达陕北后即落脚陕甘宁边区，抗战爆发后改编为八路军东渡黄河开赴山西抗日前线，而不是以长征名义继续向河南、山东进军。且四川—西康—甘肃—陕西的顺序也把西康置于四川之后重复绕行，与实际行军路线不符。故C 项“一定不可能发生”。D 项可能：红二方面军与红四方面军会合后北上的路线即湖南—贵州—云南—四川—甘肃，1936 年10 月在甘肃会宁、静宁将台堡与红一方面军会师，随后部分部队进入陕西。路线成立。故本题答案为C。","v":true,"bad":false},{"b":"专题","s":"2026年两会及政府工作报告专题","n":1,"t":"单选","q":"2026 年3 月5 日，习近平在参加人大审议时强调，发展新质生产力对于推动高质量发展、增强经济竞争力至关重要，要一体推进教育科技人才发展。下列相关举措，恰当的有几项？\n①在加强引进消化吸收再创新、关键核心技术攻关、抢占科技制高点上实现新突破\n②在促进创新链产业链资金链人才链深度融合、推动科技成果高效转化应用上探索新途径\n③在有序替代传统产业、培育壮大新兴产业、超前布局未来产业上开创新局面\n④在进一步深化改革、破除制约新质生产力发展的体制机制障碍上取得新成果","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：力争在加强原始创新和关键核心技术攻关、抢占科技制高点上实现新突破。\n③说法错误：在优化提升传统产业、培育壮大新兴产业、超前布局未来产业上开创新局面。故本题答案为B。","v":true,"bad":false},{"b":"专题","
