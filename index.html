":"单选","q":"习近平总书记强调，建设文化强国事关中国式现代化建设全局、事关中华民族复兴大业、事关提升国际竞争力。下列相关说法，正确的有几项？\n①中国特色社会主义文化发展道路，是推动社会主义文化繁荣兴盛的唯一正确道路\n②意识形态关乎旗帜、关乎道路、关乎国家政治安全，决定文化前进的方向和发展道路\n③坚持把马克思主义基本原理同中华优秀传统文化相结合，推动中华优秀传统文化创造性转化、创新性发展\n④坚持马克思主义在意识形态领域的指导地位","o":["1项","2项","3项","4项"],"a":"D","e":"①②③④均正确。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":42,"t":"单选","q":"“一国两制”是指在统一的国家之内，国家主体实行社会主义制度，个别地区依法实行资本主义制度。下列相关表述，错误的是：度，个别地区依法实行资本主义制度。下列相关表述，错误的是：","o":["“一国两制”伟大构想，最早是针对台湾问题提出来的","在任何情况下，香港、澳门都可以保持原有的资本主义制度长期不变","维护国家主权、安全、发展利益是“一国两制”方针的最高原则","“一国两制”是香港、澳门回归后保持长期繁荣稳定的最佳制度安排"],"a":"B","e":"B项错误：维护国家主权、安全、发展利益是“一国两制”方针的最高原则，在这个前提下，香港、澳门保持原有的资本主义制度长期不变，享有高度自治权。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":43,"t":"单选","q":"习近平强军思想是新时代国防和军队建设的根本遵循和行动指南。下列相关说法正确的有几项？\n①党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队\n②必须坚持政治建军、改革强军、科技强军、人才强军、依法治军\n③科技强军关乎国防和军队现代化建设方向和底色\n④如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求","o":["1项","2项","3项","4项"],"a":"C","e":"③错误：政治建军是人民军队立军之本，关乎国防和军队现代化建设方向和底色。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":44,"t":"单选","q":"关于习近平新时代中国特色社会主义思想，下列表述正确的是：","o":["中国特色社会主义的总任务是坚持和发展中国特色社会主义","中国特色社会主义事业的战略布局是全面建设社会主义现代化国家、全面深化改革、全面依法治国、全面从严治党","中国特色社会主义制度的最大优势是坚持人民当家作主","实现社会主义现代化和中华民族伟大复兴是习近平新时代中国特色社会主义思想的核心要义"],"a":"B","e":"A项错误：坚持和发展中国特色社会主义的总任务是实现社会主义现代化和中华民族伟大复兴。C项错误：中国特色社会主义制度的一次相遇最大优势是中国共产党领导。D项错误：坚持和发展中国特色社会主义是习近平新时代中国特色社会主义思想的核心要义。故本题答案为B。","v":true},{"b":"冲刺五百","s":"新思想马原要点","n":45,"t":"单选","q":"如今，民营资本进人的领域越来越多，中国的经济活力越来越强，中国的个体户总数已经达到了4750万户，全国60%的GDP、70%的税收和80%的就业岗位都来自民营企业。这表明：\n①非公有制经济是社会主义经济的重要组成部分\n②非公有制经济是我国经济社会发展的重要基础\n③非公有制经济的发展有利于支撑经济增长、扩大就业\n④非公有制经济已经成为我国国民经济的主体","o":["①②","②③","③④","②④"],"a":"B","e":"②③符合题意：题干陈述民营经济带来了经济发展活力，同时促进了经济增长，有利于增加税收，扩大就业。\n①错误：非公有制经济是社会主义市场经济的重要组成部分。\n④错误：公有制经济是我国国民经济的主体。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":46,"t":"单选","q":"建设教育强国是全面建成社会主义现代化强国的战略先导，是实现高水平科技自立自强的重要支撑。下列相关说法正确的是：\n①教育是民族振兴、社会进步的基石\n②建设教育强国是国家强盛和民族复兴的战略基石\n③教育的根本问题是立德树人\n④坚持党对教育工作的全面领导是办好教育的根本保证","o":["①②","③④","②③","①④"],"a":"D","e":"②错误：实现高水平科技自立自强是国家强盛和民族复兴的战略基石。\n③错误：培养什么人、怎样培养人、为谁培养人的问题，这是教育的根本问题。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":47,"t":"单选","q":"关于全面依法治国，下列说法正确的有几项？\n①法治社会建设是全面依法治国的重点任务和主体工程\n②严格执法是维护社会公平正义的最后一道防线\n③坚持宪法确定的中国共产党领导地位不动摇，坚持宪法确定的人民民主专政的国体和人民代表大会制度的政体不动摇\n④全面推进科学立法、严格执法、公正司法、全民守法","o":["1项","2项","3项","4项"],"a":"B","e":"①错误：法治政府建设是全面依法治国的重点任务和主体工程。\n②错误：公正司法是维护社会公平正义的最后一道防线。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":48,"t":"单选","q":"巩固国防和强大人民军队是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的战略支撑。下列相关说法错误的是：","o":["坚持党对人民军队的绝对领导，是马克思主义建党建军的一条基本原则","改革是核心战斗力，是军事发展中最活跃、最具革命性的因素","到2035年基本实现国防和军队现代化","能打胜仗是核心，反映军队的根本职能和军队建设的根本指向"],"a":"B","e":"B项错误：科技是核心战斗力，是军事发展中最活跃、最具革命性的因素。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":49,"t":"单选","q":"把党的建设作为一项伟大工程来推进，是我们党的一大创举，是我们党领导人民进行伟大社会革命的重要法宝。下列相关说法错误的是：","o":["思想建设是党的基础性建设","党的作风就是党的形象，关系人心向背，关系党的生死存亡","营造良好政治生态，是党内政治生活的首要任务","要坚决维护习近平同志党中央的核心、全党的核心地位，坚决维护党中央权威和集中统一领导"],"a":"C","e":"C项错误：加强思想教育和理论武装，是党内政治生活的首要任务，是保证全党步调一致的前提。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":50,"t":"单选","q":"中国致力于推动共建地球生命共同体，积极参与全球环境治理，是全球生态文明建设的重要参与者、贡献者、引领者。关于碳达、碳中和工作，下列说法不正确的是：","o":["我国的目标是2030年前实现碳达峰、2060年前实现碳中和","实现碳达峰、碳中和是一场广泛而深刻的经济社会系统性变革","要以经济社会发展全面绿色转型为关键","要坚定不移走生态优先、绿色低碳的高质量发展道路"],"a":"C","e":"C项错误：实现碳达峰、碳中和，要以经济社会发展全面绿色转型为引领，以能源绿色低碳发展为关键，加快形成节约资源和保护环境的产业结构、生产方式、生活方式、空间格局，坚定不移走生态优先、绿色低碳的高质量发展道路。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":51,"t":"单选","q":"我们党始终坚持“一切为了群众、一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动”的群众路线。它形成的理论依据是：\n①人民群众是社会实践的主体，是历史的主体\n②人民群众是社会变革的领导力量\n③人民群众是精神财富的创造者\n④人民群众是物质财富的创造者","o":["①②③④","②③④","①③④","①②③"],"a":"C","e":"①③④正确，\n②错误：群众路线的理论依据是，人民群众是社会历史的主体，是历史的创造者。在社会历史发展过程中，人民群众起着决定性的作用。人民群众是社会物质财富的创造者。人民群众是社会精神财富的创造者。人民群众是社会变革的决定力量，而非“领导力量”。故本题答案为C士．出工（班，中士·“【】会存在范畴，“发呆过去被公众轻视”“发呆行为现在成为了一种放慢生活节奏、舒展身心的方式”属于社会意识范畴。A项符合题意：“发呆从过去被公众轻视”到现在“被认为是一种放慢生活节奏、舒展身心的方式”，这种社会意识的变化，正是因为当前社会存在（“当前上班族生活、工作压力大·….”）发生了变化，即社会存在的变化决定社会意识的变化。B项错误：先进的或正确的社会意识对社会存在的发展起积极的推动作用，落后的或错误的社会意识对社会存在的发展起消极的阻碍作用。C项不符合题意：题干没有涉及积极情绪的作用，并且该项也不属于哲理范畴。D项错误：客观实在性是物质的唯一特性，价值判断和价值选择属于认识层面。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":52,"t":"单选","q":"当前上班族生活、工作压力大，亚健康、失眠、易怒、暴饮暴食、注意力下降等问题非常普遍。因此，国家卫健委等有关部门建议市民每天发呆五分钟。过去被公众轻视的发呆行为现在成为了一种放慢生活节奏、舒展身心的方式。这体现的哲理是：","o":["社会存在的变化决定社会意识的变化","社会意识对社会存在具有促进作用","积极的情绪是一种重要的社会力量","价值判断与价值选择具有客观实在性"],"a":"A","e":"出工（班，中士·“【】会存在范畴，“发呆过去被公众轻视”“发呆行为现在成为了一种放慢生活节奏、舒展身心的方式”属于社会意识范畴。A项符合题意：“发呆从过去被公众轻视”到现在“被认为是一种放慢生活节奏、舒展身心的方式”，这种社会意识的变化，正是因为当前社会存在（“当前上班族生活、工作压力大·….”）发生了变化，即社会存在的变化决定社会意识的变化。B项错误：先进的或正确的社会意识对社会存在的发展起积极的推动作用，落后的或错误的社会意识对社会存在的发展起消极的阻碍作用。C项不符合题意：题干没有涉及积极情绪的作用，并且该项也不属于哲理范畴。D项错误：客观实在性是物质的唯一特性，价值判断和价值选择属于认识层面。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":53,"t":"单选","q":"美食纪录片《风味人间》展示了中华美食的多个侧面，让我们重新领略历史、现实、人情世故中的美食情怀，从中看到了属于我们每个人的味道、记忆、情感和家园，也是我们无论身在何处都深深依恋的故土之根，每个人舌尖上的故乡构成了整个中国。该材料所蕴含的哲学道理是：公考资料免费更新加微信shgk738","o":["矛盾的同一性和斗争性相互依存","矛盾的普遍性通过特殊性表现出来","矛盾的特殊性寓于普遍性之中","矛盾的同一性和斗争性相互对立"],"a":"B","e":"B项符合题意：矛盾的普遍性即矛盾的共性，矛盾的特殊性即矛盾的个性。矛盾的普遍性和特殊性是相互联结的，矛盾的普遍性寓于特殊性之中，并通过特殊性表现出来。“每个人舌尖上的故乡构成了整个中国”体现了共性（中国）和个性（每个人舌尖上的故乡）的关系，说明矛盾的普遍性通过特殊性表现出来，普遍性离不开特殊性。A、D项说法正确，但是与题意无关。C项错误：矛盾的普遍性寓于特殊性之中。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":54,"t":"单选","q":"近年来，我国深空探测、载人航天工程持续推进，从娥探月、天问探火到空间站常态化运营，一系列航天实践的深人开展，让人类对宇宙空间的认知不断突破，修正了诸多传统天文认知，也为后续深空探测规划、航天技术迭代升级提供了科学引。这一航天事业发展历程蕴含的哲学道理是：\n①实践是认识发展的动力，推动认识不断深化\n②正确的认识能够对实践发展起到促进作用\n③认识的发展是一个由认识到实践、再由实践到认识的循环往复的过程\n④认识具有反复性和无限性，真理在发展中不断被推翻","o":["①②","①③","②④","③④"],"a":"A","e":"①②符合题意：我国持续开展航天探测实践，推动人类对宇宙空间的认知不断突破、更新原有认知，体现实践是认识发展的动力，实践的需要和开展推动认识不断深化发展；全新的航天科学认知，为后续深空探测规划、技术迭代提供科学指引引，体现正确的认识对实践具有积极促进作用。\n③错误：认识的发展是一个由实践到认识、再由认识到实践的波浪式前进和螺旋式上升的过程。\n④错误：认识具有反复性和无限性的表述正确，但真理具有客观性，真理在发展中不断超越自身，呈波浪式前进、螺旋式上升，并非“被推翻”。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":55,"t":"单选","q":"在开展扶贫工作时，不仅要关心困难群众的生活，既重视物质上的帮扶，更重视思想上的帮扶，可以说，打赢扶贫攻坚战，思想扶贫是关键。从哲学意义上来说，这是因为：","o":["新事物的发展要经历从量变到质变的积累","只有认识了客观规律，按客观规律办事，才能更好地改变世界","前途是光明的，道路是曲折的，事物的发展是前进性和曲折性的统一","内因是事物变化发展的根据，外因是事物变化发展的条件，外因通过内因起作用"],"a":"D","e":"题干“思想扶贫是关键”强调贫困群众的主观思想是关键，属于内因。题干“物质上的帮扶”强调通过外在帮扶来扶贫，属于外因。体现了内因是事物变化发展的根据，外因是事物变化发展的条件，外因通过内因起作用。A、B、C项表述正确，但是与题意无关。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":56,"t":"单选","q":"加快推进信息基础设施建设，一方面可以拉动投资，促进稳增长，另一方面也为发展“互联网+”、推进大众创业、万众创新提供了有力的支撑。这体现的哲学道理是：\n①联系具有普遍性，要善于把握事物之间的相互联系\n②要发挥意识的能动作用，突破条件创造新的联系\n③要重视局部，关键部分的功能及其变化甚至对整体的功能起决定作用\n④要处理好整体和部分的关系，善于用综合的思维方式考虑问题","o":["①②③","①③④","②③④","①②③④"],"a":"B","e":"①符合题意：信息基础设施建设能够拉动投资稳增长,又支撑互联网+与创新创业，体现联系具有普遍性，要善于把握事物之间的相互联系。\n②错误：联系是客观的，人们可以根据事物固有联系，改变条件，建立新的具体联系。“突破条件”属于夸大意识能动性的唯心主义倾向。\n③符合题意：信息基础设施属于经济社会发展中的关键部分，它的建设完善对稳增长、创新创业起到重要作用，体现要重视局部，关键部分的功能及其变化甚至对整体的功能起决定作用。\n④符合题意：推进信息基础设施建设兼顾稳增长、大众创业万众创新次相遇多重目标，体现要处理好整体和部分的关系，善于用综合的思维方式考虑问题。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":57,"t":"单选","q":"国庆黄金周期间，高速车流量明显“涨潮”，占用应急车道的乱象也随之增多。连日来，群众对占用应急车道行为的自发举报越来越多，网友对此事的评价也不尽相同。大多数网友认为，随手拍的举动干得漂亮，被拍的人理应挨罚。也有人说，这些拍摄者完全是打小报告、多管闲事。这表明：","o":["价值判断作为主观认识，没有客观标准","精神力量可以在一定条件下转化为物质力量","人们对同一事物的认识具有主体差异性","事物之间的联系是客观的，不以人的意志为转移"],"a":"C","e":"A项错误：价值判断是人们对事物能否满足主体需要以及满足程度所作出的判断。价值判断要遵循社会发展的客观规律，人们选择的目标能否实现，实现的程度如何，取决于人们的认识是否符合社会发展的客观规律。C项符合题意：题干中“...…·网友对此事的评价也不尽相同”、“.·大多数网友认为”、“...也有人说”强调网友们对“占用应急车道的群众自发举报”这一事件有不同的看法。这主要是因为网友们将其自身因素带人这件事中。这体现了认识的主体性。B、D项说法正确，但与题意无关。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":58,"t":"单选","q":"全球气候变暖的危害日益凸显，各国都在寻求应对政策。我国科学家研究了气候变暖条件下热量资源变化对粮食生产的影响。1981年以来，我国一年两熟、一年三熟粮食作物种植界限明显北移，在其他条件不变的情况下，前者粮食产量平均可增加上岸电！S4%一106%，后者可增加27%一58%。该研究为我国合理调整农作物区域布局提供了科学依据。这从一个侧面表明科学认识：\n①具有自觉选择性，能够透过现象认识本质并指导实践活动\n②具有能动创造性，能够推测未来，创造理想世界\n③能够揭示事物变化规律，指导实践活动，推动社会发展\n④具有独立性，能够脱离实践活动而存在","o":["①②","①③","②④","③④"],"a":"B","e":"①符合题意：题干“我国科学家研究了气候变暖条件下热量资源变化对粮食生产的影响”揭示了事物的变化规律，揭示了事物内在的本质联系。\n②错误：认识具有能动创造性，但是“创造理想世界”说法错误。\n③符合题意：题干“该研究为我国合理调整农作物区域布局提供了科学依据”体现了认识指导实践，推动社会发展。\n④错误：实践决定认识，认识不能脱离实践。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":59,"t":"单选","q":"感性认识和理性认识是认识过程的两个不同阶段。二者的根本区别在于：","o":["感性认识来源于社会实践，理性认识则来源于抽象思维","感性认识来源于日常活动，理性认识则来源于科学实践","感性认识反映事物的现象，理性认识则反映事物的本质","感性认识包含错误，理性认识则完全正确"],"a":"C","e":"A项错误：无论是感性认识还是理性认识，来源都是社会实践，抽象思维只是加工认识的手段，并非认识的来源。B项错误：感性认识与理性认识都来源于实践，不能割裂为分别来源于日常活动和科学实践。C项符合题意：感性认识属于认识的初级阶段，反映事物的外部现象；理性认识属于认识的高级阶段，反映事物的本质与规律，这是二者的根本区别。D项错误：感性认识可能存在错误，理性认识也不一定完全正确，二者都有正确与错误之分。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":60,"t":"单选","q":"销量已被列人吉尼斯世界纪录的可口可乐，从最初被偶然发明出来到亚特兰大药房售卖、商标和可乐瓶的不断改良、市场的不断扩大甚至“太空罐”的出现，总是在实践中不断创新和发展，这也是它取得成功的重要因素。这表明：","o":["辩证的否定是事物联系的环节和发展的环节","量变必然会引起事物的质变，要重视量的积累","创新是事物发展的源泉和根本动力","新事物战胜旧事物取决于人的主观能动性—T"],"a":"A","e":"A项符合题意：可口可乐产品、商标、包装不断改良，保留原有优势又增添新的形式，在实践中创新发展，体现辩证的否定是事物联系的环节和发展的环节。B项错误：量变达到一定程度才会引起质变，并非量变必然会引起事物的质变。C项错误：矛盾是事物发展的源泉和根本动力。D项错误：新事物战胜旧事物要尊重客观规律，并不取决于人的主观能动性。故本题答案为Ao。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":62,"t":"单选","q":"现代医学的药理研究表明，艾叶是一种广谱抗菌抗病毒的药物，它对各种病毒和细菌都有抑制和杀伤作用。艾叶还是一种应用广泛的食材，最典型的莫过于盛行在两广及湘、黔部分地区的民间美食一艾叶粑粑。艾叶既可以是药物，也可以是美食，这说明：","o":["人们可以根据需要改变艾叶的特性从而使其具有不同的功能","人们可以通过主观意愿改变女叶的状态使其得到合理利用","女叶在不同的生长阶段具有不同的特征从而呈现出不同的效用","人们能够利用艾叶的客观属性来满足自身的不同需要"],"a":"D","e":"D项符合题意：“艾叶既可以是药物，也可以是美食”说明人们能够利用艾叶的客观属性来满足自身的不同需要。A、B项错误：艾叶的特性是客观的，人不能凭借主观意愿或者自身需要任意去改变其特性。C项不符合题意：题干并未涉及艾叶在不同的生长阶段具有不同的特征从而呈现出不同的效用。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":63,"t":"单选","q":"国务院机构改革优化了创新引擎。一方面，重组科学技术部，加强、优化、转变政府科技管理和服务职能；另一方面，重组国家知识产权局，强化知识产权创造、保护和运用，让“第一动力”更有劲头。这段话蕴含的哲理是：","o":["社会存在状况决定社会意识","上层建筑应与经济基础相适应","生产关系应与生产力相适应","社会意识一定要适应社会存在"],"a":"B","e":"B项符合题意：经济基础决定上层建筑，上层建筑反作用于经济基础。上层建筑主要由意识形态以及政治法律制度及设施和政治组织两部分组成。其中，政治法律制度及设施和政治组织又称为政治上层建筑，包括国家政治制度、立法司法制度和行政制度，以及国家政权机构、政党、军队、警察、法庭、监狱等政治组织形态和设施。题干中“科学技术部”“国家知识产权局”都属于上层建筑范畴，调整上层建筑主要是为了适应经济基础的发展。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":64,"t":"单选","q":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》指出，“十五五”时期要坚持稳中求进工作总基调，脚踏实地、久久为功，既不好高远，也不因循守旧，在接续奋斗中推动经济社会高质量发展。下列古语体现的哲理与上述内容一致的是：\n①盘众木折、隙大墙坏\n②水滴石穿，绳锯木断\n③野火烧不尽，春风吹又生业4④宝剑锋从磨砺出，梅花香自苦寒来","o":["①②","③④","①③④","①②③"],"a":"A","e":"题干中“稳中求进”“脚踏实地、久久为功”“接续奋斗中推动高质量发展”，强调要重视量的积累，以量变促成质变，属于质量互变规律。\n①符合题意：“蠹众木折，隙大墙坏”意为蛀虫多了树木就要折断，缝隙大了墙就要塌毁，体现了量变积累到一定程度引起质变。\n②符合题意：“水滴石穿，绳锯木断”意为水滴滴石头久了也能把石头磨穿，用绳子锯木头久了也能把木头折断，体现了量变积累到一定程度引起质变。\n③不符合题意：“野火烧不尽，春风吹又生”体现了新事物的产生和旧事物的不断灭亡。\n④不符合题意：“宝剑锋从磨砺出，梅花香自苦寒来”体现了事物发展的前进性和曲折性的统一。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":65,"t":"单选","q":"有只猴子想学种葡萄，便来到葡萄园里，它看见园丁正在给葡萄浇水，就说：“原来种葡萄需要水，这还不容易！”于是，它直接把一株葡萄秧插进水田里，葡萄秧被淹死了。这个例子告诉我们：","o":["实践是检验认识是否具有真理性的唯一标准","在认识和处理问题时要掌握适度原则","意识对物质具有能动的反作用","要坚持一分为二的观点看问题"],"a":"B","e":"B项符合题意：题干中猴子认为种葡萄需要水，直接将一株葡萄秧插进水田（浇水过量）导致葡萄秧被淹死了，强调猴子在给葡萄浇水时，没有把握好水的度，导致葡萄被淹死，告诉我们在认识和处理问题时要掌握适度原则。A、C、D项说法正确，但是与题意无关。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":66,"t":"单选","q":"乡村建设在为农村带来发展机遇与动力的同时，也陆续出现一些问题，有些地方缺少科学规划，不是静下心来寻找自己的特色，而是盲目采取复制模式，结果破坏了农村原有风貌和特点，导致“千村一面”。造成这种现象是因为在发展过程中没有：","o":["坚持适度原则，控制量变的限度","从实际出发，做到具体问题具体分析","抓住重点和集中力量解决主要矛盾","把发挥主观能动性作为尊重客观规律的前提条件"],"a":"B","e":"B项符合题意：题干中“不是静下心来寻找自己的特一次相遇色，而是盲目采取复制模式，结果破坏了农村原有风貌和特点，导致‘千村一面’”，强调各农村没有从自身的实际情况出发，没有考虑自身的特点，没有具体问题具体分析。A、C项说法正确，但是与题意无关。D项错误：尊重客观规律是发挥主观能动性的前提条件。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":67,"t":"单选","q":"老子是中国古代伟大的思想家、哲学家、文学家和史学家，他认为：“将欲弱之，必固强之；将欲废之，必固兴之；将欲夺之，必固与之。”这主要体现的哲理是：","o":["事物的质变总是在量变的基础上发生的","事物的变化发展不以人们的意志为转移","新事物总是在旧事物的母体中孕育产生","矛盾双方依据一定条件可以向其对立面转化"],"a":"D","e":"D项符合题意：题干中“将欲弱之，必固强之；将欲废之，必固兴之；将欲夺之，必固与之。”意为要削弱的，必先加强一下；要废弃的，必先兴起一会儿；要夺取的，必先让与一点儿，强调“强弱”“兴废”“夺与”作为矛盾双方，在一定条件下能够相互转化。A、B、C项说法正确，但是与题意无关。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":68,"t":"单选","q":"习近平总书记在“一带一路”国际合作高峰论坛开幕式上的主旨演讲中指出，历经70年艰苦奋斗，中国人民立足本国国情、在实践中不断探索前进方向，开辟了中国特色社会主义道路。今天的中国，已经站在新的历史起点上。我们深知，尽管成就辉煌，但前方还有一座座山峰需要翻越，还有一个个险滩等待跋涉。这道含的哲学道理是：\n①事物发展的总趋势是前进性与曲折性的统一\n②要一切从实际出发，具体问题具体分析\n③看问题、办事情要着重抓住主要矛盾\n④实践是认识的基础，认识在实践中不断发展","o":["①②","③④","①③","②④"],"a":"D","e":"①错误：事物发展总趋势是前进的、上升的；发展的过程是前进性与曲折性的统一。该项混淆“总趋势”和“发展过程”。\n②符合题意：“立足本国国情”，从中国客观实际出发，把握本国矛盾特殊性，体现了坚持一切从实际出发、具体问题具体分析。\n③不符合题意：题干没有体现办事情抓重点、集中力量解决主要矛盾。\n④符合题意：“在实践中不断探索前进方向，开辟了中国特色社会主义道路”，体现实践是认识的基础，认识随实践不断深化发展。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":69,"t":"单选","q":"必须毫不放松理想信念教育、思想道德建设、意识形态工作，大力培育和弘扬社会主义核心价值观，用富有时代气息的中国精神凝聚中国力量。这体现的哲理有：\n①意识对改造客观世界具有指导作用，正确的意识促进事物发展\n②社会意识具有相对独立性，先进的社会意识推动社会进步\n③社会存在决定社会意识，社会意识是对社会存在的直观反映\n④上层建筑适应经济基础时，就能推动生产力发展","o":["①②","③④","①④","②③"],"a":"A","e":"①符合题意：题干中“理想信念、社会主义核心价值观、中国精神”属于正确的意识，能够凝聚中国力量，体现意识对改造客观世界具有指导作用，正确的意识促进事物发展。\n②符合题意：题干中重视意识形态工作、弘扬社会主义核心价值观，发挥先进思想精神的作用，体现社会意识具有相对独立性，先进的社会意识推动社会进步。\n③错误：社会存在决定社会意识，但社会意识是对社会存在的能动反映，不是直观反映。\n④错误：上层建筑适应经济基础，不一定推动生产力发展；只有当上层建筑为先进的经济基础服务时，才会促进生产力发展。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":70,"t":"单选","q":"习近平总书记强调，要坚定不移贯彻新发展理念，推动长江经济带高质量发展，谱写生态优先绿色发展新篇章，打造区域协调发展新样板。从哲学角度来看，这体现了：","o":["事物发展的过程中时时有矛盾，处处有矛盾","事物及其每个侧面各有其特点","正确地发挥主观能动性能够促进事物的发展","发展的实质是新事物的产生和旧事物的灭亡"],"a":"C","e":"C项符合题意：题干中强调的“新发展理念”属于意识范畴，“坚定不移贯彻新发展理念”是积极发挥意识主观能动性的体现，“坚定不移贯彻新发展理念，推动长江经济带高质量发展”表明了正确发挥主观能动性能够促进事物的发展。A、B、D项表述正确，但是与题意无关。故本题答案为。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":71,"t":"单选","q":"在新冠疫情防控中，人工智能及5G技术广泛应用于远程会诊、核酸检测、社区排查、体温监测等领域，为疫情态势研判、疫情防控部署提供了强有力的支撑。由此可见，人工智能：","o":["能够取代人类的思维，完全替代人类的体力和脑力劳动","具有主动创造性，能够检验自身认识是否符合实践需要","延伸了人类认识器官，能够促进人类认识和实践的发展","源于人类智慧，能够揭示深藏于事物内部的本质和规律"],"a":"C","e":"A项错误：人工智能是人类智慧的产物，不能取代人类思维，不能完全代替人类的体力和脑力劳动。B项错误：人工智能没有独立思考的思维能力，所以不具有主动创造性。C项符合题意：人类通过利用人工智能，延伸了认识器官，深化了人类的认识能力，促进入类认识和实践的发展，对各方面的发展产生重大而深远的影响。D项错误：人工智能不能揭示深藏于事物内部的本质和规律，人类必须在实践基础上通过抽象思维才能把握事物的本质和规律。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":72,"t":"单选","q":"《格言联璧·学问》中提到，“志之所趋，无远弗届，穷山距海，不能限也。志之所向，无坚不人，锐兵精甲，不能御也。”从哲学的角度看，这句话生动阐明了：公考资料免费更新加微信shgk738","o":["客观实在性是物质的唯一特性","意识具有直接现实性","意识对物质的能动作用","正确发挥主观能动性是解决问题的前提"],"a":"C","e":"C项符合题意：题干强调人如果有足够的志向，他要到达的地方不论多远，他最终都能到达。一个人如果有足够的志向，他要到达的地方不论有如何坚固的防御，他总能到达。意在说明“志向”对于一个人成就一番事业的重要作用。从唯物论角度来看，一个人的“志向”属于意识范畴，因此，题干这句话阐明了意识对物质具有能动作用。A项说法正确，但是与题意无关。B项错误：直接现实性是实践具有的特点。D项错误：一切从实际出发，尊重客观规律才是解决问题的前提和基础。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":73,"t":"单选","q":"“生活不止眼前的苟且，还有诗和远方的田野”，很多青年在谈真正体味“诗和远方”。这其中蕴含的哲理是：\n①社会意识对社会存在的发展有着积极的推动作用\n②任何事物的发展都是前进性与曲折性的统一\n③人生价值实现需要处理好主观与客观的关系\n④充分发挥主观能动性是实现人生价值的基础","o":["①②","③④","①②④","②③"],"a":"D","e":"①错误：社会意识有正确和错误之分，只有先进的社会意识才对社会存在的发展起积极推动作用。\n②符合题意：“诗和远方”代表发展的前进方向，“眼前的苟且”代表发展过程中的曲折困难，要跨过苟且才能抵达远方，体现任何事物的发展都是前进性与曲折性的统一。\n③符合题意：“诗和远方”是青年的主观理想追求，“眼前的苟且”是现实客观条件，实现理想不能脱离客观现实，体现人生价值实现需要处理好主观与客观的关系。\n④错误：社会提供的客观条件是实现人生价值的基础，而非充分发挥主观能动性。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":74,"t":"单选","q":"《回乡偶书》有诗句云：少小离家老大回，乡音无改毛衰。下列选项蕴含的哲理与该诗句相同的是：\n①坐地日行八万里，巡天遥看一千河\n②卧看满天云不动，不知云与我俱东\n③人间四月芳菲尽，山寺桃花始盛开\n④旋岚偃岳而常静，江河竞注而不流","o":["①②","③④","①②④","①②③"],"a":"A","e":"题干“少小离家老大回，乡音无改鬓毛衰”蕴含的哲理是绝对运动与相对静止的统一。“鬓毛衰”体现了人在不断衰老变化（绝对运动），“乡音无改”则体现了某些方面保持了相对稳定性（相对静止）。\n①符合题意：“坐地日行八万里，巡天遥看一千河”意思是人坐在地面上看似不动（相对静止），实则随地球自转日行八万里（绝对运动）。体现了绝对运动与相对静止的统一。\n②符合题意：“卧看满天云不动，不知云与我俱东”意思是躺着看云好像不动（相对静止），实际上云和人都在向东运动（绝对运动）。体现了绝对次相遇运动与相对静止的统一。\n③不符合题意：“人间四月芳菲尽，山寺桃花始盛开”意思是山下四月花已凋谢，山寺桃花才刚刚盛开，强调的是因海拔、气候条件不同，物候呈现出差异，体现的是矛盾具有特殊性。\n④不符合题意：“旋岚偃岳而常静，江河竞注而不流”意为狂风吹倒山岳却是“常静”的，江河奔流却是“不流”的。这是夸大相对静止、否认绝对运动的错误观点。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":75,"t":"单选","q":"恩格斯说：“运动，就它被理解为存在方式，被理解为物质的固有属性这一最一般的意义来说，囊括宇宙中发生的一切变化和过程，从单纯的位置变动起直到思维。”下列对于运动的理解不正确的是：","o":["物质和运动是不可分割的","运动是物质的本质属性","脱离运动的物质是不存在的","任何形式的运动都有其物质载体"],"a":"B","e":"B项错误：运动是物质的固有属性、根本属性和存在方式；客观实在性是物质的唯一特性和本质属性。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":76,"t":"单选","q":"翻开古代诗词，你可以一一品味诗人们深切的思想感情。读王维、孟浩然，你懂得了什么是钟情山水，读杜甫、白居易、你得了什么是优民情结，读辛弃疾、陆游，你懂得了什么是爱国情怀。这段话体现的哲理是：","o":["矛盾具有特殊性，不同事物有不同的矛盾","矛盾的普遍性寓于特殊性之中","事物发展是前进性与曲折性的统一","量变是质变的必要准备"],"a":"A","e":"A项符合题意：题干强调读不同诗人的作品能够带来不同的体验，体现了矛盾具有特殊性。B项不符合题意：矛盾的普遍性寓于特殊性之中强调从个性抽象出共性，题干重在体现不同诗人情感的差异，没有体现共性。C项不符合题意：事物发展是前进性与曲折性的统一揭示事物发展的总趋势与道路，与题干无关。D项不符合题意：量变是质变的必要准备侧重强调量的积累促成事物性质改变，与题干无关。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":77,"t":"单选","q":"红旗渠是国家5A级旅游景区，全国重点文物保护单位，被誉为“世界第八大奇迹”。林州处于河南、山西交界处，历史上严重干旱缺水。为解决水的问题，20世纪60年代，在极其艰难的条件下，林县（今林州市）人民靠自力更生、艰苦创业的精神，克服重重困难，奋战于太行山悬崖绝壁之上、险滩峡谷之中，在太行山腰修建了引漳人林的工程，被人称之为“人工天河”。修建红旗渠的过程中形成“自力更生、艰苦创业、团结协作、无私奉献”的红旗渠精神。这蕴含的哲理是：\n①人民群众是社会历史的主体，是历史的创造者\n②意识对改造客观世界具有能动的反作用\n③矛盾的主要方面决定事物的发展进程\n④实践是认识的来源","o":["①②③","①②④","①③④","②③④"],"a":"B","e":"①符合题意：题干强调林县人民修建红旗渠，体现了人民群众是社会历史的主体，是历史的创造者。\n②符合题意：题干强调林县人民凭借自力更生、艰苦创业的精神克服困难修建工程，体现了意识对改造客观世界具有能动的反作用。\n③错误：主要矛盾决定事物的发展进程，矛盾的主要方面决定事物的性质。\n④符合题意：题干表明在修建红旗渠的实践中形成红旗渠精神，体现了实践是认识的来源。故本题答案为B。公考资料免费更新加微信。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":78,"t":"单选","q":"敢于斗争、敢于胜利，是中国共产党人鲜明的政治品格，党的百年奋斗史就是一部伟大斗争史，我们党一路走来就是在斗争中求得生存、获得发展、赢得胜利。全党同志要发扬斗争精神、提高斗争本领，坚决战胜前进道路上的各种困难和挑战。上述内容没有体现的哲理是：","o":["意识对物质具有能动的反作用","矛盾是事物发展的源泉和动力","事物发展是前进性与曲折性的统一","人民群众是社会历史的创造者"],"a":"D","e":"A项能够体现、不符合题意：题干中“发扬斗争精神”“坚决战胜前进道路上的各种困难和挑战”，说明正确的意识能够指导入们能动地改造世界，体现了意识对物质具有能动的反作用。B项能够体现、不符合题意：题干中“在斗争中求得生存、获得发展、赢得胜利”，说明正是通过斗争推动了党和国家事业的前进，体现了矛盾是事物发展的源泉和动力。C项能够体现、不符合题意：题干中“坚决战胜前进道路上的各种困难和挑战”，体现事物发展是前进性与曲折性的统一。D项不能体现、符合题意：题干侧重我们党要克服困难取得胜利，没有涉及人民群众是社会历史的创造者的内容。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":79,"t":"单选","q":"成语蕴含着丰富的哲学智慧，是古人对客观世界认识的凝练总结。下列成语与其体现的哲理对应正确的是：","o":["苗助长一尊重客观规律是发挥主观能动性的前提","积羽沉舟—矛盾双方在一定条件下可以相互转化","好事多磨—量变积累到一定程度必然引起质变","仁者见仁一对同一确定的对象可以有多个真理性认识"],"a":"A","e":"A项正确：“苗助长”讲的是宋人嫌禾苗长得慢，把苗拔高，结果苗全枯死了。这正说明发挥主观能动性必须以尊重客观规律为前提，违背规律就会受到惩罚。B项错误：“积羽沉舟”体现的是量变积累到一定程度必然引起质变。C项错误：“好事多磨”体现的是事物发展是前进性与曲折性的统一。D项错误：“仁者见仁”体现的是认识具有主体差异性，不同的人由于立场、角度、知识背景等不同，对同一事物会有不同的认识。但真理具有客观性，对同一确定的对象，真理只有一个，不可能有多个真理性认识。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":80,"t":"单选","q":"在全面建设社会主义现代化国家新征程上，必须坚持解放思想、实事求是、与时俱进、求真务实，一切从实际出发，形成与时俱进的科学理论成果，在新时代伟大实践中不断开辟马克思主义中国化时代化新境界。上述论断所蕴含的哲理不包括：","o":["世界的统一性和多样性原理","矛盾的普遍性和特殊性原理","发展的前进性和曲折性原理","真理的绝对性和相对性原理"],"a":"C","e":"A项能够体现、不符合题意：世界的统一性和多样性原理的内容包括：（1）世界是统一的，即世界的本原是一个。（2）世界的统一性在于它的物质性。（3）物质世界的统一性是多样性的统一，而不是单一的无差别的统一。“在全面建设社会主义现代化国家新征程上，一切从实际出发”体现了世界的本原是物质的，世界统一于物质。“一切从实际出发，形成与时俱进的科学理论成果”说明物质世界的统一性不是单一的无差别的统一，马克思主义不是单一无差别的主义，要结合中国的实际，形成符合新时代中国发展的科学理论成果，这体现了世界的多样性。B项能够体现、不符合题意：矛盾的普遍性和特殊性辩证关系的原理，不仅是马克思主义的普遍真理同各国的具体实际相结合的哲学基础，也是中国特色社会主义的哲学依据。在新时代伟大实践中不断开辟马克思主义中国化时代化新境界，体现的是马克思主义普遍真理（普遍性）的中国化时代化（特殊性）的过程。C项不能体现、符合题意：题干强调的是理论要与时俱进、从实际出发、不断推进理论创新，没有涉及发展过程中“曲折性”的问题。D项能够体现、不符合题意：马克思主义基本原理是普遍真理，具有永恒的思想价值，体现的是真理的绝对性。在新时代伟大实践中不断开辟马克思主义中国化时代化新境界，体现的是真理的相对性。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":81,"t":"单选","q":"《中华人民共和国国民经济和社会发展第十五个五年规划纲要》指出，“十五五”时期经济社会发展必须坚持有效市场和有为政府相结合，充分发挥市场在资源配置中的决定性作用，更好发挥政府作用。上述材料体现的哲理是：\n①做事情要坚持两点论和重点论相统一\n②矛盾具有特殊性，要做到具体问题具体分析\n③实践是认识的目的和归宿，也是认识发展的动力\n④量变达到一定程度必然会引起质变，要做好量的积累","o":["①②③④","②③④","①②","③④"],"a":"C","e":"①符合题意：坚持有效市场和有为政府相结合，既要发挥市场的决定性作用，又要更好发挥政府作用，体现了坚持两点论和重点论相统一。\n②符合题意：针对我国经济发展的阶段性特征和具体问题，提出有效市场和有为政府相结合的独特治理方式，体现了矛盾具有特殊性，要做到具体问题具体分析。\n③④表述正确，但是与题意无关。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":82,"t":"单选","q":"我们要立足国情和发展实践，深人研究世界经济和我国经济面临的新情况新问题，揭示新特点新规律，提炼和总结我国经济发展实践的规律性成果，把实践经验上升为系统化的经济学说。以上说明：","o":["规律能够被人利用和创造","认识指导实践活动走向成功","实践是认识的来源","理论的发展是无限的"],"a":"C","e":"A项错误：规律是指事物发展中本身所固有的、本质的、必然的、稳定的联系。人们只能认识、掌握和利用规律，而不能按照自己的次相遇主观意志创造规律或消灭规律。B项错误：实践决定认识，认识反作用于实践，正确的认识促进实践发展，错误的认识阻碍实践发展。不能笼统地说“认识指导实践活动走向成功”。C项符合题意：题干强调立足国情和发展实践，研究现实问题，把实践经验上升为系统化的经济学说，体现了实践是认识的来源。D项不符合题意：该表述正确，但题干并未强调理论的无限发展。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":83,"t":"单选","q":"治国有常，利民为本。发展社会保障事业，既要避免像一些拉美国家那样盲目进行“福利赶超”落人“中等收入陷阱”，又要避免像一些北欧国家那样实行“泛福利化”导致社会活力不足。什么时候都不能忘记一个道理，经济发展和社会保障是水涨船高的关系，水浅行小舟，水深走大船，违背规律就会搁浅或翻船。以上论述体现的哲学观点是：\n①物质运动是有规律的，规律是不以人的意识为转移的\n②承认和尊重客观规律，是正确发挥主观能动性的前提\n③无视或违背客观规律，必然要遭受到客观规律的惩罚\n④规律是物质运动固有的、本质的、偶然的、稳定的联系","o":["②④","①②③","①③④","①②③④"],"a":"B","e":"①符合题意：“治国有常”意为治理国家有不变的法则，体现了物质运动是有规律的，规律是不以人的意识为转移的。\n②符合题意：我国应当避免出现像一些拉美国家和一些北欧国家的问题，体现了承认和尊重客观规律，是正确发挥主观能动性的前提。\n③符合题意：“水浅行小舟，水深走大船，违背规律就会搁浅或翻船”，体现了无视或违背客观规律，必然要遭受到客观规律的惩罚。\n④错误：规律是事物运动过程中固有的、本质的、必然的、稳定的联系。而非“偶然的”。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":84,"t":"单选","q":"据考证，“孟姜女哭倒秦长城”的故事原本是战国时期贵族姜姓家一个女子向齐王哭诉，要求提高自己战死丈夫的丧葬规格。到唐末在反对统治者苛捐劳役的过程中，演变成了平民之妻女哭倒秦长城的故事。这体现的哲学道理是：","o":["民间传说是对历史发展规律的直观反映","人民群众是推动历史进程的重要力量","社会意识是特定社会存在的反映","社会意识与社会存在是同步发展的"],"a":"C","e":"A项错误：民间传说是以历史事件与历史人物为依据，经过群体口耳相传和加工创作的，具有一定的能动性，并非直观反映。B项不符合题意：该说法正确，但是题干未体现人民群众对历史进程的推动作用。C项符合题意：故事从战国时期“贵族女子为丧葬规格哭诉”，到唐末演变为“平民之妻女哭倒长城反抗苛捐劳役”，其内容变化反映了不同时代的社会现实，体现出社会意识是特定社会存在的反映。D项错误：社会意识具有相对独立性，社会意识与社会存在变化发展具有不完全同步性和不平衡性。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":85,"t":"单选","q":"新能源汽车刚上市时，其推广过程阻力重重，许多新能源汽车反对者认为其续航里程短、充电难。随着全球各国开始推进环保战略，新能源汽车得到大力发展，其销量也逐年稳步提升，如今物价上涨、油价飞升，新能源汽车不烧油的优势也逐渐显现，不少市民买车时也会把新能源汽车作为首选项。这说明：\n①事物的发展是前进性与曲折性的统一\n②内因是事物变化的根据，外因是事物变化的条件\n③把握联系的多样性对于正确认识事物有重要意义\n④承认矛盾的普遍性是我们解决问题的关键","o":["①③","②④","①④","③④"],"a":"A","e":"①符合题意：新能源汽车上市之初“阻力重重”（续航短、充电难，推广艰难），体现事物发展道路的曲折性；随后销量逐年稳步提升、如今成为不少市民购车的首选项，体现事物发展方向的前进性。\n②不符合题意：该表述正确，但是题干没有体现内外因的关系。\n③符合题意：新能源汽车“不烧油”的优势并非一开始就显现，而是随着环保战略推进、油价飞升等条件的变化才逐步凸显，并被市民纳入购车考量。这说明事物的联系是多样的、有条件的，把握联系的多样性，对于正确认识事物具有重要意义。\n④错误：具体问题具体分析是正确认识事物的基础和正确解决矛盾的关键。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":86,"t":"单选","q":"中华优秀传统文化是我们文化发展的母体，是中华民族最根本的文化基因。时代革新、矛盾转化，需要我们把传承传统文化和发展现实文化有机统一、紧密结合起来，在继承中发展，在发展中继承。这段话说明：","o":["辩证的否定是事物联系的环节和发展的环节","主要矛盾决定事物的性质，要分清主流和支流","事物发展要注意量的积累，量变必然促成质变","矛盾的普遍性寓于特殊性之中，并通过特殊性表现出来"],"a":"A","e":"A项符合题意：“在继承中发展，在发展中继承”，继承体现新旧事物之间的联系，发展体现事物的前进上升，体现了辩证的否定是事物联系的环节和发展的环节。B项错误：事物的性质是由主要矛盾的主要方面决定的，并非主要矛盾。C项错误：量变达到一定程度才会引起质变，“量变必然促成质变”表述错误。D项不符合题意：该说法正确，但是题干强调文化的继承与发展，没有体现矛盾普遍性和特殊性的关系。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":87,"t":"单选","q":"1982年，29岁的习近平来到河北正定工作，在之后的1000多个日夜，他的足迹遍及全县。1988年他刚来到福建宁德，就下乡搞调研，进村入户，访贫问苦。如何解决温饱、摆脱贫困？正是在不懈的实践与思考中，“精准扶贫”“精准脱贫”的思想浮出历史的地表。上述材料说明了：\n①实践是认识的最终目的和归宿\n②要事事取得直接经验才能形成正确的理论\n③感性认识是理性认识的基础\n④感性认识上升为理性认识必须经过理性思考","o":["①②","③④","②③","①③④"],"a":"B","e":"①不符合题意：题干强调习近平总书记在不懈的实践和思考中，“精准扶贫”等思想才形成，体现了实践是认识的来源，没有体现实践是认识的最终目的和归宿。\n②错误：直接经验和间接经验都是人们获得认识的途径，都可能形成正确的理论。\n③4符合题意：习近平总书记下乡搞调研，访贫问苦，获取的是感性认识。这些感性认识经过不懈的思考，形成了“精准扶贫”“精准脱贫”思想等理性认识，体现了感性认识是理性认识的基础，感性认识上升为理性认识必须经过理性思考。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":88,"t":"单选","q":"“1+1=2”被推选为最伟大的数学公式之一。但在现实生活中，既存在“1+1>2”的可能，比如强强联手的倍增效应；也有“1+1<2”的情况，比如“九龙治水水不治”的治理难题。这体现的哲学道理是：\n①整体居于主导地位，要树立全局观念\n②理性认识依赖于感性认识立注个老\n③认识的目的是指导实践、改造世界\n④部分制约整体，要重视部分的作用，搞好局部","o":["①②","③④","①④","②③"],"a":"C","e":"①④符合题意：整体居于主导地位，整体是各个部分有机的结合，具有部分所不具备的功能。部分在事物的存在和发展过程中处于被支配的地位，部分服从和服务于整体。当部分以合理、有序的结构构成整体时，整体功能才大于部分功能之和，如题干所述的“强强联手的倍增效应”。反之,则小于部分功能之和，如题干指出的“九龙治水水不治”。因此，我们应当树立全局观念，统筹全局，实现整体的最优目标，从而达到整体功能大于部分功能之和的理想效果。\n②③说法正确，但是与题意无关。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":89,"t":"单选","q":"三角形内角之和等于180°，但是在凹曲面上，三角形内角之和小于180°，而在球形凸面上，三角形内角之和大于180°。这体现的哲学道理是：","o":["任何真理都有自己适用的条件和范围","对同一个确定对象的认识可以有多个真理","真理和谬误相互包含，二者没有明显界限","真理是对客观事物及其规律的正确反映"],"a":"A","e":"A项符合题意：三角形内角和等于180°仅适用于平面条件，在凹曲面、球形凸面上结果会发生变化，说明任何真理都有自己适用的条件和范围，真理是有条件的。B项错误：真理具有一元性，对于同一个确定对象，真理性认识只有一个，不会有多个真理。C项错误：真理和谬误有着严格的界限，不能说二者相互包含、没有明显界限。D项不符合题意：该说法正确，但是与题意无关。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":90,"t":"单选","q":"央视励志电视片《最美的青春）描述了20世纪60年代，为减少沙尘暴危害，第一代种树人来到了塞罕坝上，在荒漠上营造起万顷林海。老一代治沙人用“草方格”防风固沙。最近，中国经过长时间的研究，新一代治沙人发明了固沙车，它可以将麦草打人土层，实现播种时自动浇灌。两代治沙人在让沙漠变绿洲、荒漠变农田中奉献了自己最美的青春。这表明：\n①实践是认识发展的动力，实践推动治沙技术不断革新\n②改造客观世界能否成功取决于人的主观能动性的发挥\n③实践基础上获得的认识，能够直接转化为现实的物质力量\n④人的价值要在劳动和奉献中、在个人与社会的统一中实现","o":["①②","③④","①④","②③"],"a":"C","e":"①符合题意：两代治沙实践不断推进，从草方格到固沙车，治沙技术迭代升级，体现实践是认识发展的动力，实践推动治沙技术不断革新。\n②错误：发挥主观能动性要以尊重客观规律为前提，改造客观世界的成功取决于对客观规律的把握，并非取决于人的主观能动性的发挥。\n③错误：实践基础上获得的认识不能直接转化为现实的物质力量，必须要通过实践才能够转化为现实物质力量。\n④符合题意：两代治沙人扎根荒漠，奉献青春，改造沙漠造福社会，体现人的价值要在劳动和奉献中、在个人与社会的统一中实现。故本题答案次相遇为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":91,"t":"单选","q":"2026年8月26日，尼泊尔北部热索瓦地区发生大规模泥石流灾害。8月30日，两架载有帐篷、毛毯、太平柜、医用防护服、卫星通讯设备等中国救援物资的运-20大型运输机飞抵尼泊尔加德满都国际机场。中国向尼泊尔提供的这些救灾物资是：","o":["商品，因为它既有使用价值又有价值","商品，因为它是提供人们消费的物品","非商品，因为它是没有用于交换的物品","非商品，因为它没有使用价值和价值"],"a":"C","e":"商品是用来交换的劳动产品，必须满足是劳动产品和用于交换两个条件。中国向尼泊尔提供的这些救灾物资不用于交换，因而不属于商品。救灾物资具有使用价值，但因为不是商品，所以没有价值。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":92,"t":"单选","q":"网购用户使用第三方支付（如支付宝、财付通等）网上银行、信用卡等支付手段进行结算。这些结算方式：","o":["使货币的本质发生了根本性变化","减少了现金使用，方便了双方的交易","增加了银行盈利，降低了商品的价值","使物流行业充当了商品交换的媒介"],"a":"B","e":"A项错误：货币的本质是一般等价物，用电子支付并没有改变货币的本质。B项正确：电子支付减少了现金使用，使得交易过程更加简单、方便。C项错误：商品的价值是指凝结在商品中的无差别人类劳动，结算方式的变化对商品价值没有影响。D项错误：物流行业只是承担了寄送商品的功能，商品交换的媒介依然是货币。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":93,"t":"单选","q":"“3·15晚会”之后，由于某企业存在产品质量和销售价格欺诈行为，导致之后出现了在全国市场上抵制该企业产品的现象。这表明：","o":["使用价值是价值的物质承担者","价值是使用价值的前提和基础","生产商品的个别劳动时间少于社会必要劳动时间","生产商品的个别劳动时间多于社会必要劳动时间"],"a":"A","e":"A项符合题意：题干中“产品质量”体现了商品的使用价值，“销售价格”则是商品价值的外在表现形式，“之后出现了抵制该企业产品的现象”说明该企业产品的质量与其销售价格不匹配，即商品丧失使用价值，价值就无法实现，表明使用价值是价值的物质承担者。B项错误：使用价值是价值的前提和基础。C、D项不符合题意：题干并未涉及个别劳动时间与社会必要劳动时间的关系。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":94,"t":"单选","q":"“旧时王谢堂前燕，飞人寻常百姓家”，唐代诗人刘禹锡的这句诗词，常被用来形容过去的一些昂贵商品现在变成了大众消费品。导致这种变化的根本原因是：","o":["人民生活质量提高","社会劳动生产率提高","商品市场日益繁荣","大众消费观念发生变化"],"a":"B","e":"商品的价格由价值决定，商品的价值量由生产商品的社会必要劳动时间决定。“过去的一些昂贵商品现在变成了大众消费品”主要是因为社会劳动生产率提高，生产单位商品的社会必要劳动时间缩短，单位商品的价值量减小，从而商品的价格下降。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":95,"t":"单选","q":"价值规律是市场经济的基本规律，是调节资源配置的最基本方式。下列属于价值规律基本内容是：","o":["商品价值是由生产该商品的社会必要劳动时间决定","商品价值受供求关系影响，围绕价格上下波动","商品交换要以价格为基础，实行等价交换","商品的价格总是与价值保持一致"],"a":"A","e":"A项正确：价值规律的基本内容包括，商品的价值量由生产这种商品的社会必要劳动时间决定；商品交换要以价值量为基础，实行等价交换。B项错误：商品价格受供求关系影响，围绕价值上下波动。C项错误：商品交换要以价值量为基础，实行等价交换。D项错误：商品的价格由于受到市场供求关系的影响，与价值会出现不一致的情况。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":96,"t":"单选","q":"“十一”期间，小王选择了标价为4150元/人的海南五日游，还在海口的地摊上花100元买了几件富有少数民族特色的小饰品。这里涉及的货币职能分别是：","o":["价值尺度支付手段","流通手段价值尺度","价值尺度流通手段","支付手段流通手段"],"a":"C","e":"题干中“标价为4150元/人”是衡量海南五日游价值的大小，体现了货币价值尺度的职能；“花100元买了”发生了商品交换，体现了货币流通手段的职能。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":97,"t":"单选","q":"资本是能够带来剩余价值的价值，体现着资本家剥削工人的关系。根据资本在剩余价值生产中所起的作用不同，可以把资本分为：","o":["原始资本和积累资本","不变资本和可变资本","实物资本和货币资本","有形资本和无形资本"],"a":"B","e":"资本在资本主义生产过程中以生产资料和劳动力两种形态存在。根据这两部分资本在剩余价值生产中所起的不同作用，可以将资本分为不变资本和可变资本。不变资本，是指以生产资料形态存在的那部分资本，其价值在生产过程中一次或多次转移到新产品中去，不会发生增殖。可变资本，是指以劳动力价值形态存在的那部分资本，在生产过程中可以使价值增殖。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":98,"t":"单选","q":"商品的价值是凝结在商品中的无差别的人类劳动，商品的使用价值是商品能够满足人们某种需要的属性。关于价值与使用价值的关系，说法错误的是：","o":["使用价值和价值的关系既对立又统一","商品的价值不能离开使用价值","价值是商品的本质属性，凡是商品必然有价值","价值是商品的自然属性，使用价值是商品的社会属性"],"a":"D","e":"A、B项正确：使用价值和价值是对立统一的关系，二者统一关系表现为：商品必须同时具有使用价值和价值二因素。使用价值是价值的物质承担者；价值通过使用价值表现出来，没有合格的使用价值，价值不能得到实现。C项正确、D项错误：使用价值是价值的物质承担者，是商品的自然属性，并不反映社会生产关系，是人类社会永恒的范畴。价值是商品的根本属性，是商品的社会属性，是商品最本质的因素。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":99,"t":"单选","q":"价值规律是商品生产和商品交换的基本经济规律。价值规律的作用集中到一点，就是：","o":["调节生产资料和劳动力在社会生产各部门的分配","刺激商品生产者改进生产技术、改善经营管理","促进商品生产者在竞争中优胜劣汰","促进经济效益的提高和资源的合理配置"],"a":"D","e":"价值规律的积极作用表现在：（1）自发地调节生产资料和劳动力在社会各生产部门之间的分配比例，从而调节商品生产和流通。（2)自发地刺激社会生产力的发展，促进商品生产者改进技术，改善经营管理，提高劳动生产率。（3）自发地调节社会收入的分配。但集中到一点，就是促进经济效益的提高和资源的合理配置。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"新思想马原要点","n":100,"t":"单选","q":"资本的技术构成指的是：","o":["生产资料数量与劳动力数量的比例","可变资本与不变资本的比例","可变资本与总资本的比例","剩余劳动时间与必要劳动时间的比例"],"a":"A","e":"资本技术构成是指资本在物质形态上由生产资料的数量同使用这些生产资料的劳动力数量所构成的比例。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":1,"t":"单选","q":"2025年10月，第20期《求是》杂志发表习近平重要文章《推动落实全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议》。下列属于全球发展倡议内容的是：\n①坚持安全优先\n②坚持以人民为中心\n③坚持普惠包容\n④坚持创新驱动\n③坚持人与自然和谐共生坚持行动导向","o":["①②③④⑤","①③④⑤⑥","②③④⑤⑥","①②③④⑤⑥"],"a":"C","e":"①错误：全球发展倡议的内容包括：坚持发展优先。坚持以人民为中心。坚持普惠包容。坚持创新驱动。坚持人与自然和谐共生。坚持行动导向。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":3,"t":"单选","q":"2025年10月，第20期《求是》杂志发表习近平重要文章《推动落实全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议》。下列属于全球文明倡议内容的有几项?①共同倡导尊重世界文明多样性\n②共同倡导弘扬社会主义核心价值观\n③共同倡导重视文明传承和创新\n④共同倡导加强国际人文交流合作","o":["1项","2项","3项","4项"],"a":"C","e":"②错误：全球文明倡议内容包括：共同倡导尊重世界文明多样性。共同倡导弘扬全人类共同价值。共同倡导重视文明传承和创新。共同倡导加强国际人文交流合作。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":4,"t":"单选","q":"2025年10月，第20期《求是》杂志发表习近平重要文章《推动落实全球发展倡议、全球安全倡议、全球文明倡议、全球治理倡议》。下列属于全球治理倡议内容的有：\n①奉行主权平等\n②遵守国际法治\n③践行多边主义\n④倡导以人为本注重行动导向","o":["①②③④","①②③⑤","②③④⑤","①②③④⑤"],"a":"D","e":"①②③④5均正确。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":5,"t":"单选","q":"2025年11月，第21期《求是》杂志发表习近平重要文章《关于（中共中央关于制定国民经济和社会发展第十五个五年规划的建议>的说明》。文章指出，在《建议》稿起草过程中，要注意把握几点内容。下列相关说法，正确的有几项？\n①坚持目标导向和问题导向，以为基本实现社会主义现代化目标奠定更加坚实的基础为着眼点进行系统谋划，以有力有序有效应对世界百年变局的新形势和发展中突出问题为着力点补短板、强弱项\n②坚持系统思维，按照统筹推进“四个全面”总体布局、协调推进“五位一体”战略布局的要求，全面部署经济社会发展和党的建设各方面工作\n③坚持进一步全面深化改革，注重运用改革办法破解发展难题，为发展增动力、激活力\n④坚持扩大对外开放，既把发展放在自已力量基点上，又统筹用好全球要素和市场资源","o":["1项","2项","3项","4项"],"a":"C","e":"②错误：坚持系统思维，按照统筹推进“五位一体”总体布局、协调推进“四个全面”战略布局的要求，全面部署经济社会发展和党的建设各方面工作。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":6,"t":"单选","q":"2025年11月，第21期《求是》杂志发表习近平重要文章《关于（中共中央关于制定国民经济和社会发展第十五个五年规划的建议）的说明》。下列相关说法，正确的是：\n①“十五五”时期是夯实基础、全面发力的关键时期，制定和实施好“十五五”规划，就能为2035年基本实现社会主义现代化奠定更加坚实的基础\n②2035年基本实现社会主义现代化，一个重要标志性指标就是人均国内生产总值达到发达国家水平\n③继续把满足人民的美好生活向往确定为“十五五”时期经济社会发展的主题，要求坚持以经济建设为中心，实现质的有效提升和量的合理增长\n④推动高质量发展，最重要是加快高水平科技自立自强，积极发展新质生产力，在推动科技创新、加快培育新动能、促进经济结构优化升级上取得实质性、突破性进展","o":["①②③④","①④","②③","②③④"],"a":"B","e":"②错误：2035年基本实现社会主义现代化，一个重要标志性指标就是人均国内生产总值达到中等发达国家水平。\n③错误：继续把推动高质量发展确定为“十五五”时期经济社会发展的主题，要求坚持以经济建设为中心，实现质的有效提升和量的合理增长。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":7,"t":"单选","q":"2025年11月，第22期《求是》杂志发表习近平重要文章《因地制宜发展新质生产力》。下列关于新质生产力，说法正确的有几项？\n①新质生产力是由先进生产工具起主导作用的生产力\n②新质生产力具有高科技、高效能、高质量特征\n③新质生产力的特点是创新，关键在量大，本质是先进生产力\n④新质生产力以劳动者、劳动资料、劳动对象及其优化组合的跃升为基本内涵\n③新质生产力由技术革命性突破、生产要素创新性配置、产业深度转型升级而催生","o":["5项","4项","3项","2项"],"a":"C","e":"①错误：新质生产力是由创新起主导作用的生产力。\n③错误：新质生产力的特点是创新，关键在质优，本质是先进生产力。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":8,"t":"单选","q":"2025年11月，第22期《求是》杂志发表习近平重要文章《因地制宜发展新质生产力》。下列说法正确的是：\n①绿色发展是高质量发展的底色，新质生产力本身就是绿色生产力\n②扎实推动科技创新和产业创新深度融合，融合的基础是增加高质量科技供给\n③坚决破除制约高质量发展的体制机制端，使新质生产力更适应新型生产关系\n④发展新质生产力不能放弃传统产业，要防止一哄而上、泡沫化，也不要搞一种模式","o":["①②③","①②④","②③④","①③④"],"a":"B","e":"③错误：生产力决定生产关系，生产关系要与生产力相适应。习近平总书记指出，要坚决破除影响和制约高质量发展的体制机制弊端，完善与新质生产力更相适应的生产关系，塑造发展新动能新优势。故本题答案为B。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":9,"t":"单选","q":"2025年11月，第22期《求是》杂志发表习近平重要文章《因地制宜发展新质生产力》。下列说法不正确的是：","o":["加快推动作为经济增长和就业收入基本依托的新兴产业改造升级","抓科技创新，要着眼建设现代化产业体系，坚持教育、科技、人才一起抓，既多出科技成果，又把科技成果转化为实实在在的生产力","抓产业创新，要守牢 了经济社会发展、综合国力提升、人民生活改善","中长期发展规划有助于充分发挥政府在资源配置中的决定性作用，彰显了政府对经济社会发展的宏观调控能力","从第一个五年计划到当前的五年规划，一以贯之的主题是把我国建设成为社会主义现代化国家","通过互联网就“十五五”规划编制向全社会征求意见和建议，在我国五年规划编制史上是一次"],"a":"C","e":"A项错误：我国五年规划（计划）编制工作起始于1953年的第一个五年计划。B项错误：我国经济体制改革的核心是使市场在资源配置中起决定性作用，更好发挥政府作用。C项正确：从第一个五年计划到第十四个五年规划，一以贯之的主题是把我国建设成为社会主义现代化国家。D项错误：‘十四五”规划编制期间（2020年），我国首次通过互联网面向全社会征求意见和建议。故本题答案为C。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":39,"t":"单选","q":"【2025多省】党的二十届三中全会提出，要健全社会治理体系。关于健全社会治理体系，下列表述不准确的是：","o":["健全城乡社区治理体系，及时把矛盾纠纷化解在基层、化解在萌芽状态","提高市域社会治理能力，强化市民热线等公共服务平台功能","坚持和发展“枫桥经验”是健全社会治理体系的基础和前提","健全发挥家庭家教家风建设在基层治理中作用的机制"],"a":"C","e":"A项正确：党的二十大报告指出，推进国家安全体系和能力现代化，坚决维护国家安全和社会稳定，要完善社会治理体系。健全城乡社区治理体系，及时把矛盾纠纷化解在基层、化解在萌芽状态。B、D项正确:《中共中央关于进一步全面深化改革推进中国式现代化的决定》指出，推进国家安全体系和能力现代化，要健全社会治理体系。提高市域社会治理能力，强化市民热线等公共服务平台功能，健全“高效办成一件事”重点事项清单管理机制和常态化推进机制。健全社会心理服务体系和危机干预机制。健全发挥家庭家教家次相遇风建设在基层治理中作用的机制。C项错误：坚持和发展新时代“枫桥经验”是推进基层治理体系和治理能力现代化的重要经验，也是夯实中国式现代化基层社会治理基石的重要方法。该项中“基础和前提”的表述不准确。故本题答案为。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":62,"t":"单选","q":"【2026国考】做好新时代人口工作，要完善新时代人口发展战略，认识、适应、引领人口发展新常态，以人口高质量发展支撑中国式现代化。关于做好新时代人口工作，下列说法正确的是：","o":["要树立“大人口观”，推动人口与财政、货币、就业、产业、投资、消费、生态、区域等政策形成系统集成效应","必须推动人口工作由稳定总量、畅通流动向调节数量、优化结构转变","要更加重视“引导”和“激励”的办法，由社会治理向政府治理转变","坚持人民主体地位，把人口高速增长同人民高品质生活紧密结合起来"],"a":"A","e":"2024年11月，第22期《求是》杂志发表习近平总书记重要文章《以人口高质量发展支撑中国式现代化》。B项错误：我国已经进入推动高质量发展的关键时期，必须推动人口工作由调节数量为主向提升素质、稳定总量、优化结构、畅通流动转变，以人口高质量发展打造高素质人力资源，加快构建新发展格局，着力推动高质量发展。C项错误：要更加重视“引导”和“激励”的办法，由主要依靠政府力量向政府和社会协同治理转变。D项错误：做好新时代人口工作，要顺应人民群众对美好生活的期待，坚持人民主体地位，把人口高质量发展同人民高品质生活紧密结合起来，把“投资于物”同“投资于人”紧密结合起来。故本题答案为A。","v":true,"bad":false},{"b":"冲刺五百","s":"国省考历年精选","n":76,"t":"单选","q":"【2026多省】习近平总书记强调，学习好、贯彻好党的二十届四中全会精神，是当前和今后一个时期全党全国的一项重大政治任务。关于党的二十届四中全会精神，下列表述正确的是：","o":["把捍卫经济安全摆在首位，加强重点领域国家安全能力建设，突出保障事关国家长治久安、经济健康稳定、人民安居乐业的重大安全","坚定不移推动高质量发展，构建以新兴产业和未来产业为骨干的现代化产业体系","坚定不移扩大高水平对外开放，做强国内国际大循环，加快构建新发展格局","加强普惠性、基础性、兜底性民生建设，稳步推进基本公共服务均等化"],"a":"D","e":"A项错误：把捍卫政治安全摆在首位，加强重点领域国家安全能力建设，突出保障事关国家长治久安、经济健康稳定、人民安居乐业的重大安全。B项错误：坚持把发展经济的着力点放在实 ⑥坚持通过对话协商以和平方式解决国家间的分歧和争端","o":["①②③④⑤","②③④⑤⑥","①②③⑤⑥","①②③④⑤⑥"],"a":"D","e":"①②③④56说法皆正确。故本题答案为D。一次相遇。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":37,"t":"单选","q":"【小黑政治理论】2026年2月，第3期《求是》杂志发表习近平重要文章《走好中国特色金融发展之路，建设金融强国》。文章指出，建设金融强国，必须加快构建中国特色现代金融体系。下列属于该体系组成部分的是：\n①科学稳健的金融调控体系 ②结构合理的金融市场体系 ③分工协作的金融机构体系 ④完备有效的金融监管体系 ⑤多样化专业性的金融产品和服务体系 ⑥自主可控、安全高效的金融基础设施体系","o":["①②③④⑤","①③④⑤⑥","②③④⑤⑥","①②③④⑤⑥"],"a":"D","e":"①②③④56皆属于。故本题答案为D。","v":true,"bad":false},{"b":"冲刺五百","s":"求是重要文章","n":90,"t":"单选","q":"【小黑政治理论】2026年8月，第16期《求是》杂志发表习近平重要文章《提高防灾减灾救灾能力》。文章指出，党的十八大以来，党中央坚持把防灾减灾救灾工作作为关系人民安危和国家安全的大事来抓，积累了很多宝贵经验。下列属于积累的经验的是：\n①坚持人民至上、财产至上 ②坚持尊重自然规律 ③坚持救灾为主 ④坚持改革创新 ⑤坚持系统观念 ⑥坚持社会共治","o":["①②③④","②④⑤⑥","①②③⑤⑥","①②③④⑤⑥"],"a":"B","e":"①③错误：做好防灾减灾救灾工作，必须坚持党的全面领导，坚持人民至上、生命至上，坚持尊重自然规律，坚持预防为主，坚持改革创新，坚持系统观念，坚持社会共治。故本题答案为B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷一","n":1,"t":"单选","q":"关于中国特色社会主义新时代相关论断，下列说法正确的是：\n①坚持和发展中国特色社会主义，是改革开放以来我们党全部理论和实践的鲜明主题，也是习近平新时代中国特色社会主义思想的核心要义\n②党的十八大作出中国特色社会主义进入新时代这一重大政治论断\n③我国社会主要矛盾的变化是作出中国特色社会主义进入新时代重大判断的基本依据\n④社会主要矛盾发生转化，意味着我国社会主义所处历史阶段发生根本改变","o":["①③","①②","②④","③④"],"a":"A","e":"①正确：坚持和发展中国特色社会主义是改革开放以来党的全部理论和实践的鲜明主题，也是核心要义。\n②错，进入新时代的重大政治论断是党的十九大作出的。\n③正确，社会主要矛盾变化是作出这一判断的基本依据。\n④错，主要矛盾变化没有改变我国仍处于社会主义初级阶段的基本国情。故为\n①③，选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷一","n":2,"t":"单选","q":"习近平新时代中国特色社会主义思想是坚持“两个结合”的重大成果和光辉典范。下列说法正确的是：","o":["“两个结合”是指要把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，这两个命题均为新时代提出，是重要的思想解放","“两个结合”是对坚持和发展马克思主义作出的重大理论贡献，是我们取得成功的最大法宝","“两个结合”是用新时代中国之“矢”去射马克思主义之“的”","“两个结合”使马克思主义根脉和中华优秀传统文化魂脉内在贯通"],"a":"B","e":"B正确，“两个结合”是对坚持和发展马克思主义的重大理论贡献，是我们取得成功的最大法宝。A错在“两个命题均为新时代提出”，第一个结合在毛泽东时期就已提出。C错在颠倒，应是用马克思主义之“矢”射新时代中国之“的”。D错在颠倒，马克思主义是魂脉、中华优秀传统文化是根脉。","v":true,"bad":false},{"b":"专项十套","s":"专项卷一","n":3,"t":"单选","q":"“十个明确”是习近平新时代中国特色社会主义思想的主体内容，集中体现了这一思想体系的主要观点和基本精神。关于“十个明确”，下列说法正确的有几项？\n①中国特色社会主义最本质的特征是中国共产党领导，中国共产党是最高政治领导力量\n②坚持和发展中国特色社会主义的总任务是实现社会主义现代化和中华民族伟大复兴\n③全面深化改革总目标是建设中国特色社会主义法治体系、建设社会主义法治国家\n④党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成 ，注重解决的是发展内外联动问题","共享是中国特色社会主义的本质要求，注重解决的是社会公平正义问题"],"a":"C","e":"本题选错误项。绿色解决的是人与自然和谐共生问题，C把它说成解决“发展内外联动”，概念错位。开放才解决内外联动。A、B、D对应准确：创新解决动力、协调解决不平衡、共享解决公平正义。故选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷一","n":13,"t":"单选","q":"构建新发展格局是把握未来发展主动权的战略性布局和先手棋。下列关于构建新发展格局的说法，正确的是：\n①新发展格局是以国内大循环为主体、国内国际双循环相互促进的发展格局\n②构建新发展格局的关键在于各个区域逐步形成自我小循环\n③建设全国统一大市场是构建新发展格局的基础支撑和内在要求\n④构建新发展格局最本质的特征是实现高水平对外开放","o":["①②③","①③","①②④","②③④"],"a":"B","e":"①正确，是对新发展格局的准确表述。\n②错，构建新发展格局不是各区域搞自我小循环，而是畅通国内大循环。\n③正确，全国统一大市场是基础支撑和内在要求。\n④错，最本质特征是实现高水平的自立自强。故为\n①③，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷一","n":14,"t":"单选","q":"构建高水平社会主义市场经济体制，必须坚持和落实“两个毫不动摇”，促进各种所有制经济优势互补、共同发展。关于我国所有制经济，下列表述正确的有几项？\n①公有制经济包括国有经济、集体经济以及混合所有制经济中的国有成分和集体成分\n②公有制主体地位、国有经济主导作用不动摇，是巩固党的执政地位、坚持社会主义制度的重要保证\n③非公有制经济包括个体经济、私营经济、港澳台投资经济、外商投资经济以及混合所有制经济中的非公有制成分\n④民营经济作为公有制经济的主要形式，是推进中国式现代化的生力军","o":["1项","2项","3项","4项"],"a":"C","e":"①正确，公有制经济含国有、集体及混合所有制中的国有和集体成分。\n②正确，公有制主体地位、国有经济主导作用是重要保证。\n③正确，非公有制经济范围表述准确。\n④错，民营经济属于非公有制经济，不是“公有制经济的主要形式”。共3项，选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷一","n":15,"t":"单选","q":"坚持“两个毫不动摇”是我国基本经济制度的重要内容。下列相关说法，正确的是：\n①公有制经济和非公有制经济都是社会主义市场经济的重要组成部分\n②民营企业是中国特色社会主义的重要物质基础和政治基础，是我们党执政兴国的重要支柱和依靠力量\n③非公有制经济是国家税收重要来源、技术创新重要主体\n④毫不动摇巩固发展非公有制经济，毫不动摇鼓励支持引导公有制经济发展","o":["①②③④","①③","②④","①③④"],"a":"B","e":"①正确，二者都是社会主义市场经济的重要组成部分。\n②错，国有企业才是中国特色社会主义的重要物质基础和政治基础。\n③正确，非公有制经济是税收重要来源、技术创新重要主体。\n④错在“巩固发展非公有制”，应是毫不动摇巩固和发展公有制经济。故为\n①③，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷一","n":16,"t":"单选","q":"坚持和完善基本经济制度是实现高质量发展的保障。下列相关说法，正确的是：\n①在社会主义初级阶段实行按劳分配为主体、多种分配方式并存的分配制度，是由我国所有制决定的\n②新时代以来，我党确立了社会主义市场经济体制的改革目标和基本框架\n③要处理好政府和市场的关系，使政府在资源配置中起决定性作用\n④市场和政府分别是“无形的手”和“有形的手”，要推动有效市场和有为政府更好结合，必须做到既“放得活”又“管得好”","o":["①④","②③","①③④","①②③④"],"a":"A","e":"①正确，按劳分配为主体由所有制结构决定。\n②错，社会主义市场经济体制改革目标确立于党的十四大，不是新时代以来。\n③错，起决定性作用的是市场。\n④正确，有效市场与有为政府、既放得活又管得好。故为\n①④，选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷一","n":17,"t":"单选","q":"2026 年中央一号文件强调，要锚定农业农村现代化，扎实推进乡村全面振兴。下列关于新时代“三农”工作的说法，正确的有几项？\n①始终把解决好“三农”问题作为 项","2项","3项","4项"],"a":"B","e":"①正确，统一战线是重要法宝。\n②正确，本质要求是大团结大联合，解决人心和力量问题。\n③错，应是正确处理一致性和多样性关系，在多样性中寻求一致性，说反了。\n④错，统一战线最鲜明的特征是大团结大联合，不是“以人民为中心”。共2项，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":22,"t":"单选","q":"建设文化强国，事关中国式现代化建设全局，事关中华民族复兴大业，事关提升国际竞争力。下列相关表述，正确的是：","o":["马克思主义是我们立党立国、兴党兴国的根本指导思想，要坚持马克思主义在意识形态领域指导地位的根本制度","坚持以中华优秀传统文化为引领，不断构筑中国精神中国价值中国力量","坚持发展第一、合理保护和最小干预原则，推动文化遗产系统性保护","坚持以人民为中心的创作导向，坚持把经济效益放在首位、社会效益和经济效益相统一"],"a":"A","e":"A正确，坚持马克思主义在意识形态领域指导地位的根本制度。B错，引领的是马克思主义和社会主义核心价值观，不是“以中华优秀传统文化为引领”。C错，原则是“保护第一、合理利用、最小干预”。D错，应把社会效益放在首位。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":23,"t":"单选","q":"为民造福是立党为公、执政为民的本质要求，要把增进民生福祉作为发展的根本目的。下列相关说法，正确的是：\n①就业是最基本的民生，是最大的民生工程、民心工程、根基工程\n②收入分配是民生之本，分配制度是促进共同富裕的基础性制度\n③社会保障体系是人民生活的安全网和社会运行的稳定器\n④人民健康是社会文明进步的基础，是民族昌盛和国家富强的重要标志","o":["①②③","①③④","①②④","①②③④"],"a":"B","e":"①正确，就业是最基本的民生。\n②错，就业是民生之本，收入分配是民生之源，概念混淆。\n③正确，社会保障是安全网、稳定器。\n④正确，人民健康是社会文明进步的基础。故为\n①③④，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":24,"t":"单选","q":"在发展中保障和改善民生是中国式现代化的重大任务。下列相关说法，正确的是：","o":["要以破解结构性就业矛盾为着力点促进高质量充分就业","坚持基本医疗卫生事业市场化导向，坚持治理为主的方针，建设健康中国","社会保障体系由社会力量主导，社会救济是社会保障制度的主体","推动基本养老保险省级统筹，基本医疗保险全国统筹"],"a":"A","e":"A正确，以破解结构性就业矛盾为着力点促进高质量充分就业。B错，基本医疗卫生事业要坚持公益性导向、预防为主。C错，社会保障由政府主导，社会保险是主体，不是社会救济。D错，是基本养老保险全国统筹、基本医疗保险省级统筹。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":25,"t":"单选","q":"收入分配是民生之源，分配制度是促进共同富裕的基础性制度。下列相关说法，正确的是：","o":["发挥初次分配的基础性作用，加大税收、社保、转移支付等的调节力度","发挥再分配的调节作用，努力提高劳动报酬在初次分配中的比重","建立健全第三次分配机制，引导、支持有意愿有能力的企业、社会组织和个人积极参与公益慈善事业","健全生产要素由收益评价贡献、按贡献决定报酬的机制，强化以增加资本价值为导向的收入分配政策"],"a":"C","e":"A错，“加大税收、社保、转移支付调节”属于再分配，不是初次分配。B错，“提高劳动报酬比重”属于初次分配，不是再分配。C正确，第三次分配靠公益慈善。D错，应由市场评价贡献、按贡献决定报酬，不是“增加资本价值导向”。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":26,"t":"单选","q":"生态文明建设是关系中华民族永续发展的根本大计。下列相关表述，不正确的有几项？\n①尊重、顺应、保护自然是全面建设社会主义现代化国家的内在要求\n②构建以自然保护区为主体、各类自然公园为补充的自然保护地体系\n③坚持节约优先、保护优先、人工修复为主的方针\n④坚持把绿色低碳发展作为解决生态环境问题的治本之策\n⑤2030 年和2060 年实现“双碳”目标要与各国协商确定达到“双碳”目标的路径和方式、节奏和力度","o":["2项","3项","4项","5项"],"a":"B","e":"本题选错误项，共3项错。\n①正确，尊重顺应保护自然是内在要求。\n②错，自然保护地体系以国家公园为主体。\n③错，方针是节约优先、保护优先、自然恢复为主。\n④正确，绿色低碳发展是治本之策。\n⑤错，实现“双碳”的路径、方式、节奏、力度由我们自己决定，不与别国协商。选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":27,"t":"单选","q":"习近平强调：“改革开放是当代中国最鲜明的特色，是我们党在新的历史时期最鲜明的旗帜。”下列相关说法，正确的是：","o":["改革开放是党和人民大踏步赶上时代的重要法宝，创造了经济快速发展和社会长期稳定两大奇迹","党的十八届三中全会开启了改革开放和社会主义现代化建设新时期","全面深化改革的总目标是改革和变更中国特色社会主义制度、推进国家治理体系和治理能力现代化","进一步全面深化改革以政治体制改革为牵引，以促进社会公平正义、增进人民福祉为出发点和落脚点"],"a":"A","e":"A正确，改革开放是重要法宝，创造了两大奇迹。B错，开启改革开放新时期的是十一届三中全会，十八届三中全会开启的是全面深化改革新时期。C错，是完善和发展中国特色社会主义制度，不是“改革和变更”。D错，以经济体制改革为牵引。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":28,"t":"单选","q":"进一步全面深化改革是新时代新征程上的重大战略部署。下列相关说法，正确的是：\n①改革开放是坚持和发展中国特色社会主义的必由之路\n②全面深化改革开放必须以是否有利于坚持和改善党的全面领导、是否有利于坚持和完善中国特色社会主义制度为根本标准\n③改革和法治如鸟之两翼、车之两轮，相辅相成、相伴而生\n④进一步全面深化改革要贯彻坚持党的全面领导、坚持以人民为中心、坚持守正创新、坚持以经济建设为主线、坚持全面依法治国、坚持系统观念等原则","o":["①②③","①③④","①②④","②③④"],"a":"A","e":"①正确，改革开放是必由之路。\n②正确，根本标准是“三个有利于”与党的领导、制度标准。\n③正确，改革与法治如鸟之两翼。\n④错，应是“以制度建设为主线”，不是“以经济建设为主线”。故为\n①②③，选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":29,"t":"单选","q":"全面依法治国是中国特色社会主义的本质要求和重要保障。下列相关说法，正确的有几项？\n①中国特色社会主义法治道路的核心要义，就是要坚持党的领导，坚持中国特色社会主义制度，贯彻中国特色社会主义法治理论，同时注重吸收西方宪政、三权分立等优秀政治法治模式\n②坚持党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别\n③全面依法治国的总目标是建设中国特色社会主义法治体系、建设社会主义法治国家\n④全民守法是维护社会公平正义的最后一道防线","o":["1项","2项","3项","4项"],"a":"B","e":"①错，法治道路核心要义是党的领导、中国特色社会主义制度、中国特色社会主义法治理论，不吸收西方宪政、三权分立。\n②正确，党的领导是法治之魂、最大区别。\n③正确，总目标是建设法治体系、法治国家。\n④错，司法是维护公平正义的最后一道防线。共2项，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":30,"t":"单选","q":"全面依法治国是国家治理的一场深刻革命。下列相关说法，正确的是：\n①坚持依宪治国、依宪执政，要把全面贯彻实施宪法作为首要任务\n②法治社会建设是全面依法治国的重点任务和主体工程\n③加快完善以宪法为核心的中国特色社会主义法律体系\n④全面依法治国的总抓手是坚持中国特色社会主义制度","o":["①③","②③","②④","①④"],"a":"A","e":"①正确，依宪治国、依宪执政，全面贯彻实施宪法是首要任务。\n②错，法治政府建设是重点任务和主体工程，法治社会是基础。\n③正确，完善以宪法为核心的法律体系。\n④错，总抓手是建设中国特色社会主义法治体系。故为\n①③，选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":31,"t":"单选","q":"习近平指出：“全面依法治国必须正确处理政治和法治、改革和法治、依法治国和以德治国、依法治国和依规治党的关系。”下列相关说法，正确的有几项？\n①党和法的关系是政治和法治关系的集中反映，是全面依法治国的根本问题\n②改革和法治相辅相成，要在法治下推进改革，在改革中完善法治\n③法治和德治不可分离、不可偏废，国家治理需要法律和道德协同发力\n④要发挥依法治国和依规治党的互补性作用，国家法律是党的政策的先导和指引，是立法的依据和执法司法的重要指导","o":["1项","2项","3项","4项"],"a":"C","e":"①正确，党和法关系是政治和法治关系的集中反映。\n②正确，在法治下推进改革、在改革中完善法治。\n③正确，法治德治不可偏废。\n④错在颠倒，党的政策是国家法律的先导，不是国家法律是党的政策的先导。共3项，选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":32,"t":"单选","q":"新时代党的建设总要求是推进党的建设新的伟大工程的总遵循。下列相关说法，正确的是：\n①坚持党要管党、全面从严治党以调动全党积极性、主动性、创造性为主线\n②新时代党的建设以党的思想建设为统领，以坚定理想信念宗旨为根基\n③坚持制度上全贯通，把制度建设要求体现到全面从严治党全过程、各方面、各层级\n④要把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党","o":["①③","①②","②④","③④"],"a":"D","e":"①错，主线是加强党的长期执政能力建设、先进性和纯洁性建设。\n②错，以党的政治建设为统领，不是思想建设。\n③正确，制度上全贯通。\n④正确，党的建设目标表述准确。故为\n③④，选D。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":33,"t":"单选","q":"全面从严治党是新时代党的建设的鲜明主题。关于党的建设，下列说法正确的有几项？\n①思想建设的首要任务是用党的创新理论武装全党\n②制度建设是党的根本性建设，决定着党的建设方向和效果，要摆在首位\n③作风问题的核心是保持党同人民群众的血肉联系\n④政治建设首要任务是保证全党服从中央，坚持党中央权威和集中统一领导","o":["1项","2项","3项","4项"],"a":"B","e":"①错，思想建设的首要任务是坚定理想信念。\n②错，政治建设是根本性建设、摆在首位，不是制度建设。\n③正确，作风问题核心是党同人民群众的血肉联系。\n④正确，政治建设首要任务是保证全党服从中央、维护党中央权威和集中统一领导。共2项，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":34,"t":"单选","q":"党的力量来自组织，党的全面领导、党的全部工作要靠党的坚强组织体系去实现。关于党的组织体系建设，下列说法正确的有几项？\n①严密的组织体系，这是世界上任何其他政党都不具有的强大优势\n②中央和国家机关是贯彻落实党中央决策部署的“最初一公里”\n③从严治党，关键是要抓住基层干部这个“关键少数”\n④严密党的组织体系，关键是坚持党中央权威和集中统一领导，根本在做到“两个维护”","o":["1项","2项","3项","4项"],"a":"C","e":"①正确，严密组织体系是其他政党不具备的优势。\n②正确，中央和国家机关是“最初一公里”。\n③错，“关键少数”指领导干部，从严治党关键是抓住领导干部特别是高级干部。\n④正确，关键是党中央权威和集中统一领导，根本在“两个维护”。共3项，选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":35,"t":"单选","q":"全面从严治党是新时代党的建设的鲜明主题。关于党的建设，下列说法正确的是：\n①加强纪律建设是全面从严治党的治本之策，抓纪律首要是抓政治纪律\n②制度治党是长远之策、根本之策，要坚持以宪法为根本，以民主集中制为核心，完善党内法规制度体系\n③人民监督是永葆党的肌体健康的生命之源，是各种监督形式中最根本的、第一位的\n④要持续深化纠治形式主义、官僚主义、享乐主义和奢靡之风","o":["①③","①④","②④","②③"],"a":"B","e":"①正确，纪律建设是治本之策，首要抓政治纪律。\n②错，应以党章为根本，不是宪法。\n③错，党内监督是第一位的、最根本的，人民监督是重要方面。\n④正确，持续纠治“四风”。故为\n①④，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":36,"t":"单选","q":"全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路。关于党的建设，下列说法正确的是：\n①腐败是党长期执政面临的最大威胁，反腐败是最彻底的自我革命\n②不敢腐的刚性制度约束、不能腐的强大震慑效能、不想腐的思想教育优势要融于一体\n③自我革命是跳出历史周期率的唯一答案，勇于自我革命是我党最大的优势\n④反腐倡廉的核心是制度制约和监督权力","o":["①③","①④","②④","②③"],"a":"B","e":"①正确，腐败是最大威胁，反腐败是最彻底的自我革命。\n②错，把“不敢腐”“不能腐”的表述颠倒了：不敢腐靠惩治震慑、不能腐靠制度约束。\n③错，“唯一答案”错，自我革命是跳出历史周期率的第二个答案。\n④正确，核心是制约和监督权力。故为\n①④，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":37,"t":"单选","q":"总体国家安全观是新时代国家安全工作的根本遵循和行动指南。下列相关说法，正确的有几项？\n①总体国家安全观是总体的、系统的、相对的大安全\n②总体国家安全观的关键和灵魂是“总体”，它突出大安全理念\n③总体国家安全观以人民安全为根本，政治安全为宗旨，经济安全为基础\n④坚持把政治安全摆在首位，这是新时代中国国家安全的生命线\n⑤防范化解国家安全风险，是新时代中国国家安全的根本立场","o":["2项","3项","4项","5项"],"a":"B","e":"①错，总体国家安全观是总体的、系统的，不是“相对的”。\n②正确，关键和灵魂是“总体”。\n③错，以人民安全为宗旨、政治安全为根本，说反了。\n④正确，政治安全摆在首位。\n⑤正确，防范化解风险是根本立场。共3项，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":38,"t":"单选","q":"教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。下列相关说法，正确的是：\n①建设教育强国是全面推进强国建设、民族复兴伟业的首要任务、坚实基础、战略支撑\n②培养什么人、为谁培养人、怎样培养人是教育的根本问题\n③高质量发展是教育的生命线，要把高等教育作为基点，基础教育作为龙头\n④建设教育强国以立德树人为根本任务，以为党育人、为国育才为根本目标","o":["①③","①④","②④","②③"],"a":"C","e":"①错，教育强国是强国建设的基工程、先手棋，说“首要任务”不准确。\n②正确，培养什么人、怎样培养人、为谁培养人是根本问题。\n③错，基点与龙头说反了，基础教育是基点、高等教育是龙头。\n④正确，立德树人是根本任务、为党育人为国育才是根本目标。故为\n②④，选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":39,"t":"单选","q":"全面建成社会主义现代化强国关键看科技自立自强，这是促进发展大局的根本支撑。下列相关说法，正确的是：","o":["基础研究是科技创新的源头，要有组织推进市场导向的体系化基础研究、前沿导向的探索性基础研究、战略导向的应用性基础研究","企业是基础研究的主力军，高水平研究型大学是科技创新的主体","加大研发投入，健全市场投入为主、社会多渠道投入机制","强化基础研究前瞻性、战略性、系统性布局，坚持目标导向和自由探索“两条腿走路”"],"a":"D","e":"A错，三类基础研究的导向错配：战略导向的体系化基础研究、前沿导向的探索性基础研究、市场导向的应用性基础研究，A把“市场导向”与“体系化”拼在一起。B错，企业是科技创新主体，高水平研究型大学是基础研究主力军。C错，应健全政府投入为主、社会多渠道投入机制。D正确，两条腿走路。","v":true,"bad":false},{"b":"专项十套","s":"专项卷二","n":40,"t":"单选","q":"人才是实现民族振兴、赢得国际竞争主动的战略资源。下列相关说法，正确的是：\n①实施人才强国战略，要建设一支规模宏大、结构合理、素质优良的人才队伍\n②坚持党对人才工作的全面领导，是建设人才强国的“纲”和“本”\n③坚持把引进人才作为战略基点，充实高科技人才队伍\n④改进人才评价机制，建立健全四唯导向的评价体系","o":["①②","②③","③④","①④黑十专项卷三党的创新理论"],"a":"A","e":"①正确，人才队伍规模宏大、结构合理、素质优良。\n②正确，党管人才是“纲”和“本”。\n③错，战略基点是自主培养，不是引进。\n④错，要破除“四唯”，不是建立健全四唯导向。故为\n①②，选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":41,"t":"单选","q":"习近平指出，初心不改，虽远不怠；矢志不渝，虽艰必达。中方愿同各方一道，继续高举“上海精神”旗帜，落实上海合作组织未来10年发展战略，努力实现更高质量发展，为推动构建人类命运共同体作出更大贡献！其哲学依据在于：","o":["意识具有主观能动性","意识对事物发展起促进作用","意识是对客观世界的直观映象","意识的唯一特性是客观实在性"],"a":"A","e":"“初心不改、矢志不渝”强调人要有坚定信念并为之奋斗，体现意识具有主观能动性，A正确。B错，意识有正确与错误之分，只有正确意识才起促进作用。C错，意识是对客观世界的能动反映，不是直观映象。D错，客观实在性是物质的唯一特性，不是意识。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":42,"t":"单选","q":"习近平强调，当代中国最大的客观实际，就是我国仍处于并将长期处于社会主义初级阶段，这是我们认识当下、规划未来、制定政策、推进事业的客观基点，不能脱离这个基点，否则就会犯错误，甚至犯颠覆性的错误。从唯物论角度看，这一论断体现的哲理是：","o":["意识对改造客观世界具有决定性作用","物质决定意识，想问题办事情要坚持一切从实际出发","世界上的事物都是绝对运动和相对静止的统一","正确发挥主观能动性是尊重客观规律的前提"],"a":"B","e":"我国仍处于社会主义初级阶段这一“客观实际”是制定政策的基点，说明物质决定意识、要一切从实际出发，B正确。A错，意识不起决定作用。C讲运动与静止，与题干不符。D错，尊重客观规律是正确发挥主观能动性的前提，说反了。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":43,"t":"单选","q":"习近平指出，当前和今后一个时期，我国卫生与健康工作需要因应形势发展变化，优化完善一些具体政策举措，但是走中国特色卫生与健康发展道路不能动摇，贯彻新时代卫生与健康工作方针不能动摇。下列选项体现的哲理与题干最一致的是：","o":["改革只有进行时、没有完成时","鞋子合不合脚，自己穿了才知道","明者因时而变，知者随事而制","该改的、能改的我们坚决改，不该改的、不能改的坚决不改"],"a":"D","e":"题干“具体政策可以优化，但道路和方针不能动摇”，是变与不变的统一。D“该改的坚决改、不该改的坚决不改”最一致。A强调改革永无止境，只有“变”。B强调从实际出发。C强调因时而变，都只讲了变的一面。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":44,"t":"单选","q":"2026 年8 月26 日，因尼泊尔一侧发生高位冰岩崩，碎屑流沿沟道裹挟冰碛物演变为泥石流，跨境冲击西藏日喀则市吉隆县吉隆口岸，造成重大人员伤亡和失联。专家研判，该灾害是喜马拉雅南麓“板块挤压松动山体+气候变暖加剧冰川不稳定+季风暴雨触发”多重因素耦合的链式结果，且灾害链跨境传导、中尼两侧均受影响。从马克思主义哲学角度看，这一事件最突出的启示是：","o":["任何两个事物之间都存在客观联系，灾害影响不受地域边界限制","世界是普遍联系的有机整体，在跨境灾害治理中要强化协同联动与全链条防控","人为事物的联系比自在事物的联系更具有破坏性，需要做好风险预警","事物的联系是客观的，人们可以根据固有联系改造事物发展的客观规律"],"a":"B","e":"灾害是多重因素耦合、跨境传导的链式结果，说明世界是普遍联系的有机整体，治理要协同联动、全链条防控，B正确。A错，联系是有条件的，并非任何两个事物都联系。C错，自在事物的联系同样可能带来破坏。D错，规律不能改造。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":45,"t":"单选","q":"2026 年8 月，第16 期《求是》杂志发表习近平重要文章《提高防灾减灾救灾能力》。文章指出，防灾减灾救灾涉及多个部门、多个灾种、多个环节，必须明晰职责分工，扣紧责任链条，攥指成拳形成合力。这体现的哲理是：\n①整体居于主导地位，整体功能大于各个部分功能之和\n②部分的功能及其变化会影响整体的功能，要重视部分的作用\n③矛盾具有特殊性，要坚持具体问题具体分析\n④联系具有普遍性，要用联系的观点看问题","o":["①②③","①③","①②④","②④"],"a":"D","e":"“明晰分工、扣紧责任链条、攥指成拳”强调部分影响整体、要用联系的观点看问题，\n②④正确。\n①错，整体功能未必大于部分功能之和，只有结构优化时才大于。\n③讲具体问题具体分析，题干未涉及。故选D。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":46,"t":"单选","q":"下列选项中，能体现发展实质的诗句是：\n①长江后浪推前浪，浮世新人换旧人\n②莫道今年春将尽，明年春色倍还人\n③请君莫奏前朝曲，听唱新翻杨柳枝\n④年年岁岁花相似，岁岁年年人不同","o":["①②③","①②④","①③④","②③④"],"a":"A","e":"发展的实质是新事物产生、旧事物灭亡。\n①“后浪推前浪、新人换旧人”、\n②“明年春色倍还人”、\n③“听唱新翻杨柳枝”都体现新旧更替。\n④“年年岁岁花相似”体现的是相对静止，不是发展。故为\n①②③，选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":47,"t":"单选","q":"习近平多次在国际场合引用古典名句阐释辩证思维，展现出中华优秀传统文化中蕴含着丰富的马克思主义哲学智慧。下列选项体现的哲理对应正确的是：","o":["矛盾具有同一性——安而不忘危，存而不忘亡，治而不忘乱","重视矛盾特殊性——万物并育而不相害，道并行而不相悖","坚持内外因结合——一花独放不是春，百花齐放春满园","要抓住主要矛盾——苟日新，日日新，又日新"],"a":"A","e":"“安而不忘危，存而不忘亡，治而不忘乱”体现矛盾双方相互依存、相互贯通，即矛盾同一性，A对应正确。B“万物并育而不相害”体现矛盾统一/包容，不是特殊性。C“一花独放不是春”体现整体与部分、联系。D“苟日新，日日新”体现发展、创新，不是主要矛盾。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":48,"t":"单选","q":"习近平强调：“吹灭别人的灯，并不会让自己更加光明。阻挡别人的路，也不会让自己行得更远。”下列选项体现的哲学道理与题干一致的是：\n①危和机总是同生并存的，克服了危即是机\n②实现社会主义现代化是一个阶梯式递进、不断发展进步的历史过程，需要不懈努力、接续奋斗\n③人与自然是生命共同体，保护生态环境就是保护生产力，改善生态环境就是发展生产力\n④发展是解决我国一切问题的基础和关键，发展必须是科学发展","o":["①③","②④","①③④","②③④"],"a":"A","e":"“吹灭别人的灯不会让自己更光明”说明损人不利己，各国相互依存、要合作共赢，体现矛盾同一性与普遍联系。\n①“危和机同生并存”体现矛盾同一性；\n③“人与自然是生命共同体”体现普遍联系，均一致。\n②④讲发展、可持续，与题干指向不同。故选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":49,"t":"单选","q":"习近平指出，“在任何工作中，我们既要讲两点论，又要讲重点论，没有主次，不加区别，眉毛胡子一把抓，是做不好工作的。”下列能够体现坚持两点论和重点论相统一的是：\n①坚持把社会效益放在首位、社会效益和经济效益相统一\n②以国内大循环为主体，国内国际双循环相互促进\n③统筹推进高质量发展和高水平安全，筑牢国家安全屏障\n④突出经济体制改革这个重点，全面协调推进各方面改革","o":["①②③","③④","①②④","①③"],"a":"C","e":"两点论要求看到矛盾双方，重点论要求抓住主要方面。\n①社会效益首位又兼顾经济效益、\n②国内大循环为主体又双循环互促、\n④经济体制改革为重点又全面推进，都是两点与重点的统一。\n③“统筹发展与安全”只体现两点论，没有突出重点。故选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":50,"t":"单选","q":"习近平指出，以人工智能为代表的新一轮科技革命和产业变革，正在以加速突破之势催生新的生产方式、生活方式、学习方式、工作方式，促进了多方面发展，同时也带来一些潜在隐患，对我们用好机遇抓发展和加强治理避风险提出了新的更高的要求。这段话体现的哲学道理是：","o":["外部矛盾是事物发展的根据，起着决定性作用","矛盾具有普遍性，要坚持一分为二的观点看问题","矛盾的普遍性寓于特殊性之中，二者在一定条件下相互转化","主要矛盾的主要方面决定事物的性质，要分清主流和支流"],"a":"B","e":"人工智能既带来发展机遇又带来潜在隐患，要求一分为二看问题，B正确。A错，内因才是事物发展的根据。C讲普遍性与特殊性，与题干无关。D讲主流与支流，题干是利与弊并存，并非判断事物性质。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":51,"t":"单选","q":"新时代推进高水平科技自立自强，既要苦练内功，坚决打赢关键核心技术攻坚战，夯实我国科技发展根基；同时也要坚持对外开放，积极融入全球创新网络，合理吸收借鉴国际先进科技成果。这句话体现的哲理是：\n①内因是事物发展的根据，要着重把握事物发展的内部矛盾\n②坚持两点论，统筹把握事物发展的内部条件与外部条件\n③矛盾的斗争性是绝对的，同一性是相对的\n④联系具有普遍性，任何事物都处在联系之中","o":["①②","①②④","③④","②③④"],"a":"B","e":"“苦练内功”是用好内因，“对外开放”是用好外因，两者统筹即两点论，故\n①②④正确。\n③讲斗争性与同一性，题干未涉及。故选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":52,"t":"单选","q":"习近平在二〇二六年春节团拜会上强调：“只要保持战略定力，一步一个脚印坚定朝前走，一个阶段一个阶段扎实推进，党和国家事业就一定会不断积小胜为大胜，我们的目标就一定能实现。”这体现的哲学道理是：\n①量变是质变的前提条件，积极做好量的积累\n②新事物战胜旧事物是一帆风顺的过程\n③量变必然引起质变，要不失时机促成事物的飞跃\n④事物发展是量变—质变—新的量变循环往复的上升过程","o":["①②","③④","②③","①④"],"a":"D","e":"“一步一个脚印、一个阶段一个阶段、积小胜为大胜”强调量的积累，\n①正确；发展是量变—质变—新的量变的循环上升，\n④正确。\n②错，新事物战胜旧事物必然经历曲折，不是一帆风顺。\n③错，量变只有达到一定程度才引起质变，不是“必然”随时随地。故选D。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":53,"t":"单选","q":"2026 年8 月，习近平在吉尔吉斯斯坦媒体发表署名文章指出，吉尔吉斯斯坦有句谚语：“滴水汇成湖。”中国古语也讲：“不积小流，无以成江海。”中方愿继续同吉方一道努力，一步一个脚印推进各领域合作，将两国人民友好的涓涓溪流汇聚成中吉友好的大河，携手开创两国关系高质量发展新局面。这体现的哲学道理是：","o":["量变是质变的必要准备，要重视量的积累，循序渐进推进双边合作","事物发展的道路是迂回曲折的，要勇敢应对中吉交往中的各类矛盾","矛盾的普遍性寓于特殊性之中，中吉友好要坚持共性与个性相统一","整体居于主导地位，整体功能总是大于各个部分功能之和"],"a":"A","e":"“滴水汇成湖”“不积小流，无以成江海”“一步一个脚印”都强调量的积累是质变的必要准备，A正确。B讲曲折性、C讲共性与个性、D讲整体与部分（且整体功能未必总大于部分之和），均不对应。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":54,"t":"单选","q":"2026 年，我国继续实施更加积极的财政政策。一方面，赤字率继续按4%左右安排，赤字规模达到5.89 万亿元，全国一般公共预算支出首次迈上30 万亿元新台阶，加大对科技创新、民生保障等重点领域的支持力度；另一方面，明确强调“坚决落实过紧日子的要求”，严控一般性支出，坚决防止债务风险累积，确保财政可持续。上述做法体现的哲学原理是：\n①度是保持事物质的稳定性的数量界限，要坚持适度原则\n②主要矛盾在事物发展中起决定作用，要集中力量解决主要矛盾\n③量变达到一定程度必然引起质变，要防止事物向不利的方向转化\n④矛盾双方相互依存，在一定条件下可以相互转化","o":["①②③","①③","②④","①③④"],"a":"A","e":"赤字率按4%左右安排、支出上台阶又强调“过紧日子”，体现把握适度、防止量变引起不利质变，\n①③正确；加大对重点领域支持体现抓主要矛盾，\n②正确。\n④矛盾双方相互转化，题干未体现。故选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":55,"t":"单选","q":"2026 年8 月17 日，习近平在纪念江泽民同志诞辰100周年大会上发表的重要讲话中提到，“‘历尽天华成此景，人间万事出艰辛。’这是江泽民同志以豪迈诗句对奋斗的诠释。”下列选项体现的哲理与题干中的诗句一致的是：","o":["千淘万漉虽辛苦，吹尽狂沙始到金","横看成岭侧成峰，远近高低各不同","落红不是无情物，化作春泥更护花","江山代有才人出，各领风骚数百年"],"a":"A","e":"“历尽天华成此景，人间万事出艰辛”讲成就来自艰辛奋斗，体现事物发展是前进性与曲折性的统一。“千淘万漉虽辛苦，吹尽狂沙始到金”完全一致，A正确。B讲认识角度不同，C讲奉献，D讲人才辈出，均不对应。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":56,"t":"单选","q":"当前，经济全球化遭遇“逆风”，单边主义、保护主义抬头，部分国家搞脱钩断链，全球化进程受到干扰。但经济全球化是社会生产力发展的客观要求，历史大势不可逆转，不会因暂时的逆流而发生根本改变。这一论断蕴含的哲学道理是：","o":["事物发展的总趋势是前进上升的，发展的道路具有曲折性","矛盾的斗争性推动事物的运动、变化和发展","区分量变和质变的根本标志是事物变化是否超出度的范围","内部矛盾是事物变化发展的决定性因素"],"a":"A","e":"经济全球化遭遇逆流但大势不可逆转，说明总趋势是前进上升的、道路具有曲折性，A正确。B讲斗争性推动发展，C讲量变质变界限，D讲内因决定，均未对应“逆流不改大势”。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":57,"t":"单选","q":"2026 年5 月20 日，习近平同俄罗斯总统普京举行会谈。习近平指出，中俄关系一步一个脚印走到今天这个高度，是因为双方以“千磨万击还坚劲”的毅力不断深化政治互信和战略协作，以“更上一层楼”的精神拓展各领域合作，以“乱云飞渡仍从容”的勇气捍卫国际公道正义。下列哲学原理对应正确的是：","o":["“一步一个脚印”——主要矛盾对事物发展起决定作用","“千磨万击还坚劲”——事物的发展是前进性与曲折性的统一","“更上一层楼”——矛盾是事物发展的源泉和动力","“乱云飞渡仍从容”——发挥主观能动性是尊重客观规律的前提"],"a":"B","e":"“千磨万击还坚劲”说明在磨难中愈发坚韧，体现前进性与曲折性的统一，B正确。A“一步一个脚印”强调量的积累。C“更上一层楼”强调发展、质变。D“乱云飞渡仍从容”强调战略定力、尊重规律基础上发挥能动性，且“能动性是前提”本身说反了。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":58,"t":"单选","q":"2026 年6 月，国家发展改革委发布《关于总结推广上海浦东新区、深圳、厦门综合改革试点创新举措和经验做法的通知》，向全国推广新一批综合改革试点创新举措和经验做法。这批经验举措源于三地在“试验田”里的大胆探索、先行先试。上述材料体现的哲学道理是：\n①实践是认识的基础，推动认识的产生及深化\n②矛盾的普遍性寓于特殊性之中，并通过特殊性表现出来\n③获得正确认识是人类从事实践活动的根本目的\n④认识的发展必然推动实践的创新发展","o":["①②","③④","②③","①④"],"a":"A","e":"三地先行先试形成可复制经验并向全国推广，说明实践是认识的基础，\n②普遍性寓于特殊性之中，\n①②正确。\n③错，实践是认识的目的，获得认识不是根本目的。\n④错，认识有正确与错误之分，正确认识才推动实践。故选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":59,"t":"单选","q":"近年来，我国多地围绕低空经济展开密集探索：深圳率先出台低空经济产业促进条例，合肥开通全国首条商业化无人机物流航线，各地在试点运营中不断发现空域管理、安全标准、商业模式等方面的新问题，并据此调整政策方案和技术规范，推动低空经济从“概念验证”逐步走向“规模落地”。这一过程体现的哲学道理是：","o":["实践是认识的基础，认识在实践中不断深化和发展","真理与谬误相伴而行，认识运动是一种圆圈式的循环运动","辩证的否定的实质是“扬弃”，即既克服又保留","事物的量变必然引起质变，要重视量的积累"],"a":"A","e":"各地在试点中发现问题、调整政策和技术规范，推动低空经济走向规模落地，体现实践是认识的基础、认识在实践中深化，A正确。B错，认识运动是螺旋式上升，不是圆圈式循环。C讲辩证否定，D讲量变质变，均非题干主线。","v":true,"bad":false},{"b":"专项十套","s":"专项卷三","n":60,"t":"单选","q":"习近平指出：“道不可坐论，理不能空谈。学习党的创新理论的目的全在于运用。”各级干部要当好中国式现代化建设的坚定行动派、实干家。下列选项所蕴含的哲理与题干最不一致的是：","o":["橘生淮南则为橘，生于淮北则为枳","知屋漏者在宇下，知政失者在草野","道虽迩，不行不至；事虽小，不为不成","知之愈明，则行之愈笃；行之愈笃，则知之益明黑十专项卷四党的创新理论"],"a":"A","e":"题干强调“道不可坐论、理不能空谈”，重在实践中运用。B“知屋漏者在宇下”、C“道虽迩，不行不至”、D“行之愈笃”都强调实践、行动。A“橘生淮南则为橘”讲环境对事物的影响（外因、具体问题具体分析），与题干最不一致。故选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":61,"t":"单选","q":"社会发展的基本规律是生产力与生产关系、经济基础与上层建筑的矛盾运动及其规律。下列说法正确的有几项？\n①生产工具是生产力中的主导因素，是生产力发展水平的主要标志\n②生产资料所有制形式是生产关系的基础，是区分社会制度的根本标志\n③上层建筑中，政治上层建筑居主导地位，国家政权是核心\n④社会基本矛盾中经济基础与上层建筑的矛盾是更根本的","o":["1项","2项","3项","4项"],"a":"B","e":"①错，劳动者才是生产力中最活跃、起主导作用的因素，生产工具是生产力发展水平的主要标志。\n②正确，生产资料所有制是生产关系的基础、区分社会制度的根本标志。\n③正确，政治上层建筑居主导地位、国家政权是核心。\n④错，生产力与生产关系的矛盾更根本。共2项，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":62,"t":"单选","q":"我国持续深化户籍制度改革，破除城乡二元体制壁垒，推动公共服务均等化，进一步理顺城乡社会关系，释放城镇化发展活力，更好促进经济社会高质量发展。这一举措的哲学依据是：","o":["上层建筑一定要适合经济基础的发展状况","调整生产关系以解放和发展社会生产力","改革是社会发展的根本动力","社会意识可以促进社会存在的发展变化"],"a":"A","e":"户籍制度、城乡二元体制属于上层建筑中制度层面的调整，理顺后释放城镇化活力，体现上层建筑要适合经济基础状况，A正确。B讲生产关系调整，题干重点不在所有制与分配。C错，社会基本矛盾是社会发展的根本动力，改革是直接动力。D错，只有先进的社会意识才促进社会存在发展。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":63,"t":"单选","q":"习近平强调：“教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。”“人才是第一资源，综合国力竞争归根到底是人才竞争”。这些论断的哲学依据是：\n①科学技术是先进生产力的集中体现和主要标志\n②劳动者是生产力中最活跃、起主导作用的因素\n③人才是社会变革的决定力量\n④社会存在决定社会意识，人才观念是对社会存在的能动反映","o":["①②④","③④","②③","①②"],"a":"D","e":"“人才是第一资源”的哲学依据在于：科学技术是先进生产力的集中体现和主要标志（①），劳动者是生产力中最活跃、起主导作用的因素（②），故\n①②正确。\n③错，人民群众是社会变革的决定力量，不是人才。\n④讲社会存在与社会意识，不是题干论断的依据。故选D。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":64,"t":"单选","q":"习近平强调：“江山就是人民，人民就是江山。中国式现代化是全体人民共同参与、共同建设、共同享有的现代化，要尊重人民首创精神，充分调动广大群众干事创业的积极性，依靠人民群众不断创造新的发展业绩。”该论述的哲学依据是：\n①人民群众是社会变革的领导者，主导社会基本矛盾运动\n②人民群众是社会发展的根本动力，决定社会历史的发展规律\n③人民群众是社会历史的主体，是社会物质财富和精神财富的创造者\n④人民群众只有经过英雄人物的组织和引领，才能成为推动历史前进的真正力量","o":["①②","①③④","③","①②③④"],"a":"C","e":"“江山就是人民”说明人民群众是历史的主体，是物质财富和精神财富的创造者，\n③正确。\n①错，人民群众是历史的创造者，不是“领导者”。\n②错，社会基本矛盾是社会发展的根本动力。\n④错，人民群众不需要经过英雄人物引领才成为推动历史的力量。故选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":65,"t":"单选","q":"近期，人民日报撰文《银行该不该午休？》引发热议。文章指出，满足客户需求与保护员工权益，从来都不是一道“选择题”。银行保障一线员工休息的权益，这种做法值得鼓励，但在执行中，必须科学决策、细化举措，找准员工权益与客户需求之间的平衡点，比如银行可以通过大数据分析，动态掌握网点人流情况，开设潮汐窗口，合理分配人力。这体现的哲学道理是：\n①抓住矛盾的特殊性，坚持具体问题具体分析\n②一切从实际出发，做到客观符合主观\n③矛盾的斗争性是事物发展的源泉和动力\n④人民群众是历史的创造者，坚持群众观点和群众路线","o":["①②","①④","②③","③④"],"a":"B","e":"银行在员工权益与客户需求之间找平衡、靠大数据开潮汐窗口，体现具体问题具体分析（①）和群众观点、群众路线（④）。\n②错，应是主观符合客观。\n③错，矛盾双方既对立又统一，同一性与斗争性共同推动事物发展，单说斗争性不准确。故选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":66,"t":"单选","q":"2025 年12 月10 日，中央经济工作会议在京举行。下列关于做好新形势下经济工作的新认识和新体会，说法正确的有几项？\n①必须充分挖掘经济潜能\n②必须坚持政策支持和改革创新并举\n③必须做到既“放得活”又“管得好”\n④必须坚持从“投资于物”向“投资于人”转变\n⑤必须以苦练内功来应对外部挑战","o":["2项","3项","4项","5项"],"a":"C","e":"中央经济工作会议“五个必须”为：必须充分挖掘经济潜能、必须坚持政策支持和改革创新并举、必须做到既“放得活”又“管得好”、必须坚持投资于物和投资于人紧密结合、必须以苦练内功应对外部挑战。\n①②③⑤正确，\n④把“紧密结合”改成“由物向人转变”，表述错误。共4项，选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":67,"t":"单选","q":"2025 年12 月10 日，中央经济工作会议在京举行。下列关于2026 年经济工作重点任务的说法，正确的有几项？\n①坚持投资主导，建设强大国内市场\n②坚持创新驱动，加紧培育壮大新动能\n③坚持改革攻坚，增强高质量发展动力活力\n④坚持“双控”引领，推动全面绿色转型\n⑤坚持民生为大，努力为人民群众多办实事","o":["2项","3项","4项","5项"],"a":"B","e":"2026年重点任务表述为“坚持内需主导”“坚持‘双碳’引领”，\n①“投资主导”、\n④“双控引领”均错误；\n②创新驱动、\n③改革攻坚、\n⑤民生为大都正确。共3项，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":68,"t":"单选","q":"2025 年12 月10 日至11 日，中央经济工作会议在北京举行。下列关于2026 年经济工作的要求，说法正确的有几项？\n①围绕做强国内大循环，拓展内需增长新空间\n②围绕发展新质生产力，坚定不移深化改革扩大开放\n③围绕激发高质量发展的动力活力，推动科技创新和产业创新深度融合\n④围绕不断增进民生福祉，加大保障和改善民生力度\n⑤围绕守牢安全底线，稳妥做好重点领域风险化解","o":["2项","3项","4项","5项"],"a":"B","e":"要求是“围绕做强国内大循环拓展内需增长新空间、围绕激发高质量发展的动力活力坚定不移深化改革扩大开放、围绕发展新质生产力推动科技创新和产业创新深度融合、围绕增进民生福祉加大保障改善民生力度、围绕守牢安全底线稳妥化解重点领域风险”。\n②③把“动力活力”与“新质生产力”错配，\n①④⑤正确，共3项，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":69,"t":"单选","q":"《2026 年政府工作报告》指出，2025 年我国经济社会发展主要目标任务顺利完成，“十四五”圆满收官，中国式现代化迈出新的坚实步伐。下列关于我国2025 年发展成果，说法正确的是：\n①国内生产总值增长5%，总量首次超过130 万亿元\n②城镇新增就业1267 万人，城镇调查失业率平均为5.2%③粮食产量历史上首次突破1.3 万亿斤\n④新能源汽车年产量超过1600 万辆\n⑤常住人口城镇化率达到67.9%","o":["②④⑤","①④⑤","①②④⑤","②③④⑤"],"a":"A","e":"①错，2025年经济总量已超140万亿元，“首次超过130万亿元”是2024年。\n③错，粮食产量2024年已首破1.4万亿斤，2025年不是“首次突破1.3万亿斤”。\n②城镇新增就业1267万人、\n④新能源汽车年产超1600万辆、\n⑤常住人口城镇化率67.9%均正确，故选A。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":70,"t":"单选","q":"《2026 年政府工作报告》指出，2025 年我国经济社会发展主要目标任务顺利完成，“十四五”圆满收官，中国式现代化迈出新的坚实步伐。下列关于我国2025 年发展成果，说法正确的有几项？\n①实施学前一年免费教育政策、惠及1400 万儿童\n true,"bad":false},{"b":"专项十套","s":"专项卷四","n":75,"t":"单选","q":"《2026 年政府工作报告》指出，2026 年要着力建设强大国内市场，充分挖掘释放有效投资潜力。下列说法正确的有几项？\n①增强政府主导的有效投资增长动力，提高民生类政府投资比重\n②单列并降低用于项目建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜\n③统筹用好各类政府投资资金，支持工作基础较好的地方探索编制全口径政府投资计划\n④落实促进民间投资的政策措施，完善民营企业参与重大项目建设长效机制，引导民间投资向高技术、现代服务业等新赛道拓展","o":["1项","2项","3项","4项"],"a":"B","e":"①错，是“增强政府投资的有效带动作用”，不是“政府主导”。\n②错，应是“单列并适当提高”专项债券额度，“降低”与之相反。\n③正确，探索编制全口径政府投资计划。\n④正确，引导民间投资向新赛道拓展。共2项，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":76,"t":"单选","q":"《2026 年政府工作报告》指出，加紧培育壮大新动能。坚持把发展经济的着力点放在实体经济上，因地制宜发展新质生产力，建设现代化产业体系。下列说法正确的是：","o":["优化提升传统产业。实施新一轮制造业重点产业链高质量发展行动，强化产业基础再造和重大技术装备攻关，打造一批国家先进制造业集群","鼓励央企国企带头开放应用场景，打造集成电路、航空航天、低空经济等未来产业","培育发展量子科技、生物制造、具身智能、脑机接口、6G等新兴支柱产业","高效用好国家创业投资引导基金，大力发展创业投资、天使投资，社会投资基金要带头做耐心资本，推动更多初创企业加快成长为科技领军企业"],"a":"A","e":"A正确，优化提升传统产业的三项举措表述准确。B错，集成电路、航空航天、低空经济属新兴产业，不是未来产业。C错，量子科技、生物制造、具身智能等属未来产业，不是“新兴支柱产业”。D错，应“政府投资基金要带头做耐心资本”，不是社会投资基金。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":77,"t":"单选","q":"《2026 年政府工作报告》指出，加快高水平科技自立自强。下列说法正确的是：","o":["继续优化基础研究投入比重，降低长期稳定支持，逐步提高竞争性支持","建设北京（京津冀）、杭州（长三角）、粤港澳大湾区国际科技创新中心，打造世界级科技创新策源地","强化高校创新主体地位，支持高校牵头组建创新联合体，承担国家重大科技项目","深化人才发展体制机制改革，完善以创新能力、质量、实效、贡献为导向的评价体系"],"a":"D","e":"A错，是“提高长期稳定支持比重”，不是降低。B错，长三角国际科创中心在上海，不在杭州。C错，强化的是企业创新主体地位，高校是参与方。D正确，完善以创新能力、质量、实效、贡献为导向的评价体系。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":78,"t":"单选","q":"《2026 年政府工作报告》指出，纵深推进全国统一大市场建设。下列说法正确的是：","o":["鼓励地方政府经济促进行为，多出台差异化税收优惠、财政补贴政策","加强反垄断、反不正当竞争，强化公平竞争审查柔性约束","综合运用产能调控、标准引领、价格执法、质量监管等手段，鼓励“内卷式”竞争，营造良好市场生态","深化要素市场化配置综合改革试点，将更多符合条件的地区纳入试点范围"],"a":"D","e":"A错，是要清理地方违规税收优惠、财政补贴，不是鼓励差异化优惠。B错，公平竞争审查是刚性约束，不是“柔性”。C错，是要整治“内卷式”竞争，不是鼓励。D正确，深化要素市场化配置综合改革试点、扩大试点范围。","v":true,"bad":false},{"b":"专项十套","s":"专项卷四","n":79,"t":"单选","q":"《2026 年政府工作报告》指出，推进财税金融体制改革。下列说法正确的是：","o":["加大财政资源和预算统筹力度，降低国有资本收益收取比例","调整优化消费税征税范围、税率，并推进部分品目征收环节后移","规范金融机构竞争秩序，深入推进地方中小金融机构增量提质","进一步健全中长期资金入市机制，严控私募股权和创投基金退出渠道，提高直接融资、股权融资比重"],"a":"B","e":"A错，是“提高国有资本收益收取比例”，不是降低。B正确，调整优化消费税征税范围、税率并推进部分品目 义”是邓小平理论回答的问题，“三个代表”回答的是建设什么样的党、怎样建设党。B错，基本路线和“三步走”战略是邓小平提出的。C错，三大基本经济制度是党的十九届四中全会明确的。","v":true,"bad":false},{"b":"专项十套","s":"专项卷七","n":131,"t":"单选","q":"2026 年8 月17 日，习近平在纪念江泽民同志诞辰100周年大会上发表重要讲话指出，我们要学习江泽民同志深谋远虑的战略思维。下列能够体现江泽民同志战略思维的是：\n①从二十一世纪头20 年是我国必须紧紧抓住并且可以大有作为的重要战略机遇期这一重大判断出发，对全面建设小康社会、实现第三步战略目标进行前瞻性谋划\n②坚持把改革作为党执政兴国的第一要务，引领我们聚精会神搞建设、一心一意谋改革\n③领导我们积极发展社会主义民主政治，实施全面依法治国基本方略\n④领导实现香港、澳门顺利回归，推动两岸双方达成体现一个中国原则的“九二共识”","o":["①②③④","①④","②③","②③④"],"a":"B","e":"①正确，基于重要战略机遇期判断对全面建设小康社会、第三步战略目标前瞻谋划。\n④正确，实现港澳顺利回归、推动达成“九二共识”。\n②错，执政兴国的第一要务是“发展”，不是改革。\n③错，“全面依法治国”是新时代的表述，江泽民时期是确立依法治国基本方略。故为\n①④，选B。","v":true,"bad":false},{"b":"专项十套","s":"专项卷七","n":132,"t":"单选","q":"2026 年7 月17 日，习近平在上海出席2026 世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话。当前，世界百年变局加速演进，新一轮科技革命和产业变革加速突破，全球人工智能技术创新进入前所未有的活跃期，既蕴含巨大机遇，也面临治理挑战。人类不得不直面的时代之问是：\n①当机器开始思考，人类如何与之相处？\n②当算法参与决策，安全如何保障？\n③当技术挑战伦理，治理如何跟上？\n④当鸿沟不断拉大，普惠如何实现？","o":["①②③","①②④","②③④","①②③④"],"a":"D","e":"四项都是人工智能时代的“时代之问”：机器开始思考人类如何相处、算法参与决策安全如何保障、技术挑战伦理治理如何跟上、鸿沟拉大普惠如何实现。故选D。","v":true,"bad":false},{"b":"专项十套","s":"专项卷七","n":133,"t":"单选","q":"2026 年7 月17 日，习近平在上海出席2026 世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话。下列属于应对“时代之问”举措的是：\n①坚持绿色转型，共建美丽家园\n②强化风险意识，确保安全可控\n③鼓励包容并蓄，促进文明互鉴\n④倡导和衷共济，完善全球治理","o":["①②③④","①②④","①②③","②③④"],"a":"D","e":"②正确，强化风险意识、确保安全可控。\n③正确，鼓励包容并蓄、促进文明互鉴。\n④正确，倡导和衷共济、完善全球治理。\n①“坚持绿色转型、共建美丽家园”属于全球发展倡议、生态议题，不属于应对人工智能“时代之问”的举措。故为\n②③④，选D。","v":true,"bad":false},{"b":"专项十套","s":"专项卷七","n":134,"t":"单选","q":"2026 年7 月17 日，习近平在上海出席2026 世界人工智能大会暨人工智能全球治理高级别会议开幕式并发表主旨讲话。下列相关说法，正确的有几项？\n①鼓励开源开放、合作共享，全面促进人工智能科技创新、产业发展、场景应用\n②共同反对在人工智能领域泛化国家安全概念、把本国安全凌驾于他国安全之上的做法\n③用全人类共同价值塑造人工智能的价值观，善用人工智能技术增进不同文明的理解和包容\n④切实发挥联合国的重要作用，加强人工智能发展战略、治理规则、技术标准的对接协调","o":["1项","2项","3项","4项"],"a":"D","e":"四项均正确：鼓励开源开放合作共享、反对泛化国家安全概念、用全人类共同价值塑造人工智能价值观、发挥联合国重要作用加强规则标准对接。故选D。","v":true,"bad":false},{"b":"专项十套","s":"专项卷七","n":135,"t":"单选","q":"2026 年9 月1 日，习近平出席上合组织峰会。习近平指出，今年是上海合作组织成立25 周年。25 年来，上海合作组织走过不平凡历程。下列关于上海合作组织的发展，说法不正确的是：","o":["最重大的发展成就是一步步成为世界上幅员最广、人口最多、发展潜力巨大的新型区域合 {"b":"专项十套","s":"专项卷八","n":157,"t":"单选","q":"2026 年6 月，全国东西部协作工作会议在宁夏银川召开。习近平对常态化做好东西部协作工作作出重要指示。下列相关说法，正确的有几项？\n①东西部协作开展30 年来，在助力脱贫攻坚、促进区域协调发展等方面发挥了重要作用，彰显了我们党的政治优势和我国社会主义制度的优越性\n②甘宁协作是习近平总书记亲自开创、部署、推动的东西部协作重要决策\n③要进一步完善协作机制，优化协作方式，拓展协作领域，推动东西部产业互补、人员互动、技术互学、观念互通、作风互鉴，实现互利共赢、共同发展\n④各级党委和政府要认真落实常态化帮扶责任，扎实推进乡村全面振兴，推动全体人民共同富裕在本世纪中叶全面实现","o":["4项","3项","2项","1项"],"a":"C","e":"①正确，东西部协作30年彰显政治优势和制度优势。\n③正确，完善机制、拓展领域、互利共赢。\n②错，是“闽宁协作”，不是“甘宁协作”。\n④错，共同富裕是长期历史过程，“本世纪中叶全面实现”不准确。共2项，选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷八","n":158,"t":"单选","q":"2026 年7 月，全国基础教育工作会议在京召开。习近平对基础教育工作作出重要指示。党的十八大以来，党中央把基础教育作为基础性、先导性工作来抓，多措并举推动基础教育实现长足发展，为建设教育强国提供了有力支撑。下列相关说法，正确的有几项？\n①要以加强师德师风建设为教育的根本任务，坚持不懈用党的创新理论铸魂育人，培养德智体美劳全面发展的社会主义建设者和接班人\n②要遵循教育规律，落实健康第一教育理念，提升教育教学质量，促进广大学生身心健康、成长成才\n③要适应人民群众新期盼，推进基础教育扩优提质，牢牢守住教育公平底线\n④要推动学校、家庭、社会各自发力，不断开创基础教育高质量发展新局面","o":["4项","3项","2项","1项"],"a":"C","e":"②正确，落实健康第一理念、提升教育教学质量。\n③正确，推进扩优提质、守住教育公平底线。\n①错，教育的根本任务是立德树人，不是师德师风建设。\n④错，是学校、家庭、社会“协同育人”，不是各自发力。共2项，选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷八","n":159,"t":"单选","q":"党的十八大以来，党中央把基础教育作为基础性、先导性工作来抓，多措并举推动基础教育实现长足发展，为建设教育强国提供了有力支撑。下列说法正确的是：","o":["基础教育包括学前教育、义务教育、高中教育、高等教育","当前我国学前教育、义务教育、高中教育、高等教育毛入学率已超过90%","要坚持教育高质量发展，把基础教育作为龙头，高等教育作为基点","我国已建成了世界上规模最大且有质量的基础教育体系，基础教育总体已经达到世界高收入国家的平均水平"],"a":"D","e":"A错，基础教育包括学前教育、义务教育和普通高中教育，不包括高等教育。B错，只有义务教育毛入学率超过90%，学前和高中尚未达到。C错，基点与龙头说反了。D正确，我国建成世界最大规模且有质量的基础教育体系，总体达到高收入国家平均水平。","v":true,"bad":false},{"b":"专项十套","s":"专项卷八","n":160,"t":"单选","q":"2026 年8 月，习近平对树立和践行正确政绩观作出重要指示。下列说法正确的有几项？\n①要经常性开展政绩观教育，重点抓好对地方党政正职、新提拔干部、年轻干部、关键岗位干部的教育培训\n②要坚持常态化查改问题，对需要长期整改的政绩观偏差突出问题盯紧不放、跟踪问效，深化新官不理旧账整改整治\n③要结合巡视巡察、审计监督、统计监督等精准发现问题，增强针对性和穿透力，扎实推动整改\n④要用好考核指挥棒，完善统一标准的考核评价体系，树立重实干重实绩的选人用人导向，让敢于负责、勇于担当、善于作为、实绩突出的干部受到重用\n⑤要加强政绩观行为的管理监督，严格执行民主集中制，对领导干部定期谈话提醒，及时发现并纠正苗头性倾向性问题","o":["2项","3项","4项","5项"],"a":"C","e":"①正确，经常性开展政绩观教育、突出重点对象。\n②正确，常态化查改问题、深化新官不理旧账整治。\n③正确，结合巡视巡察、审计、统计监督精准发现问题。\n⑤正确，加强管理监督、严格执行民主集中制。\n④错，考核评价应是“差异化、精准化”，不是“统一标准”。共4项，选C。","v":true,"bad":false},{"b":"
