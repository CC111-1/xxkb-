:"专项卷十","n":198,"t":"单选","q":"2026 年3 月，《关于做好第二轮土地承包到期后再延长30 年试点工作的意见》发布。下列相关要求，说法正确的是：","o":["村民出嫁至外村，发包方须收回其承包地","可适度打破原集体土地所有权的界限在全村范围内推行平均承包","逐步推行市场化改革，农村集体土地可以由本集体经济组织外的成员有偿进行承包","坚持维护农村社会稳定，尊重历史、照顾现实，统筹考虑、循序渐进，科学合理安排进度"],"a":"D","e":"A错，村民出嫁至外村，承包地不应被强行收回。B错，不得打破集体土地所有权界限搞平均承包。C错，集体土地承包限于本集体经济组织成员，不对外有偿承包。D正确，坚持维护农村社会稳定、尊重历史照顾现实、循序渐进。","v":true,"bad":false},{"b":"专项十套","s":"专项卷十","n":199,"t":"单选","q":"2026 年3 月，《关于做好第二轮土地承包到期后再延长30 年试点工作的意见》发布。《意见》指出，要稳妥有序开展延包试点。下列相关举措，说法不正确的是：","o":["开展延包试点，以农村承包地确权登记颁证成果为基础，以第二轮土地承包合同到期为起点再延长承包期30年","以户为单位开展延包，确保绝大多数农户原有承包地继续保持稳定，不能推倒重来、打乱重分，不能借机违法调整或收回农户承包地","坚持“小调整、大稳定”，“大稳定”的前提是“小调整”","“小调整”仅限于少数存在承包地因自然灾害毁损等特殊情形且群众普遍要求调地的村组"],"a":"C","e":"本题选不正确项。C错在颠倒：是“大稳定、小调整”，“大稳定”是前提，“小调整”是在大稳定基础上的调整。A以确权成果为基础、以合同到期为起点再延30年，B以户为单位、不得推倒重来打乱重分，D“小调整”仅限特殊情形且群众普遍要求调地的村组，均正确。故选C。","v":true,"bad":false},{"b":"专项十套","s":"专项卷十","n":200,"t":"单选","q":"2026 年3 月，《关于做好第二轮土地承包到期后再延长30 年试点工作的意见》发布。《意见》指出，要稳妥有序开展延包试点。下列相关举措，说法正确的有几项？\n①延包工作小组由本村村委会成员决定产生\n②延包方案由农民集体在法律和政策范围内民主协商，在本集体经济组织范围内公示不少于15 日\n③延包方案涉及承包地调整的，应当报乡（镇）政府农业农村主管部门批准\n④县级以上地方政府农业农村主管部门、乡（镇）政府要加强对延包方案制定和实施的指导监督","o":["1项","2项","3项","4项"],"a":"B","e":"②正确，延包方案民主协商、公示不少于15日。\n④正确，县级以上农业农村部门和乡镇政府加强指导监督。\n①错，延包工作小组由本集体经济组织成员“民主推选”产生，不是村委会成员决定。\n③错，涉及承包地调整的应报“县级”政府农业农村主管部门批准。共2项，选B。","v":true,"bad":false},{"b":"黑五卷","s":"黑五卷·一","n":1,"t":"单选","q":"2026 年10 月22 日，纪念中国工农红军长征胜利90 周年大会隆重举行。习近平总书记指出，正是在党的正确路线指引下，红军作战指挥实行了一系列符合实际、机动灵活的战略战术，从而成功突破敌人层层封锁，不断走向新生、走向胜利。历史雄辩地证明，马克思主义基本原理只有同中国具体实际紧密结合，才能解决中国的问题，才能展现出强大生命力。这段材料体现的哲学道理是：\n①物质决定意识，主观必须符合客观，做到一切从实际出发\n②事物发展是前进性与曲折性的统一，在曲折中不断走向胜利\n③矛盾的普遍性与特殊性相互联结，坚持共性与个性具体的历史的统一\n④先进的社会意识可以正确预见社会发展方向，积极推动社会发展","o":["①②③④","①②④","①②","③④"],"a":"A","e":"①符合题意：“红军作战指挥实行了一系列符合实际、机动灵活的战略战术”，强调从中国革命的实际情况出发制定战略战术，体现了物质决定意识，主观必须符合客观，做到一切从实际出发。\n②符合题意：“成功突破敌人层层封锁，不断走向新生、走向胜利”，红军长征历经艰难险阻，但最终走向胜利，体现了事物发展是前进性与曲折性的统一，在曲折中不断走向胜利。\n③符合题意：“马克思主义基本原理只有同中国具体实际紧密结合，才能解决中国的问题”，直接体现了矛盾的普遍性与特殊性相互联结，坚持共性与个性具体的历史的统一。\n④符合题意：“正是在党的正确路线指引下.……….不断走向胜利”“马克思主义·….·展现出强大生命力”，党的正确路线、马克思主义作为先进的社会意识，能够正确预见社会发展方向，对社会发展起积极的推动作用。故本题答案为A。“，“，中士【】‘高度重视自身建设”，都是在强调事物的变化发展主要是由内因推动的，内因是事物变化发展的根据和根本动力，要着眼于自身、加强自身建设。\n①符合题意：“勇于自我革命是我们党最鲜明的品格、最大的优势”，即通过党自身的自我革命实现自我完善、自我提高，依靠自身力量解决自身问题，体现了内因是事物变化发展的根据，与题干哲理一致。\n②不符合题意：“江山就是人民，人民就是江山”强调的是人民群众是历史的创造者，要坚持群众观点和群众路线，与题干哲理不一致。\n③不符合题意：“抓住领导干部这个‘关键少数’”体现的是在复杂事物中抓主要矛盾、抓重点的哲学道理，与题干哲理不一致。\n④符合题意：“必须以苦练内功来应对外部挑战”，苦练内功强调的是内因，体现了重视内因、着眼于自身发展的道理，与题干哲理一致。5不符合题意：“以愚公移山、精卫填海的精神一抓到底”强调的是发挥主观能动性、重视量的积累、持之以恒的道理，与题干哲理不一致。故本题答案为C。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":2,"t":"单选","q":"2026 年7 月1 日，庆祝中国共产党成立105 周年大会在京举行。习近平总书记指出，我们党清醒认识到打铁必须自身硬，善于以时代发展要求审视自己、以强烈忧患意识警醒自己、以自我革命精神完善自己，高度重视自身建设，坚决清除一切损害党的先进性和纯洁性的因素、清除一切侵蚀党的健康肌体的病毒，在革命性锻造中更加坚强有力。下列选项蕴含的哲学道理和题干一致的是：\n①勇于自我革命，是我们党最鲜明的品格，也是我们党最大的优势\n②江山就是人民，人民就是江山\n③从严治党，关键是要抓住领导干部这个“关键少数”\n④必须以苦练内功来应对外部挑战\n⑤反腐败斗争永远在路上、永远是进行时，必须以愚公移山、精卫填海的精神一抓到底","o":["①②③","①③④⑤","①④","②④⑤"],"a":"C","e":"“，中士【】‘高度重视自身建设”，都是在强调事物的变化发展主要是由内因推动的，内因是事物变化发展的根据和根本动力，要着眼于自身、加强自身建设。\n①符合题意：“勇于自我革命是我们党最鲜明的品格、最大的优势”，即通过党自身的自我革命实现自我完善、自我提高，依靠自身力量解决自身问题，体现了内因是事物变化发展的根据，与题干哲理一致。\n②不符合题意：“江山就是人民，人民就是江山”强调的是人民群众是历史的创造者，要坚持群众观点和群众路线，与题干哲理不一致。\n③不符合题意：“抓住领导干部这个‘关键少数’”体现的是在复杂事物中抓主要矛盾、抓重点的哲学道理，与题干哲理不一致。\n④符合题意：“必须以苦练内功来应对外部挑战”，苦练内功强调的是内因，体现了重视内因、着眼于自身发展的道理，与题干哲理一致。5不符合题意：“以愚公移山、精卫填海的精神一抓到底”强调的是发挥主观能动性、重视量的积累、持之以恒的道理，与题干哲理不一致。故本题答案为C。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":3,"t":"单选","q":"习近平总书记指出，基础研究是打基础、利长远的事业，既不能急功近利，也不可消极无为，要有“前人栽树、后人乘凉”的境界和担当，有“十年磨一剑”的恒心和毅力。这体现的哲学道理是：\n①量变达到一定程度必然引起质变，量变比质变更重要\n②联系具有普遍性、客观性，人们可以根据自身需要建立新的具体联系\n③价值观对人的行为具有重要的导向作用，要坚持正确的价值判断和价值选择\n④正确发挥主观能动性要以尊重客观规律为前提和基础","o":["①②","②④","③④","①③"],"a":"C","e":"①说法错误：“量变比质变更重要”表述错误。量变与质变二者地位不同、作用不同，但不能比较谁“更重要”，也不存在敦轻敦重的问题。\n②说法错误：“人们可以根据自身需要建立新的具体联系”说法错误。联系的客观性要求人们只能根据事物固有的联系，通过改变事物的状态、调整原有的联系来建立新的具体联系，而不能“根据自身需要”随意建立。\n③符合题意：‘前人栽树、后人乘凉”的境界和担当、“不能急功近利”的价值取向，直接体现了价值观作为一种社会意识对人的行为具有重要的导向作用，要求人们自觉树立正确的价值观，坚持正确的价值判断和价值选择，把当前利益与长远利益、个人价值与社会价值统一起来。\n④符合题意：“十年磨一剑”的恒心和毅力是充分发挥主观能动性的表现；“不能急功近利”“打基础、利长远”则要求尊重基础研究周期长、见效慢的客观规律，从实际出发、按规律办事。二者结合体现了正一次相遇确发挥主观能动性必须以尊重客观规律为前提和基础。故本题答案为C。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":4,"t":"单选","q":"“六个必须坚持”是习近平新时代中国特色社会主义思想的世界观和方法论，深刻揭示了这一思想的理论品格和鲜明特质，构成相互联系、内在统一的有机整体。下列对应准确的是：","o":["推进改革发展往往牵一发而动全身——坚持人民至上","既不能刻舟求剑、封闭僵化，也不能照抄照搬、食洋不化——坚持自信自立","为解决人类面临的共同问题作出贡献——坚持问题导向","人民的创造性实践是理论创新的不竭源泉——坚持守正创新"],"a":"B","e":"A项对应错误：推进改革发展往往牵一发而动全身对应坚持系统观念。B项对应正确：“不能照抄照搬、食洋不化”强调了不直接抄国外模式，要立足本国国情，依靠自身力量，体现了坚持自信自立。这句话出自党的二十大报告，习近平总书记指出：“党的百年奋斗成功道路是党领导入民独立自主探索开辟出来的，马克思主义的中国篇章是中国共产党人依靠自身力量实践出来的，贯穿其中的一个基本点就是中国的问题必须从中国基本国情出发，由中国人自己来解答。我们要坚持对马克思主义的坚定信仰、对中国特色社会主义的坚定信念，坚定道路自信、理论自信、制度自信、文化自信，以更加积极的历史担当和创造精神为发展马克思主义作出新的贡献，既不能刻舟求剑、封闭僵化，也不能照抄照搬、食洋不化。”C项对应错误：为解决人类面临的共同问题作出贡献对应坚持胸怀天下。D项对应错误：人民的创造性实践是理论创新的不竭源泉对应坚持人民至上。故本题答案为B。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":5,"t":"单选","q":"习近平总书记指出，中国式现代化是我们党领导全国各族人民在长期探索和实践中历经千辛万苦、付出巨大代价取得的重大成果，我们必须倍加珍惜、始终坚持、不断拓展和深化。下列相关说法，正确的有几项？\n①一个国家走向现代化，最重要的是要遵循世界现代化一般规律\n②全体人民共同富裕的现代化，这是中国式现代化的本质特征\n③中国式现代化是人类历史上规模最大的现代化，也是难度最大的现代化\n④中国式现代化走得通、行得稳，是强国建设、民族复兴的唯一正确道路\n⑤中国式现代化，拓展了发展中国家走向现代化的路径选择，为人类对更好社会制度的探索提供了中国方案","o":["1 项","2 项","3 项","4 项"],"a":"D","e":"①说法错误：一个国家走向现代化，既要遵循现代化一般规律，更要符合本国实际，具有本国特色。\n②③④5说法正确。故本题答案为D。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":6,"t":"单选","q":"2025 年12 月，第24 期《求是》杂志发表习近平总书记重要文章《扩大内需是战略之举》。文章指出，扩大内需既关系经济稳定，也关系经济安全，不是权宜之计，而是战略之举。下列说法正确的是：","o":["当产能总体过剩时，扩大内需可进一步通过扩大规模投资来提高发展速度和边际效用","要增强投资对经济增长的基础作用，更要有效发挥消费对优化供给结构的关键作用","要把扩大内需战略同深化供给侧结构性改革有机结合起来，形成供给牵引需求、需求创造供给的更高水平动态平衡","需求侧管理，重在解决总量性问题，主要是通过调节税收、财政支出、货币信贷等来刺激或抑制需求，进而推动经济增长"],"a":"D","e":"A项说法错误：过去，我国生产能力滞后，因而把工作重点放在扩大投资、提高生产能力上。现在，产能总体过剩，仍一味靠扩大规模投资抬高速度，作用有限且边际效用递减。B项说法错误：在扩大有效投资、发挥投资关键作用的同时，必须更加有效地发挥消费对增长的基础作用。C项说法错误：要把扩大内需战略同深化供给侧结构性改革有机结合起来，形成需求牵引供给、供给创造需求的更高水平动态平衡。D项说法正确：需求侧管理，重在解决总量性问题，注重短期调控，主要是通过调节税收、财政支出、货币信贷等来内部货科刺激或抑制需求，进而推动经济增长。供给侧管理，重在解决结构性问题，注重激发经济增长动力，主要通过优化要素配置和调整生产结构来提高供给体系质量和效率，进而推动经济增长。故本题答案为D。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":7,"t":"单选","q":"要发挥区域协调发展战略、区域重大战略、主体功能区战略、新型城镇化战略叠加效应，统筹推进区域内战略深化实施和区域间联动发展，优化重大生产力布局，发挥重点区域增长极作用，构建优势互补、高质量发展的区域经济布局和国土空间体系。下列相关举措，说法正确的是：","o":["鼓励东北地区率先推进现代化，加强原创性、颠覆性科技创新，引领建设具有国际竞争力的先进制造业集群和现代服务业高地","支持京津冀、长三角、黄河中游城市群打造世界级城市群，巩固提升动力源作用","促进城市化地区增强经济人口集聚承载能力、农产品主产区提升农业综合生产能力、重点生态功能区改善自然生态系统质量","推进以县城为核心的新型城镇化建设，要把推进农业转移人口市民化作为首要任务"],"a":"C","e":"A项说法错误：推动西部大开发形成新格局，推动东北全面振兴取得新突破，促进中部地区加快崛起，鼓励东部地区加快推进现代化。由此可知，“鼓励东北地区率先推进现代化”说法错误。B项说法错误：巩固提升京津冀、长三角、粤港澳大湾区动力源作用。D项说法错误：推进以人为核心的新型城镇化建设，要分类推进以县城为重要载体的城镇化建设。故本题答案为C。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":8,"t":"单选","q":"2026 年10 月26 日至29 日，党的二十届五中全会召开，会议审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。党的十八大以来，习近平总书记创造性提出“依规治党”并作出一系列重要论述。下列说法正确的有几项？\n①加强党内法规制度建设是全面从严治党的长远之策、根本之策\n②要增强制度执行力，法规制度的生命力在于监督\n③完善的党内法规体系是中国特色社会主义法治体系的重要内容\n④完善党内法规制度体系，重点是做好顶层设计、查漏补缺、提质增效文章\n⑤必须坚持把宪法作为全党的根本行为规范","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"②说法错误：要增强制度执行力，法规制度的生命力在于执行。5说法错误：必须坚持把党章作为全党的根本行为规范。\n①③④说法正确。故本题答案为B。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":9,"t":"单选","q":"2026 年10 月22 日，纪念中国工农红军长征胜利90 周年大会在京隆重举行。下列属于伟大长征精神的是：\n①把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利的精神\n②为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲的精神\n③坚持独立自主、实事求是，一切从实际出发的精神\n④顾全大局、严守纪律、紧密团结的精神\n⑤紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗的精神\n⑥开天辟地、敢为人先的首创精神","o":["①②③④⑤","①②③⑤⑥","①③④⑤⑥","②③④⑤⑥"],"a":"A","e":"①②③④5均属于伟大长征精神内涵。6说法错误：“开天辟地、敢为人先的首创精神”属于红船精神。故本题答案为A。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":10,"t":"单选","q":"2026 年10 月12 日至13 日，全国卫生与健康大会在京召开。下列相关举措，说法正确的有几项？\n①要增强思想自觉和行动自觉，坚定不移走中国特色卫生与健康发展道路\n②要牢固树立健康优先导向，推进人民健康与经济社会协调发展\n③要坚持从保基本向提品质转变，更好满足人民群众多样化健康需求\n④要坚守基本医疗卫生事业的公益性，夯实全民健康根基\n⑤要深化改革创新和开放合作，持续增强卫生与健康事业发展动力活力","o":["2 项","3 项","4 项","5 项"],"a":"C","e":"③说法错误：坚持保基本和提品质并重，更好满足人民群众多样化健康需求。\n①②④5说法正确。故本题答案为C。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":11,"t":"单选","q":"2026 年10 月9 日，《中共中央国务院关于发展新质生产力的意见》发布。《意见》指出，要改造提升传统产业、培育壮大新兴产业、前瞻布局未来产业。下列属于“培育壮大新兴产业”相关举措的是：\n①巩固提升矿业、冶金、化工等产业在全球产业分工中的地位和竞争力\n②加快新一代信息技术、新能源、新材料、智能网联新能源汽车等产业发展\n③推动量子科技、氢能和核聚变能、具身智能、第六代移动通信等产业发展\n④在确保安全前提下，推动低空经济、商业航天健康有序发展","o":["①③","①④","②③","②④"],"a":"D","e":"①属于“改造提升传统产业”方面的举措。\n③属于“前瞻布局未来产业”方面的举措。\n②④说法正确。故本题答案为D。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":12,"t":"单选","q":"2026 年9 月1 日，习近平总书记在上海合作组织峰会上发表讲话指出，今年是上海合作组织成立25 周年。25 年来，上海合作组织走过不平凡历程。关于上海合作组织，下列说法不正确的是：","o":["最重大的发展成就是一步步成为世界上幅员最广、人口最多、发展潜力巨大的新型区域合作组织","最宝贵的精神财富是开创性提出和始终遵循互信、互利、平等、协商、尊重多样文明、谋求共同发展的“上海精神”","最重要的合作经验是找到不结盟、不对抗、不针对第三方的正确共处之道","最核心的组织定位是成为当今世界最具影响力的新兴市场和发展中国家合作平台"],"a":"D","e":"A、B、C项说法正确：习近平总书记指出，今年是上海合作组织成立25周年。25年来，上海合作组织走过不平凡历程。最重大的发展成就是一步步成为世界上幅员最广、人口最多、发展潜力巨大的新型区域合作组织；最宝贵的精神财富是开创性提出和始终遵循互信、互利、平等、协商、尊重多样文明、谋求共同发展的“上海精神”；最重要的合作经验是找到不结盟、不对抗、不针对第三方的正确共处之道，推动地区国家携手建设共同家园。D项说法错误：当今世界最具影响力的新兴市场和发展中国家合作平台是金砖合作机制。故本题答案为D。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":13,"t":"单选","q":"《2026 年政府工作报告》指出，要坚持内需主导，统筹促消费和扩投资，拓展内需增长新空间，更好发挥我国超大规模市场优势。下列说法正确的有几项？\n①增强政府主导的有效投资增长动力，提高民生类政府投资比重\n②单列并降低用于项目建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜\n③制定实施城乡居民增收计划，在促进低收入群体增收、增加居民财产性收入、完善薪酬和社保制度等方面推出一批务实举措\n④扩大个人消费贷款和服务业经营主体贷款贴息政策支持领域，提高贴息上限","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：增强市场主导的有效投资增长动力，提高民生类政府投资比重。\n②说法错误：单列并提高用于项目建设的地方政府专项债券额度，继续向投资项目准备充分、资金用得好的地方倾斜。\n③④说法正确。故本题答案为B。内部货科","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":14,"t":"单选","q":"2026 年1 月，中国共产党第二十届中央纪律检查委员会第五次全体会议召开。下列说法正确的是：","o":["党的自我革命重在授权，把权力关进制度笼子是全面从严治党的重要任务","深化巡察巡视上下联动，加强对省区市巡察、对村巡视工作指导督导","持续深化群众身边不正之风和腐败问题集中整治，推动省级主战场持续深化整治工作，发挥群众监督作用","把权力关进制度笼子，既要不断完善制度规定，使制度密而不繁、有效管用，又要着力提高制度执行力，增强刚性约束"],"a":"D","e":"A项说法错误：党的自我革命重在治权，把权力关进制度笼子是新时代全面从严治党的一项重要任务。B项说法错误：深化巡视巡察上下联动，加强对省区市巡视、中央单位内部巡视、对村巡察工作指导督导。C项说法错误：推动县级主战场持续深化整治工作，发挥群众监督作用，提升基层监督能力。故本题答案为D。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":15,"t":"单选","q":"2026 年9 月，第18 期《求是》杂志发表习近平总书记重要文章《在加强基础研究座谈会上的讲话》。文章指出，要优化基础研究系统布局。下列举措说法正确的是：\n①要把准目标方向，坚持“四个面向”战略导向，从国家急迫需要和长远需求出发，进一步明确基础研究的主攻方向和重点领域\n②要强化力量协同，发挥新型举国体制优势，强化国家实验室、国家科研机构、高水平研究型大学等引领作用\n③要鼓励和规范发展新型研发机构，推动国家实验室主导的产学研深度融合，打通基础研究、应用开发、成果转化的创新链条\n④要健全学科布局，完善学科设置调整机制，加强基础学科建设，促进应用学科与基础学科协调发展，鼓励多学科交叉融合和跨学科研究","o":["②③④","①②④","①③④","①②③"],"a":"B","e":"③说法错误：强化力量协同，发挥新型举国体制优势，强化国家实验室、国家科研机构、高水平研究型大学等引领作用，鼓励和规范发一次相遇展新型研发机构，推动企业主导的产学研深度融合，打通基础研究、应用开发、成果转化的创新链条。\n①②④说法正确。故本题答案为B。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":16,"t":"单选","q":"2026 年4 月，全国服务业大会在京召开。习近平总书记就服务业发展作出重要指示。下列相关说法，正确的是：","o":["我国服务业规模稳步扩大，质效持续提升，在支撑产业升级、满足民生需要、带动就业扩容等方面发挥了重要作用，服务贸易规模稳居全球第二","要突出供给牵引、改革攻坚、科技赋能、开放合作，深入实施服务业扩能提质行动","要推进生活性服务业向专业化和价值链高端延伸，促进生产性服务业高品质多样化便利化发展","要扩大服务业高水平对外开放，服务业领域外资准入负面清单已实现清零"],"a":"A","e":"B项说法错误：突出需求牵引、改革攻坚、科技赋能、开放合作，深入实施服务业扩能提质行动。C项说法错误：要推进生产性服务业向专业化和价值链高端延伸，要促进生活性服务业高品质多样化便利化发展。D项说法错误：“十四五”时期，制造业领域外资准入负面清单已实现清零。“十五五”规划纲要指出，放宽服务领域准入，扩大服务业高水平对外开放。但“放宽服务领域准人”不等于“完全放开”，服务业领域外资准人负面清单并未实现清零。故本题答案为A。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":17,"t":"单选","q":"2026 年3 月，《关于做好第二轮土地承包到期后再延长30 年试点工作的意见》发布。下列相关要求，说法正确的是：","o":["牢牢把住提高农民收入这条主线，坚持把依法维护农民权益作为出发点和落脚点","逐步推行市场化改革，农村集体土地可以由本集体经济组织外的成员有偿进行承包","不断完善“三权分置”政策体系，落实集体所有权、稳定土地经营权、放活农户承包权","坚持农民主体地位，充分发挥农民主动性和创造性，鼓励农民集体在法律和政策范围内因地制宜探索延包具体路径和办法"],"a":"D","e":"A项说法错误：牢牢把住处理好农民和土地关系这条主线，坚持把依法维护农民权益作为出发点和落脚点。B项说法错误：农村集体土地家庭承包，仅限本集体经济组织内部农户。外部主体可以流转经营权，但不能取得承包权。C项说法错误：不断完善三权分置政策体系，落实集体所有权、稳定农户承包权、放活土地经营权。故本题答案为D。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":18,"t":"单选","q":"2026 年6 月，《美丽中国建设“十五五”规划》发布，这是我国生态环境领域第一部以“美丽中国建设”命名的五年规划。下列相关说法，正确的有几项？\n①到2030 年，绿色生产生活方式基本形成，碳中和目标如期实现\n②京津冀及周边地区、长三角地区和汾渭平原，推动煤炭消费总量保持下降趋势、新改扩建用煤项目依法实行煤炭等量或增量替代\n③持续巩固以青藏高原生态屏障区、黄河重点生态区、长江重点生态区、东北森林带、北方防沙带、南方丘陵山地带、海岸带等“三区四带”为骨架的国家生态安全屏障体系\n④建立健全以国家公园为主体的自然保护地体系，自然保护地面积占陆域国土面积比例不低于18%⑤有序扩大全国碳排放权交易市场覆盖行业范围、扩展参与主体，对碳排放总量相对稳定的行业优先实施配额总量控制，稳妥推行免费和有偿相结合的配额分配方式","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"①说法错误：到2030年，绿色生产生活方式基本形成，碳达峰目标如期实现。2060年实现碳中和目标。\n②说法错误：京津冀及周边地区、长三角地区和汾渭平原，推动煤炭消费总量保持下降趋势、新改扩建用煤项目依法实行煤炭等量或减量替代。\n③④5说法正确。故本题答案为B。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":19,"t":"单选","q":"2026 年，习近平总书记多次给有关方面和各界群众致信回信，以殷殷嘱托激励他们踔厉奋发、勇毅前行，积极投身强国建设、民族复兴伟业。下列致信回信的内容与其对象对应正确的是：\n①赓续千年书院学脉，弘扬“实事求是、敢为人先”的精神，努力培养更多经世致用的优秀人才——四所交通大学全体师生\n②扎根通信技术岗位辛勤付出一辈子，期颐之年仍关心党和国家事业发展——新华社老党员张连生\n③传承红色基因，增长知识本领，磨练意志品质，做党和人民的红孩子——中央广播电视总台《小喇叭》节目\n④守百姓幸福，护家国平安，人民公安重任在肩——福建省“漳州110”全体队员","o":["①③","①④","②③","②④"],"a":"D","e":"①说法错误：习近平总书记给四所交通大学全体师生回信，勉励他们要秉持“求实学、务实业”办学宗旨，传承弘扬西迁精神，聚焦国家重大战略需求，加强科技自主创新和人才自主培养，在促进产学研深度融合上实现更多突破，为建设教育强国、科技强国、人才强国作出新贡献。习近平总书记在湖南大学建校100周年的贺信中强调，希望湖南大学以新时代中国特色社内邮货科会主义思想为指导，继承光荣革命传统，赓续千年书院学脉，弘扬“实事求是、敢为人先”的精神，不断提升办学质量和水平，努力培养更多经世致用的优秀人才，为建设教育强国、推进中国式现代化作出新贡献。\n③说法错误：习近平总书记在致中央广播电视总台《小喇叭》节目开播70周年的贺信中指出，要落实立德树人根本任务，紧扣时代发展脉搏，深耕少儿文化沃土。习近平总书记在给中共一大纪念馆、南湖革命纪念馆少先队红领巾讲解员回信时指出，要传承红色基因，增长知识本领，磨练意志品质，做党和人民的红孩子。\n②④说法正确。故本题答案为 D。","v":"一"},{"b":"黑五卷","s":"黑五卷·一","n":20,"t":"单选","q":"2026 年7 月，习近平总书记对基础教育工作作出重要指示，强调党的十八大以来，党中央把基础教育作为基础性、先导性工作来抓，多措并举推动基础教育实现长足发展，为建设教育强国提供了有力支撑。下列相关说法，正确的有几项？\n①要以加强师德师风建设为教育的根本任务，坚持不懈用党的创新理论铸魂育人，培养德智体美劳全面发展的社会主义建设者和接班人\n②要遵循教育规律，落实健康第一教育理念，提升教育教学质量，促进广大学生身心健康、成长成才\n③要推动学校、家庭、社会各自发力，不断开创基础教育高质量发展新局面\n④我国已建成了世界上规模最大且有质量的基础教育体系，基础教育总体已经达到世界高收入国家的平均水平","o":["4 项","3 项","2 项","1 项"],"a":"C","e":"①说法错误：要以新时代中国特色社会主义思想为指导，全面贯彻党的教育方针，落实立德树人根本任务，坚持不懈用党的创新理论铸魂育人，培养德智体美劳全面发展的社会主义建设者和接班人。\n③说法错误：各级党委和政府要切实扛起政治责任，优化办学资源配置，深化教育综合改革，推动学校、家庭、社会同向发力，不断开创基础教育高质量发展新局面。\n②④说法正确。故本题答案为C。","v":"一"},{"b":"黑五卷","s":"黑五卷·二","n":1,"t":"单选","q":"习近平总书记指出，保障和改善民生要抓住人民最关心最直接最现实的利益问题，既尽力而为，又量力而行，一件事情接着一件事情办，一年接着一年干。这一要求体现的哲学道理是：\n①发挥主观能动性与尊重客观规律是辩证统一的\n②量变是质变的必要准备，要注重量的积累\n③办事情要善于抓住重点，集中力量解决主要矛盾\n④矛盾的普遍性寓于特殊性之中，要坚持具体问题具体分析\n⑤人民群众是社会历史的主体，要坚持群众观点和群众路线","o":["①②③⑤","①②④","①③④⑤","②③④"],"a":"A","e":"①符合题意：“尽力而为”强调充分发挥主观能动性，积极作为、主动担当；“量力而行”强调尊重客观规律，从实际出发，按规律办事。二者结合体现了发挥主观能动性与尊重客观规律的辩证统一。\n②符合题意：“一件事情接着一件事情办，一年接着一年干”强调民生建设是一个循序渐进、持续积累的过程，体现了量变是质变的必要准备，要重视量的积累，通过持续努一次相遇力逐步实现民生改善的质的飞跃。\n③符合题意：“抓住人民最关心最直接最现实的利益问题”体现了在复杂事物发展过程中要善于抓住主要矛盾，集中力量解决关键问题，以重点突破带动整体推进。\n④不符合题意：题干材料并未涉及矛盾普遍性与特殊性的关系，也未体现具体问题具体分析的方法论要求。5符合题意：‘抓住人民最关心最直接最现实的利益问题”直接表明民生工作的出发点和落脚点在于人民，体现了人民群众是历史的创造者、是社会历史的主体，要坚持一切为了群众、一切依靠群众。故本题答案为A。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":2,"t":"单选","q":"习近平总书记指出，当前和今后一个时期，我国卫生与健康工作需要因应形势发展变化，优化完善一些具体政策举措，但是走中国特色卫生与健康发展道路不能动摇，贯彻新时代卫生与健康工作方针不能动摇。这段话体现的哲学道理是：\n①物质决定意识，要坚持一切以时间、地点、条件为转移\n②物质世界的发展是绝对运动和相对静止的统一\n③社会意识具有相对独立性，总是落后于社会存在的发展\n④辩证否定的实质是“扬弃”，即既克服又保留","o":["①②③","①②④","①③④","②③④"],"a":"B","e":"①符合题意：“因应形势发展变化，优化完善一些具体政策举措”，说明政策举措的调整要依据客观形势这一物质条件，体现物质决定意识，要求一切以时间、地点、条件为转移。\n②符合题意：“优化完善具体政策举措”是运动变化，“道路”“方针”不能动摇是保持相对稳定，体现物质世界的发展是绝对运动和相对静止的统一。\n③说法错误：社会意识具有相对独立性，但“总是落后于社会存在的发展”这一表述过于绝对，社会意识有时会先于社会存在而变化。\n④符合题意：优化完善具体政策举措是对原有政策中不适应形势部分的克服，坚守正确道路与方针是对合理部分的保留，体现辩证否定的实质是“扬弃”，即既克服又保留。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":3,"t":"单选","q":"2026 年，我国继续实施更加积极的财政政策。一方面，适当提高财政赤字率，扩大政府投资规模，加大对科技创新、民生保障等重点领域的支持力度；另一方面，明确强调“不搞大水漫灌”，坚决防止债务风险累积，确保财政可持续。上述做法最能体现的哲学道理是：","o":["事物的量变必然引起质变，要积极促进事物质的飞跃","事物发展是前进性与曲折性的统一，要做好应对困难的思想准备","度是保持事物质的稳定性的数量界限，要坚持适度原则","上层建筑适合经济基础状况，就能推动生产力发展"],"a":"C","e":"C项符合题意：题干中“适当提高赤字率、扩大政府投资规模”体现的是政策力度上的加力，“不搞大水漫灌、防止债务风险累积、确保财政可持续”强调的则是把握力度、守住边界。这两个方面共同说明，财政政策在扩张时必须控制在合理限度内，超过一定界限就会使财政可持续性这一“质”发生改变；这正是“度是保持事物质的稳定性的数量界限，要坚持适度原则”的道理。A项说法错误：“量变必然引I起质变”表述绝对化，量变只有积累到一定程度才会引起质变。B项说法正确，但是与题意无关。D项说法错误：上层建筑内邮货科适合经济基础状况，并且为先进经济基础服务时，才会推动生产力发展。故本题答案为C。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":4,"t":"单选","q":"实体经济是一国经济的立身之本，是财富创造的根本源泉，是国家强盛的重要支柱。下列相关说法，正确的有几项？\n①坚持把发展经济的着力点放在实体经济上，推动资源要素向实体经济集聚、政策措施向实体经济倾斜、工作力量向实体经济加强\n②制造业是实体经济的基础，要快速扩大制造业规模，坚定不移建设制造强国\n③实施产业基础再造工程和重大技术装备攻关工程，支持专精特新企业发展，推动制造业高端化、智能化、绿色化发展\n④实体经济是金融的根基，金融是实体经济的血脉，要防止金融逐渐脱实向虚","o":["1 项","2 项","3 项","4 项"],"a":"C","e":"②说法错误：制造业是实体经济的基础，要保持制造业合理比重，坚定不移建设制造强国。“快速扩大制造业规模”表述不恰当。\n①③④说法正确。故本题答案为C。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":5,"t":"单选","q":"坚持马克思主义在意识形态领域的指导地位，植根博大精深的中华文明，顺应信息技术发展潮流，发展具有强大思想引领力、精神凝聚力、价值感召力、国际影响力的新时代中国特色社会主义文化。下列相关举措，说法正确的有几项？\n①坚持不懈用习近平新时代中国特色社会主义思想凝心铸魂，加强体系化、学理化研究阐释和大众化、通俗化宣传普及\n②盘活用好各类公共文化设施资源，有序推进公共文化设施所有权和使用权分置改革\n③推动文化遗产系统性保护和统一监管，推进管理资源整合，建立文化遗产保护督察制度\n④改造提升传统文化业态，推动文化建设数智化赋能、信息化转型，发展数字动漫、沉浸式展演、线上演播、短视频、微短剧等新型文化业态","o":["1 项","2 项","3 项","4 项"],"a":"D","e":"①②③④说法均正确。故本题答案为D。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":6,"t":"单选","q":"2026 年6 月，第12 期《求是》杂志发表习近平总书记重要文章《一体推进教育科技人才发展》。教育、科技、人才是全面建设社会主义现代化国家的基础性、战略性支撑。下列相关表述，正确的有几项？\n①要增强系统观念，坚持教育优先发展、科技自立自强、人才引领驱动\n②科学技术是第一生产力、第一竞争力、第一资源，必须充分认识科学技术的根本支撑作用\n③要优化国家科研机构、高水平研究型大学、科技领军企业定位和布局，强化基础研究领域、交叉前沿领域、重点领域前瞻性、引领性布局\n④基础研究是科技创新的源头，要有组织推进市场导向的体系化基础研究、前沿导向的探索性基础研究、战略导向的应用性基础研究\n⑤要坚持把引进人才作为满足人才需求的核心环节，努力充实高科技人才队伍","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"②说法错误：必须充分认识科技的根本支撑作用，科学技术是第一生产力、第一竞争力，人才是第一资源，创新是第一动力。所以科学技术是第一资源搭配不当。\n④说法错误：基础研究是科技创新的源头，要有组织推进战略导向的体系化基础研究、前沿导向的探索性基础研究、市场导向的应用性基础研究。5说法错误：走好人才自主培养之路，满足庞大的人才需求必须主要依靠自主培养。\n①③说法正确。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":7,"t":"单选","q":"国家安全是民族复兴的根基，社会稳定是国家强盛的前提。必须坚定不移贯彻总体国家安全观，把维护国家安全贯穿党和国家工作各方面全过程，确保国家安全和社会稳定。下列相关举措，说法正确的有几项？\n①要落实行业监管、属地管理、政府主体的食品药品安全责任，加大违法犯罪行为惩治力度\n②要强化末端治理、预判预警、早期纠正，统筹推进房地产、地方政府债务、中小金融机构等风险有序化解\n③要坚持立足国内、补齐短板、多元保障、强化储备，加强能源产供储销体系建设\n④要严格落实耕地保护和粮食安全党政同责要求，严守耕地红线","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：要落实行业监管、属地管理、企业主体的食品药品安全责任，加大违法犯罪行为惩治力度。\n②说法错误：要强化源头防控、预判预警、早期纠正，统筹推进房地产、地方政府债务、中小金融机构等风险有序化解。\n③④说法正确。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":8,"t":"单选","q":"2026 年10 月26 日至29 日，党的二十届五中全会召开，会议审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。下列关于持之以恒推进全面从严治党，说法正确的是：","o":["以宪法为根本，坚持党的先锋队性质，坚持党的全面领导和党中央集中统一领导","着眼于提高党的长期行政能力、保持党的先进性和纯洁性、保持党同人民群众的血肉联系","坚持严的基调不动摇，健全全面从严治党体系，以党的制度建设为统领，全面推进党的各方面建设","充分激发全党积极性主动性创造性，不断实现党的自我净化、自我完善、自我革新、自我提高，持续增强党的政治领导力、思想引领力、群众组织力、社会号召力"],"a":"D","e":"A、B、C项说法错误，D项说法正确：全会指出，落实新时代党的建设总要求，以党章为根本，坚持党的先锋队性质，坚持党的全面领导和党中央集中统一领导，着眼于提高党的长期执政能力、保持党的先进性和纯洁性、保持党同人民群众的血肉联系，坚持严的基调不动摇，健全全面从严治党体系，以党的政治建设为统领，全面推进党的各方面建设，充分激发全党积极性主动性创造性，不断实现党的自我净化、自我完善、自我革新、自我提高，持续增强党的政治领导力、思想引引领力、群众组织力、社会号召力。故本题答案为D。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":9,"t":"单选","q":"2026 年10 月26 日至29 日，党的二十届五中全会召开，会议审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。党的十八大以来，逐渐形成了党委抓、书记抓、各有关部门抓、一级抓一级、层层抓落实的党建工作格局。下列说法正确的有几项？\n①围绕加强对管党治党的领导、选好用好干部、强化权力运行监督制约、维护群众利益等，明确纪委全面从严治党主体责任\n②围绕高效监督、从严执纪、精准问责等，明确各级监察委员会的监督责任\n③围绕抓好班子、带好队伍、推动落实，明确纪委书记第一责任人责任\n④结合职责任务分工，按照“一岗双责”要求，明确领导班子其他成员的管党治党责任\n⑤围绕严于自律和互相监督、互相提醒帮助，结合党员、干部岗位特点和工作实际，明确党员、干部的具体责任","o":["2 项","3 项","4 项","5 项"],"a":"A","e":"①说法错误：围绕加强对管党治党的领导、选好用好干部、强化权力运行监督制约、维护群众利益等，明确党委（党组）全面从严治党主体责任。\n②说法错误：围绕高效监督、从严执纪、精准问责等，明确各级纪委的监督责任。纪委是党内监督专责机关，监察委员会是国家监督机关而非党内监督专责机关。小黑提示，出题人在这里故意偷换主体，纪委和监委二者虽然合署办公，但在落实全面从严治党政治责任这个语境下，只能用纪委，不用监委。\n③内部货科说法错误：围绕抓好班子、带好队伍、推动落实，明确党委（党组）书记第一责任人责任。\n④5说法正确，故本题答案为A。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":10,"t":"单选","q":"2026 年10 月12 日至13 日，全国卫生与健康大会在京召开。习近平总书记出席会议并发表重要讲话。讲话指出，全面提高医疗服务水平是建成健康中国的一项重点任务。下列相关说法，正确的有几项？\n①要深入实施医疗卫生强基工程，优化医疗卫生机构功能定位和结构布局，促进集中诊疗，让群众能就近看得上病、看得好病\n②要加强慢性病综合防控，完善防治康管全链条服务\n③要健全中医药传承创新发展机制，强化中西医逐步分离、独立发展\n④要加强卫生与健康领域基础研究和原始创新，促进科技成果转化，做大做强健康产业\n⑤要优化就医体验，不断提高群众看病就医的便利度和满意度","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"①说法错误：要深入实施医疗卫生强基工程，优化医疗卫生机构功能定位和结构布局，促进分级诊疗，让群众能就近看得上病、看得好病。\n③说法错误：健全中医药传承创新发展机制，强化中西医协同融合。\n②④5说法正确。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":11,"t":"单选","q":"2026 年10 月9 日，《中共中央国务院关于发展新质生产力的意见》发布。《意见》指出，要强化企业科技创新主体地位。下列相关说法，正确的有几项？\n①加强普惠激励政策供给，建立企业研发准备金制度，强化企业科技投入主导作用\n②鼓励科技型中小企业加大研发投入，降低企业研发费用加计扣除比例\n③将各类企业研发项目按程序上升为国家项目，鼓励企业牵头国家科技任务\n④支持有能力的民营企业牵头承担国家重大技术攻关任务\n⑤建立用户考核评价成果的机制，强化企业成果转化主体地位","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"②说法错误：鼓励科技型中小企业加大研发投入，提高企业研发费用加计扣除比例。\n③说法错误：将符合国家战略需求的企业研发项目按程序上升为国家项目，鼓励企业牵头国家科技任务，支持有能力的民营企业牵头承担国家重大技术攻关任务。\n①④5说法正确。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":12,"t":"单选","q":"2026 年10 月21 日，《中共中央办公厅国务院办公厅关于推动科技创新和产业创新深度融合的意见》发布。《意见》指出，推动科技创新和产业创新深度融合，是以高水平科技自立自强引领发展新质生产力的关键。下列说法正确的是：","o":["统筹布局国家新兴产业创新中心、国家产业技术工程化中心、国家技术创新中心、国家制造业创新中心等，优先强化重点产业关键个性技术供给","逐步弱化央地合作，鼓励各地自主承担科技投入、重大任务实施","健全科技成果转化、创业投资等方面尽职免责机制，探索建立负面清单","完善国有企业分类考核评价体系，降低企业与高校、科研院所等联合研发费用视同利润加回的比例"],"a":"C","e":"A项说法错误：统筹布局国家新兴产业创新中心、国家产业技术工程化中心、国家技术创新中心、国家制造业创新中心等，强化重点产业关键共性技术供给。B项说法错误：加强央地协同，健全中央与地方科技投入共担、重大任务联动实施机制。D项说法错误：完善国有企业分类考核评价体系，提高企业与高校、科研院所等联合研发费用视同利润加回的比例。故本题答案为C。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":13,"t":"单选","q":"《2026 年政府工作报告》指出，要纵深推进全国统一大市场建设。下列说法正确的是：","o":["鼓励地方政府经济促进行为，多出台差异化税收优惠、财政补贴政策","加强反垄断、反不正当竞争，强化公平竞争审查柔性约束","综合运用产能调控、标准引领、价格执法、质量监管等手段，鼓励“内卷式”竞争，营造良好市场生态","深化要素市场化配置综合改革试点，将更多符合条件的地区纳入试点范围"],"a":"D","e":"A项说法错误：规范地方政府经济促进行为，出台地方政府招商引资鼓励和禁止事项清单，规范税收优惠、财政补贴政策。“差异化税收优惠、财政补贴政策”不利于推进全国统一大市场建设。B项说法错误：加强反垄断、反不正当竞争，强化公平竞争审查刚性约束。C项说法错误：综合运用产能调控、标准引领、价格执法、质量监管等手段，深入整治“内卷式”竞争，营造良好市场生态。故本题答案为D。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":14,"t":"单选","q":"2026 年6 月18 日，《关于学习贯彻习近平党建思想的通知》印发。关于习近平党建思想的科学内涵，下列说法正确的有几项？\n①坚持党中央集中统一领导是党的领导的最高原则\n②坚持锤炼坚强党性是党的宗旨立场和价值取向\n③坚持落实管党治党政治责任是全面从严治党需要牢牢牵住的“牛鼻子”\n④坚持推进作风建设常态化长效化是保持党同人民群众血肉联系的有效途径\n⑤坚持用党的创新理论凝心铸魂是党的思想建设的首要任务","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"②说法错误：坚持不忘初心、牢记使命是党的宗旨立场和价值取向。坚持锤炼坚强党性是党员、干部的终身课题。5说法错误：坚持用党的创新理论凝心铸魂是党的思想建设的根本任务。坚定理想信念是党的思想建设的首要任务。\n①③④说法正确。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":15,"t":"单选","q":"2026 年9 月，第18 期《求是》杂志发表习近平总书记重要文章《在加强基础研究座谈会上的讲话》。文章指出，要加强对基础研究的支持保障。下列说法正确的是：","o":["要逐步提高基础研究经费占比，进一步拓宽筹资渠道，稳步增加财政投入，引导企业和社会力量加大投入，形成基础研究多元化投入格局","要建立以竞争性支持取代稳定支持的基础研究投入机制","要加紧建设世界一流科技期刊，鼓励国内外成果在海外期刊和平台首发","要深化科技体制改革，健全符合基础研究特点的统一评价体系，完善基础研究激励机制"],"a":"A","e":"B项说法错误：提高科学基金资助效能，对从事基础研究的科研机构和平台基地提供稳定支持，对优秀研究团队和人才实行竞争择优基础上的接续支持，对重大原创项目采取滚动式支持。故要完善竞争性支持和稳定支持相结合的基础研究投入机制，而非“竞争性支持取代稳定支持”。C项说内邮货科法错误：加紧建设世界一流科技期刊，鼓励国内外成果在我国期刊和平台首发。D项说法错误：深化科技体制改革，健全符合基础研究特点的分类评价体系，完善基础研究激励机制，改革科研管理方式。故本题答案为A。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":16,"t":"单选","q":"习近平总书记指出，当前世界百年变局加速演进，新一轮科技革命和产业变革加速突破，全球人工智能技术创新进入前所未有的活跃期，既蕴含巨大机遇，也面临治理挑战。下列关于人工智能发展，说法正确的有几项？\n①人工智能以数据、算力、算法等为关键要素，以神经科学、认知科学、计算科学、数学等理论突破和学科交叉为基础，以智能前沿技术群体性突破和广泛渗透赋能为标志\n②人工智能呈现数据驱动、万物互联、人机协同、跨界融合等显著特征\n③各国应当秉持以人为本、向上向善理念，让人工智能成为促进共同繁荣、维护共同安全的一个重要动力源\n④要加强人工智能发展战略、治理规则、技术标准的对接协调，早日形成具有广泛共识的全球治理框架\n⑤要维护产业安全，加快构建独立于西方技术体系的发展中国家人工智能产业链","o":["5 项","4 项","3 项","2 项"],"a":"B","e":"5说法错误：我们坚持高水平自立自强、自主可控，但倡导鼓励开源开放、合作共享。“构建独立于西方技术体系的发展中国家人工智能产业链”，和习近平总书记强调的“坚持开放共赢”完全相悖。\n①②③④说法正确。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":17,"t":"单选","q":"新时代以来，习近平总书记在地方考察和重要指示中，多次肯定基层创造的一系列先进发展治理经验，并要求各地结合实际学习借鉴、复制推广，更好推动高质量发展和社会治理现代化。下列经验与学习要求对应正确的是：","o":["学习“义乌发展经验”——因地制宜完善乡村建设实施机制，分类有序、片区化推进乡村振兴","学习“闽宁协作”经验——推动产业互补、人员互动、技术互学、观念互通、作风互鉴","学习新时代“枫桥经验”——引导各地区立足自身资源禀赋，尊重基层和群众首创精神，因地制宜发展县域经济","学习“千万工程”经验——紧紧依靠人民群众，把问题解决在基层、化解在萌芽状态"],"a":"B","e":"A项说法错误：学习“义乌发展经验”，要求引导各地区立足自身资源禀赋，尊重基层和群众首创精神，因地制宜发展县域经济。C项说法错误：学习新时代“枫桥经验”，要求紧紧依靠人民群众，把问题解决在基层、化解在萌芽状态。D项说法错误：学习“千万工程”经验，要求因地制宜完善乡村建设实施机制，分类有序、片区化推进乡村振兴。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":18,"t":"单选","q":"2026 年2 月，《中共中央国务院关于锚定农业农村现代化扎实推进乡村全面振兴的意见》发布。文件指出，要提升农业综合生产能力和质量效益。下列表述正确的有几项？\n①坚持产量产能、生产生态、增产增收一起抓，实施新一轮万亿斤粮食产能提升行动\n②分区分类高质量推进高标准农田建设，完善立项、建设、验收和管护机制\n③加强北方地区防洪排涝体系建设，适度提高工程建设标准\n④在确保省域内耕地保护任务不降低前提下，稳妥有序退出河道湖区影响行洪安全等的不稳定耕地\n⑤深化涉农高校教育教学改革，以就业为导向加快新农科建设","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"①说法错误：坚持产量产能、生产生态、增产增收一起抓，加力实施新一轮千亿斤粮食产能提升行动，促进良田良种良机良法集成增效，推进粮油作物大面积提单产。5说法错误：深化涉农高校教育教学改革，以需求为导向加快新农科建设，推动涉农专业人才定向培养。\n②③④说法正确。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":19,"t":"单选","q":"2026 年8 月15 日，《中华人民共和国生态环境法典》正式施行。下列相关说法，正确的有几项？\n①这是中国第一部以“法典”命名的法律，也是世界上首部以“生态环境”命名的法典\n②法典中“生态保护”单独成编，为世界环境法典体例之首创\n③法典以“五编体”搭建科学完备的生态环境法治体系，促进生态环境治理系统集成、协同高效\n④法典以“完全法典化”的编纂模式，形成法典统领、单行法配套衔接的分层立法格局，探索出兼具体系性与开放性、稳定性与适应性的编纂新路\n⑤法典以习近平生态文明思想为魂和纲，是习近平生态文明思想和习近平法治思想贯通融合、交相辉映的重要结晶","o":["5 项","4 项","3 项","2 项"],"a":"D","e":"①说法错误：《中华人民共和国生态环境法典》是世界上首部以“生态环境”命名的法典，但该法典是我国第二部以“法典”命名的法律，第一部是《中华人民共和国民法典》。\n②说法错误：法典中“绿色低碳发展”单独成编，为世界环境法典体例之首创。\n④说法错误：法典采用适度法典化编纂模式，并非完全法典化。\n③5说法正确。故本题答案为D。","v":"二"},{"b":"黑五卷","s":"黑五卷·二","n":20,"t":"单选","q":"习近平总书记指出，要坚持惠民生和促消费、投资于物和投资于人紧密结合。下列属于投资于人范畴的有几项？\n①全面实施育儿补贴制度、惠及3000 多万婴幼儿\n②开工建设雅鲁藏布江下游水电工程，规划总装机规模约6000 万千瓦\n③加大超长期特别国债投入，支持“东数西算”、特高压等新型基建项目\n④全国范围内免除公办幼儿园学前一年在园儿童保育教育费","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"“投资于人”是指将资源投向教育、医疗、托育、养老等民生领域，聚焦人的能力提升、生活保障与全面发展，以此提升人力资本、释放消费潜力。“投资于物”则指向基础设施、能源工程等物质资本建设，二者共同服务于扩大内需战略。\n①④涉及民生，属于“投资于人”范畴。\n②③涉及基础设施，属于“投资于物”范畴。故本题答案为B。","v":"二"},{"b":"黑五卷","s":"黑五卷·三","n":1,"t":"单选","q":"2026 年10 月22 日，纪念中国工农红军长征胜利90 周年大会隆重举行。习近平总书记指出，红军长征创造了非凡的人间奇迹，铸就了伟大长征精神。精神所在，就是力量所在。伟大长征精神充分彰显了忠诚的力量、真理的力量、正义的力量、团结的力量，它作为中国共产党人精神谱系的重要组成部分，跨越时空、历久弥新，永远是激励我们战胜困难、勇往直前的宝贵财富和强大动力。这体现的哲学道理是：\n①社会意识具有相对独立性，先进的社会意识对社会发展起促进作用\n②精神力量通过实践可以转化为改造世界的物质力量\n③认识具有直接现实性，正确的认识对实践具有巨大的指导效果\n④人民群众是社会历史的主体，是社会变革的领导力量","o":["③④","①③","②④","①②"],"a":"D","e":"①符合题意：“伟大长征精神·…跨越时空、历久弥新，永远是激励我们战胜困难、勇往直前的宝贵财富和强大动力”，说明社会意识具有相对独立性，先进的社会意识对社会发展起积极的促进作用。\n②符合题意：题干强调“精神所在，就是力量所在”，长征精神本身是精神力量，但它能激励人们“战胜困难、勇往直前”，即通过人们的实践活动转化为改造客观世界的物质一次相遇力量，体现了精神力量通过实践可以向物质力量转化。\n③说法错误：实践具有直接现实性，认识不具有直接现实性。\n④说法错误：人民群众是社会历史的主体，是历史的创造者，人民群众是社会变革的决定力量，而非“领导力量”。故本题答案为 D。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":2,"t":"单选","q":"习近平总书记强调，在革命、建设、改革中先后把党的建设作为伟大工程、新的伟大工程，党的十八大以来深入推进新时代党的建设新的伟大工程，找到“让人民来监督政府”和“自我革命”两个跳出治乱兴衰历史周期率的答案，这是中国共产党的独特创造，永载马克思主义政党建设史册。这体现的哲学道理是：\n①认识具有无限性，追求真理是一个永无止境的过程\n②事物的发展是内因和外因共同作用的结果，二者相辅相成\n③人民群众是历史的创造者，要坚持群众观点和群众路线\n④辩证否定是事物的自我否定，是事物联系和发展的环节","o":["②③④","①②","③④","①②③④"],"a":"D","e":"①符合题意：从革命、建设时期的“伟大工程”到“新的伟大工程”，从一个答案到两个答案，体现了党对执政规律和党建规律的认识不断深化，说明认识具有无限性，追求真理是一个永无止境的过程。\n②符合题意：“让人民来监督政府”强调外在力量的约束性（外因），“自我革命”强调内在力量的主导性（内因），两者相辅相成、内外结合，共同构成跳出历史周期率的完整路径，体现了事物的发展是内因和外因共同作用的结果。\n③符合题意：“让人民来监督政府”体现了唯物史观中人民群众是历史创造者的基本原理，党始终坚持以人民为中心，依靠人民监督保证权力正确运行，坚持了群众观点和群众路线。\n④符合题意：“自我革命”是党对自身的辩证否定，是自我批判、自我扬弃、自我革新的过程，不是全盘否定，而是在继承基础上的创新发展；从“伟大工程”到“新的伟大工程”，每个阶段都是在前一阶段基础上的继承与发展，体现了辩证否定是事物联系和发展的环节。故本题答案为D。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":3,"t":"单选","q":"习近平总书记强调，党的各级组织层层压实主体责任，把严的要求贯穿管党治党全过程，日常管理监督立足于早、着眼于小，发现苗头及时提醒，触犯纪律立即处理，多积尺寸之功，经常防微杜渐。这体现的哲学道理是：","o":["事物的发展是前进性与曲折性的统一","量变是质变的必要准备，要重视量的积累","主要矛盾的主要方面决定事物的性质","实践是检验认识真理性的唯一标准"],"a":"B","e":"B项符合题意：材料中“立足于早、着眼于小”“发现苗头及时提醒”“多积尺寸之功”“防微杜渐”等表述，强调的是在问题尚处于萌芽状态时就加以干预，防止不良因素的量变积累到一定程度引发质变。这体现了唯物辩证法中量变与质变的辩证关系原理一一量变是质变的必要准备，质变是量变的必然结果。只有重视量的积累，从小处着手、从早处防范，才能有效防止消极的质变发生。A、C、D项说法正确，但是与题意无关。故本题答案为B。内邮货科","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":4,"t":"单选","q":"尊重自然、顺应自然、保护自然，是全面建设社会主义现代化国家的内在要求。必须牢固树立和践行绿水青山就是金山银山的理念，站在人与自然和谐共生的高度谋划发展。下列相关举措，说法正确的有几项？\n①推动经济社会发展绿色化、低碳化是实现高质量发展的关键环节\n②要全面实行排污许可制，健全现代环境治理体系\n③要以国家重点生态功能区、生态保护红线、自然保护地等为重点，加快实施重要生态系统保护和修复重大工程\n④要立足我国能源资源禀赋，坚持先立后破，毕其功于一役打赢碳达峰攻坚战","o":["1 项","2 项","3 项","4 项"],"a":"C","e":"④说法错误：实现碳达峰碳中和是一场广泛而深刻的经济社会系统性变革。立足我国能源资源禀赋，坚持先立后破，有计划分步骤实施碳达峰行动。\n①②③说法正确。故本题答案为C。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":5,"t":"单选","q":"人民民主是社会主义的生命，是全面建设社会主义现代化国家的应有之义。必须坚定不移走中国特色社会主义政治发展道路，坚持党的领导、人民当家作主、依法治国有机统一。下列相关说法，正确的有几项？\n①要支持和保证人民通过人民代表大会行使国家权力，保证各级人大都由民主选举产生、对人民负责、受人民监督\n②要发挥人民政协作为专门监察机关作用，完善民主监督和委员联系界别群众制度机制\n③要健全以职工代表大会为基本形式的企事业单位民主管理制度，维护职工合法权益\n④要以铸牢中华民族共同体意识为主线，坚定不移走中国特色解决民族问题的正确道路，坚持和完善民族区域自治制度","o":["1 项","2 项","3 项","4 项"],"a":"C","e":"②说法错误：要发挥人民政协作为专门协商机构作用，加强制度化、规范化、程序化等功能建设，提高深度协商互动、意见充分表达、广泛凝聚共识水平，完善人民政协民主监督和委员联系界别群众制度机制。\n①③④说法正确。故本题答案为C。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":6,"t":"单选","q":"党的十八大以来，我们不断推进金融实践创新、理论创新、制度创新，积累了宝贵经验，逐步走出一条中国特色金融发展之路。下列相关举措，说法正确的是：","o":["坚持把金融服务实体经济作为根本宗旨，坚持把防控风险作为金融工作的永恒主题","我国金融体系的重要特征和优势是民营金融机构占主体，但存在间接融资和债权融资比重偏高、金融服务普惠性不足等问题","我国金融机构门类齐全，关键是要同质发展、优势互补，要各司其职、各展所长","金融具有功能性和盈利性双重属性，功能发挥要服从盈利目标"],"a":"A","e":"B项说法错误：我国金融体系的重要特征和优势是国有金融机构占主体，但存在间接融资和债权融资比重偏高、金融服务普惠性不足等问题，还存在金融泛化、乱办金融、大量非法金融活动。C项说法错误：我国金融机构门类齐全，关键是要错位发展、优势互补，在服务实体经济上各司其职、各展所长。D项说法错误：金融具有功能性和盈利性双重属性，盈利要服从功能发挥。故本题答案为A。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":7,"t":"单选","q":"全面建设社会主义现代化国家，必须坚持中国特色社会主义文化发展道路，增强文化自信，围绕举旗帜、聚民心、育新人、兴文化、展形象建设社会主义文化强国。下列相关说法，正确的有几项？\n①要以全人类共同价值为引领，发展社会主义先进文化，弘扬革命文化，传承中华优秀传统文化\n②意识形态工作是为国家立心、为民族立魂的工作，要牢牢掌握党对意识形态工作领导权\n③要弘扬以伟大长征精神为源头的中国共产党人精神谱系，用好红色资源\n④要坚守中华文化立场，提炼展示中华文明的精神标识和文化精髓，加快构建中国话语和中国叙事体系，讲好中国故事、传播好中国声音，展现可信、可爱、可敬的中国形象","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：以社会主义核心价值观为引领，发展社会主义先进文化，弘扬革命文化，传承中华优秀传统文化。\n③说法错误：弘扬以伟大建党精神为源头的中国共产党人精神谱系，用好红色资源，深入开展社会主义核心价值观宣传教育，深化爱国主义、集体主义、社会主义教育，着力培养担当民族复兴大任的时代新人。\n②④说法正确。故本题答案为B。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":8,"t":"单选","q":"2026 年10 月26 日至29 日，党的二十届五中全会召开，会议审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。下列属于持之以恒推进全面从严治党遵循的原则是：\n①坚持服务使命任务，坚持以党的政治建设为统领\n②坚持全面从严，坚持问题导向\n③坚持守正创新，坚持以上率下\n④坚持从严治吏，坚持依宪治党","o":["①②③④","①②③","①③④","②③④"],"a":"B","e":"④选项的“坚持从严治吏”说法本身正确，但全会并未将其纳入持之以恒推进全面从严治党遵循的七大原则范畴，且“坚持依宪治党”说法错误。小黑提示，“国有宪法，党有党章”。小黑在出题的时候故意将“坚持依规治党”替换为“坚持依宪治党”，为了“骗取”同学们的注意力，还专门加入了“坚持从严治吏”。\n①②③说法正确：全会强调，持之以恒推进全面从严治党遵循的原则是：坚持服务使命任务，坚持以党的政治建设为统领，坚持全面从严，坚持问题导向，坚持守正创新，坚持以上率下，坚持依规治党。故本题答案为B。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":9,"t":"单选","q":"2026 年10 月26 日至29 日，党的二十届五中全会召开，会议审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。下列说法正确的有几项？\n①习近平党建思想回答了“建设什么样的党、怎样建设党”的重大时代课题\n②增强党性是全面从严治党的根本性任务，要把学习、领悟、运用党的创新理论作为加强党性修养的根本途径\n③民主集中制是党的根本组织原则和领导制度，是我们党区别于其他政党的重要标志\n④纪律建设作为全面从严治党的治本之策，要始终以严的基调正风肃纪\n⑤一体推进不敢腐不能腐不想腐是全面从严治党的重要方略和反腐败斗争的基本方针","o":["2 项","3 项","4 项","5 项"],"a":"C","e":"①说法错误：习近平党建思想回答的重大时代课题是“建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党”。“建设什么样的党、怎样建设党”是“三个代表”重要思想回答的课题。\n②③④③说法正确。故本题答案为C。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":10,"t":"单选","q":"2026 年10 月12 日至13 日，全国卫生与健康大会在京召开。习近平总书记出席会议并发表重要讲话。讲话指出，改革是卫生与健康事业发展的强大动力。下列相关说法，正确的是：","o":["要坚持把推进医疗、医保、医药独立发展和治理作为医药卫生体制改革的主攻方向","要以市场化为导向深化公立医院改革，加强县区、基层医疗机构运行保障","要构建多层次医疗保障体系，优化药品耗材分级采购、医保支付和资金使用政策，实现基金安全运行、医院良性运转、群众负担合理","要健全药品供应保障和使用管理机制，完善国家基本药物制度，强化药品质量安全监管"],"a":"D","e":"A项说法错误：要坚持把推进医疗、医保、医药协同发展和治理作为医药卫生体制改革的主攻方向。B项说法错误：全面落实医疗卫生事业单位改革方案，以公益性为导向深化公立医院改革，加强县区、基层医疗机构运行保障。C项说法错误：要构建多层次医疗保障体系，优化药品耗材集中采购、医保支付和资金使用政策，实现基金安全运行、医院良性运转、群众负担合理。故本题答案为D。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":11,"t":"单选","q":"2026 年10 月9 日，《中共中央国务院关于发展新质生产力的意见》发布。下列相关说法正确的是：","o":["在国家重大工程项目中按需部署科技任务，健全需求导向的选题制度、责权利一致的管理制度、应用导向的评价制度","更好发挥社会投资基金引导带动作用，完善长期资本投早、投小、投长期、投硬科技的支持政策，壮大耐心资本","强化跨部门联合监管，创新监管方式，增加现场监管次数，探索“用数据决策、用数据管理”监管模式","加快推动科研人员考核评价激励与报项目、发论文、评奖励等紧密挂钩，防止简单按人才“帽子”定薪酬、定职称、定待遇"],"a":"A","e":"B项说法错误：更好发挥政府投资基金引导带动作用,完善长期资本投早、投小、投长期、投硬科技的支持政策，壮大耐心资本。C项说法错误：强化跨部门联合监管，创新监管方式，减少现场监管次数，探索“用数据决策、用数据管理”监管模式，提升跨部门综合监管智能化水平。D项说法错误：加快推动科研人员考核评价激励与报项目、发论文、评奖励等适度脱钩，防止简单按人才“帽子”定薪酬、定职称、定待遇。故本题答案为A。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":12,"t":"单选","q":"2026 年10 月21 日，《中共中央办公厅国务院办公厅关于推动科技创新和产业创新深度融合的意见》发布。《意见》指出，推动科技创新和产业创新深度融合，是以高水平科技自立自强引领发展新质生产力的关键。下列相关说法，正确的有几项？\n①坚持准确把握科技革命和产业变革新趋势新特点，加强系统谋划和分类推进\n②坚持统筹科技供给和需求牵引，围绕产业链部署创新链，围绕创新链布局产业链\n③坚持强化科研院所创新主体地位，完善激励创新的市场机制，推动创新资源向科研院所集聚\n④坚持以改革激发创新活力，坚决破除阻碍科技创新和产业创新深度融合发展的思想观念和制度障碍","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：坚持准确把握科技革命和产业变革新趋势新特点，加强系统谋划和一体推进。\n③说法错误：坚持强化企业创新主体地位，完善激励创新的市场机制，推动创新资源向企业集聚。\n②④说法正确。故本题答案为B。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":13,"t":"单选","q":"《2026 年政府工作报告》指出，要坚持民生为大，加强普惠性、基础性、兜底性民生建设，努力为人民群众多办实事。下列说法正确的有几项？\n①实施稳岗扩容提质行动，支持劳动密集型行业企业稳定岗位\n②推动基础教育扩优提质，统筹义务教育优质均衡发展、学前教育优质普惠发展，完善免费学前教育政策，增加普通高中学位供给\n③加强初婚初育家庭住房保障，支持多子女家庭改善性住房需求\n④完善并落实基本养老保险全国统筹制度，稳步推动基本医疗保险省级统筹","o":["1 项","2 项","3 项","4 项"],"a":"D","e":"①②③④说法均正确。故本题答案为D。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":14,"t":"单选","q":"2026 年1 月，中共中央政治局就前瞻布局和发展未来产业进行第二十四次集体学习。关于未来产业的发展，下列说法正确的是：","o":["要综合考虑国家战略需求、技术成熟程度、要素支撑条件等因素，因地制宜、同质发展","要充分发挥新型举国体制优势，坚持“科技出题、产业答题”","要完善财税等政策，以发展绿色金融为重点促进未来产业发展","要加强基础研究战略性、前瞻性、体系化布局，加快科技成果转化应用"],"a":"D","e":"A项说法错误：要综合考虑国家战略需求、技术成熟程度、要素支撑条件等因素，因地制宜、错位发展。B项说法错误：要充分发挥新型举国体制优势，坚持“产业出题、科技答题”，加大重点领域关键核心技术攻关力度。C项说法错误：要完善财税等政策，大力发展科技金融。绿色金融和未来产业无关，绿色金融是指为支持环境改善、应对气候变化和资源高效利用的经济活动提供的金融服务，涵盖环保、节能、清洁能源、绿色交通等领域。故本题答案为D。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":15,"t":"单选","q":"2026 年7 月1 日，庆祝中国共产党成立105 周年大会在京举行。习近平总书记指出，中国共产党之所以能够在105 年奋斗中不断铸就辉煌，历史和人民之所以选择中国共产党，根本在于我们党具有其他政党和政治力量无可比拟的优秀特质。下列属于这些优秀特质的是：\n①矢志追求真理、始终把准前进方向\n②深深植根人民、始终拥有坚实根基\n③勇担历史使命、始终掌握战略主动\n④顺应发展潮流、始终走在时代前列\n⑤敢于善于斗争、始终保持必胜信心\n⑥注重强健自身、始终充满生机活力","o":["②③④⑤","①②③④","③④⑤⑥","①②③④⑤⑥"],"a":"D","e":"①②③④56均属于。故本题答案为D。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":16,"t":"单选","q":"2026 年9 月1 日，习近平总书记在“上海合作组织+”会议上发表讲话指出，中国作为负责任大国，积极倡导平等有序的世界多极化。主权平等、相互尊重是根本原则，均衡有序、遵守法治是必然要求，多边主义、对话协商是关键路径，互利共赢、普惠包容是发展方向。下列说法正确的有几项？\n①要坚持各国无论大小、强弱、贫富，都权利平等、机会平等、规则平等\n②要弘扬社会主义核心价值观，摒弃双重标准、例外主义、干涉霸凌、丛林法则，推进国际关系法治化\n③联合国宪章宗旨和原则确立了国际关系基本准则，是战后国际秩序的基石\n④要聚焦发展议题，坚持开放合作，弥合数字和智能鸿沟，让技术革命和发展成果惠及各国人民\n⑤要坚持对话不对抗、结伴又结盟，坚持共商共建共享，推动各国在全球治理中平等参与、普遍受益","o":["5 项","4 项","3 项","2 项"],"a":"C","e":"②说法错误：要弘扬全人类共同价值，摒弃双重标准、例外主义、干涉霸凌、丛林法则，推进国际关系法治化。5说法错误：要坚持结伴不结盟、对话不对抗，坚持共商共建共享，推动各国在全球治理中平等参与、普遍受益。\n①③④说法正确。故本题答案为C。内邮货科","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":17,"t":"单选","q":"中国共产党在百年奋斗历程中铸就了一系列伟大精神，构建起中国共产党人的精神谱系。新时代以来，习近平总书记多次号召全党全社会传承弘扬这些宝贵精神，强调要从中汲取奋进力量，赓续红色血脉，将其转化为全面建设社会主义现代化国家、全面推进中华民族伟大复兴的强大精神动力。下列精神与其内涵对应正确的是：","o":["焦裕禄精神——互信、互利、平等、协商、尊重多样文明、谋求共同发展","西迁精神——胸怀大局、无私奉献、弘扬传统、艰苦创业","伟大建党精神——亲民爱民、艰苦奋斗、科学求实、迎难而上、无私奉献","伟大长征精神——坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民"],"a":"B","e":"A项说法错误：焦裕禄精神的内涵是“亲民爱民、艰苦奋斗、科学求实、迎难而上、无私奉献”。“互信、互利、平等、协商、尊重多样文明、谋求共同发展”描述的是上海精神。C项说法错误：伟大建党精神的内涵是“坚持真理、坚守理想，践行初心、担当使命，不怕牺牲、英勇斗争，对党忠诚、不负人民”。D项说法错误：伟大长征精神就是把全国人民和中华民族的根本利益看得高于一切，坚定革命的理想和信念，坚信正义事业必然胜利；为了救国救民，不怕任何艰难险阻，不惜付出一切牺牲；坚持独立自主、实事求是，一切从实际出发；顾全大局、严守纪律、紧密团结；紧紧依靠人民群众，同人民群众生死相依、患难与共、艰苦奋斗。故本题答案为B。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":18,"t":"单选","q":"2026 年2 月，《中共中央国务院关于锚定农业农村现代化扎实推进乡村全面振兴的意见》发布。文件指出，要实施常态化精准帮扶。下列表述正确的是：","o":["把常态化帮扶纳入乡村振兴战略统筹实施，保持财政投入、金融支持、资源要素配置等方面政策逐步降低","强化救济式帮扶，发挥社会救助兜底保障作用，推动帮扶政策协同集成","优化产业帮扶方式，分类推进现有产业巩固、升级、盘活、调整，发展具有市场竞争力的帮扶产业","扎实做好市县两级常态化监测，健全精准识别和快速响应机制，确保早发现、早干预、早帮扶"],"a":"C","e":"A项说法错误：把常态化帮扶纳入乡村振兴战略统筹实施，保持财政投入、金融支持、资源要素配置等方面政策总体稳定。B项说法错误：强化开发式帮扶，增强内生动力，发挥社会救助兜底保障作用，推动帮扶政策协同集成。D项说法错误：扎实做好乡村两级常态化监测，健全精准识别和快速响应机制。故本题答案为C。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":19,"t":"单选","q":"由常住地提供基本公共服务，逐步消除基本公共服务与户籍挂钩因素，促进未落户常住人口与户籍人口同等享有基本公共服务，有利于满足人民日益增长的美好生活需要，对提升城镇化质量、释放国内需求潜力、构建新发展格局具有重要意义。下列相关举措，说法正确的有几项？\n①学龄人口流入多的城市政府做好存量学位资源挖潜和整合利用，按需新增学位，巩固提升义务教育阶段随迁子女就读民办学位比例\n②推动更多城市将稳定就业居住的未落户常住人口家庭纳入公租房保障范围，推行按就业居住年限、住房困难程度确定保障对象、保障方式、保障标准、准入条件和退出机制\n③全面取消在就业地参加职工社会保险的户籍限制，大力推进全民参保计划，引导支持各类劳动者在就业地参加职工社会保险\n④加力落实持户口簿参加城乡居民基本医疗保险政策，超大特大城市等各类城市切实保障户籍地中小学生、学龄前儿童等在常住地参加城乡居民基本医疗保险的权利\n⑤对符合条件的城镇常住人口依申请认定为就业困难人员，按规定落实就业援助政策","o":["5 项","4 项","3 项","2 项"],"a":"C","e":"①说法错误：学龄人口流人多的城市政府做好存量学位资源挖潜和整合利用，按需新增学位，巩固提升义务教育阶段随迁子女就读公办学位比例。\n④说法错误：加力落实持居住证参加城乡居民基本医疗保险政策，超大特大城市等各类城市切实保障外地户籍中小学生、学龄前儿童等在常住地参加城乡居民基本医疗保险的权利。\n②③5说法正确。故本题答案为C。","v":"三"},{"b":"黑五卷","s":"黑五卷·三","n":20,"t":"单选","q":"习近平总书记指出，2026 年是“十五五”开局之年，地方各级领导班子将陆续换届，通过学习教育推动各级领导班子和领导干部树立和践行正确政绩观，十分重要，很有必要。下列相关说法正确的是：","o":["要以立党为公、为民造福、科学决策、真抓实干为总要求，以分类推进学查改为抓手","要坚持聚焦主题、简约务实，划分批次、划分阶段，认真落实学习研讨、查摆问题、整改整治、建章立制、开门教育等工作安排","要坚持实事求是、求真务实，为人民出政绩、以实干出政绩","要坚持与中央巡察整改、深入贯彻中央八项规定精神学习教育整改、“十五五”规划编制实施、生态环保督察整改等相结合"],"a":"C","e":"A项说法错误：要以立党为公、为民造福、科学决策、真抓实干为总要求，以一体推进学查改为抓手。B项说法错误：学习教育要坚持聚焦主题、简约务实，不分批次、不划阶段，认真落实学习研讨、查摆问题、整改整治、建章立制、开门教育等工作安排。D项说法错误：要坚持与中央巡视整改、深入贯彻中央八项规定精神学习教育整改、“十五五”规划编制实施、生态环保督察整改等相结合，边查边改、立行立改，对突出问题开展集中整治，持续推动整改落实。故本题答案为C。","v":"三"},{"b":"黑五卷","s":"黑五卷·四","n":1,"t":"单选","q":"2026 年8 月，习近平总书记作出重要指示强调，树立和践行正确政绩观是一项长期任务，必须久久为功，不断巩固拓展学习教育成果，持续推动各级党组织和广大党员、干部立党为公、为民造福、科学决策、真抓实干，努力创造经得起实践、人民、历史检验的实绩。上述指示蕴含的哲学道理是：\n①量变是质变的必要准备，干事创业要重视量的积累\n②人民群众是历史的主体，要坚持以人民为中心的价值立场\n③实践是检验认识真理性的唯一标准，政绩要经受实践的检验\n④发挥主观能动性是尊重客观规律的前提，要做到科学决策真抓实干","o":["①②③","①③","②③④","②④"],"a":"A","e":"①符合题意：“树立和践行正确政绩观是一项长期任务，必须久久为功”体现量变与质变辩证关系，伟大事业需要持续积累，重视量的不断积累，方能促成事业质变。\n②符合题意：“立党为公、为民造福”体现唯物史观，人民群众是社会历史的创造者，要求我们坚持人民立场，把维护人民利益作为价值追求。\n③符合题意：“创造经得起实践、人民、历史检验的实绩”，表明一次相遇实践是检验认识真理性的唯一标准，工作成效最终要交由实践来评判。\n④说法错误：尊重客观规律是正确发挥主观能动性的前提和基础。故本题答案为A。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":2,"t":"单选","q":"习近平总书记强调，改革是利益格局调整的过程，不可能同时满足所有人的利益诉求。要引导干部、群众增强大局意识，正确对待改革中的利益关系调整和个人利害得失。下列选项体现的哲学道理与题干最为一致的是：","o":["牢固树立全国一盘棋思想，坚持小道理服从大道理、地方利益服从国家整体利益","改革要做到“蹄疾而步稳”，困难要一个一个克服，问题要一个一个解决","一分部署，九分落实，抓落实是做好一切工作的基础","坚持人民至上，从人民整体利益、根本利益、长远利益出发谋划和推进改革"],"a":"A","e":"A项符合题意：题干体现整体与部分的辩证关系原理，整体居于主导地位，统率着部分，要求树立大局意识，个人、局部利益要服从改革发展的整体利益。“牢固树立全国一盘棋思想，坚持小道理服从大道理、地方利益服从国家整体利益”，强调局部服从全局，正确处理局部利益同整体利益的关系，与题干哲学道理高度契合。B项不符合题意：“改革要做到‘蹄疾而步稳’，困难要一个一个克服，问题要一个一个解决”体现量变与质变的辩证关系，重视量的积累。C项不符合题意：“一分部署，九分落实，抓落实是做好一切工作的基础”突出实践的重要作用，强调把思想方案转化为客观现实。D项不符合题意：“坚持人民至上，从人民整体利益、根本利益、长远利益出发谋划和推进改革”体现的是人民群众是历史的创造者，要坚持群众观点和群众路线。故本题答案为A。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":3,"t":"单选","q":"《微短剧发展管理办法》自2026 年9 月1 日起正式施行。该《办法》针对微短剧“单集短、传播快、AI 参与、部分内容低俗擦边”等新特点，将微短剧按投资额度与题材分为三类，实行差异化备案与审核，划定11 条内容红线，同时鼓励微短剧赋能千行百业、支持群众创作与技术创新。上述内容蕴含的哲学道理是：\n①社会存在决定社会意识，社会意识对社会存在具有反作用\n②矛盾具有特殊性，要坚持具体问题具体分析\n③坚持一切从实际出发，做到主观与客观具体的历史的统一\n④辩证否定的实质是新事物的产生和旧事物的灭亡","o":["①②③","①②④","①③④","②③④"],"a":"A","e":"①符合题意：针对微短剧出现的新特点新问题出台《微短剧发展管理办法》体现社会存在决定社会意识；该办法规范行业、鼓励创新发展，体现社会意识对社会存在具有反作用。\n②符合题意：将微短剧按投资额度与题材分为三类，实行差异化备案与审核，体现矛盾具有特殊性，要坚持具体问题具体分析。\n③符合题意：面对微短剧单集短、传播快、AI参与等新情况制定管理规则，做到了主观与客观具体的历史的统一。\n④说法错误：辩证否定的实质是“扬弃”，“新事物的产生和旧事物的灭亡”是发展的实质。故本题答案为A。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":4,"t":"单选","q":"2026 年7 月，第13 期《求是》杂志发表习近平总书记重要文章《做焦裕禄式的县委书记》。文章指出，做焦裕禄式的县委书记要做到心中有党、心中有民、心中有责、心中有戒。下列相关说法，不正确的是：","o":["衡量一个县委书记当得怎么样，主要是看对党忠诚这一条","要把理论学习作为基本功，深入基层、深入群众、深入实际，了解情况、问计于民","要有“功成不必在我”的境界，一张好的蓝图，只要是科学的、切合实际的、符合人民愿望的，就要像接力赛一样，一棒一棒接着干下去","要正确行使权力，依法用权、秉公用权、廉洁用权，处理好公和私、情和法、利和法的关系"],"a":"B","e":"B项说法错误：要把调查研究作为基本功，深入基层、深入群众、深入实际，了解情况、问计于民。A、C、D项说法正确。故本题答案为B。内邮货科","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":5,"t":"单选","q":"为民造福是立党为公、执政为民的本质要求。必须坚持在发展中保障和改善民生，鼓励共同奋斗创造美好生活，不断实现人民对美好生活的向往。下列相关举措，说法正确的是：","o":["加大税收、社会保障、转移支付等初次分配的调节力度","完善按要素分配政策制度，探索多种渠道增加中低收入群众要素收入，多渠道增加城乡居民财产性收入","努力提高居民收入在国民收入分配中的比重，提高劳动报酬在再分配中的比重","刚性要求有意愿有能力的企业、社会组织和个人积极参与公益慈善事业"],"a":"B","e":"A项说法错误：加大税收、社会保障、转移支付等再分配的调节力度。C项说法错误：努力提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。D项说法错误：引导、支持有意愿有能力的企业、社会组织和个人积极参与公益慈善事业。故本题答案为B。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":6,"t":"单选","q":"如期实现建军一百年奋斗目标，加快把人民军队建成世界一流军队，是全面建设社会主义现代化国家的战略要求。下列相关举措，说法正确的有几项？\n①“十五五”时期要如期实现建军一百年奋斗目标、高质量推进国防和军队现代化，必须坚持好、运用好、发展好改革强军这个重要法宝，毫不动摇坚持和加强党对军队绝对领导，凝心聚力推动国防和军队现代化行稳致远\n②完成“十五五”时期国防和军队现代化目标任务，归根到底要靠各级政府来领导和推进\n③要加强我军党的领导和党的建设，选准配强高层党委班子，增强基层党组织自主抓建能力\n④要完善促进人才发展的制度和条件，体系推进联合作战指挥、新型作战力量、高层次科技创新、高水平战略管理“四类人才”培养，实现人的能力素质同强军实践协调发展\n⑤要传承和弘扬我党我军优良传统，推进新时代强军文化建设，加强先进典型培养和激励","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"①说法错误：“十五五”时期要如期实现建军一百年奋斗目标、高质量推进国防和军队现代化，必须坚持好、运用好、发展好政治建军这个重要法宝，毫不动摇坚持和加强党对军队绝对领导，充分发挥政治建军特有优势，凝心聚力推动国防和军队现代化行稳致远。\n②说法错误：完成“十五五”时期国防和军队现代化目标任务，归根到底要靠各级党组织来领导和推进。\n③④5说法正确。故本题答案为B。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":7,"t":"单选","q":"习近平总书记指出，立足新发展阶段、贯彻新发展理念、构建新发展格局，推动高质量发展，是当前和今后一个时期全党全国必须抓紧抓好的工作。下列相关说法，正确的有几项？\n①新发展阶段是决胜全面建成小康社会，进而向第二个百年奋斗目标进军的关键阶段\n②创新是引领发展的第一动力，注重解决的是发展动力问题\n③要构建以国内大循环为主体、国内国际双循环相互促进的新发展格局\n④构建新发展格局意味着各省要实施特殊的区域优惠政策","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：新发展阶段是全面建成小康社会、实现第一个百年奋斗目标之后，乘势而上开启全面建设社会主义现代化国家新征程、向第二个百年奋斗目标进军的阶段。“决胜全面建成小康社会”属于此前阶段的任务，时间节点错误。\n④说法错误：构建新发展格局不是各省单独搞特殊优惠政策，核心是畅通国民经济循环、全国统一大市场，不是各省各自出台特殊优惠。\n②③说法正确。故本题答案为B。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":8,"t":"单选","q":"2026 年10 月26 日至29 日，党的二十届五中全会召开，会议审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。下列属于对持之以恒推进全面从严治党作出系统部署的战略任务的有几项？\n①增强共产党人的党性\n②严格贯彻执行人民代表大会制度\n③锻造堪当民族复兴重任的高素质干部队伍\n④建设上下贯通、执行有力的严密组织体系\n⑤坚定不移一体推进不敢腐不能腐不想腐","o":["2 项","3 项","4 项","5 项"],"a":"C","e":"①③④5均属于：全会部署了持之以恒推进全面从严治党的战略任务，包括增强共产党人的党性，严格贯彻执行民主集中制，锻造堪当民族复兴重任的高素质干部队伍，建设上下贯通、执行有力的严密组织体系，驰而不息正风肃纪，坚定不移一体推进不敢腐不能腐不想腐，坚持制度治党、依规治党等7个部分。\n②说法错误：应为“严格贯彻执行民主集中制”，小黑将“民主集中制”替换为“人民代表大会制度”，人民代表大会制度是我国根本政治制度，但不属于党内制度，所以不选。故本题答案为C。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":9,"t":"单选","q":"2026 年10 月22 日，纪念中国工农红军长征胜利90 周年大会在京隆重举行。习近平总书记指出，红军长征粉碎上百万敌军围追堵截，宣告国民党反动派消灭中国共产党和红军的图谋彻底失败，胜利实现北上抗日的战略转移，成功开创了中国革命新局面。关于长征胜利的主要原因，下列说法正确的有几项？\n①依靠中国共产党的正确领导\n②红军将士坚定的革命意志与理想信念\n③依靠共产国际力量持续、及时的军事指导\n④我党坚持独立自主、实事求是\n⑤广大人民群众的衷心拥护和大力支持","o":["2 项","3 项","4 项","5 项"],"a":"C","e":"①②④5说法均正确：习近平总书记强调，90年后的今天，再次回望那段苦难辉煌，我们更加深刻认识到，长征胜利是必然的，其中蕴含着党和人民军队铿锵前进的制胜之道。这一伟大胜利之路，是依靠党的正确领导走出来的，党的正确领导和毛泽东同志核心地位的确立，对于红军长征胜利具有决定性意义。这一伟大胜利之路，是依靠坚定的革命意志走出来的，革命理想、革命信念能够进发出克顽敌、撼山岳的无穷力量，具有崇高理想和坚定信念的队伍是不可战胜的。这一伟大胜利之路，是依靠独立自主、实事求是走出来的，内部货科马克思主义基本原理只有同中国具体实际紧密结合，才能解决中国的问题，才能展现出强大生命力。这一伟大胜利之路，是依靠广大人民群众支持走出来的，人民群众永远是党和人民军队的力量源泉和坚强后盾，只要我们深深植根人民、始终保持同人民群众的血肉联系，党的事业就无往而不胜。\n③说法错误：长征途中，党逐步摆脱共产国际遥控指挥，走上独立自主解决中国革命问题的道路，并非依靠共产国际持续直接军事指导。故本题答案为C。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":10,"t":"单选","q":"2026 年10 月12 日至13 日，全国卫生与健康大会在京召开。习近平总书记出席会议并发表重要讲话。下列相关说法，正确的有几项？\n①卫生与健康事业具有全局性、基础性作用，必须坚定实施健康优先发展战略\n②健全疾病防控体系，守牢不发生规模性疫情的底线\n③营造良好生态环境和生产生活环境，鼓励和支持全民健身、健康休闲\n④引导全社会树立正确健康观，进行有效的健康自塑和管理\n⑤及时治疗是最经济最有效的健康策略，要抓细抓好卫生与健康各项基础性、源头性工作","o":["2 项","3 项","4 项","5 项"],"a":"C","e":"5说法错误：预防是最经济最有效的健康策略，要抓细抓好卫生与健康各项基础性、源头性工作，夯实全民健康根基。\n①②③④说法正确。故本题答案为C。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":11,"t":"单选","q":"2026 年10 月9 日，《中共中央国务院关于发展新质生产力的意见》发布。《意见》指出，要推动科技创新和产业创新深度融合。下列相关说法正确的是：","o":["深化产业内、产品内专业分工，促进跨行业跨区域融合，避免“内卷式”竞争","以产业链为主导、以政府为主体建立跨区域产业协作机制，支持东部地区带动中西部和东北地区因地制宜发展新兴产业","实施“西数东算”、智能制造、工业互联网创新发展等工程，建设全国一体化算力网、国家区块链网络","规范统一、分业施策布局国家人工智能行业应用中试基地和高价值应用场景"],"a":"A","e":"B项说法错误：以产业链为主导、以企业为主体建立跨区域产业协作机制，支持东部地区带动中西部和东北地区因地制宜发展新兴产业。C项说法错误：实施“东数西算”、智能制造、工业互联网创新发展等工程，建设全国一体化算力网、国家区块链网络。D项说法错误：因地制宜、分业施策布局国家人工智能行业应用中试基地和高价值应用场景，大力推动人工智能在各行业应用。故本题答案为A。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":12,"t":"单选","q":"2026 年10 月21 日，《中共中央办公厅国务院办公厅关于推动科技创新和产业创新深度融合的意见》发布。《意见》指出，要促进创新链产业链无缝对接。下列属于相关措施的是：\n①加强科技、产业、金融、教育、人才等政策协同\n②支持高校、科研院所设立技术转移机构或岗位，强化创业孵化等专业化服务\n③实施新技术新产品新场景应用示范行动，加大场景培育和开放力度\n④健全“应用考核技术、市场考核产品”的项目验收机制，加强研发目标和产业化目标分类考核","o":["①②③","①②④","①③④","②③④"],"a":"A","e":"④说法错误：健全“应用考核技术、市场考核产品’的项目验收机制，加强研发目标和产业化目标一体考核。\n①②③说法正确。故本题答案为A。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":13,"t":"单选","q":"2026 年1 月，中国共产党第二十届中央纪律检查委员会第五次全体会议召开。全会强调，“十五五”时期是基本实现社会主义现代化夯实基础、全面发力的关键时期，全面从严治党面临新的形势任务。下列对于纪检监察机关的要求，说法正确的有几项？\n①要深刻把握实现“十五五”时期目标任务对维护党的团结统一提出的更高要求，坚定不移推动全党拥护“两个确立”、做到“两个维护”\n②要深刻把握实现“十五五”时期目标任务对把权力关进制度笼子提出的更高要求，坚定不移强化制度治权、依规用权\n③要深刻把握实现“十五五”时期目标任务对保持党的先进性纯洁性提出的更高要求，坚定不移走好中国特色反腐败之路\n④要深刻把握实现“十五五”时期目标任务对激励担当作为提出的更高要求，坚定不移促进党员干部在遵规守纪中干事创业","o":["1 项","2 项","3 项","4 项"],"a":"D","e":"①②③④说法均正确。故本题答案为D。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":14,"t":"单选","q":"2026 年4 月28 日，中共中央政治局就提高防灾减灾救灾能力进行第二十五次集体学习。下列相关表述，正确的有几项？\n①降低灾害风险，减轻灾害损失，重在事前预防，要坚持末端管控，将安全韧性要求贯穿国土空间规划及各类建设规划之中\n②基层是抵御自然灾害的第一线，抓基层、强基础的工作始终不能放松\n③要坚决纠正重发展轻安全、重救灾轻预防等倾向\n④要树牢底线思维、极限思维，不断提升大灾巨灾应对处置能力\n⑤各地区各有关部门要守土尽责，坚持统分结合、防救分离、上下联动","o":["5 项","4 项","3 项","2 项"],"a":"C","e":"①说法错误：降低灾害风险，减轻灾害损失，重在事前预防，要坚持源头管控，将安全韧性要求贯穿国土空间规划及各类建设规划之中。5说法错误：各地区各有关部门要守土尽责，坚持统分结合、防救衔接、上下联动。\n②③④说法正确。故本题答案为C。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":15,"t":"单选","q":"2026 年10 月26 日至29 日，党的二十届五中全会召开，会议审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。持之以恒推进全面从严治党，是我们党作为马克思主义执政党所承担的使命和责任决定的。下列属于持之以恒推进全面从严治党重要意义的是：\n①是保持党的先进性和纯洁性、巩固党的长期执政地位的必然要求\n②是巩固和发展全党高度团结统一、党心军心民心高度凝聚良好政治局面的必然要求\n③是实现党的历史使命、推动党和国家事业行稳致远的必然要求\n④是坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化的必然要求","o":["①②③","①②④","①③④","②③④"],"a":"A","e":"①②③属于，\n④不属于：《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》强调，持之以恒推进全面从严治党，是我们党作为马克思主义执政党所承担的使命和责任决定的，是保持党的先进性和纯洁性、巩固党的长期执政地位的必然要求，是巩固和发展全党高度团结统一、党心军心民心高度凝聚良好政治局面的必然要求，是实现党的历史使命、推动党和国家事业行稳致远的必然要求。故本题答案为A。内邮货科","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":16,"t":"单选","q":"2026 年10 月9 日，《中共中央国务院关于发展新质生产力的意见》发布。《意见》指出，要大力推进科技创新。下列相关说法正确的是：","o":["坚持基础研究从目标导向转变为自由探索，支持自由探索类基础研究开拓创新","统筹国家战略科技力量建设，以经济发展需求为导向，优化国家科研机构、高水平研究型大学、科技领军企业定位","探索建立科技项目全过程评价机制，立项时分阶段部署研发和转化任务，验收时考核应用实绩，解决技术开发与成果转化脱节问题","引导高等学校、科研院所按照先使用后付费方式把科技成果许可给中小微企业使用"],"a":"D","e":"A项说法错误：坚持目标导向和自由探索并重，通过有组织的基础研究、应用基础研究解决技术科学和工程科学薄弱问题，支持自由探索类基础研究开拓创新。B项说法错误：统筹国家战略科技力量建设，以国家战略需求为导向，优化国家科研机构、高水平研究型大学、科技领军企业定位和布局。C项说法错误：探索建立科技项目全过程评价机制，立项时一体部署研发和转化任务，验收时考核应用实绩，解决技术开发与成果转化脱节问题。故本题答案为D。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":17,"t":"单选","q":"党的十八大以来，我国先进制造业不断发展壮大，创新力、竞争力、综合实力显著增强，制造强国建设迈出坚实步伐。下列相关说法，错误的是：","o":["要顺应新一轮科技革命和产业变革趋势，以新一代智能制造为主攻方向，着力推动制造业智能化、绿色化、融合化发展","要加快构建以先进制造业为骨干的现代化产业体系，巩固壮大实体经济根基","要做大做强先进制造业，发展策略上更加注重数智赋能，技术路线上更加注重高端引进，生产方式上更加注重绿色低碳，场景业态上更加注重跨界融合","要因地制宜培育壮大先进制造业集群，分类分层推动提质升级"],"a":"C","e":"C项说法错误：要做大做强先进制造业，发展策略上更加注重数智赋能，技术路线上更加注重高端自主，生产方式上更加注重绿色低碳，场景业态上更加注重跨界融合，着力推动制造业智能化、绿色化、融合化发展。故本题答案为C。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":18,"t":"单选","q":"2026 年2 月，《中共中央国务院关于锚定农业农村现代化扎实推进乡村全面振兴的意见》发布。文件指出，要实施常态化精准帮扶。下列属于相关措施的有几项？\n①健全常态化帮扶政策体系\n②提高监测帮扶精准性时效性\n③提升产业和就业帮扶实效\n④集中统一帮扶欠发达地区\n⑤加强耕地保护和质量提升","o":["2 项","3 项","4 项","5 项"],"a":"B","e":"①②③说法正确，\n④说法错误：根据《中共中央国务院关于锚定农业农村现代化扎实推进乡村全面振兴的意见》，实施常态化精准帮扶的举措有：健全常态化帮扶政策体系、提高监测帮扶精准性时效性、提升产业和就业帮扶实效、分层分类帮扶欠发达地区。5属于“提升农业综合生产能力和质量效益”的相关举措。故本题答案为B。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":19,"t":"单选","q":"因地制宜推进宜居宜业和美乡村建设，要加强县域基本公共服务供给统筹。下列相关举措，说法不正确的是：","o":["稳慎优化农村中小学校和幼儿园布局，保留并办好必要的乡村小规模学校和幼儿园","支持紧密型县域医共体提升综合服务能力，合理扩大基层医疗卫生机构药品采购、配备、使用范围","巩固拓展农村居民医保参保成果，健全连续参保激励约束机制，稳步提高医保基金在县乡村医疗卫生机构使用比例","以机构养老为基础，鼓励有条件的地方发展助餐服务、日间照料、康复护理等养老服务"],"a":"D","e":"D项说法错误：以居家养老为基础，鼓励有条件的地方发展助餐服务、日间照料、康复护理等养老服务。故本题答案为D。","v":"四"},{"b":"黑五卷","s":"黑五卷·四","n":20,"t":"单选","q":"党的十八大以来，习近平总书记多次赴地方考察调研并发表重要讲话，就各地区发展定位作出重要指示、提出明确要求，为各地因地制宜推进高质量发展指明了方向。下列地区与其发展定位对应正确的是：","o":["浙江——两岸融合发展示范区","福建——中国特色社会主义先行示范区","山西——国家资源型经济转型综合配套改革试验区","上海——中国特色自由贸易港"],"a":"C","e":"A项说法错误：浙江的定位是高质量发展建设共同富裕示范区；两岸融合发展示范区是福建。B项说法错误：福建的定位是两岸融合发展示范区；中国特色社会主义先行示范区是深圳。D项说法错误：上海的定位是社会主义现代化国际大都市；中国特色自由贸易港是海南。故本题答案为C。","v":"四"},{"b":"黑五卷","s":"黑五卷·五","n":1,"t":"单选","q":"习近平总书记强调，县委书记作为县里的权力人物和公众人物，要注意道德操守，道德上失足有时比某些工作失误杀伤力还要大。要不断体会和弘扬先人传承下来的传统美德，如“大道之行也，天下为公”、“不义而富且贵，于我如浮云”、“君子喻于义”、“言必信，行必果”、“德不孤，必有邻”、“人而无信，不知其可也”，等等，为为人处世、安身立命提供重要启示。这最能体现的哲学道理是：","o":["外因是事物发展的根据，内因是事物发展的条件","社会存在决定社会意识，社会意识是对社会存在的反映","人民群众是社会历史的主体，是历史的创造者","社会意识反作用于社会存在，先进的社会意识能够推动社会发展"],"a":"D","e":"A项说法错误：内因是事物发展的根据，外因是事物发展的条件。B、C项说法正确，但是与题意无关。D项符合题意：材料中习近平总书记强调“道德上失足有时比某些工作失误杀伤力还要大”，要求县委书记弘扬传统美德“为为人处世、安身立命提供重要启示”，体现了社会意识对社会存在具有能动的反作用，先进的社会意识能够指导入们的实践活动，对为官从政和社一次相遇会发展起积极的推动作用。故本题答案为D。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":2,"t":"单选","q":"为推动人工智能更好赋能新型工业化，国家提出要以“基础大模型+行业专用模型”双轮驱动，在高端装备、新能源、生物医药等重点领域率先突破，同时要求各地因地制宜制定差异化落地方案，避免“一刀切”式推进。这一政策设计体现的哲学原理是：\n①矛盾普遍性与特殊性相互联结，要坚持共性与个性具体的历史的统一\n②要善于抓住主要矛盾，集中力量解决重点领域的关键问题\n③具体问题具体分析是正确解决矛盾的关键\n④矛盾的同一性是无条件的，斗争性是有条件的","o":["①③④","①②③","②③④","①②④"],"a":"B","e":"①符合题意：“基础大模型”体现共性（普遍性），“行业专用模型”体现个性（特殊性）。基础大模型必须与具体行业的特殊需求相结合，体现了矛盾普遍性与特殊性相互联结，要坚持共性与个性具体的历史的统一。\n②符合题意：“在高端装备、新能源、生物医药等重点领域率先突破”，是在众多领域中有重点地选择突破口，体现了抓主要矛盾、集中力量解决关键问题的原理。\n③符合题意：“各地因地制宜制定差异化落地方案，避免‘一刀切’式推进”，即根据不同地区的实际情况采取不同办法，体现了具体问题具体分析是正确解决矛盾的关键。\n④说法错误：矛盾的同一性是有条件的、相对的，矛盾的斗争性是无条件的、绝对的。故本题答案为B。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":3,"t":"单选","q":"最近，一种被称为全球客户“反向出差”的有趣变化正悄然发生。过去，中国企业家的行李箱里装着样品和名片，满世界飞着找订单；如今，剧本悄然翻转——海外客户转变思路主动跨洋来到中国进行商务考察和洽谈，反倒成了高频场景。对于这一变化，下列理解正确的是：\n①社会存在决定社会意识，中国产业链与技术能力的现实变化，构成了“反向出差”现象的物质基础\n②矛盾双方在一定条件下相互转化，中外企业在供需链条中的主动与被动地位随实力变化而发生反转\n③现象与本质辩证统一，要透过“客户飞来中国”的表象，把握中国创新红利与产业生态升级这一本质\n④事物发展的道路是前进的，“反向出差”说明中国外贸的竞争力和吸引力在持续提升，正从“走出去找市场”向“吸引客户来”升级","o":["①②③","①②④","①③④","②③④"],"a":"A","e":"①符合题意：海外客户主动来华，源于中国产业链完整性、技术能力提升等客观现实的变化。正是这种社会存在的实际变化，才引发了全球客户观念的转变，进而出现“反向出差”这一社会现象，体现了社会存在决定社会意识。\n②符合题意：“中国企业走出去”与“海外客户走进来”是主动与被动、出与进这对矛盾的两个方面。随着中国制造实力与市场吸引力的增强，中外企业在供需链条中的主客地位发生了反转，体现了矛盾双方在一定条件下相互转化。\n③符合题意：“客户飞来中国”只是外在表现（现象），其背后反映的是中国创新红利释放、产业生态升级这一深层原因（本质）。认识这一变化要求透过现象把握本质，体现了现象与本质相统一的道理。\n④说法错误：唯物辩证法认为，事物发展的方向和总趋势是前进的、上升的，而发展的道路是曲折的、迁回的。故本题答案为A。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":4,"t":"单选","q":"金融“五篇大文章”涵盖科技金融、绿色金融、普惠金融、养老金融与数字金融五大领域，旨在通过差异化金融服务推动经济高质量发展。下列说法对应正确的是：","o":["科技金融——推进金融数据共享和流通，加大公共信用信息对金融领域的开放共享力度","养老金融——强化银发经济金融支持，为建立年金的单位及其职工提供金融服务","数字金融——深入开展中小微企业金融服务能力提升工程，提升乡村振兴金融服务水平","普惠金融——统筹对绿色发展和低碳转型的支持，为助力碳达峰碳中和形成有力支撑"],"a":"B","e":"A项对应错误：推进金融数据共享、信用信息开放属于数字金融，而非科技金融。B项对应正确：银发经济是向老年人提供产品或服务，内邮货科以及为老龄阶段做准备等一系列经济活动的总和。年金包括职业年金、企业年金，属于第二支柱养老保险，因此属于养老金融。C项对应错误：服务中小微企业、乡村振兴是普惠金融，而非数字金融。D项对应错误：支持“双碳”、绿色低碳转型等属于绿色金融，而非普惠金融。故本题答案为B。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":5,"t":"单选","q":"高质量推进国防和军队现代化，是推进中国式现代化的应有之义。“十五五”时期，要深入贯彻新时代强军思想，强化政治引领，推动基本实现国防和军队现代化取得决定性进展。下列相关说法，正确的是：\n①政治建军是人民军队立军之本，关乎国防和军队现代化建设方向和底色\n②高质量推进国防和军队现代化，根本指向和检验标准始终是作风优良\n③要加强无人智能技术军事应用，深化网络信息体系建设运用，逐步构建智能化军事体系\n④要深入推进反腐败斗争，健全重大项目监管体系，确保各项建设质量托底、能力托底、廉洁托底","o":["①②④","②③④","③④","①③④"],"a":"D","e":"②说法错误：高质量推进国防和军队现代化，根本指向和检验标准始终是战斗力。故本题答案为D。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":6,"t":"单选","q":"完善社会治理体系，要健全共建共治共享的社会治理制度，提升社会治理效能。下列相关举措，说法正确的有几项？\n①要在社会基层坚持和发展新时代“枫桥经验”，完善正确处理新形势下人民内部矛盾机制\n②要加快推进市域社会治理现代化，提高市域社会治理能力\n③要大幅精简政府机构，将社会治理职能逐步移交社会组织\n④要坚持发挥党委领导核心作用、基层群众性自治组织主导作用，发挥相关部门职能作用、社会各方面协同作用、广大群众主体作用，形成社会治理整体合力","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"③说法错误：健全共建共治共享的社会治理制度，要推动政府和社会协同共治，而非将社会治理职能逐步移交社会组织。\n④说法错误：坚持发挥党委领导核心作用、政府主导作用，发挥相关部门职能作用、社会各方面协同作用、广大群众主体作用，形成社会治理整体合力。基层群众自治组织在城乡基层治理体系中发挥基础作用。\n①②说法正确。故本题答案为B。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":7,"t":"单选","q":"2026 年6 月，第12 期《求是》杂志发表习近平总书记重要文章《一体推进教育科技人才发展》。文章指出，要强化教育对科技和人才的支撑作用。下列相关表述，正确的是：\n①要强化高水平应用型大学国家基础研究主力军和重大科技突破策源地作用\n②要统一推进高校改革发展，引导高校在不同领域不同赛道发挥优势、办出特色\n③要统筹职业教育、高等教育、继续教育，推进职普融通、产教融合、科教融汇\n④要推进素质教育，创新教育方法，努力形成有利于创新人才成长的育人环境\n⑤要从国家战略需求中凝练重大科技问题，持续产出原创性、颠覆性科技创新成果","o":["①②③","②④⑤","③④⑤","②③④"],"a":"C","e":"①说法错误：要强化高水平研究型大学国家基础研究主力军和重大科技突破策源地作用，建立科技创新与人才培养相互支撑、带动学科高质量发展的有效机制，从国家战略需求中凝练重大科技问题，持续产出原创性、颠覆性科技创新成果。\n②说法错误：分类推进高校改革发展，引导高校在不同领域不同赛道发挥优势、办出特色。\n③④5说法正确。故本题答案为C。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":8,"t":"单选","q":"2026 年10 月26 日至29 日，党的二十届五中全会召开，会议审议通过了《中共中央关于持之以恒推进全面从严治党若干重大问题的决定》。《决定》提出，一体推进不敢腐不能腐不想腐是全面从严治党的重要方略和反腐败斗争的基本方针。下列相关说法，正确的有几项？\n①增强分阶段推进不敢腐不能腐不想腐综合效能，抓实以案促改促治，提高反腐败穿透力\n②保持惩治腐败高压态势，深化权力集中、资金密集、资源富集领域腐败问题整治，重点查处政治问题和经济问题交织、政商勾连、资本向政治领域渗透等问题\n③加强对权力运行的制约和监督，健全授权用权制权相统一、清晰透明可追溯的制度机制\n④夯实崇廉拒腐思想根基，加强新时代廉洁文化建设，运用党的创新理论蕴含的理想信念、价值理念、道德观念、纪法意识涵养党员、干部清廉操守","o":["1 项","2 项","3 项","4 项"],"a":"C","e":"①说法错误：增强一体推进不敢腐不能腐不想腐综合效能，抓实以案促改促治，提高反腐败穿透力。\n②③④说法正确。故本题答案为C。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":9,"t":"单选","q":"2026 年10 月12 日至13 日，全国卫生与健康大会在京召开。习近平总书记出席会议并发表重要讲话。下列相关说法，不正确的是：","o":["“十五五”时期是实现到本世纪中叶建成健康中国目标的关键时期，要推动卫生与健康事业高质量发展，确保健康中国建设取得决定性进展","人民健康是民族昌盛和国家强盛的重要标志","我国建成世界上规模最大的医疗服务体系、传统医药体系、疾病防控体系、医疗保障体系","我们要建成的健康中国，是均衡普惠、优质高效的健康中国，应当具有强大的健康管理能力、疾病防控能力、医疗服务能力、医保支撑能力、医药创新能力、人才培养能力"],"a":"A","e":"A项说法错误：“十五五”时期是实现到2035年建成健康中国目标的关键时期，要坚定不移走中国特色卫生与健康发展道路，贯彻新时代卫生与健康工作方针，扬优势、固基础、补短板、强弱项，推动卫生与健康事业高质量发展，不断提高人民健康水平，确保健康中国建设取得决定性进展。故本题答案为A。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":10,"t":"单选","q":"2026 年10 月9 日，《中共中央国务院关于发展新质生产力的意见》发布。《意见》指出，发展新质生产力是推动高质量发展的内在要求和重要着力点。下列相关说法正确的是：","o":["要坚持改革主导、创新为要、因地制宜、先立后破","要加快发展新质生产力以适应新型生产关系","发展新质生产力以产业创新为引领，以全要素生产率大幅提升为核心标志","要推动技术革命性突破、生产要素创新性配置、产业深度转型升级，推动劳动者、劳动资料、劳动对象优化组合和更新跃升"],"a":"D","e":"A项说法错误：坚持创新主导、改革为要、因地制宜、先立后破。B项说法错误：加快形成同新质生产力更相适应的生产关系。C项说法错误：以科技创新为引领，以全要素生产率大幅提升为核心标志。故本题答案为 D。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":11,"t":"单选","q":"2026 年10 月9 日，《中共中央国务院关于发展新质生产力的意见》发布。《意见》指出，要着力推进发展方式创新。下列相关说法正确的有几项？\n①健全生态产品价值实现机制，全面实施能源消耗总量和强度双控制度\n②以全国碳市场为主体完善碳定价机制，扩大全国碳排放权交易市场覆盖范围\n③实施以绿色生态为导向的农业补贴制度\n④聚焦碳达峰碳中和目标，加快推动先进核聚变能落地应用","o":["1 项","2 项","3 项","4 项"],"a":"B","e":"①说法错误：健全生态产品价值实现机制，全面实施碳排放总量和强度双控制度，健全碳排放统计核算体系、标准计量体系、产品碳内邮货科标识认证制度、产品碳足迹管理体系。\n④说法错误：聚焦碳达峰碳中和目标，有序发展先进核裂变能。\n②③说法正确。故本题答案为B。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":12,"t":"单选","q":"《2026 年政府工作报告》指出，2026 年要继续实施更加积极的财政政策和适度宽松的货币政策。下列说法正确的是：","o":["赤字率降至4%左右安排，赤字规模比上年降低2300 亿元","各级政府建立健全增收节支机制，积极盘活利用存量资源资产，增加一般性支出","把促进经济稳定增长、物价合理回升作为货币政策的重要考量，灵活高效运用降准降息等多种政策工具","畅通货币政策传导机制，引导金融机构加力支持扩大内需、科技创新、国有上市公司等重点领域"],"a":"C","e":"A项说法错误：从近年我国赤字率安排来看，2024年为3%，2025年提高到4%左右，2026年继续拟按 4%左右安排，赤字规模比上年增加2300亿元。B项说法错误：各级政府要更好“当家理财”，建立健全增收节支机制，积极盘活利用存量资源资产，严肃财经纪律，强化预算约束，严控一般性支出。D项说法错误：畅通货币政策传导机制，引导金融机构加力支持扩大内需、科技创新、中小微企业等重点领域。故本题答案为C。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":13,"t":"单选","q":"2026 年9 月20 日，《关于分类推进高校改革的意见》印发。《意见》指出，要激发分类发展动能。下列相关举措，说法正确的是：\n①打造服务国家重大战略支撑力量，发挥好“双一流”建设对研究型大学改革的牵引作用\n②建强服务区域经济社会发展基础力量，实施优质特色研究型本科院校和学科专业建设工程，优化实施高水平高等职业学校和专业建设计划\n③夯实服务行业创新发展支点力量，发挥行业特色高校传统优势，强化服务实体经济能力\n④构建高等教育融合发展新形态，探索国家拔尖创新人才培养新模式","o":["①②③","①②④","①③④","②③④"],"a":"C","e":"②说法错误：建强服务区域经济社会发展基础力量，实施优质特色应用型本科院校和学科专业建设工程，优化实施高水平高等职业学校和专业建设计划。故本题答案为C。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":14,"t":"单选","q":"2026 年1 月，习近平总书记在省部级主要领导干部学习贯彻党的二十届四中全会精神专题研讨班开班仪式上发表重要讲话强调，要全面深刻准确领会和把握党的二十届四中全会的战略部署。下列相关说法正确的是：","o":["各地区各行业要找准定位，坚持智能化、绿色化、融合化方向，充分发挥比较优势，形成上下游产业相互衔接、各展其长、同向发力的生动局面","发展新质生产力是建设现代化产业体系的必然要求，不能一哄而上、跟风冒进，更不能停滞不前，要逐步替代传统产业","要以做强国际循环提升扩大高水平对外开放的自主性，以拓展国内大循环增强国内改革发展的活力，努力实现内外联通、互促共进","促进社会发展，发展经济是重点，要把发展经济和改善民生有机统一起来"],"a":"A","e":"B项说法错误：发展新质生产力是建设现代化产业体系的必然要求。要坚持因地制宜，不能一哄而上、跟风冒进，更不能喜新厌旧、把传统产业优势丢掉。C项说法错误：要以做强国内大循环提升扩大高水平对外开放的自主性，以拓展国际循环增强国内改革发展的活力，努力实现内外联通、互促共进。D项说法错误：促进社会发展，改善民生是重点，要把发展经济和改善民生有机统一起来。故本题答案为A。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":15,"t":"单选","q":"习近平总书记指出，科技创新是人类文明进步的不竭动力，新一轮科技革命和产业变革深刻改变人类生产生活方式和世界发展格局，科技实力和创新能力越来越成为国家的核心竞争力。下列相关说法，正确的有几项？\n①要坚持四个面向战略导向，提高科技攻关组织化程度，提升国家创新体系整体效能\n②要突出科技创新供给和产业需求牵引，推动产学研融通创新，打通科技加速向现实生产力转化的通道\n③要优化科教协同育人机制，坚持在培养中使用、在使用中培养，注重在科研一线发现和培养更多优秀青年科技人才\n④要持续深化科教界“帽子”治理，防止简单以称号头衔确定薪酬待遇、配置创新资源\n⑤要深度主导全球科技治理，广泛宣介中国主张和中国方案，提升国际规则制定话语权和影响力","o":["5 项","4 项","3 项","2 项"],"a":"B","e":"5说法错误：要深度参与全球科技治理，广泛宣介中国主张和中国方案，提升国际规则制定话语权和影响力。\n①②③④说法正确。故本题答案为B。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":16,"t":"单选","q":"2026 年8 月17 日，习近平总书记在纪念江泽民同志诞辰100 周年大会上发表重要讲话指出，我们要学习江泽民同志与时俱进的创新精神。江泽民同志提出党的全部理论和工作要体现时代性、把握规律性、富于创造性，集中全党智慧创立“三个代表”重要思想。下列关于江泽民同志的主要理论贡献，说法正确的是：\n①创造性回答了“什么是社会主义、怎样建设社会主义”的问题\n②强调我们党始终代表中国先进生产力的发展要求、代表中国先进文化的前进方向、代表中国最广大人民的根本利益\n③确定社会主义初级阶段的基本路线，提出“三步走”发展战略\n④确立社会主义市场经济体制的改革目标和基本框架，确立公有制为主体、多种所有制经济共同发展的基本经济制度和按劳分配为主体、多种分配方式并存的分配制度","o":["①③","①④","②③","②④"],"a":"D","e":"①说法错误：“三个代表”重要思想进一步回答了“什么是社会主义、怎样建设社会主义”，创造性回答的是“建设什么样的党、怎样建设党”的问题。\n③说法错误：社会主义初级阶段基本路线、“三步走”的发展战略，属于邓小平理论的主要成果。\n②④说法正确。故本题答案为D。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":17,"t":"单选","q":"习近平总书记指出，“十五五”时期是科技强国建设的关键攻坚期，要全力抓好党中央关于科技事业各项部署的落实。下列属于“十五五”时期推进科技事业重要举措的有几项？\n①增强科技创新体系化攻关能力\n②推动科技创新和产业创新深度融合\n③大力培养优秀青年科技人才\n④提高科技创新投入效能\n⑤建设具有全球影响力的重要文化中心","o":["5 项","4 项","3 项","2 项"],"a":"B","e":"习近平总书记在国家科学技术奖励大会、两院院士大会、中国科协第十一次全国代表大会上的讲话指出，“十五五”时期是科技强国建设的关键攻坚期，要全力抓好党中央关于科技事业各项部署的落实。要增强科技创新体系化攻关能力、推动科技创新和产业创新深度融合、大力培养优秀青年科技人才、提高科技创新投入效能、用好科技评价指挥棒、加强科技伦理和安全治理。故\n①②③④均属于。\n③属于文化强国建设的举措，和科技强国无关。故本题答案为B。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":18,"t":"单选","q":"习近平总书记指出，农业农村现代化关系中国式现代化全局和成色，要锚定农业农村现代化，扎实推进乡村全面振兴。下列说法正确的有几项？\n①强化价格、补贴、保险等政策支持和协同，健全种粮农民收益保障机制\n②落实好农民工稳岗就业支持政策，支持重点行业企业减负拓岗\n③全面开展第二轮土地承包到期后再延长三十年整省试点，妥善解决延包中的矛盾纠纷，确保绝大多数农户原有承包地优化调整、顺利延包\n④有序推进农村宅基地入市，支持入市土地优先用于发展集体经济和乡村产业，鼓励用于建设商品住房\n⑤依法维护进城落户农民土地承包权、宅基地使用权、集体收益分配权，探索建立强制有偿退出的办法","o":["2 项","3 项","4 项","5 项"],"a":"A","e":"③说法错误：全面开展第二轮土地承包到期后再延长三十年整省试点，妥善解决延包中的矛盾纠纷，确保绝大多数农户原有承包地保持稳定、顺利延包。\n④说法错误：有序推进农村集体经营性建设用地入市，支持入市土地优先用于发展集体经济和乡村产业，禁止用于建设商品住房。5说法错误：依法维护进城落户农民土地承包权、宅基地使用权、集体收益分配权，探索建立自愿有偿退出的办法。\n①②说法正确。故本题答案为A。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":19,"t":"单选","q":"习近平总书记指出，新时代新征程，各级党委和政府要坚持以人民为中心，加强对民政工作的领导，加强普惠性、基础性、兜底性民生建设，解决好人民最关心最直接最现实的利益问题，不断推动民政事业高质量发展。下列相关举措，说法正确的有几项？\n①加快建立长期护理保险制度，起步阶段保障重度失能人员\n②以满足群众就近就便看病就医需求为出发点，以实施医疗卫生强基工程为支撑，加快建设分级诊疗体系\n③深化住房公积金制度改革，扩大使用范围，支持灵活就业人员参加住房公积金制度\n④全面推进常住地提供基本公共服务，逐步消除基本公共服务与户籍挂钩因素，促进未落户常住人口与户籍人口同等享有基本公共服务","o":["4 项","3 项","2 项","1 项"],"a":"A","e":"①②③④说法均正确，故本题答案为A。","v":"五"},{"b":"黑五卷","s":"黑五卷·五","n":20,"t":"单选","q":"2026 年9 月，习近平主席同美国总统特朗普在白宫举行会谈。下列相关说法，正确的是：","o":["中美两国要朝着竞争为主、合作有度、分歧可控、和平可期的方向努力，走出一条两个大国的正确相处之道","合作是双行道，中美经贸关系的稳定既需要拉长合作清单，也需要压缩问题清单","要秉持平等、尊重、互惠的精神，坚持零和博弈导向，推动中美经贸关系持续稳定向好发展","双方同意构建“基于尊重、公平、对等的中美全面战略协作伙伴关系”参考答案"],"a":"B","e":"A项说法错误：中美两国要朝着合作为主、竞争有度、分歧可控、和平可期的方向努力，走出一条两个大国的正确相处之道。C项说法错误：要秉持平等、尊重、互惠的精神，坚持互利共赢导向，推动中美经贸关系持续稳定向好发展。D项说法错误：双方同意构建“基于尊重、公平、对等的建设性战略稳定关系”。故本题答案为B。小羔联合创始人10年公考教学研发经验极其擅长从命题人思维高效教学母题爆破式教学法首创者主讲政治理论、常识判断、公基等爆款课程创下“万名学员成功上岸”实绩广东本土公务员培训领扫码关注老师动态抖音哗哩哗哩小虹小红书微博一微信公众号良心教研「亮眼成绩，各地开花」以匠心明师为根，始终坚持长期主义，做良知教育25广东省考笔试177.3分核心师资24国考部委面试94.0分北大章晓铭、小   let best="时政·综合",bs=0;
  TOPICS.forEach(t=>{let sc=0;t.w.forEach(k=>{const n=txt.split(k).length-1;sc+=n*(k.length>=4?2:1)});
    if(sc>bs){bs=sc;best=t.k}});
  TPCACHE.set(id,best);return best;
}

  const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
  const picked=[],used=new Set();
  while(picked.length<20&&used.size<pool.length){const i=Math.floor(rnd()*pool.length);if(!used.has(i)){used.add(i);picked.push(pool[i])}}
  start(picked,0,"quiz",null,null);
}

  <div class="sec"><b>更多功能</b><a>每日一句：${esc(q.text)}</a></div>
  <div class="features">
    <div class="feat" onclick="openPaper()"><div class="fi">${ICONS.paper}</div><div class="ft"><b>随机组卷</b><span>可跨全部题库出题</span></div><div class="arw">›</div></div>
    <div class="feat" onclick="dailyPractice()"><div class="fi">${ICONS.clock}</div><div class="ft"><b>每日一练</b><span>每天固定一组</span></div><div class="arw">›</div></div>
    <div class="feat" onclick="startReview()"><div class="fi">${ICONS.repeat}</div><div class="ft"><b>今日复习</b><span>${dueN?dueN+" 题到期":'暂无到期'}</span></div><div class="arw">›</div></div>
    <div class="feat" onclick="goWrong()"><div class="fi">${ICONS.flag}</div><div class="ft"><b>知识点错题</b><span>按考点归包重做</span></div><div class="arw">›</div></div>
  </div>

  ${BOOKS.map(bk=>{
    const bs=st(bk.questions);

        <button class="pri" onclick="openBook('${bk.board}')">${started||bs.done===0?"开始练":"继续练"}</button>

  <div class="note" style="margin-top:14px;text-align:center">题干与选项据原卷文字层整理，个别字词与原卷可能有出入，以原卷为准。</div>`;
}

function openBook(board){

  const key="xxkb_pos_"+board;
  start(bk.questions,resumeIdx(bk.questions,key),"quiz",bk,null);
}
function openBookWrong(board){
  const bk=boardOf(board);
  const qs=wrongOf(bk.questions);
  if(!qs.length)return toast("本套暂时没有错题");
  start(qs,0,"quiz",bk,null);
}
function openUnits(board,kind){
  const bk=boardOf(board);
  openMask(`<h3>${kind==="exam"?"整卷模考":"按卷练"} · ${esc(board)}</h3>
    <div class="small">${kind==="exam"?"按整卷顺序做，交卷后统一判分":"选一卷单独练，可断点续刷"}</div>
    <div class="unit-grid">
      ${bk.units.map((u,i)=>{
        const qs=bk.questions.filter(q=>q.s===u.s);
        const s=st(qs);
        return `<div class="unit" onclick="closeMask();startUnit('${board}',${i},'${kind}')">

}
function startUnit(board,idx,kind){
  const bk=boardOf(board);
  const u=bk.units[idx];
  const qs=bk.questions.filter(q=>q.s===u.s);
  const lim=kind==="exam"?qs.length*60:0;
  if(lim)toast("整卷模考：限时 "+Math.round(lim/60)+" 分钟");
  start(qs,resumeIdx(qs,"xxkb_pos_"+board+"|"+u.s),"quiz",bk,{s:u.s,name:u.name},lim);
}
function resetBook(board){
  ask("重置《"+board+"》的答题记录？其它题本不受影响。",function(){resetBookDo(board)},"确定重置");
  return;
}
function resetBookDo(board){
  BOOKS.find(b=>b.board===board).questions.forEach(q=>{delete ans[qid(q)]});
  save(LS.ans,ans);toast("已重置该题本");renderHome();
}

/* 答题 */
function start(list,idx,mode,book,unit,limitSec){
  cur={list:list.map(qid),idx:Math.max(0,Math.min(idx||0,list.length-1)),mode:mode==="drill"?"drill":"quiz",
    book:book||null,unit:unit||null,revealed:new Set(),flags:new Set(),started:Date.now(),finished:false,reviewIdx:0,
    limit:limitSec||0,autoSubmitted:false,enterAt:Date.now()};
  multiSel="";saveLast();renderQuiz();
  clearInterval(tick);tick=setInterval(()=>{
    const el=document.getElementById("timer");
    if(!el||!cur||cur.finished)return;
    if(cur.limit){const left=cur.limit*1000-elapsed();
      if(left<=0){el.textContent="00:00";el.classList.add("red");cur.autoSubmitted=true;clearInterval(tick);finish(true);return}
      el.textContent="剩 "+fmt(left); el.classList.toggle("red",left<60000);
    } else el.textContent=fmt(elapsed());
  },1000);
}
function setPad(on){document.getElementById("app").style.paddingBottom=on?"104px":""}
function getQ(){return byId.get(cur.list[cur.idx])}
function optText(q,L){const i="ABCD".indexOf(L);return (i>=0&&q.o[i])?q.o[i]:""}
function answeredCount(){return cur.list.filter(id=>ans[id]).length}
function fmt(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function elapsed(){return Date.now()-cur.started}
function isMultiNow(){const q=getQ();return (q.t||"").includes("多")||q.a.replace(/[^A-D]/g,"").length>1}

function renderQuiz(){
  const q=getQ(); if(!q)return finish();
  const a=ans[qid(q)];
  const sel=a?a.sel:(multiSel||"");
  const drill=cur.mode==="drill";
  const revealed = drill ? (cur.revealed.has(qid(q))||!!a) : false;
  const okA=q.a.trim().replace(/[^A-D]/g,"");
  const opts=q.o.map((txt,i)=>{
    const L="ABCD"[i];
    const chosen = sel?sel.includes(L):false;
    let cls="opt";
    if(revealed){ if(okA.includes(L))cls+=" ok"; else if(chosen)cls+=" err"; else cls+=" dim"; }
    else if(chosen) cls+=" sel";
    return `<div class="${cls}" data-l="${L}" onclick="choose('${L}')"><div class="lab">${L}</div><div class="txt">${esc(txt)}</div></div>`;
  }).join("");
  const pctw=Math.round((cur.idx+1)/cur.list.length*100);
  setPad(true);document.getElementById("app").innerHTML=`
  <div class="hdrline"><div class="hrow">
    <button class="icon-btn" onclick="exitQuiz()">‹</button>
    <div class="hsub">
      <div class="t1"><span>${esc(q.s)} · 第 ${q.n} 题 · ${cur.idx+1}/${cur.list.length}</span><span class="timer ${cur.limit?"pill":""}" id="timer">${cur.limit?"剩 "+fmt(cur.limit*1000-elapsed()):fmt(elapsed())}</span></div>
      <div class="prog"><i style="width:${pctw}%"></i></div>
    </div>
    <button class="icon-btn" onclick="openSheet()" title="答题卡" style="width:auto;padding:0 13px;font-size:12.5px;font-weight:600;color:var(--pri)">答题卡</button>
  </div></div>
  <div class="qwrap fade">
    <div class="qhead">
      <span class="tag">${esc(q.t||"单选")}</span>
      ${q.bad&&cfg.showBad?`<span class="tag warn">题干残缺</span>`:""}
      <span class="qidx">第 ${cur.idx+1} 题 / 共 ${cur.list.length} 题</span>
      <span class="mini ${flags.includes(qid(q))?"on":""}" onclick="toggleFlag()">${flags.includes(qid(q))?"已标记":"标记"}</span>
      <span class="mini ${notes[qid(q)]?"on":""}" onclick="openNote()">${notes[qid(q)]?"有笔记":"笔记"}</span>
      <div class="star ${isFav(q)?"on":""}" onclick="toggleFav()">${ICONS.star}${isFav(q)?"已收藏":"收藏"}</div>
    </div>
    <div class="qtext">${esc(q.q)}</div>
    <div id="opts">${opts}</div>
    ${revealed?`<div class="answerbar ${a&&a.ok?"ok":"err"}">${a?(a.ok?"答对了":"答错了"):"本题解析"} · 正确答案 ${esc(okA)}${a&&!a.ok?`　你选了 ${esc(sel)}`:""}</div>
      <div class="exp"><h4>解析</h4><p>${esc(q.e)}</p></div>`:""}
  </div>
  <div class="foot" id="foot"></div>`;
  renderFoot();
}
function renderFoot(){
  const foot=document.getElementById("foot"); if(!foot)return;
  const q=getQ();const revealed=cur.revealed.has(qid(q))||!!ans[qid(q)];
  const multi=isMultiNow();
  if(cur.mode==="drill"){
    foot.innerHTML=`
      <button class="small" ${cur.idx===0?"disabled":""} onclick="prevQ()">上一题</button>
      ${revealed?`<button class="pri" onclick="nextQ()">${cur.idx===cur.list.length-1?"完成":"下一题"}</button>`
                :`<button class="pri" onclick="submitAnswer()">${multi?"提交答案":"确认作答"}</button>`}
      <button class="small" onclick="finish()">交卷</button>`;
  }else{
    const last=cur.idx===cur.list.length-1;
    foot.innerHTML=`
      <button class="small" ${cur.idx===0?"disabled":""} onclick="prevQ()">上一题</button>
      ${multi?`<button class="pri" onclick="submitAnswer()" ${selEmpty()?"disabled":""}>确认本题</button>`:""}
      ${last?`<button class="pri" onclick="finish()">交卷</button>`
            :`<button class="pri" onclick="nextQ()">下一题</button><button class="small" onclick="finish()">交卷</button>`}`;
  }
}
function selEmpty(){const q=getQ();return !(multiSel||(ans[qid(q)]||{}).sel)}
function choose(L){
  const q=getQ();
  if(cur.mode==="drill"&&(cur.revealed.has(qid(q))||ans[qid(q)]))return;
  if(isMultiNow()){
    const arr=(multiSel||((ans[qid(q)]||{}).sel)||"").split(",").filter(Boolean);
    const i=arr.indexOf(L); i<0?arr.push(L):arr.splice(i,1);
    multiSel=arr.sort().join(",");
    document.querySelectorAll(".opt").forEach(el=>el.classList.remove("sel"));
    arr.forEach(x=>document.querySelector('.opt[data-l="'+x+'"]')?.classList.add("sel"));
    renderFoot();
    return;
  }
  multiSel="";
  record(L);
}
function record(sel){
  const q=getQ();
  const spent=Math.max(600,Date.now()-(cur.enterAt||Date.now()));
  const norm=s=>String(s||"").replace(/[^A-D]/g,"").split("").sort().join("");
  const ok=norm(sel)===norm(q.a.trim());
  ans[qid(q)]={sel,ok,ts:Date.now()};
  save(LS.ans,ans);
  srsUpd(qid(q),ok);
  qtime[qid(q)]=Math.round(spent/1000);save("xxkb_time_v1",qtime);
  const today=new Date().toISOString().slice(0,10);
  stat.days=stat.days||{}; stat.days[today]=(stat.days[today]||0)+1; stat.total=(stat.total||0)+1;
  if(ok)stat.ok=(stat.ok||0)+1;
  save(LS.stat,stat);
  save("xxkb_pos_"+(cur.unit?cur.book.board+"|"+cur.unit.s:(cur.book?cur.book.board:"")),cur.idx);
  saveLast();
  const at=cur.idx; multiSel="";
  if(cur.mode==="drill"){cur.revealed.add(qid(q));renderQuiz();return}
  renderQuiz();
  if(cfg.autoNext&&cur.idx<cur.list.length-1)setTimeout(()=>{if(cur&&cur.idx===at&&!cur.finished)nextQ()},420);
}
function submitAnswer(){ if(!multiSel)return toast("先选出你的答案"); record(multiSel); }
function nextQ(){ if(!cur)return; if(cur.idx<cur.list.length-1){cur.idx++;multiSel="";cur.enterAt=Date.now();renderQuiz();saveLast();} else if(cur.mode==="drill")finish(); }
function prevQ(){ if(cur.idx>0){cur.idx--;multiSel="";cur.enterAt=Date.now();renderQuiz();saveLast();} }
function exitQuiz(){
  if(cur&&cur.list&&answeredCount()>0&&!cur.finished){
    ask("还没交卷。退出会保留已答记录，下次可接着做。",function(){cur=null;clearInterval(tick);renderHome()},"确定退出");
    return;
  }
  cur=null;clearInterval(tick);renderHome();
}
function finish(auto){
  if(!cur)return renderHome();
  if(auto||cur.finished)return finishNow(auto);
  const all=cur.list.map(id=>byId.get(id)).filter(Boolean);
  const answered=all.filter(q=>ans[qid(q)]);
  if(!answered.length){toast("还没作答，先做一题再交卷");return}
  const undone=all.length-answered.length;
  if(undone>0){
    ask("还有 "+undone+" 题没做。交卷只统计你已答的 "+answered.length+" 题，其余不计入成绩。",function(){finishNow(false)},"确定交卷");
    return;
  }
  finishNow(false);
}
function finishNow(auto){
  setPad(false);
  if(!cur)return renderHome();
  const all=cur.list.map(id=>byId.get(id)).filter(Boolean);
  const answered=all.filter(q=>ans[qid(q)]);
  cur.finished=true;clearInterval(tick);
  const qs=answered; cur.resIds=qs.map(q=>qid(q));
  const wrong=qs.filter(q=>!ans[qid(q)].ok);
  const done=qs.length, ok=done-wrong.length;
  const rate=done?Math.round(ok/done*100):0;
  const time=fmt(elapsed());
  const usedLimit=cur.limit?`限时 ${Math.round(cur.limit/60)} 分钟${cur.autoSubmitted?" · 时间到自动交卷":""}`:"";
  const color=rate>=80?"var(--ok)":rate>=60?"var(--warn)":"var(--err)";
  document.getElementById("app").innerHTML=`
  <div class="hdr"><button class="icon-btn" onclick="renderHome()">‹</button><h1>本组结果</h1></div>
  <div class="rescard">
    <div class="bigring">${ringSvg(rate,132,9)}<div class="n"><b style="color:${color}">${rate}<span style="font-size:16px">%</span></b><span>正确率</span></div></div>
    <div class="resline"><span>已答 <em>${done}</em> 题</span><span>答对 <em style="color:var(--ok)">${ok}</em></span>
      <span>答错 <em style="color:var(--err)">${wrong.length}</em></span>
      <span>用时 <em>${time}</em></span>${usedLimit?`<span>${usedLimit}</span>`:""}</div>
  </div>
  <div class="acts" style="margin-bottom:14px">
    <button class="pri" onclick="openReview(${qs.findIndex(q=>{const a=ans[qid(q)];return !a||!a.ok})>=0?qs.findIndex(q=>{const a=ans[qid(q)];return !a||!a.ok}):0})">逐题看解析</button>
    <button onclick="shareResult()">分享成绩单</button>
    <button onclick="redoWrong()">错题重做（${wrong.length}）</button>
    <button class="ghost" onclick="renderHome()">返回题库</button>
  </div>
  <div class="sec"><b>逐题回看</b><a>点一行看解析</a></div>
  <div class="sec" style="margin-top:-4px"><a>只统计已答的 ${done} 题，没做的不计入也不展示</a></div>
  <div class="list">${qs.map((q,i)=>{const a=ans[qid(q)];
    const r=a.ok?`<span class="r ok">答对</span>`:`<span class="r err">答错</span>`;
    return `<div class="li" onclick="openReview(${i})"><div class="n">${i+1}</div>
      <div class="t"><b>${esc(q.q.replace(/\s+/g," ").slice(0,34))}</b>
        <span>${esc(q.s)} · 第${q.n}题　你选 ${esc(a.sel)}　正确 ${esc(q.a.trim().replace(/[^A-D]/g,""))}</span></div>${r}</div>`}).join("")||'<div class="empty">本组没有作答的题目</div>'}</div>`;
}
function openReview(i){cur.reviewIdx=i;renderReview()}
function renderReview(){
  const L=cur.resIds&&cur.resIds.length?cur.resIds:cur.list;
  const i=Math.min(cur.reviewIdx||0,L.length-1);
  const q=byId.get(L[i]); if(!q)return finish();
  const a=ans[qid(q)];
  const sel=a?a.sel:"";
  const okA=q.a.trim().replace(/[^A-D]/g,"");
  const opts=q.o.map((txt,k)=>{
    const L="ABCD"[k]; const chosen=sel.includes(L); let cls="opt";
    if(okA.includes(L))cls+=" ok"; else if(chosen)cls+=" err"; else cls+=" dim";
    return `<div class="${cls}"><div class="lab">${L}</div><div class="txt">${esc(txt)}</div></div>`;
  }).join("");
  const wrongText=(sel&&sel!==okA)
    ? `你选了 <b>${esc(sel)}</b>：${esc(sel.split("").map(L=>L+"．"+optText(q,L)).join("　"))}<br>正确答案 <b>${esc(okA)}</b>：${esc(okA.split("").map(L=>L+"．"+optText(q,L)).join("　"))}`
    : "";
  setPad(true);document.getElementById("app").innerHTML=`
  <div class="hdrline"><div class="hrow">
    <button class="icon-btn" onclick="finish()">‹</button>
    <div class="hsub">
      <div class="t1"><span>${esc(q.s)} · 第 ${q.n} 题 · ${i+1}/${L.length}</span><span>${a?(a.ok?"答对":"答错"):"未答"}</span></div>
      <div class="prog"><i style="width:${Math.round((i+1)/L.length*100)}%"></i></div>
    </div></div></div>
  <div class="qwrap fade">
    <div class="qhead"><span class="tag">${esc(q.t||"单选")}</span>${q.bad?`<span class="tag warn">题干残缺</span>`:""}
      <div class="star ${isFav(q)?"on":""}" onclick="toggleFavReview()">${ICONS.star}${isFav(q)?"已收藏":"收藏"}</div>
      <span class="qidx">第 ${i+1} 题 / 共 ${L.length} 题</span></div>
    <div class="qtext">${esc(q.q)}</div>
    <div>${opts}</div>
    <div class="answerbar ${a&&a.ok?"ok":"err"}">${a?(a.ok?"答对了":"答错了"):"未作答"} · 正确答案 <b>${esc(okA)}</b>${a&&!a.ok?`　你选了 ${esc(sel)}`:""}</div>
    <div class="exp"><h4>解析</h4><p>${esc(q.e)}</p></div>
    ${wrongText?`<div class="exp why"><h4>为什么选错</h4><p>${wrongText}</p></div>`:""}
    ${notes[qid(q)]?`<div class="exp"><h4>我的笔记</h4><p>${esc(notes[qid(q)])}</p></div>`:""}
    <div class="report"><a onclick="openNoteReview()">${ICONS.book} 写笔记</a>　<a onclick="shareQ()">${ICONS.share} 做成图片</a>　<a onclick="copyQ()">复制文本</a>　<a onclick="reportQ()">报错</a></div>
    <div style="height:8px"></div>
  </div>
  <div class="foot">
    <button class="small" ${i===0?"disabled":""} onclick="openReview(${i-1})">上一题</button>
    <button class="pri" ${i===L.length-1?"disabled":""} onclick="openReview(${i+1})">下一题</button>
    <button class="small" onclick="finish()">结果</button>
  </div>`;
}
function openNoteReview(){
  const q=byId.get((cur.resIds||cur.list)[cur.reviewIdx]);const id=qid(q);const v=notes[id]||"";
  openMask(`<h3>本题笔记</h3><div class="small">${esc(q.s)} · 第${q.n}题</div>
    <textarea id="noteTxt2" style="width:100%;min-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:12px;font:15px/1.7 inherit;font-family:inherit">${esc(v)}</textarea>
    <div class="acts" style="margin-top:14px"><button class="pri" onclick="saveNoteReview()">保存</button>
      <button class="ghost" onclick="closeMask()">取消</button></div>`);
}
function saveNoteReview(){
  const q=byId.get(cur.list[cur.reviewIdx]);const v=(document.getElementById("noteTxt2").value||"").trim();
  if(v)notes[qid(q)]=v;else delete notes[qid(q)];
  save("xxkb_note_v1",notes);closeMask();renderReview();toast("笔记已保存");
}
function copyQ(){
  const q=byId.get((cur.resIds||cur.list)[cur.reviewIdx]);if(!q)return;
  const okA=q.a.trim().replace(/[^A-D]/g,"");
  const txt=q.s+" 第"+q.n+"题（"+ (q.t||"单选") +"）\n"+q.q+"\n"+q.o.map((o,i)=>"ABCD"[i]+"．"+o).join("\n")+"\n正确答案："+okA+"\n解析："+q.e;
  const done=()=>toast("已复制，可直接粘贴给别人");
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done).catch(()=>fallback());
  else fallback();
  function fallback(){const el=document.createElement("textarea");el.value=txt;document.body.appendChild(el);el.select();document.execCommand("copy");el.remove();done()}
}
function redoWrong(){
  const qs=(cur.resIds||cur.list).map(id=>byId.get(id)).filter(q=>{const a=ans[qid(q)];return a&&!a.ok});
  if(!qs.length)return toast("这一组没有错题");
  start(qs,0,"quiz",cur.book,cur.unit);
}
function openNote(){
  const id=qid(getQ());const v=notes[id]||"";
  openMask(`<h3>本题笔记</h3><div class="small">只存在你本机，导出备份时会一起带走</div>
    <textarea id="noteTxt" style="width:100%;min-height:120px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:12px;font:15px/1.7 inherit;font-family:inherit">${esc(v)}</textarea>

function drawShare(q){
  const W=900,PAD=42,CW=W-PAD*2;
  const cv=document.createElement("canvas");const ctx=cv.getContext("2d");
  const fam='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif';
  const setF=(size,weight)=>{ctx.font=(weight||400)+" "+size+"px "+fam};
  const wrap=(text,size,maxW)=>{setF(size);return String(text).split("\n").flatMap(par=>{
      const out=[];let line="";
      for(const ch of par){const t=line+ch;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=ch}else line=t}
      if(line)out.push(line);return out});};
  const okA=q.a.trim().replace(/[^A-D]/g,"");
  const stem=wrap(q.q,30,CW-24);
  const opts=q.o.map((t,i)=>({L:"ABCD"[i],lines:wrap(t,25,CW-78)}));
  const exps=wrap(q.e,24,CW-24);
  const optH=opts.reduce((a,o)=>a+Math.max(56,o.lines.length*42+22)+10,0);
  const expLines=Math.min(exps.length,16);
  const H=PAD+8+44+38+stem.length*50+22+optH+14+52+24+30+expLines*40+18+56+PAD;
  cv.width=W;cv.height=H;
  const g=ctx.createLinearGradient(0,0,W,0);g.addColorStop(0,"#0b6b5e");g.addColorStop(1,"#17a58c");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#ffffff";ctx.fillRect(PAD-8,PAD-8,CW+16,H-PAD*2+16);
  let y=PAD;
  setF(15,600);ctx.fillStyle="#0e7c6b";ctx.fillText("小黑题库 · 公考刷题器",PAD+10,y+22);
  setF(18,700);ctx.fillStyle="#0e7c6b";ctx.textAlign="right";ctx.fillText("cc 原创",W-PAD-10,y+20);ctx.textAlign="left";
  y+=44;
  setF(13,400);ctx.fillStyle="#7a8b86";ctx.fillText(q.s+" · 第"+q.n+" 题 · "+(q.t||"单选"),PAD+10,y+16);
  y+=32;
  setF(29,500);ctx.fillStyle="#152622";
  stem.forEach((ln,i)=>ctx.fillText(ln,PAD+10,y+26+i*48));
  y+=stem.length*48+26;
  opts.forEach(o=>{
    const h=Math.max(56,o.lines.length*42+22);
    ctx.strokeStyle="#e3e9e6";ctx.lineWidth=1.5;
    roundRect(ctx,PAD+10,y,CW-20,h,14);ctx.stroke();
    ctx.fillStyle="#e8f5f1";ctx.beginPath();ctx.arc(PAD+38,y+h/2,15,0,7);ctx.fill();
    ctx.fillStyle="#0e7c6b";setF(16,700);ctx.textAlign="center";ctx.fillText(o.L,PAD+38,y+h/2+6);
    ctx.textAlign="left";setF(24,400);ctx.fillStyle="#23342f";
    const th=o.lines.length*42;
    o.lines.forEach((ln,i)=>ctx.fillText(ln,PAD+64,y+(h-th)/2+29+i*42));
    y+=h+10;
  });
  y+=14;
  ctx.fillStyle="#e7f6ec";roundRect(ctx,PAD+10,y,CW-20,50,12);ctx.fill();
  ctx.fillStyle="#12894b";setF(18,700);ctx.fillText("正确答案 "+okA,PAD+30,y+32);
  y+=74;
  ctx.strokeStyle="#e3e9e6";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(PAD+10,y-8);ctx.lineTo(W-PAD-10,y-8);ctx.stroke();
  ctx.fillStyle="#0e7c6b";setF(14,700);ctx.fillText("解析",PAD+10,y+16);
  y+=34;
  ctx.fillStyle="#3a4a45";setF(23,400);
  exps.slice(0,expLines).forEach((ln,i)=>ctx.fillText(ln,PAD+10,y+18+i*40));
  if(exps.length>expLines){ctx.fillStyle="#7a8b86";ctx.fillText("……",PAD+10,y+18+expLines*40)}
  const fy=H-PAD-16;
  ctx.strokeStyle="#e3e9e6";ctx.beginPath();ctx.moveTo(PAD+10,fy-34);ctx.lineTo(W-PAD-10,fy-34);ctx.stroke();
  setF(14.5,700);ctx.fillStyle="#5d6f69";ctx.fillText("小黑题库 · 公考刷题器 | cc 原创 · 共"+DATA.length+"题 · 数据仅存本机",PAD+10,fy);
  cv.toBlob(b=>{
    let file=null;
    try{file=new File([b],q.s+"-第"+q.n+"题.png",{type:"image/png"})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"小黑题库 · 公考刷题器",text:q.s+" 第"+q.n+"题"}).catch(()=>saveImg(b,q.s+"-第"+q.n+"题.png"));
    }else saveImg(b,q.s+"-第"+q.n+"题.png");
  },"image/png");
}
function shareResult(){
  const qs=(cur.resIds||cur.list).map(id=>byId.get(id)).filter(q=>ans[qid(q)]);
  const wrong=qs.filter(q=>{const a=ans[qid(q)];return a&&!a.ok});
  const done=qs.length,ok=done-wrong.length;
  const rate=done?Math.round(ok/done*100):0;
  const W=900,PAD=42,CW=W-PAD*2;
  const cv=document.createElement("canvas");const ctx=cv.getContext("2d");
  const fam='"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif';
  const setF=(z,w)=>{ctx.font=(w||400)+" "+z+"px "+fam};
  const wrongList=wrong.slice(0,8);
  const H=420+wrongList.length*58+ (wrong.length>8?40:0) + 40;
  cv.width=W;cv.height=H;
  const g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,"#0b6b5e");g.addColorStop(.6,"#128a76");g.addColorStop(1,"#17a58c");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#ffffff";ctx.fillRect(PAD-8,PAD-8,CW+16,H-PAD*2+16);
  let y=PAD+10;
  setF(15,600);ctx.fillStyle="#0e7c6b";ctx.fillText("小黑题库 · 公考刷题器",PAD+10,y+16);
  setF(16,700);ctx.fillStyle="#0e7c6b";ctx.textAlign="right";ctx.fillText("cc 原创 · "+todayKey(),W-PAD-10,y+16);ctx.textAlign="left";
  y+=58;
  const color=rate>=80?"#12894b":rate>=60?"#c07800":"#c62b23";
  setF(86,700);ctx.fillStyle=color;ctx.textAlign="center";ctx.fillText(rate+"%",W/2,y+62);
  setF(16,400);ctx.fillStyle="#7a8b86";ctx.fillText("本组正确率",W/2,y+96);ctx.textAlign="left";
  y+=130;
  const stats=[["已答",done],["答对",ok],["答错",wrong.length],["正确率",rate+"%"],["用时",fmt(elapsed())]];
  const cw=CW/stats.length;
  stats.forEach((it,i)=>{
    const x=PAD+10+cw*i+cw/2;
    ctx.textAlign="center";setF(26,700);ctx.fillStyle="#152622";ctx.fillText(String(it[1]),x,y+26);
    setF(12,400);ctx.fillStyle="#8a9a95";ctx.fillText(it[0],x,y+50);ctx.textAlign="left";
  });
  y+=86;
  ctx.strokeStyle="#e3e9e6";ctx.beginPath();ctx.moveTo(PAD+10,y);ctx.lineTo(W-PAD-10,y);ctx.stroke();
  y+=32;
  setF(15,700);ctx.fillStyle="#0e7c6b";ctx.fillText(wrong?("错题 "+wrong.length+" 道（点开 App 看解析）"):"全对，继续冲",PAD+10,y);
  y+=26;
  if(wrongList.length){
    setF(13,400);ctx.fillStyle="#3a4a45";
    wrongList.forEach((q,i)=>{
      const t=String(i+1)+". "+q.s+" 第"+q.n+"题  "+q.q.replace(/\s+/g," ").slice(0,26)+(q.q.length>26?"…":"");
      ctx.fillText(t,PAD+14,y+16+i*58);
    });
    y+=wrongList.length*58;
    if(wrong.length>8){ctx.fillStyle="#8a9a95";ctx.fillText("……还有 "+(wrong.length-8)+" 道",PAD+14,y+8);y+=40}
  }
  const fy=H-PAD-16;
  setF(14.5,700);ctx.fillStyle="#5d6f69";ctx.fillText("小黑题库 · 公考刷题器 | cc 原创 · 共"+DATA.length+"题",PAD+10,fy);
  cv.toBlob(b=>{
    let file=null;try{file=new File([b],"成绩单.png",{type:"image/png"})}catch(e){}
    if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
      navigator.share({files:[file],title:"成绩单"}).catch(()=>saveImg(b,"小黑题库_成绩单.png"));
    }else saveImg(b,"小黑题库_成绩单.png");
  },"image/png");
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
